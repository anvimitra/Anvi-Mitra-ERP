<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Teacher Enrollment</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--brand:#5146c7;--line:#e4e8f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.back{color:var(--brand);font-weight:750;text-decoration:none}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field input{padding:10px;border:1px solid #d8deea;border-radius:9px;font:inherit}.btn{padding:10px 14px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:750;cursor:pointer}.btn.secondary{background:#fff;color:#172033;border:1px solid var(--line)}.msg{font-size:13px;margin-top:10px}.ok{color:#087443}.err{color:#b42318}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px;text-align:left;border-bottom:1px solid #edf0f4;font-size:13px}th{font-size:11px;color:#667085;text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef0ff;color:#3730a3;font-size:11px}@media(max-width:850px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="/erp/web/portal-dashboard.html">← Dashboard</a><h1>Teacher Enrollment</h1><p>Enroll teachers into the current school/branch before assigning their classes and subjects.</p></div><span id="school" class="badge">Loading…</span></div><div class="grid"><section class="panel"><h2>New Teacher</h2><form id="form"><div class="form"><div class="field"><label>Full Name *</label><input id="fullName" required></div><div class="field"><label>Employee Code *</label><input id="employeeCode" required></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Joining Date</label><input id="joiningDate" type="date"></div><div class="field"><label>Login Password *</label><input id="password" type="password" minlength="6" required></div><div class="field full"><button class="btn">Create Teacher Login</button></div></div></form><div id="msg" class="msg"></div></section><section class="panel"><h2>Teachers</h2><div class="table"><table><thead><tr><th>Name</th><th>Employee Code</th><th>Contact</th><th>Branch</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div><div id="listMsg" class="msg"></div></section></div></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(!['super_admin','principal','admin','office_staff'].includes(role)){location.replace('/erp/web/portal-dashboard.html');return}const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const [org,r]=await Promise.all([LSKERP.request('/api/organization'),LSKERP.request('/api/teachers')]);$('school').textContent=org.school.displayName||org.school.name;$('rows').innerHTML=(r.teachers||[]).map(t=>`<tr><td><b>${esc(t.fullName)}</b></td><td>${esc(t.employeeCode)}</td><td>${esc(t.phone||'—')}</td><td>${esc(t.branchName||'School level')}</td><td><span class="badge">${esc(t.status||'active')}</span></td></tr>`).join('')||'<tr><td colspan="5">No teachers enrolled yet.</td></tr>'}catch(e){$('listMsg').textContent=e.message||'Could not load teachers';$('listMsg').className='msg err'}}$('form').onsubmit=async e=>{e.preventDefault();$('msg').className='msg';$('msg').textContent='Creating teacher…';const body={fullName:$('fullName').value.trim(),employeeCode:$('employeeCode').value.trim(),email:$('email').value.trim()||null,phone:$('phone').value.trim()||null,joiningDate:$('joiningDate').value||null,password:$('password').value};try{await LSKERP.request('/api/teachers',{method:'POST',body:JSON.stringify(body)});$('msg').textContent='Teacher enrolled successfully. Next step is class/subject permission assignment.';$('msg').className='msg ok';e.target.reset();await load()}catch(err){$('msg').textContent=err.message||'Could not create teacher';$('msg').className='msg err'}}load()})();</script></body></html>
