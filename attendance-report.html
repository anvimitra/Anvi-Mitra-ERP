<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Attendance Report</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--brand:#5b5bd6;--line:#e3e8f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.top h1{margin:0;font-size:25px}.muted{font-size:13px;color:#667085}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}label{display:block;font-size:11px;color:#667085;margin-bottom:5px}input,select{width:100%;padding:10px;border:1px solid #d7dce6;border-radius:9px;background:#fff}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.actions{display:flex;gap:8px;align-items:end}.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.stat{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;font-size:13px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:950px}.table th,.table td{padding:9px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px}.table th{color:#667085;font-size:10px;text-transform:uppercase}.num{text-align:center!important}.msg{margin-top:10px;font-size:13px}.ok{color:#087443}.err{color:#b42318}.reportTitle{font-weight:800;margin-bottom:3px}.empty{text-align:center;padding:28px;color:#667085}.exportBar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.actions{align-items:stretch}}@media print{body{background:#fff}.top,.filters,.buttons,.exportBar{display:none}.wrap{padding:0}.panel{border:0;box-shadow:none;padding:4px}.table{min-width:0}.table th,.table td{font-size:9px;padding:5px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>Attendance Report</h1><div class="muted">Student-wise attendance percentage for the selected period.</div></div><div class="buttons"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn" onclick="location.href='/erp/web/portal-dashboard.html'">← Dashboard</button></div></div><section class="panel"><div class="filters"><div><label>FROM DATE</label><input id="from" type="date"></div><div><label>TO DATE</label><input id="to" type="date"></div><div><label>ACADEMIC SESSION</label><select id="session"><option value="">All / current</option></select></div><div><label>SECTION</label><select id="section"><option value="">All sections</option></select></div><div class="actions"><button class="btn primary" onclick="loadReport()">Generate Report</button></div></div><div id="msg" class="msg"></div></section><section class="panel"><div class="reportTitle" id="heading">Attendance Report</div><div class="muted" id="period"></div><div class="stats"><div class="stat">Students: <b id="students">0</b></div><div class="stat">Present: <b id="present">0</b></div><div class="stat">Absent: <b id="absent">0</b></div><div class="stat">Late: <b id="late">0</b></div><div class="stat">Avg Attendance: <b id="avg">0%</b></div></div><div class="exportBar"><button class="btn primary" onclick="exportCSV()">⬇ Export CSV / Excel</button></div><div class="tableWrap"><table class="table"><thead><tr><th>#</th><th>Student</th><th>Admission No</th><th>Class</th><th>Section</th><th class="num">Present</th><th class="num">Absent</th><th class="num">Late</th><th class="num">Half Day</th><th class="num">Leave</th><th class="num">Recorded</th><th class="num">Attendance %</th></tr></thead><tbody id="body"><tr><td colspan="12" class="empty">Generate a report to view attendance.</td></tr></tbody></table></div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id);const now=new Date(),local=new Date(now.getTime()-now.getTimezoneOffset()*60000),today=local.toISOString().slice(0,10);$('from').value=today.slice(0,8)+'01';$('to').value=today;let report=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function init(){try{const d=await LSKERP.request('/api/academic-sessions');const ss=d.sessions||d.academicSessions||[];$('session').innerHTML='<option value="">All / current</option>'+ss.map(s=>`<option value="${s.id}">${esc(s.name||s.sessionName||s.id)}</option>`).join('');await sections()}catch(e){msg(e.message,true)}}async function sections(){try{const q=$('session').value?'?sessionId='+encodeURIComponent($('session').value):'';const d=await LSKERP.request('/api/attendance/sections'+q);$('section').innerHTML='<option value="">All sections</option>'+(d.sections||[]).map(s=>`<option value="${s.sectionId}">${esc(s.className)} • ${esc(s.sectionName)}</option>`).join('')}catch(e){msg(e.message,true)}}$('session').onchange=sections;function msg(t,bad){$('msg').textContent=t;$('msg').className='msg '+(bad?'err':'ok')}async function loadReport(){try{const from=$('from').value,to=$('to').value;if(!from||!to)throw new Error('Select both dates');if(from>to)throw new Error('From date cannot be after To date');const q=new URLSearchParams({from,to});if($('session').value)q.set('sessionId',$('session').value);if($('section').value)q.set('sectionId',$('section').value);msg('Generating report…');const d=await LSKERP.request('/api/attendance/report?'+q.toString());report=d.report||[];render();msg('Report generated successfully.')}catch(e){report=[];render();msg(e.message||'Could not generate report',true)}}function render(){ $('period').textContent=($('from').value||'')+' to '+($('to').value||'');$('students').textContent=report.length;$('present').textContent=report.reduce((n,r)=>n+Number(r.present||0),0);$('absent').textContent=report.reduce((n,r)=>n+Number(r.absent||0),0);$('late').textContent=report.reduce((n,r)=>n+Number(r.late||0),0);const vals=report.map(r=>Number(r.attendancePercent)).filter(Number.isFinite);$('avg').textContent=(vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2):'0')+'%';$('body').innerHTML=report.length?report.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.fullName)}</b></td><td>${esc(r.admissionNo||'—')}</td><td>${esc(r.className||'')}</td><td>${esc(r.sectionName||'')}</td><td class="num">${r.present||0}</td><td class="num">${r.absent||0}</td><td class="num">${r.late||0}</td><td class="num">${r.halfDay||0}</td><td class="num">${r.leave||0}</td><td class="num">${r.recordedDays||0}</td><td class="num"><b>${Number(r.attendancePercent||0).toFixed(2)}%</b></td></tr>`).join(''):'<tr><td colspan="12" class="empty">No attendance records found for this filter.</td></tr>'}$('heading').textContent='Attendance Report • '+(report.length?'Student Summary':'No Results')}function csvCell(v){const s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}function exportCSV(){if(!report.length){msg('Generate a report before exporting.',true);return}const rows=[['#','Student','Admission No','Class','Section','Present','Absent','Late','Half Day','Leave','Recorded Days','Attendance %'],...report.map((r,i)=>[i+1,r.fullName,r.admissionNo,r.className,r.sectionName,r.present,r.absent,r.late,r.halfDay,r.leave,r.recordedDays,Number(r.attendancePercent||0).toFixed(2)+'%'])];const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='attendance-report-'+($('from').value||'from')+'-to-'+($('to').value||'to')+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);msg('CSV exported successfully.')}window.loadReport=loadReport;window.exportCSV=exportCSV;init()})();</script></body></html>
