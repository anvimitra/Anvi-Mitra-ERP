<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Enrollment Center</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--brand:#4f46e5;--line:#e4e8f0;--muted:#667085}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1150px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:27px}.back{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#172033;text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #d7dce6;border-radius:9px;font:inherit;background:#fff}.btn{padding:11px 14px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:750;cursor:pointer}.btn:disabled{opacity:.6}.muted{color:var(--muted);font-size:13px}.msg{margin-top:10px;font-size:13px}.ok{color:#087443}.err{color:#b42318}.student-list{display:grid;gap:8px;max-height:340px;overflow:auto}.student{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid #edf0f5;border-radius:10px;cursor:pointer}.student:hover,.student.active{background:#f1f3ff;border-color:#cfd2ff}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;white-space:nowrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.scroll{overflow:auto}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>Student Enrollment Center</h1><div class="muted">Enroll a student into the selected academic session and class section. School and branch isolation is enforced by the API.</div></div><a class="back" href="/erp/web/portal-dashboard.html">← Dashboard</a></div><section class="panel"><div class="grid"><div class="field"><label>Search student</label><input id="search" placeholder="Name or admission number"></div><div class="field"><label>Academic session</label><select id="session"></select></div><div class="field"><label>Class section</label><select id="section"></select></div><div class="field"><label>Roll number</label><input id="rollNo" inputmode="numeric" placeholder="Optional"></div><div><button class="btn" id="enroll" disabled>Enroll selected student</button></div></div><div id="msg" class="msg muted"></div></section><section class="panel"><h2>Students</h2><div id="students" class="student-list">Loading…</div></section><section class="panel"><h2>Selected student enrollments</h2><div id="enrollments" class="scroll"><div class="muted">Select a student to view enrollment history.</div></div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(!['super_admin','principal','admin','office_staff'].includes(role)){document.body.innerHTML='<main class="wrap"><section class="panel"><h2>Access denied</h2></section></main>';return}const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let students=[],selected=null,structure=null;async function load(){const [studentData,structureData]=await Promise.all([LSKERP.request('/api/students'),LSKERP.request('/api/academic-structure')]);students=studentData.students||studentData.data||[];structure=structureData;$('session').innerHTML=(structure.sessions||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');$('section').innerHTML=(structure.sections||[]).map(s=>`<option value="${s.id}">${esc(s.className||s.class_name||'Class')} • ${esc(s.name)}${s.branchName?' • '+esc(s.branchName):''}</option>`).join('');renderStudents()}function renderStudents(){const q=$('search').value.trim().toLowerCase();const list=students.filter(s=>!q||String(s.fullName||s.full_name||'').toLowerCase().includes(q)||String(s.admissionNo||s.admission_no||'').toLowerCase().includes(q));$('students').innerHTML=list.length?list.map(s=>`<div class="student ${selected?.id===s.id?'active':''}" data-id="${s.id}"><div><b>${esc(s.fullName||s.full_name)}</b><div class="muted">Admission: ${esc(s.admissionNo||s.admission_no||'—')}</div></div><span class="badge">${esc(s.status||'active')}</span></div>`).join(''):'<div class="muted">No students found.</div>';$('students').querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>selectStudent(el.dataset.id))}async function selectStudent(id){selected=students.find(s=>String(s.id)===String(id))||null;renderStudents();$('enroll').disabled=!selected;try{const d=await LSKERP.request('/api/students/'+encodeURIComponent(id)+'/enrollments');const rows=d.enrollments||[];$('enrollments').innerHTML=rows.length?`<table class="table"><thead><tr><th>Session</th><th>Class</th><th>Section</th><th>Roll</th><th>Branch</th><th>Status</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${esc(e.sessionName)}</td><td>${esc(e.className)}</td><td>${esc(e.sectionName)}</td><td>${esc(e.rollNo||'—')}</td><td>${esc(e.branchName||'School')}</td><td>${esc(e.status)}</td></tr>`).join('')}</tbody></table>`:'<div class="muted">No enrollment history.</div>'}catch(e){$('enrollments').innerHTML=`<div class="err">${esc(e.message)}</div>`}}$('search').oninput=renderStudents;$('enroll').onclick=async()=>{if(!selected)return;$('enroll').disabled=true;$('msg').className='msg muted';$('msg').textContent='Saving enrollment…';try{await LSKERP.request('/api/students/'+encodeURIComponent(selected.id)+'/enrollments',{method:'POST',body:JSON.stringify({sessionId:$('session').value,sectionId:$('section').value,rollNo:$('rollNo').value.trim()||null})});$('msg').className='msg ok';$('msg').textContent=`${selected.fullName||selected.full_name} enrolled successfully.`;await selectStudent(selected.id)}catch(e){$('msg').className='msg err';$('msg').textContent=e.message||'Enrollment failed'}finally{$('enroll').disabled=!selected}}try{await load()}catch(e){$('msg').className='msg err';$('msg').textContent=e.message||'Could not load enrollment data'}})()</script></body></html>
