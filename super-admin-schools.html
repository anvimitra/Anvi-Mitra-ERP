<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • School Management</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:20px;margin-bottom:18px}input{padding:10px;border:1px solid #d7dce6;border-radius:8px;width:100%;box-sizing:border-box;margin:4px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{padding:11px 16px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}.msg{margin:10px 0;color:#667085}.school{padding:13px;border:1px solid #e4e8f0;border-radius:12px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="panel"><h1>Super Admin • Schools</h1><p>Add school profile, branding and the first school admin account.</p><form id="f" class="grid"><input id="name" placeholder="School name *" required><input id="code" placeholder="School code *" required><input id="appSlug" placeholder="App slug *" required><input id="displayName" placeholder="Display name"><input id="address" placeholder="Address"><input id="phone" placeholder="School phone"><input id="supportEmail" placeholder="Support email" type="email"><input id="logoUrl" placeholder="Logo URL"><input id="appName" placeholder="App name"><input id="androidPackage" placeholder="Android package"><input id="initialAdminName" placeholder="Initial admin name *" required><input id="initialAdminEmail" placeholder="Initial admin email" type="email"><input id="initialAdminPhone" placeholder="Initial admin phone"><input id="initialAdminPassword" placeholder="Initial admin password *" type="password" minlength="6" required><input id="primaryColor" placeholder="Primary color" value="4F46E5"><input id="secondaryColor" placeholder="Secondary color" value="0F1720"><button class="btn">Create School</button></form><p class="msg" id="msg"></p></div><div class="panel"><h2>Configured Schools</h2><div id="list" class="msg">Loading…</div></div></main><script src="/erp/web/api.js"></script><script>(async()=>{const $=id=>document.getElementById(id);if(!LSKERP.token()){location.replace('/erp/web/login.html');return}if((LSKERP.user().role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/portal-dashboard.html');return}async function load(){try{const d=await LSKERP.request('/api/platform/schools');$('list').innerHTML=(d.schools||[]).map(s=>`<div class="school"><b>${s.display_name||s.name}</b> (${s.code})<br>App: ${s.app_name||'—'} • ${s.app_slug||'—'}<br>Logo: ${s.logo_url||'—'}<br>Status: ${s.status||'—'}</div>`).join('')||'No schools yet.'}catch(e){$('list').textContent=e.message}}$('f').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Creating…';try{const b={};['name','code','appSlug','displayName','address','phone','supportEmail','logoUrl','appName','androidPackage','initialAdminName','initialAdminEmail','initialAdminPhone','initialAdminPassword','primaryColor','secondaryColor'].forEach(k=>b[k]=$(k).value);await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(b)});$('f').reset();$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';$('msg').textContent='School created successfully';load()}catch(e){$('msg').textContent=e.message||'Creation failed'}};load()})();</script></body></html>
