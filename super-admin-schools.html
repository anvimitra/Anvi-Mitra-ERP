<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • School Management</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--brand:#5146c8;--line:#e4e8f0;--muted:#667085;--success:#087443;--danger:#b42318}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:#151b36;color:#fff;padding:20px}.brand{font-size:20px;font-weight:800}.sub{font-size:12px;color:#b8c2e5;margin:5px 0 22px}.nav a{display:block;color:#dbe4ff;padding:10px;margin-top:8px;text-decoration:none;border-radius:8px}.nav a.active,.nav a:hover{background:#ffffff18}.logout{margin-top:20px;width:100%;padding:10px;background:transparent;color:#fff;border:1px solid #536083;border-radius:8px}.main{padding:24px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.top h1{margin:0}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.card h2{font-size:18px;margin:0 0 15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #d8dee9;border-radius:8px;font:inherit}.btn{width:100%;padding:11px;background:var(--brand);color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6}.msg{font-size:13px;margin-top:10px}.ok{color:var(--success)}.error{color:var(--danger)}.small{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}.table th{font-size:11px;color:#667085;text-transform:uppercase}.status{font-weight:700}.active{color:var(--success)}.inactive{color:var(--danger)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:3}.nav{display:flex;gap:6px}.nav a{white-space:nowrap}.grid{grid-template-columns:1fr}}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">Anvi Mitra ERP</div><div class="sub">Platform Control • Super Admin</div><nav class="nav"><a class="active" href="/super-admin-schools.html">Schools</a><a href="/portal-dashboard.html?role=super_admin">ERP Dashboard</a></nav><button class="logout" id="logout">Logout</button></aside><main class="main"><div class="top"><h1>School Management</h1><div class="pill">Role: Super Admin</div></div><div class="grid"><section class="card"><h2>Add New School</h2><form id="form"><div class="row"><div class="field"><label>School Name *</label><input id="name" required placeholder="LSK Academy"></div><div class="field"><label>School Code *</label><input id="code" required placeholder="LSK001"></div></div><div class="row"><div class="field"><label>App Slug *</label><input id="appSlug" required placeholder="lsk-academy"></div><div class="field"><label>Android Package</label><input id="androidPackage" placeholder="in.anvimitra.lskacademy"></div></div><div class="row"><div class="field"><label>Logo URL</label><input id="logoUrl" placeholder="https://.../logo.png"></div><div class="field"><label>Support Email</label><input id="supportEmail" type="email"></div></div><div class="row"><div class="field"><label>Support Phone</label><input id="supportPhone"></div><div class="field"><label>Timezone</label><input id="timezone" value="Asia/Kolkata"></div></div><div class="row"><div class="field"><label>Primary Color</label><input id="primaryColor" value="4F46E5"></div><div class="field"><label>Secondary Color</label><input id="secondaryColor" value="0F1720"></div></div><button class="btn" id="createBtn">Create School</button><div class="msg" id="msg"></div></form></section><section class="card"><h2>Schools</h2><div class="small" id="summary">Loading…</div><div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Name</th><th>Code</th><th>Slug</th><th>Status</th><th>Created</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main></div><script src="/api.js"></script><script>(async()=>{const u=LSKERP.user();if(!LSKERP.token()||String(u.role||'').toLowerCase()!=='super_admin'){sessionStorage.clear();location.replace('/login.html');return}logout.onclick=()=>{sessionStorage.clear();location.replace('/login.html')};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const r=await LSKERP.request('/api/platform/schools');const s=r.schools||[];summary.textContent=`${s.length} school${s.length===1?'':'s'} configured`;rows.innerHTML=s.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.code)}</td><td>${esc(x.app_slug)}</td><td class="status ${x.status==='active'?'active':'inactive'}">${esc(x.status)}</td><td>${x.created_at?new Date(x.created_at).toLocaleDateString('en-IN'):''}</td></tr>`).join('')}form.onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('createBtn');msg.textContent='Creating…';msg.className='msg';btn.disabled=true;try{const p={name:name.value.trim(),code:code.value.trim(),appSlug:appSlug.value.trim(),androidPackage:androidPackage.value.trim()||null,logoUrl:logoUrl.value.trim()||null,supportEmail:supportEmail.value.trim()||null,supportPhone:supportPhone.value.trim()||null,timezone:timezone.value.trim()||'Asia/Kolkata',primaryColor:primaryColor.value.trim()||'4F46E5',secondaryColor:secondaryColor.value.trim()||'0F1720'};const r=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(p)});msg.textContent=`Created: ${r.school?.name||p.name}`;msg.className='msg ok';form.reset();timezone.value='Asia/Kolkata';primaryColor.value='4F46E5';secondaryColor.value='0F1720';await load()}catch(e){msg.textContent=e.message||'Create failed';msg.className='msg error'}finally{btn.disabled=false}};load().catch(e=>{summary.textContent='Could not load schools';msg.textContent=e.message||'Load failed';msg.className='msg error'})})()</script></body></html>
