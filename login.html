<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LSK Academy ERP — Login</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,92vw);background:#fff;border:1px solid #e1e6ef;border-radius:18px;padding:28px;box-shadow:0 12px 40px #15203b12}.brand{font-size:24px;font-weight:800}.sub{color:#667085;font-size:14px;margin:6px 0 24px}label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}input,select,button{width:100%;padding:12px;border:1px solid #d9dee8;border-radius:9px;font:inherit}button{margin-top:18px;background:#172b55;color:#fff;border:0;cursor:pointer;font-weight:700}.msg{margin-top:14px;font-size:13px;color:#667085}</style></head><body><form class="box" id="login"><div class="brand">LSK Academy ERP</div><div class="sub">Secure school management portal</div><label>School Code</label><input id="schoolCode" autocomplete="organization" required><label>Email / Phone</label><input id="loginId" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><label>Login as</label><select id="role"><option value="admin">Admin / Office</option><option value="teacher">Teacher</option><option value="parent">Parent</option></select><button>Sign in</button><div class="msg" id="msg"></div></form><script>const form=document.getElementById('login');form.addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Signing in…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.getElementById('loginId').value,password:document.getElementById('password').value,schoolCode:document.getElementById('schoolCode').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');if(!d.accessToken)throw new Error('Login response did not contain an access token');sessionStorage.setItem('lsk_access_token',d.accessToken);sessionStorage.setItem('lsk_user',JSON.stringify(d.user||{}));const selected=document.getElementById('role').value;const actual=(d.user?.role||selected).toLowerCase();if(selected!=='admin'&&selected!=='teacher'&&selected!=='parent')throw new Error('Invalid role');if(actual==='parent'){location.href='/erp/web/parent-dashboard.html';return}location.href='/erp/web/portal-dashboard.html?role='+encodeURIComponent(actual)}catch(err){msg.textContent=err.message}}</script></body></html>
