<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Bulk Enrollment</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--brand:#4f46e5;--line:#e4e8f0;--muted:#667085}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.top h1{margin:0;font-size:27px}.back,.btn{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#172033;text-decoration:none;cursor:pointer}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:750}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #d7dce6;border-radius:9px;font:inherit}.students{margin-top:15px;border:1px solid var(--line);border-radius:12px;overflow:auto}.student{display:grid;grid-template-columns:42px 1.5fr 1fr 1fr;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid #edf0f5;font-size:13px}.student:last-child{border-bottom:0}.student.head{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:750;background:#fafbfc}.muted{color:var(--muted);font-size:13px}.msg{margin-top:10px;font-size:13px}.ok{color:#087443}.err{color:#b42318}.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}@media(max-width:800px){.grid{grid-template-columns:1fr}.student{grid-template-columns:34px 1fr 1fr;}.student.head{display:none}.student>span:last-child{grid-column:2/-1}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>Bulk Student Enrollment</h1><p class="muted">Select multiple students and enroll them into one session and section. Each student is still validated by the server for school and branch scope.</p></div><a class="back" href="/erp/web/students.html">← Students</a></div><section class="panel"><div class="grid"><div class="field"><label>Academic Session *</label><select id="session"></select></div><div class="field"><label>Class / Section *</label><select id="section"></select></div><div class="field"><label>Search</label><input id="search" placeholder="Name or admission number"></div></div><div style="margin-top:13px;display:flex;gap:9px;flex-wrap:wrap"><button class="btn" id="all">Select visible</button><button class="btn" id="none">Clear selection</button><button class="btn primary" id="enroll" disabled>Enroll selected</button></div><div class="progress"><span id="progress"></span></div><div id="msg" class="msg muted"></div></section><section class="panel"><div id="students" class="students">Loading…</div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(!['super_admin','principal','admin','office_staff'].includes(role)){document.body.innerHTML='<main class="wrap"><section class="panel"><h2>Access denied</h2></section></main>';return}const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let students=[],structure=null,selected=new Set();async function load(){const [sd,ac]=await Promise.all([LSKERP.request('/api/students'),LSKERP.request('/api/academic-structure')]);students=sd.students||[];structure=ac;$('session').innerHTML='<option value="">Select session</option>'+(ac.sessions||[]).map(s=>`<option value="${s.id}">${esc(s.name)}${s.isCurrent?' • Current':''}</option>`).join('');$('section').innerHTML='<option value="">Select section</option>'+(ac.sections||[]).map(s=>`<option value="${s.id}">${esc(s.className||'Class')} • ${esc(s.name)}</option>`).join('');render()}function render(){const q=$('search').value.trim().toLowerCase();const list=students.filter(s=>!q||String(s.fullName||'').toLowerCase().includes(q)||String(s.admissionNo||'').toLowerCase().includes(q));$('students').innerHTML='<div class="student head"><span></span><span>Student</span><span>Admission</span><span>Status</span></div>'+(list.length?list.map(s=>`<label class="student"><span><input type="checkbox" data-id="${s.id}" ${selected.has(s.id)?'checked':''}></span><span><b>${esc(s.fullName)}</b></span><span>${esc(s.admissionNo||'—')}</span><span>${esc(s.status||'active')}</span></label>`).join(''):'<div class="muted" style="padding:18px">No students found.</div>');$('students').querySelectorAll('[data-id]').forEach(x=>x.onchange=()=>{x.checked?selected.add(x.dataset.id):selected.delete(x.dataset.id);updateButton()});updateButton()}function updateButton(){$('enroll').disabled=selected.size===0||!$('session').value||!$('section').value;$('enroll').textContent=`Enroll selected (${selected.size})`}$('search').oninput=render;$('session').onchange=updateButton;$('section').onchange=updateButton;$('all').onclick=()=>{const q=$('search').value.trim().toLowerCase();students.filter(s=>!q||String(s.fullName||'').toLowerCase().includes(q)||String(s.admissionNo||'').toLowerCase().includes(q)).forEach(s=>selected.add(s.id));render()};$('none').onclick=()=>{selected.clear();render()};$('enroll').onclick=async()=>{const ids=[...selected];$('enroll').disabled=true;$('msg').className='msg muted';let done=0,failed=0;for(const id of ids){try{await LSKERP.request('/api/students/'+encodeURIComponent(id)+'/enrollments',{method:'POST',body:JSON.stringify({sessionId:$('session').value,sectionId:$('section').value,rollNo:null})});done++}catch(_){failed++}$('progress').style.width=`${Math.round((done+failed)*100/ids.length)}%`;$('msg').textContent=`Processed ${done+failed}/${ids.length} • Success ${done} • Failed ${failed}`}$('msg').className=failed?'msg err':'msg ok';selected.clear();render()};try{await load()}catch(e){$('msg').className='msg err';$('msg').textContent=e.message||'Could not load enrollment data'}})()</script></body></html>
