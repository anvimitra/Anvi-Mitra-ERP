<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMS Status — Anvi Mitra ERP</title><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,sans-serif}.wrap{max-width:950px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-size:22px;font-weight:850}.muted{color:#667085;font-size:13px}.btn{display:inline-block;padding:9px 12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;color:#172033;text-decoration:none;font-weight:750}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:16px}.value{font-size:24px;font-weight:850;margin-top:5px}.ok{color:#067647}.bad{color:#b42318}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px}.pill{padding:4px 8px;border-radius:999px;background:#eef0ff;font-weight:700;font-size:11px}.status{margin-top:12px;color:#b42318}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">📱 SMS Delivery Status</div><div class="muted">Parent notification delivery monitor</div></div><a class="btn" href="/erp/web/fee-center.html">← Back</a></div><div class="grid"><div class="card"><div class="muted">Provider</div><div class="value" id="provider">—</div></div><div class="card"><div class="muted">Pending</div><div class="value" id="pending">0</div></div><div class="card"><div class="muted">Sent</div><div class="value ok" id="sent">0</div></div><div class="card"><div class="muted">Failed</div><div class="value bad" id="failed">0</div></div></div><section class="card"><h2>Recent SMS Queue</h2><table class="table"><thead><tr><th>Time</th><th>Phone</th><th>Event</th><th>Status</th><th>Attempts</th><th>Error</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table><div id="status" class="status"></div></section></div><script src="/erp/web/api.js"></script><script>(async()=>{try{if(!LSKERP.token())return location.replace('/erp/web/login.html');const u=LSKERP.user();if(!['super_admin','principal','admin'].includes((u.role||'').toLowerCase()))return location.replace('/erp/web/portal-dashboard.html');const d=await LSKERP.request('/api/notifications/sms-status');document.getElementById('provider').textContent=d.providerConfigured?'Configured':'Not configured';const c={};(d.counts||[]).forEach(x=>c[x.status]=x.count);document.getElementById('pending').textContent=c.pending||0;document.getElementById('sent').textContent=c.sent||0;document.getElementById('failed').textContent=c.failed||0;const rows=d.recent||[];document.getElementById('rows').innerHTML=rows.length?rows.map(x=>`<tr><td>${new Date(x.queuedAt).toLocaleString('en-IN')}</td><td>${x.phone||''}</td><td>${x.eventType||''}</td><td><span class="pill">${x.status}</span></td><td>${x.attempts||0}</td><td>${x.lastError||''}</td></tr>`).join(''):'<tr><td colspan="6">No SMS records.</td></tr>'}catch(e){document.getElementById('status').textContent=e.message||'Unable to load SMS status.'}})();</script></body></html>
