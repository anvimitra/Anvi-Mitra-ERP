<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Admissions</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--brand:#5b5bd6;--line:#e4e8f0;--muted:#667085}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top h1{margin:0;font-size:27px}.back{color:var(--brand);text-decoration:none;font-weight:700}.hero{margin:20px 0;background:linear-gradient(120deg,#24285f,#6046c8);color:#fff;padding:23px;border-radius:20px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#e8e9ff;font-size:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;margin-top:15px;box-shadow:0 5px 22px #17203308}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form input,.form select{padding:11px;border:1px solid #d8deea;border-radius:10px;font:inherit}.btn{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:11px 16px;font-weight:750;cursor:pointer}.msg{font-size:13px;margin-top:10px}.ok{color:#087443}.err{color:#b42318}.table{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.badge{padding:5px 9px;border-radius:999px;background:#eef0ff;color:#4247a8;font-size:11px;font-weight:700}@media(max-width:700px){.wrap{padding:16px}.form{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="/erp/web/portal-dashboard.html">← Dashboard</a><h1>Admissions</h1></div><span id="school" class="badge">Loading…</span></div><section class="hero"><h2>Student Admission Desk</h2><p>Create an application and move an approved candidate into the school with one controlled workflow.</p></section><section class="panel"><h3>New Admission Application</h3><div class="form"><input id="applicationNo" placeholder="Application No *"><select id="session"><option value="">Academic Session *</option></select><select id="class"><option value="">Applied Class</option></select><input id="studentName" placeholder="Student full name *"><input id="dob" type="date"><select id="gender"><option value="">Gender</option><option>Male</option><option>Female</option><option>Other</option></select><input id="father" placeholder="Father name"><input id="mother" placeholder="Mother name"><input id="phone" placeholder="Guardian phone"><button class="btn" id="save">Create Application</button></div><div id="msg" class="msg"></div></section><section class="panel"><h3>Recent Applications</h3><div class="table"><table><thead><tr><th>Application</th><th>Student</th><th>Class</th><th>Session</th><th>Status</th><th>Created</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let structure;async function load(){const [org,s]=await Promise.all([LSKERP.request('/api/organization'),LSKERP.request('/api/academic-structure')]);structure=s;document.getElementById('school').textContent=org.school.displayName||org.school.name;document.getElementById('session').innerHTML='<option value="">Academic Session *</option>'+s.sessions.map(x=>`<option value="${x.id}">${esc(x.name)}${x.isCurrent?' • Current':''}</option>`).join('');document.getElementById('class').innerHTML='<option value="">Applied Class</option>'+s.classes.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const a=await LSKERP.request('/api/admissions');document.getElementById('rows').innerHTML=a.applications.length?a.applications.map(x=>`<tr><td>${esc(x.applicationNo)}</td><td><b>${esc(x.studentName)}</b></td><td>${esc(x.appliedClassName||'—')}</td><td>${esc(s.sessions.find(z=>z.id===x.sessionId)?.name||'—')}</td><td><span class="badge">${esc(x.status)}</span></td><td>${new Date(x.createdAt).toLocaleDateString()}</td></tr>`).join(''):'<tr><td colspan="6">No applications yet.</td></tr>'}document.getElementById('save').onclick=async()=>{const msg=document.getElementById('msg');msg.className='msg';msg.textContent='';try{await LSKERP.request('/api/admissions',{method:'POST',body:JSON.stringify({applicationNo:document.getElementById('applicationNo').value,sessionId:document.getElementById('session').value,appliedClassId:document.getElementById('class').value||null,studentName:document.getElementById('studentName').value,dateOfBirth:document.getElementById('dob').value||null,gender:document.getElementById('gender').value||null,fatherName:document.getElementById('father').value||null,motherName:document.getElementById('mother').value||null,guardianPhone:document.getElementById('phone').value||null})});msg.className='msg ok';msg.textContent='Application created successfully';await load()}catch(e){msg.className='msg err';msg.textContent=e.message||'Could not create application'}};load().catch(e=>document.getElementById('msg').textContent=e.message)})();</script></body></html>
