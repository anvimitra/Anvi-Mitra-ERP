<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Fee Assignment - Anvi Mitra ERP</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:#fff;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #0001}input,select,button{padding:10px;margin:5px;border:1px solid #ccd3df;border-radius:8px}input,select{min-width:190px}button{cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.muted{color:#667085}.msg{padding:8px 5px;min-height:20px}.error{color:#b42318}.ok{color:#087443}.results{display:none;border:1px solid #e5e7eb;border-radius:10px;padding:10px}.student{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.field{display:flex;flex-direction:column}.field label{font-size:12px;color:#667085;margin:5px}.selected{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px}.context{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.pill{background:#f8fafc;border:1px solid #e5e7eb;border-radius:9px;padding:8px 12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Student Fee Assignment</h1><div class="muted">Assign fee → generate installments → invoice → payment</div></div><a href="/erp/web/fee-center.html">← Fee Center</a></div><section class="card"><h3>1. Select Student</h3><input id="search" placeholder="Admission No. / Name"><button class="primary" onclick="findStudents()">Search</button><div id="msg" class="msg"></div><div id="results" class="results"></div><div id="selected" class="selected" style="display:none"></div></section><section class="card"><h3>2. Assign Fee</h3><div id="academicContext" class="context"><span class="pill">Loading academic context…</span></div><div class="grid"><div class="field"><label>Academic Session</label><select id="sessionId"><option value="">Loading sessions…</option></select></div><div class="field"><label>Fee Head</label><select id="feeHead"><option value="">Loading fee heads…</option></select></div><div class="field"><label>Amount</label><input id="amount" type="number" min="0" step="0.01"></div><div class="field"><label>Frequency</label><select id="frequency"><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="half_yearly">Half Yearly</option><option value="annual">Annual</option><option value="one_time">One Time</option></select></div><div class="field"><label>Start Date</label><input id="startDate" type="date"></div><div class="field"><label>Due Day</label><input id="dueDay" type="number" min="1" max="31" value="10"></div></div><button class="primary" onclick="assign(false)">Assign Fee</button><button onclick="assign(true)">Assign + Generate Installments</button><div id="assignMsg" class="msg"></div></section><section class="card"><h3>3. Generate Installments</h3><div class="grid"><div class="field"><label>From Date</label><input id="fromDate" type="date"></div><div class="field"><label>To Date</label><input id="toDate" type="date"></div></div><button class="primary" onclick="generateInstallments()">Generate Installments</button><div id="genMsg" class="msg"></div></section><section class="card"><h3>Existing Assignments</h3><button onclick="loadAssignments()">Refresh</button><div class="table-wrap"><table><thead><tr><th>Fee Head</th><th>Amount</th><th>Frequency</th><th>Start</th><th>Due Day</th><th>Status</th></tr></thead><tbody id="assignmentRows"><tr><td colspan="6" class="muted">Select a student first.</td></tr></tbody></table></div></section></div><script src="/erp/web/api.js"></script><script>
const allowed=['super_admin','principal','admin','accountant','office_staff'];const u=typeof LSKERP!=='undefined'?LSKERP.user():{};if(!allowed.includes(String(u.role||'').toLowerCase()))document.body.innerHTML='<div class="wrap"><div class="card"><h2>Access denied</h2><p>Finance access is required.</p></div></div>';let studentId=null,academic=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function setMsg(id,text,cls=''){const x=$(id);x.textContent=text;x.className='msg '+cls}
async function loadAcademic(){try{const d=await LSKERP.request('/api/academic-structure');academic=d;const sessions=d.sessions||[];const current=sessions.find(s=>s.isCurrent)||sessions[0];$('sessionId').innerHTML='<option value="">Select session</option>'+sessions.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}${s.isCurrent?' • Current':''}</option>`).join('');if(current){$('sessionId').value=current.id;setDates(current)}renderContext()}catch(e){$('sessionId').innerHTML='<option value="">Unable to load sessions</option>';setMsg('assignMsg',e.message||'Could not load academic sessions.','error')}}
function setDates(s){const today=new Date();const iso=today.toISOString().slice(0,10);$('startDate').value=s.startsOn||iso;$('fromDate').value=s.startsOn||iso;$('toDate').value=s.endsOn||iso}
function renderContext(){const s=academic?.sessions?.find(x=>x.id==$('sessionId').value);let html='';if(s)html+=`<span class="pill"><b>Session:</b> ${esc(s.name)}</span>`;if(academic?.activeEnrollment)html+=`<span class="pill"><b>Class:</b> ${esc(academic.activeEnrollment.className||'—')}</span><span class="pill"><b>Section:</b> ${esc(academic.activeEnrollment.sectionName||'—')}</span><span class="pill"><b>Branch:</b> ${esc(academic.activeEnrollment.branchName||'Main')}</span>`;$('academicContext').innerHTML=html||'<span class="pill">Select a student to load class/section.</span>'}
async function findStudents(){const q=$('search').value.trim();if(!q)return setMsg('msg','Enter admission number or student name.','error');try{setMsg('msg','Searching…');const d=await LSKERP.request('/api/students/search?q='+encodeURIComponent(q));const list=d.students||[];const box=$('results');if(!list.length){box.style.display='none';return setMsg('msg','No student found.','error')}box.style.display='block';box.innerHTML=list.map(s=>`<div class="student"><div><b>${esc(s.fullName)}</b><br><span class="muted">Admission: ${esc(s.admissionNo||'—')}</span></div><button onclick="selectStudent('${encodeURIComponent(s.id)}','${encodeURIComponent(s.fullName||'Student')}','${encodeURIComponent(s.admissionNo||'')}')">Select</button></div>`).join('');setMsg('msg',list.length+' student(s) found.','ok')}catch(e){setMsg('msg',e.message||'Search failed.','error')}}
async function selectStudent(id,name,adm){studentId=decodeURIComponent(id);$('selected').style.display='block';$('selected').innerHTML='<b>Selected Student</b><br>'+esc(decodeURIComponent(name))+' — Admission: '+esc(decodeURIComponent(adm));$('results').style.display='none';try{const d=await LSKERP.request('/api/students/'+encodeURIComponent(studentId)+'/enrollments');const list=d.enrollments||[];academic.activeEnrollment=list.find(x=>x.status==='active')||list[0]||null;renderContext();if(academic.activeEnrollment?.sessionId){$('sessionId').value=academic.activeEnrollment.sessionId;const s=academic.sessions.find(x=>x.id===academic.activeEnrollment.sessionId);if(s)setDates(s)}await loadStructures();loadAssignments()}catch(e){setMsg('assignMsg',e.message||'Could not load student enrollment.','error')}}
async function loadHeads(){try{const d=await LSKERP.request('/api/fee-heads');$('feeHead').innerHTML='<option value="">Select fee head</option>'+(d.feeHeads||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${esc(x.code)})</option>`).join('')}catch(e){setMsg('assignMsg',e.message||'Could not load fee heads.','error')}}
async function loadStructures(){const sid=$('sessionId').value;const cid=academic?.activeEnrollment?.sectionId?academic.activeEnrollment.sectionId:null;if(!sid||!academic?.activeEnrollment)return;try{const d=await LSKERP.request('/api/fee-structures?sessionId='+encodeURIComponent(sid));const structures=d.feeStructures||[];const branch=academic.activeEnrollment.branchId;const cls=academic.activeEnrollment.className;$('academicContext').innerHTML+=structures.length?`<span class="pill"><b>Available structures:</b> ${structures.filter(x=>!x.branchId||x.branchId===branch).length}</span>`:''}catch(e){setMsg('assignMsg',e.message||'Could not load fee structures.','error')}}
$('sessionId').addEventListener('change',()=>{const s=academic?.sessions?.find(x=>x.id==$('sessionId').value);if(s)setDates(s);renderContext();loadStructures()});async function assign(andGenerate){if(!studentId)return setMsg('assignMsg','Select a student first.','error');const body={studentId,sessionId:$('sessionId').value,feeHeadId:$('feeHead').value,amount:Number($('amount').value),frequency:$('frequency').value,startDate:$('startDate').value,dueDay:$('dueDay').value?Number($('dueDay').value):null};if(!body.sessionId||!body.feeHeadId||!body.startDate||Number.isNaN(body.amount)||body.amount<=0)return setMsg('assignMsg','Session, fee head, valid amount and start date are required.','error');try{setMsg('assignMsg','Saving…');await LSKERP.request('/api/fees/assignments',{method:'POST',body:JSON.stringify(body)});setMsg('assignMsg','Fee assignment created successfully.','ok');loadAssignments();if(andGenerate)await generateInstallments()}catch(e){setMsg('assignMsg',e.message||'Assignment failed.','error')}}async function generateInstallments(){if(!studentId)return setMsg('genMsg','Select a student first.','error');const sid=$('sessionId').value,from=$('fromDate').value,to=$('toDate').value;if(!sid||!from||!to)return setMsg('genMsg','Session, From Date and To Date are required.','error');if(from>to)return setMsg('genMsg','From Date cannot be after To Date.','error');try{setMsg('genMsg','Generating installments…');const d=await LSKERP.request('/api/fees/installments/generate',{method:'POST',body:JSON.stringify({sessionId:sid,studentId,fromDate:from,toDate:to})});setMsg('genMsg',`Generated ${d.generated||0} installment(s) from ${d.assignments||0} assignment(s).`,'ok')}catch(e){setMsg('genMsg',e.message||'Generation failed.','error')}}async function loadAssignments(){if(!studentId)return;try{const d=await LSKERP.request('/api/fees/assignments/student/'+encodeURIComponent(studentId));const list=d.assignments||[];$('assignmentRows').innerHTML=list.map(x=>`<tr><td>${esc(x.feeHeadName)}</td><td>₹${Number(x.amount||0).toFixed(2)}</td><td>${esc(x.frequency)}</td><td>${esc(x.startDate)}</td><td>${esc(x.dueDay||'—')}</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No assignments found.</td></tr>'}catch(e){setMsg('assignMsg',e.message||'Could not load assignments.','error')}}
loadAcademic();loadHeads();$('search').addEventListener('keydown',e=>{if(e.key==='Enter')findStudents()});
</script></body></html>
