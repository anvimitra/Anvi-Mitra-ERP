name: ERP CI

on:
  push:
    branches: [main]
    paths:
      - 'erp/**'
      - '.github/workflows/erp-ci.yml'
  pull_request:
    paths:
      - 'erp/**'
      - '.github/workflows/erp-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect ERP validation diagnostics
        id: diagnostics
        shell: bash
        run: |
          set +e
          report="$GITHUB_WORKSPACE/erp-validation-report.txt"
          : > "$report"
          failed=0
          echo '=== JavaScript syntax ===' >> "$report"
          for f in erp/src/*.js; do
            node --check "$f" >> "$report" 2>&1
            code=$?
            if [ $code -eq 0 ]; then echo "PASS $f" >> "$report"; else echo "FAIL $f (exit $code)" >> "$report"; failed=1; fi
          done
          echo '=== Required web files ===' >> "$report"
          for f in erp/web/super-admin/schools.html erp/web/school-management.html erp/web/school-onboarding.html erp/web/staff-management.html erp/web/student-enrollment.html erp/web/teacher-assignments.html erp/web/teacher-permissions.html erp/web/teacher-marks.html erp/web/offline-sync.js erp/web/local-storage.html; do
            if test -s "$f"; then echo "PASS $f" >> "$report"; else echo "FAIL $f" >> "$report"; failed=1; fi
          done
          echo '=== SQL extension files ===' >> "$report"
          for f in erp/sql/*.sql; do
            if test -s "$f"; then echo "PASS $f" >> "$report"; else echo "FAIL $f" >> "$report"; failed=1; fi
          done
          echo '=== Migration runner syntax ===' >> "$report"
          node --check erp/src/migrate.js >> "$report" 2>&1
          code=$?
          if [ $code -eq 0 ]; then echo 'PASS erp/src/migrate.js' >> "$report"; else echo "FAIL erp/src/migrate.js (exit $code)" >> "$report"; failed=1; fi
          echo "diagnostic_failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Run ERP contract tests individually
        id: contract_tests
        shell: bash
        run: |
          set +e
          cd erp
          report="../erp-validation-report.txt"
          failed=0
          tests=(tests/erp_contract.test.js tests/school_provisioning_contract.test.js tests/enrollment_contract.test.js tests/teacher_marks_ui_contract.test.js tests/offline_web_contract.test.js tests/migration_preflight.test.js tests/architecture_contract.test.js tests/major_process_contract.test.js tests/school_management_ui_contract.test.js tests/school_summary_contract.test.js tests/local_storage_ui_contract.test.js tests/timetable_contract.test.js tests/staff_attendance_contract.test.js tests/offline_attendance_contract.test.js tests/exam_management_integration_contract.test.js tests/notifications_contract.test.js)
          for test_file in "${tests[@]}"; do
            echo "===== $test_file =====" >> "$report"
            node "$test_file" >> "$report" 2>&1
            code=$?
            if [ $code -eq 0 ]; then echo "PASS $test_file" >> "$report"; else echo "FAIL $test_file (exit $code)" >> "$report"; failed=1; fi
          done
          echo '===== contract smoke =====' >> "$report"
          node scripts/contract-smoke.js >> "$report" 2>&1
          code=$?
          if [ $code -eq 0 ]; then echo 'PASS contract smoke' >> "$report"; else echo "FAIL contract smoke (exit $code)" >> "$report"; failed=1; fi
          echo "contract_failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Upload ERP validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-validation-report
          path: erp-validation-report.txt
          if-no-files-found: error
      - name: Fail validation if diagnostics found errors
        if: always()
        shell: bash
        run: |
          if grep -q '^FAIL ' erp-validation-report.txt; then
            echo 'ERP validation diagnostics found failures:'
            grep '^FAIL ' erp-validation-report.txt
            exit 1
          fi
          echo 'ERP static/contract validation PASS'

  migration-contract:
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: erp_ci
          POSTGRES_DB: anvi_mitra_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_ci -d anvi_mitra_erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ERP dependencies
        working-directory: erp
        run: npm install --no-audit --no-fund
      - name: Validate migration runner
        working-directory: erp
        run: node --check src/migrate.js
      - name: Verify extension migration ordering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, os, re
          files = sorted(glob.glob('erp/sql/*.sql'))
          nums=[]
          for f in files:
              m=re.match(r'.*/(\d+)_', f)
              if m: nums.append((int(m.group(1)), os.path.basename(f)))
          assert nums, 'No numbered ERP migrations found'
          seen={}
          for n,name in nums: seen.setdefault(n,[]).append(name)
          dup={n:v for n,v in seen.items() if len(v)>1}
          assert not dup, f'Duplicate migration numbers: {dup}'
          print(f'Validated {len(nums)} ERP extension migrations.')
          PY
      - name: Execute every migration on a clean PostgreSQL database
        working-directory: erp
        env:
          DATABASE_URL: postgresql://erp_ci:postgres@localhost:5432/anvi_mitra_erp_ci
        run: npm run migrate
      - name: Re-run migration runner to verify idempotency
        working-directory: erp
        env:
          DATABASE_URL: postgresql://erp_ci:postgres@localhost:5432/anvi_mitra_erp_ci
        run: npm run migrate
      - name: Verify key runtime objects
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql "postgresql://erp_ci:postgres@localhost:5432/anvi_mitra_erp_ci" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 1 FROM pg_proc WHERE proname='teacher_can_edit_exam_subject';
          SELECT 1 FROM pg_proc WHERE proname='guard_sync_teacher_exam_marks';
          SELECT 1 FROM pg_class WHERE relname='sync_devices';
          SELECT 1 FROM pg_class WHERE relname='sync_changes';
          SELECT 1 FROM pg_class WHERE relname='sync_conflicts';
          SELECT 1 FROM pg_class WHERE relname='local_storage_connectors';
          SQL

  platform-e2e:
    runs-on: ubuntu-latest
    needs: migration-contract
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: erp_ci
          POSTGRES_DB: anvi_mitra_erp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_ci -d anvi_mitra_erp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ERP dependencies
        working-directory: erp
        run: npm install --no-audit --no-fund
      - name: Migrate clean E2E database
        working-directory: erp
        env:
          DATABASE_URL: postgresql://erp_ci:postgres@localhost:5432/anvi_mitra_erp_e2e
        run: npm run migrate
      - name: Run authenticated school provisioning E2E
        working-directory: erp
        env:
          DATABASE_URL: postgresql://erp_ci:postgres@localhost:5432/anvi_mitra_erp_e2e
          JWT_SECRET: e2e-test-secret-at-least-32-characters-long
          NODE_ENV: test
          ERP_BASE_URL: http://127.0.0.1:4183
        run: node scripts/school-management-e2e.js
