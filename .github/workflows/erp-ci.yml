name: ERP CI

on:
  push:
    branches: [main]
    paths:
      - 'erp/**'
      - '.github/workflows/erp-ci.yml'
  pull_request:
    paths:
      - 'erp/**'
      - '.github/workflows/erp-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate server modules
        shell: bash
        run: |
          set -e
          for f in erp/src/*.js; do echo "Checking $f"; node --check "$f"; done
      - name: Validate key web pages
        shell: bash
        run: |
          set -e
          for f in \
            erp/web/super-admin/schools.html \
            erp/web/school-management.html \
            erp/web/school-onboarding.html \
            erp/web/staff-management.html \
            erp/web/student-enrollment.html \
            erp/web/teacher-assignments.html \
            erp/web/teacher-permissions.html \
            erp/web/teacher-marks.html \
            erp/web/offline-sync.js \
            erp/web/local-storage.html; do test -s "$f"; done
      - name: Validate SQL extension migrations
        shell: bash
        run: |
          set -e
          for f in erp/sql/*.sql; do test -s "$f"; done
          test -s erp/sql/032_offline_sync_access_control.sql
          test -s erp/sql/036_sync_idempotency.sql
      - name: Validate migration runner
        working-directory: erp
        run: node --check src/migrate.js
      - name: Run ERP contract tests individually
        id: contract_tests
        shell: bash
        run: |
          set +e
          cd erp
          : > ../erp-test-report.txt
          failed=0
          tests=(
            tests/erp_contract.test.js
            tests/school_provisioning_contract.test.js
            tests/enrollment_contract.test.js
            tests/teacher_marks_ui_contract.test.js
            tests/offline_web_contract.test.js
            tests/migration_preflight.test.js
            tests/architecture_contract.test.js
            tests/major_process_contract.test.js
            tests/school_management_ui_contract.test.js
            tests/school_summary_contract.test.js
            tests/local_storage_ui_contract.test.js
          )
          for test_file in "${tests[@]}"; do
            echo "===== $test_file =====" | tee -a ../erp-test-report.txt
            node "$test_file" >> ../erp-test-report.txt 2>&1
            code=$?
            if [ $code -eq 0 ]; then echo "PASS $test_file" | tee -a ../erp-test-report.txt; else echo "FAIL $test_file (exit $code)" | tee -a ../erp-test-report.txt; failed=1; fi
          done
          echo "===== contract smoke =====" | tee -a ../erp-test-report.txt
          node scripts/contract-smoke.js >> ../erp-test-report.txt 2>&1
          code=$?
          if [ $code -eq 0 ]; then echo "PASS contract smoke" | tee -a ../erp-test-report.txt; else echo "FAIL contract smoke (exit $code)" | tee -a ../erp-test-report.txt; failed=1; fi
          exit $failed
      - name: Upload ERP validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-validation-report
          path: erp-test-report.txt
          if-no-files-found: warn

  # The core PostgreSQL schema is maintained by the deployment database. CI validates
  # the ERP extension migrations statically; a real DATABASE_URL is required for the
  # infrastructure-backed migration/E2E gate described in README.md.
  migration-contract:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate migration runner
        working-directory: erp
        run: node --check src/migrate.js
      - name: Verify extension migration ordering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, os, re
          files = sorted(glob.glob('erp/sql/*.sql'))
          nums=[]
          for f in files:
              m=re.match(r'.*/(\d+)_', f)
              if m: nums.append((int(m.group(1)), os.path.basename(f)))
          assert nums, 'No numbered ERP migrations found'
          seen={}
          for n,name in nums: seen.setdefault(n,[]).append(name)
          dup={n:v for n,v in seen.items() if len(v)>1}
          assert not dup, f'Duplicate migration numbers: {dup}'
          print(f'Validated {len(nums)} ERP extension migrations.')
          PY
