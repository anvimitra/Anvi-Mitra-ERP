name: ERP Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'erp/src/**'
      - 'erp/sql/**'
      - 'erp/test/**'
      - 'erp/package.json'
      - '.github/workflows/erp-backend-ci.yml'
  pull_request:
    paths:
      - 'erp/src/**'
      - 'erp/sql/**'
      - 'erp/test/**'
      - 'erp/package.json'
      - '.github/workflows/erp-backend-ci.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: erp/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check server JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Run backend tests when present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(test/*.test.js)
          if ((${#tests[@]} == 0)); then
            echo 'No backend test files yet; syntax checks completed.'
            exit 0
          fi
          npm test
