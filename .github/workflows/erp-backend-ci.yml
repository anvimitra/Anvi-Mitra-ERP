name: ERP Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'erp/src/**'
      - 'erp/sql/**'
      - 'erp/test/**'
      - 'erp/package.json'
      - '.github/workflows/erp-backend-ci.yml'
  pull_request:
    paths:
      - 'erp/src/**'
      - 'erp/sql/**'
      - 'erp/test/**'
      - 'erp/package.json'
      - '.github/workflows/erp-backend-ci.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: erp_test
          POSTGRES_DB: anvi_mitra_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_test -d anvi_mitra_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: erp
    env:
      DATABASE_URL: postgresql://erp_test:erp_test@127.0.0.1:5432/anvi_mitra_erp_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: erp/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check server JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Run backend integration tests
        run: npm test
