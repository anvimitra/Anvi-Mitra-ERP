name: Build Android App

on:
  push:
    branches: [main]
    paths:
      - 'erp/mobile_app/**'
      - '.github/workflows/mobile-app-build.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp/mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.ERP_API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: anvi-mitra-school-app-apk
          path: erp/mobile_app/build/app/outputs/flutter-apk/app-release.apk
