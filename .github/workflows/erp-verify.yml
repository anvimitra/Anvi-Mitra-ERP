name: ERP Verify

on:
  push:
    branches: [main]
    paths:
      - 'erp/**'
      - '.github/workflows/erp-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anvi_mitra_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d anvi_mitra_erp_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ERP dependencies
        working-directory: erp
        run: npm install
      - name: Validate JavaScript
        run: |
          set -e
          for f in erp/src/*.js; do node --check "$f"; done
      - name: Validate required web files
        run: |
          set -e
          for f in \
            erp/web/super-admin-schools.html \
            erp/web/super_admin_schools.html \
            erp/web/super-admin-branches.html \
            erp/web/school-management.html \
            erp/web/school-onboarding.html \
            erp/web/staff-management.html \
            erp/web/student-enrollment.html \
            erp/web/teacher-permissions.html \
            erp/web/offline-sync.js \
            erp/web/local-storage.html; do
            test -s "$f"
          done
      - name: Validate SQL files
        run: |
          set -e
          for f in erp/sql/*.sql; do test -s "$f"; done
      - name: Run clean PostgreSQL migration
        working-directory: erp
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anvi_mitra_erp_test
        run: npm run migrate
