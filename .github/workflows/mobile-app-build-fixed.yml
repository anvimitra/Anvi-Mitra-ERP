name: Build Android App (ERP)

on:
  push:
    branches: [main]
    paths:
      - 'erp/mobile_app/**'
      - '.github/workflows/mobile-app-build-fixed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp/mobile_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create . --platforms=android --project-name anvi_mitra_school_app

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.ERP_API_BASE_URL }} --dart-define=APP_VERSION=0.3.0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anvi-mitra-school-app-apk
          path: erp/mobile_app/build/app/outputs/flutter-apk/app-release.apk
