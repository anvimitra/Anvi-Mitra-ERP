name: Build Android App (ERP)

on:
  push:
    branches: [main]
    paths:
      - 'erp/mobile_app/**'
      - '.github/workflows/mobile-app-build-fixed.yml'
  workflow_dispatch:
    inputs:
      school_name:
        description: 'School name shown in the app'
        required: true
        default: 'LSK Academy'
      school_slug:
        description: 'Stable school slug, e.g. lsk-academy'
        required: true
        default: 'lsk-academy'
      application_id:
        description: 'Unique Android application ID, e.g. in.anvimitra.lskacademy'
        required: true
        default: 'in.anvimitra.lskacademy'
      artifact_name:
        description: 'APK artifact name'
        required: true
        default: 'lsk-academy-school-app-apk'
      primary_color:
        description: 'Primary brand color without #, e.g. 4F46E5'
        required: true
        default: '4F46E5'
      secondary_color:
        description: 'Secondary brand color without #, e.g. 0F172A'
        required: true
        default: '0F172A'
      logo_url:
        description: 'Optional public HTTPS school logo URL'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp/mobile_app
    env:
      SCHOOL_NAME: ${{ inputs.school_name || 'Anvi Mitra School App' }}
      SCHOOL_SLUG: ${{ inputs.school_slug || 'anvi-mitra' }}
      APPLICATION_ID: ${{ inputs.application_id || 'in.anvimitra.schoolapp' }}
      ARTIFACT_NAME: ${{ inputs.artifact_name || 'anvi-mitra-school-app-apk' }}
      PRIMARY_COLOR: ${{ inputs.primary_color || '4F46E5' }}
      SECONDARY_COLOR: ${{ inputs.secondary_color || '0F172A' }}
      LOGO_URL: ${{ inputs.logo_url || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create . --platforms=android --project-name anvi_mitra_school_app

      - name: Apply school branding
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$APPLICATION_ID" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "Invalid Android application ID: $APPLICATION_ID"
            exit 1
          fi
          if [[ ! "$PRIMARY_COLOR" =~ ^[0-9A-Fa-f]{6}$ ]]; then
            echo "Invalid primary color: $PRIMARY_COLOR"
            exit 1
          fi
          if [[ ! "$SECONDARY_COLOR" =~ ^[0-9A-Fa-f]{6}$ ]]; then
            echo "Invalid secondary color: $SECONDARY_COLOR"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace(
              'android:label="anvi_mitra_school_app"',
              'android:label="' + os.environ['SCHOOL_NAME'] + '"'
          )
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          gtext = gradle.read_text()
          gtext, count = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "' + os.environ['APPLICATION_ID'] + '"',
              gtext,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not locate Android applicationId')
          gradle.write_text(gtext)
          PY

      - name: Install launcher icon tooling
        run: |
          flutter pub add --dev flutter_launcher_icons

      - name: Prepare school logo and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$LOGO_URL" ]]; then
            echo "No LOGO_URL supplied; keeping the generated Flutter launcher icon."
            exit 0
          fi
          if [[ ! "$LOGO_URL" =~ ^https:// ]]; then
            echo "LOGO_URL must use HTTPS"
            exit 1
          fi
          mkdir -p assets
          curl --fail --location --silent --show-error --max-time 30 "$LOGO_URL" -o assets/school_logo.png
          file assets/school_logo.png
          cat > flutter_launcher_icons.yaml <<'YAML'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/school_logo.png
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: assets/school_logo.png
          YAML
          dart run flutter_launcher_icons

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.ERP_API_BASE_URL }}
          --dart-define=APP_NAME="$SCHOOL_NAME"
          --dart-define=SCHOOL_SLUG="$SCHOOL_SLUG"
          --dart-define=PRIMARY_COLOR="$PRIMARY_COLOR"
          --dart-define=SECONDARY_COLOR="$SECONDARY_COLOR"
          --dart-define=LOGO_URL="$LOGO_URL"
          --dart-define=APP_VERSION=0.3.0

      - name: Prepare named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${ARTIFACT_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: erp/mobile_app/build/app/outputs/flutter-apk/${{ env.ARTIFACT_NAME }}.apk
