name: ERP Backend Check

on:
  push:
    branches: [main]
    paths:
      - 'erp/src/**'
      - 'erp/sql/**'
      - 'erp/test/**'
      - 'erp/package.json'
      - '.github/workflows/erp-backend-check.yml'
  pull_request:
    paths:
      - 'erp/src/**'
      - 'erp/sql/**'
      - 'erp/test/**'
      - 'erp/package.json'
      - '.github/workflows/erp-backend-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://erp:erp@127.0.0.1:5432/erp_test
      JWT_SECRET: ci-only-anvi-mitra-erp-secret-1234567890
    defaults:
      run:
        working-directory: erp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check server files
        run: |
          set +e
          : > syntax-report.txt
          failed=0
          for file in src/*.js; do
            echo "===== $file =====" >> syntax-report.txt
            node --check "$file" >> syntax-report.txt 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "OK: $file" >> syntax-report.txt
            else
              echo "FAIL: $file (exit $code)" >> syntax-report.txt
              failed=1
            fi
          done
          cat syntax-report.txt
          exit "$failed"
      - name: Upload syntax report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-backend-syntax-report
          path: erp/syntax-report.txt
          if-no-files-found: warn
      - name: Validate migration filenames
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = fs.readdirSync('sql').filter(f => /^\d+_.+\.sql$/.test(f)).sort();
          if (!files.length) throw new Error('No SQL migrations found');
          for (const file of files) {
            const text = fs.readFileSync(`sql/${file}`, 'utf8');
            if (!text.trim()) throw new Error(`Empty migration: ${file}`);
          }
          console.log(`Validated ${files.length} SQL migration files.`);
          NODE
      - name: Run PostgreSQL migrations
        run: npm run migrate
      - name: Run Node test suite
        run: npm test
      - name: Check critical modules exist
        run: |
          test -f src/sync.js
          test -f src/teacher_permissions.js
          test -f src/security_hardening.js
          test -f sql/036_teacher_marks_guard.sql
          test -f local_connector/server.js
          test -f mobile_app/lib/offline_sync.dart
