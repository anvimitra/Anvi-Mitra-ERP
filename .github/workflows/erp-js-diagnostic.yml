name: ERP JS Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'erp/src/**'
      - '.github/workflows/erp-js-diagnostic.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - academic_master.js
          - auth.js
          - exam_marks.js
          - exam_results.js
          - local_storage.js
          - migrate.js
          - organization.js
          - security.js
          - server.js
          - staff.js
          - student_enrollment.js
          - sync.js
          - sync_admin.js
          - sync_routes.js
          - teacher_assignments.js
          - teacher_permissions.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check file
        run: node --check "erp/src/FILE"
