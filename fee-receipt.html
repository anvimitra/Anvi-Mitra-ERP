<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fee Receipt | Anvi Mitra ERP</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:24px;color:#172033}.wrap{max-width:820px;margin:auto}.toolbar{display:flex;gap:10px;margin-bottom:16px}.toolbar input{flex:1;padding:11px;border:1px solid #ccd3dc;border-radius:8px}.toolbar button{padding:11px 16px;border:0;border-radius:8px;cursor:pointer}.receipt{background:#fff;padding:32px;border-radius:12px;box-shadow:0 2px 12px #0001}.head{text-align:center;border-bottom:2px solid #172033;padding-bottom:16px}.head h1{margin:0 0 6px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0}.meta div{padding:8px;background:#f7f8fa}.right{text-align:right}.items{width:100%;border-collapse:collapse;margin-top:18px}.items th,.items td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.totals{margin-left:auto;max-width:320px;margin-top:18px}.totals div{display:flex;justify-content:space-between;padding:5px}.grand{font-weight:bold;font-size:18px;border-top:2px solid #172033;margin-top:5px;padding-top:10px}.foot{margin-top:35px;display:flex;justify-content:space-between}.error{color:#b42318;margin:10px 0}@media print{body{background:#fff;padding:0}.toolbar{display:none}.receipt{box-shadow:none;border-radius:0}.wrap{max-width:none}}</style></head><body><div class="wrap"><div class="toolbar"><input id="receiptNo" placeholder="Enter receipt number"><button onclick="loadReceipt()">Load Receipt</button><button onclick="window.print()">Print</button></div><div id="error" class="error"></div><div id="receipt" class="receipt" style="display:none"></div></div><script>const token=localStorage.getItem('lskerp_token')||localStorage.getItem('token');async function loadReceipt(no){no=(no||document.getElementById('receiptNo').value).trim();if(!no)return;document.getElementById('receiptNo').value=no;const e=document.getElementById('error');e.textContent='';try{const r=await fetch('/api/fees/payments/'+encodeURIComponent(no)+'/receipt',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Receipt not found');render(d)}catch(x){e.textContent=x.message}}function money(v){return '₹'+Number(v||0).toFixed(2)}function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function render(d){const x=d.receipt,el=document.getElementById('receipt');el.style.display='block';el.innerHTML='<div class="head"><h1>'+esc(x.branchName||'Anvi Mitra ERP')+'</h1><div>'+esc(x.branchAddress||'')+'</div><div>'+esc(x.branchPhone||'')+(x.branchEmail?' | '+esc(x.branchEmail):'')+'</div><h2>FEE PAYMENT RECEIPT</h2></div><div class="meta"><div><b>Receipt No:</b> '+esc(x.receiptNo)+'</div><div class="right"><b>Date:</b> '+esc(x.paidOn)+'</div><div><b>Student:</b> '+esc(x.studentName)+'</div><div class="right"><b>Admission No:</b> '+esc(x.admissionNo)+'</div><div><b>Class:</b> '+esc([x.className,x.sectionName].filter(Boolean).join(' - '))+'</div><div class="right"><b>Invoice:</b> '+esc(x.invoiceNo)+'</div></div><table class="items"><thead><tr><th>Fee Head</th><th>Description</th><th>Amount</th></tr></thead><tbody>'+d.items.map(i=>'<tr><td>'+esc(i.feeHeadName)+'</td><td>'+esc(i.description||'')+'</td><td>'+money(i.amount)+'</td></tr>').join('')+'</tbody></table><div class="totals"><div><span>Payment Received</span><b>'+money(x.amount)+'</b></div><div><span>Invoice Net</span><b>'+money(x.netAmount)+'</b></div><div><span>Total Paid</span><b>'+money(x.paidAmount)+'</b></div><div><span>Balance</span><b>'+money(x.balanceAmount)+'</b></div><div><span>Method</span><b>'+esc(x.method)+'</b></div></div><div class="foot"><span>Received by: '+esc(x.receivedBy||'')+'</span><span>Authorized Signature</span></div>'}const qp=new URLSearchParams(location.search).get('receiptNo');if(qp)loadReceipt(qp)</script></body></html>
