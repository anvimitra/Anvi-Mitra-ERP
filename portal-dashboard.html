<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Dashboard</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb;--line:#e5eaf2;--brand:#5b5bd6;--accent:#08a88a}*{box-sizing:border-box}body{margin:0;overflow-x:hidden}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:linear-gradient(160deg,#0b1024,#29265f 55%,#3c2470);color:#fff;padding:22px;position:relative;overflow:hidden}.side:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:#ffffff10;right:-80px;bottom:10%;animation:orb 8s ease-in-out infinite alternate}.brand{font-size:20px;font-weight:900;letter-spacing:-.4px}.sub{font-size:11px;color:#bfc8ea;margin:5px 0 28px}.nav{display:grid;gap:7px;position:relative;z-index:1}.nav button{border:1px solid transparent;background:#ffffff05;color:#dce3ff;text-align:left;padding:11px 12px;border-radius:11px;font-size:14px;cursor:pointer;transition:.2s}.nav button:hover,.nav button.active{background:#ffffff14;border-color:#ffffff18;color:#fff;transform:translateX(3px)}.logout{position:relative;z-index:1;margin-top:18px;width:100%;padding:10px;border:1px solid #53608a;background:#ffffff08;color:white;border-radius:10px;cursor:pointer}.main{padding:25px;max-width:1500px;width:100%;margin:auto;position:relative}.main:before{content:'';position:fixed;inset:-35%;z-index:-1;background:radial-gradient(circle at 15% 20%,#7c3aed12,transparent 25%),radial-gradient(circle at 85% 15%,#06b6d414,transparent 24%),radial-gradient(circle at 70% 85%,#5b5bd610,transparent 28%);animation:bgmove 18s ease-in-out infinite alternate}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;animation:down .5s ease}.top h1{margin:0;font-size:29px;letter-spacing:-.8px}.role{font-size:13px;background:#fff;border:1px solid var(--line);padding:8px 13px;border-radius:999px;box-shadow:0 7px 22px #10162d0a;text-transform:capitalize}.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#202653,#5f45c8 58%,#7439b7);color:white;border-radius:22px;padding:25px;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:0 18px 50px #34266b25;animation:rise .6s ease}.hero:after{content:'';position:absolute;width:260px;height:260px;border:1px solid #ffffff20;border-radius:50%;right:20%;top:-180px;animation:spin 18s linear infinite}.hero h2{margin:0 0 7px;font-size:23px}.hero p{margin:0;color:#e8eaff;font-size:13px}.switch{min-width:250px;position:relative;z-index:1}.switch label{display:block;font-size:10px;color:#dfe2ff;margin-bottom:5px;font-weight:800;letter-spacing:.8px}.switch select{width:100%;padding:11px;border:1px solid #ffffff35;border-radius:11px;background:#ffffff15;color:white;outline:none}.switch select option{color:#172033;background:white}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:17px}.card,.section{background:#ffffffd9;backdrop-filter:blur(10px);border:1px solid #e4e8f0;border-radius:17px;padding:18px;box-shadow:0 12px 35px #10162d09;animation:rise .55s ease}.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.label{font-size:12px;color:#667085}.value{font-size:28px;font-weight:900;margin-top:5px}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item{padding:16px;border:1px solid #e7eaf0;border-radius:13px;background:#fff;text-align:left;cursor:pointer;font:inherit;transition:.2s}.item:hover{transform:translateY(-3px);box-shadow:0 12px 28px #10162d12;border-color:#cfd5e5}.item b{display:block;margin-bottom:5px}.muted{color:#667085;font-size:13px;line-height:1.45}.error{color:#b42318;font-size:13px;margin-top:12px}.status{font-size:12px;color:#087443;margin-top:5px}.sync-btn{margin-top:10px;border:1px solid #cfd5e1;background:#fff;padding:8px 10px;border-radius:9px;font-weight:800;cursor:pointer}.sync-btn:disabled{opacity:.6}.online{color:#087443}.offline{color:#b54708}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{padding:12px;position:sticky;top:0;z-index:5}.nav{display:flex;overflow:auto}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.main{padding:16px}}@media(max-width:620px){.cards{grid-template-columns:1fr}.top,.hero{align-items:flex-start;flex-direction:column}.switch{width:100%;min-width:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes down{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}@keyframes bgmove{from{transform:translate3d(-1%,0,0) scale(1)}to{transform:translate3d(1%,2%,0) scale(1.05)}}@keyframes orb{from{transform:translateY(0)}to{transform:translateY(-35px)}}@keyframes spin{to{transform:rotate(360deg)}}</style><script>function openModule(label){const routes={'Students':'/erp/web/student-enrollment.html','Teachers':'/erp/web/staff-management.html','Teacher Assignments':'/erp/web/teacher-assignments.html','Report Cards':'/erp/web/report-card-management.html','Report Card Designer':'/erp/web/report-card-designer.html','Fees':'/erp/web/fee-management.html','Academic Setup':'/erp/web/academic-master.html','Exams & Results':'/erp/web/exam-management.html','Local Storage':'/erp/web/local-storage.html','Teacher Permissions':'/erp/web/teacher-permissions.html'};if(routes[label])location.href=routes[label]}</script></head><body><div class="app"><aside class="side"><div class="brand">Anvi Mitra ERP</div><div class="sub">Multi-School • Multi-Branch</div><nav class="nav" id="nav"></nav><button class="logout" id="logout">Logout</button></aside><main class="main"><div class="top"><h1 id="title">Dashboard</h1><div class="role" id="role">Role: —</div></div><section class="hero"><div><h2 id="schoolName">Welcome to Anvi Mitra ERP</h2><p id="branchName">Choose your working branch for a focused dashboard.</p></div><div class="switch"><label>WORKING BRANCH</label><select id="branchSelect"><option value="">All / School level</option></select></div></section><div class="cards" id="cards"></div><div class="section"><h2>Quick access</h2><div class="grid" id="content"></div><div class="error" id="error"></div></div></main></div><script src="/erp/web/api.js"></script><script src="/erp/web/offline-sync.js"></script><script>(async()=>{const token=LSKERP.token();if(!token){location.replace('/erp/web/login.html');return}let user=LSKERP.user();const role=(user.role||'').toLowerCase();const roles={admin:['Dashboard','Academic Setup','Students','Admissions','Attendance','Exams & Results','Fees','Timetable','Homework','Teachers','Reports','Report Cards','Report Card Designer'],principal:['Dashboard','Academic Setup','Students','Admissions','Attendance','Exams & Results','Fees','Timetable','Homework','Teachers','Reports','Report Cards','Report Card Designer'],super_admin:['Dashboard','School Management','Academic Setup','Students','Admissions','Attendance','Exams & Results','Fees','Timetable','Homework','Teachers','Reports','Report Cards','Report Card Designer'],accountant:['Dashboard','Students','Fees','Reports'],office_staff:['Dashboard','Students','Admissions','Fees','Reports'],teacher:['Dashboard','Students','Attendance','Exams & Results','Timetable','Homework'],parent:['Dashboard','My Children','Attendance','Homework','Exams & Results','Fees']};const data={admin:[['Academic Setup','Classes, sections, subjects and academic sessions'],['Students','Admissions, profiles and enrollments'],['Reports','Academic and operational reports'],['Report Cards','Generate, review, publish and print student report cards'],['Report Card Designer','Create school / branch-specific report card templates'],['Fees','Fee structure, invoices, collection and dues']],principal:[['Academic Setup','Classes, sections, subjects and academic sessions'],['Students','Admissions, profiles and enrollments'],['Reports','Academic and operational reports'],['Report Cards','Generate, review, publish and print student report cards'],['Fees','Fee structure, invoices, collection and dues']],super_admin:[['Academic Setup','Classes, sections, subjects and academic sessions'],['Students','Admissions, profiles and enrollments'],['Reports','Academic and operational reports'],['Report Cards','Generate, review, publish and print student report cards'],['Fees','Fee structure, invoices, collection and dues']],accountant:[['Fees','Fee structure, invoices, collection and dues'],['Reports','Collection and outstanding reports']],office_staff:[['Students','Admissions, profiles and enrollments'],['Fees','Fee structure, invoices, collection and dues']],teacher:[['Today','Attendance and timetable at a glance'],['Homework','Create and review class homework'],['Results','FA1 / FA2 / FA3 / Half Yearly / Yearly marks']],parent:[['My Children','See linked student profiles'],['Homework','See assigned and pending homework'],['Results','View published exam results']]};if(!roles[role]){sessionStorage.clear();location.replace('/erp/web/login.html');return}document.getElementById('role').textContent='Role: '+role;const nav=document.getElementById('nav');roles[role].forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.className=i?'':'active';b.onclick=()=>{document.querySelectorAll('.nav button').forEach(n=>n.classList.remove('active'));b.classList.add('active');document.getElementById('title').textContent=x;if(x==='School Management'){location.href='/erp/web/super-admin-schools.html';return}openModule(x)};nav.appendChild(b)});document.getElementById('content').innerHTML=data[role].map(x=>'<button class="item" onclick="openModule(\''+x[0]+'\')"><b>'+x[0]+'</b><span class="muted">'+x[1]+'</span></button>').join('');document.getElementById('logout').onclick=()=>{sessionStorage.clear();location.replace('/erp/web/login.html')};async function load(){try{const org=await LSKERP.request('/api/organization');document.getElementById('schoolName').textContent=org.school.displayName||org.school.name;const select=document.getElementById('branchSelect');select.innerHTML='<option value="">All / School level</option>'+(org.branches||[]).map(b=>'<option value="'+b.id+'">'+b.name+' ('+b.code+')</option>').join('');if(user.branchId)select.value=user.branchId;document.getElementById('branchName').textContent=select.value?((org.branches||[]).find(b=>b.id===select.value)?.name||'Selected branch')+' • Branch-scoped view':'School-level view • Select a branch to focus your workspace';select.onchange=async()=>{try{select.disabled=true;await LSKERP.setBranch(select.value);user=LSKERP.user();await load()}catch(e){document.getElementById('error').textContent=e.message||'Could not switch branch'}finally{select.disabled=false}};const d=role==='parent'?await LSKERP.request('/api/portal/me/students'):await LSKERP.request('/api/students');const list=d.students||[];let sync={online:navigator.onLine,outboxCount:0,cursor:0};if(window.AnviMitraOfflineSync)sync=await AnviMitraOfflineSync.status();document.getElementById('cards').innerHTML='<div class="card"><div class="label">Students visible</div><div class="value">'+list.length+'</div><div class="muted">Based on your school/branch access</div></div><div class="card"><div class="label">Branches</div><div class="value">'+(org.branches||[]).length+'</div><div class="muted">Configured branches</div></div><div class="card"><div class="label">ERP status</div><div class="value">✓</div><div class="status">Authenticated & connected</div></div><div class="card"><div class="label">Data sync</div><div class="value '+(sync.online?'online':'offline')+'" style="font-size:20px">'+(sync.online?'Online':'Offline')+'</div><div class="muted">Pending: '+sync.outboxCount+' • Cursor: '+sync.cursor+'</div><button class="sync-btn" id="syncNow">Sync now</button></div>';document.getElementById('syncNow').onclick=async()=>{const b=document.getElementById('syncNow');b.disabled=true;b.textContent='Syncing…';try{if(window.AnviMitraOfflineSync)await AnviMitraOfflineSync.sync();await load()}catch(e){document.getElementById('error').textContent=e.message||'Sync failed'}finally{b.disabled=false;b.textContent='Sync now'}}}catch(e){document.getElementById('error').textContent=e.message||'Could not load dashboard data'}}load()})();</script></body></html>
