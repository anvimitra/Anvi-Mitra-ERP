<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent Attendance — Anvi Mitra ERP</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb;--line:#e5e7eb;--brand:#5b5bd6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.brand{font-size:22px;font-weight:850}.muted{color:#667085;font-size:13px}.btn{display:inline-block;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#172033;text-decoration:none;font-weight:750;cursor:pointer}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.controls select,.controls input{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#f7f8fc;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px}.day{min-height:58px;border:1px solid var(--line);border-radius:10px;padding:7px;font-size:12px;background:#fff}.day b{display:block;font-size:13px}.present{background:#ecfdf3;border-color:#a7f3d0}.absent{background:#fef2f2;border-color:#fecaca}.late{background:#fff7ed;border-color:#fed7aa}.half_day{background:#fffbeb;border-color:#fde68a}.leave{background:#eff6ff;border-color:#bfdbfe}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px}.legend span{padding:5px 8px;border-radius:8px}.error{color:#b42318;min-height:20px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.calendar{gap:5px}.day{min-height:50px;padding:5px;font-size:11px}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">📊 Attendance Detail</div><div class="muted">Parent Portal</div></div><a class="btn" href="/erp/web/parent-dashboard.html">← Dashboard</a></div><div class="controls"><select id="child"><option>Loading children…</option></select><input id="month" type="month"><button class="btn primary" id="load">Load Attendance</button></div><div id="error" class="error"></div><section class="card"><h2 id="title">Attendance</h2><div class="stats"><div class="stat">Present<b id="present">—</b></div><div class="stat">Absent<b id="absent">—</b></div><div class="stat">Late<b id="late">—</b></div><div class="stat">Leave<b id="leave">—</b></div><div class="stat">Attendance %<b id="pct">—%</b></div></div><div class="legend"><span class="present">🟢 Present</span><span class="absent">🔴 Absent</span><span class="late">🟠 Late</span><span class="half_day">🟡 Half Day</span><span class="leave">🔵 Leave</span></div><div id="calendar" class="calendar"></div></section></div><script src="/erp/web/api.js"></script><script>(async()=>{const error=document.getElementById('error');try{if(!LSKERP.token())return location.replace('/erp/web/login.html');const u=LSKERP.user();if((u.role||'').toLowerCase()!=='parent')return location.replace('/erp/web/portal-dashboard.html');const overview=await LSKERP.request('/api/portal/me/overview');const children=overview.students||[];const child=document.getElementById('child');const qs=new URLSearchParams(location.search);child.innerHTML=children.map(s=>`<option value="${String(s.id).replace(/"/g,'&quot;')}">${String(s.fullName||'').replace(/[&<>]/g,'')}</option>`).join('')||'<option value="">No children</option>';if(qs.get('studentId')&&children.some(s=>String(s.id)===qs.get('studentId')))child.value=qs.get('studentId');const now=new Date();document.getElementById('month').value=now.toISOString().slice(0,7);document.getElementById('load').onclick=load;async function load(){const sid=child.value;if(!sid)return;const ym=document.getElementById('month').value;if(!/^\d{4}-\d{2}$/.test(ym))return;const [y,m]=ym.split('-').map(Number);const from=`${ym}-01`,last=new Date(y,m,0).getDate(),to=`${ym}-${String(last).padStart(2,'0')}`;error.textContent='';const d=await LSKERP.request(`/api/portal/me/student/${encodeURIComponent(sid)}/attendance?from=${from}&to=${to}`);const s=d.summary||{};document.getElementById('present').textContent=s.present||0;document.getElementById('absent').textContent=s.absent||0;document.getElementById('late').textContent=s.late||0;document.getElementById('leave').textContent=s.leave||0;document.getElementById('pct').textContent=Number(s.attendancePercent||0).toFixed(1)+'%';const selected=children.find(x=>String(x.id)===String(sid));document.getElementById('title').textContent=(selected?.fullName||'Student')+' — '+new Date(y,m-1).toLocaleString('en-IN',{month:'long',year:'numeric'});const map={};(d.attendance||[]).forEach(x=>{map[String(x.date).slice(0,10)]=x});let html='';for(let day=1;day<=last;day++){const ds=`${ym}-${String(day).padStart(2,'0')}`,a=map[ds];const cls=a?.status||'';html+=`<div class="day ${cls}"><b>${day}</b><span>${a?({present:'Present',absent:'Absent',late:'Late',half_day:'Half Day',leave:'Leave'}[a.status]||a.status):'Not marked'}</span></div>`}document.getElementById('calendar').innerHTML=html}if(children.length)await load()}catch(e){error.textContent=e.message||'Unable to load attendance.'}})();</script></body></html>
