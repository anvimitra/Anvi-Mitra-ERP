<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Sync Monitor</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--line:#e4e8f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.label{font-size:12px;color:#667085}.value{font-size:25px;font-weight:800;margin-top:4px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}.btn{border:0;border-radius:8px;padding:8px 11px;background:#172b55;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:#172033;border:1px solid var(--line)}.btn.warn{background:#b42318}.actions{display:flex;gap:7px;flex-wrap:wrap}.msg{margin:10px 0;font-size:13px}.ok{color:#087443}.err{color:#b42318}.json{max-width:350px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,monospace;font-size:11px;background:#f8fafc;padding:7px;border-radius:7px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>Sync Monitor</h1><p class="muted">Central PostgreSQL remains the source of truth. Review offline conflicts before they are applied.</p></div><div class="actions"><button class="btn alt" onclick="location.href='/erp/web/portal-dashboard.html'">Dashboard</button><button class="btn" id="refresh">Refresh</button></div></div><div class="grid" id="stats"></div><section class="panel"><h2>Pending conflicts</h2><div id="msg" class="msg"></div><div class="tablewrap"><table class="table"><thead><tr><th>Created</th><th>Device</th><th>Entity</th><th>Local</th><th>Server</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(!['super_admin','principal','admin'].includes(role)){document.body.innerHTML='<main class="wrap"><section class="panel"><h2>Access denied</h2><p class="muted">Only school administrators can resolve sync conflicts.</p></section></main>';return}const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pretty=v=>esc(JSON.stringify(v||{},null,2));async function load(){try{const [s,c]=await Promise.all([LSKERP.request('/api/sync/status'),LSKERP.request('/api/sync/conflicts?resolution=pending&limit=200')]);$('stats').innerHTML=`<div class="card"><div class="label">Active devices</div><div class="value">${s.deviceCount?.active||0}</div></div><div class="card"><div class="label">Changes last 24h</div><div class="value">${s.changesLast24h||0}</div></div><div class="card"><div class="label">Pending conflicts</div><div class="value">${s.pendingConflicts||0}</div></div><div class="card"><div class="label">Latest cursor</div><div class="value">${s.latestChange?.cursor||0}</div></div>`;const list=c.conflicts||[];$('rows').innerHTML=list.map(x=>`<tr><td>${esc(x.createdAt)}</td><td>${esc(x.deviceName||x.deviceId||'Unknown')}</td><td><b>${esc(x.entityType)}</b><br><span class="muted">${esc(x.entityId)}</span></td><td><div class="json">${pretty(x.localPayload)}</div></td><td><div class="json">${pretty(x.serverPayload)}</div></td><td><div class="actions"><button class="btn" data-action="server" data-id="${x.id}">Server wins</button><button class="btn alt" data-action="local" data-id="${x.id}">Local wins</button><button class="btn warn" data-action="merge" data-id="${x.id}">Merge JSON</button></div></td></tr>`).join('')||'<tr><td colspan="6">No pending conflicts.</td></tr>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>resolve(b.dataset.id,b.dataset.action));$('msg').className='msg ok';$('msg').textContent='Sync status refreshed.'}catch(e){$('msg').className='msg err';$('msg').textContent=e.message||'Could not load sync status'}}async function resolve(id,action){let resolution=action==='server'?'server_wins':action==='local'?'local_wins':'merged';let mergedPayload=null;if(resolution==='merged'){const raw=prompt('Enter merged JSON payload');if(raw===null)return;try{mergedPayload=JSON.parse(raw);if(!mergedPayload||typeof mergedPayload!=='object')throw new Error()}catch(_){alert('Invalid JSON');return}}const note=prompt('Resolution note (optional)')||'';try{await LSKERP.request('/api/sync/conflicts/'+id+'/resolve',{method:'POST',body:JSON.stringify({resolution,note,mergedPayload})});await load()}catch(e){alert(e.message||'Could not resolve conflict')}}$('refresh').onclick=load;load()})();</script></body></html>
