<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Teacher Permissions</title>
<style>:root{--p:#4f46e5;--c:#06b6d4;--bg:#f5f7fb;--ink:#172033;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 90% 0,#cffafe,transparent 30%),var(--bg);color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{padding:30px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#111827,#3730a3 55%,#0891b2);box-shadow:0 20px 55px #11182726}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#dbeafe}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 24px #1118270b}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fields label{font-size:11px;font-weight:800}.fields select{width:100%;margin-top:5px;padding:11px;border:1px solid #d7dce7;border-radius:10px;background:#fff}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--p),var(--c));color:#fff}.badge{display:inline-flex;padding:5px 9px;border-radius:99px;background:#ecfdf3;color:#027a48;font-size:11px;font-weight:900}.muted{color:var(--muted)}.switch{display:flex;gap:9px;align-items:center;margin-top:10px}.switch input{width:auto}@media(max-width:800px){.fields{grid-template-columns:1fr 1fr}}@media(max-width:520px){.fields{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><section class="hero"><h1>Teacher Permissions</h1><p>Assign exactly which session, class/section and subject a teacher can work with.</p></section>
<div class="bar"><span id="status" class="muted">Loading…</span><a class="btn" href="/super-admin/schools">← Schools</a><button class="btn primary" onclick="save()">Save Assignment</button></div>
<section class="card"><div class="fields"><label>Teacher<select id="teacher"></select></label><label>Academic Session<select id="session"></select></label><label>Class / Section<select id="section"></select></label><label>Subject<select id="subject"></select></label></div><div class="switch"><input id="canMark" type="checkbox" checked><label for="canMark">Can enter marks</label><input id="canAttendance" type="checkbox" checked><label for="canAttendance">Can enter attendance</label></div></section>
<div class="bar"><h2>Existing assignments</h2><span class="muted">Server authorization remains active even offline.</span></div><div id="list" class="grid"></div></div>
<script>
let masters={}, assignments=[];const token=()=>localStorage.getItem('accessToken')||localStorage.getItem('token')||sessionStorage.getItem('lsk_access_token')||'';
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token(),'Content-Type':'application/json'};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{masters=await api('/api/teacher-assignments/masters');assignments=(await api('/api/teacher-assignments')).assignments||[];teacher.innerHTML=(masters.teachers||[]).map(x=>'<option value="'+x.id+'">'+esc(x.email||x.phone||x.id)+'</option>').join('');session.innerHTML=(masters.sessions||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');section.innerHTML=(masters.sections||[]).map(x=>'<option value="'+x.id+'">'+esc(x.className)+' — '+esc(x.name)+'</option>').join('');subject.innerHTML=(masters.subjects||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+' ('+esc(x.code)+')</option>').join('');render();status.textContent=assignments.length+' assignment(s) loaded'}catch(e){status.textContent=e.message}}
function render(){list.innerHTML=assignments.map(a=>'<article class="card"><b>'+esc(a.email||a.phone)+'</b><p>'+esc(a.className)+' / '+esc(a.sectionName)+' • '+esc(a.subjectName)+'</p><p class="muted">'+esc(a.sessionName||'')+(a.branchName?' • '+esc(a.branchName):'')+'</p><span class="badge">'+(a.canMark?'Marks enabled':'Marks disabled')+'</span> <span class="badge">'+(a.canAttendance?'Attendance enabled':'Attendance disabled')+'</span></article>').join('')||'<div class="card">No assignments yet.</div>'}
async function save(){try{await api('/api/teacher-assignments',{method:'POST',body:JSON.stringify({teacherId:teacher.value,sessionId:session.value,sectionId:section.value,subjectId:subject.value,canMark:canMark.checked,canAttendance:canAttendance.checked})});status.textContent='Assignment saved';load()}catch(e){status.textContent=e.message}}
load();
</script></body></html>
