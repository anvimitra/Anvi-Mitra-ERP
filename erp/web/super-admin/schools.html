<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anvi Mitra ERP • School Management</title>
<style>
:root{--p:#4f46e5;--p2:#06b6d4;--bg:#f4f7fb;--ink:#172033;--muted:#667085;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 10% 0%,#dbeafe 0,transparent 32%),var(--bg);color:var(--ink)}
.wrap{max-width:1180px;margin:auto;padding:28px}.hero{position:relative;overflow:hidden;padding:34px;border-radius:28px;color:#fff;background:linear-gradient(135deg,#111827,#3730a3 55%,#0891b2);box-shadow:0 20px 55px #11182726}
.hero:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-65px;top:-100px;background:#ffffff14;animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(22px) scale(1.08)}}
.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;color:#dbeafe}.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:20px 0;flex-wrap:wrap}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:19px;box-shadow:0 8px 24px #1118270b;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 38px #11182718}
.logo{width:52px;height:52px;object-fit:contain;border-radius:14px;background:#f8fafc;border:1px solid var(--line)}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#ecfdf3;color:#027a48;font-size:12px;font-weight:800}.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
input{padding:11px 12px;border:1px solid #d7dce7;border-radius:11px;background:#fff;width:100%}.search{width:min(360px,100%)}.status{padding:10px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.open{display:flex}.panel{background:#fff;padding:24px;border-radius:24px;width:min(780px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px #0004}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.fields label{font-size:12px;font-weight:800}.fields input{margin-top:6px}.full{grid-column:1/-1}.section{grid-column:1/-1;margin-top:5px;padding-top:14px;border-top:1px solid var(--line);font-weight:900}.meter{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--p2));transition:.25s}
@media(max-width:650px){.fields{grid-template-columns:1fr}.full,.section{grid-column:auto}}
</style></head>
<body><div class="wrap">
<section class="hero"><h1>School Management</h1><p>Super Admin • Multi-school ERP • Provision, brand and onboard schools from one control center.</p></section>
<div class="bar"><div class="tools"><input class="search" id="q" placeholder="Search school…" oninput="render()"><span class="status" id="network">Checking connection…</span></div><button class="btn primary" onclick="openModal()">＋ Add School</button></div>
<div class="status" id="status">Loading schools…</div><div id="grid" class="grid"></div></div>
<div id="m" class="modal"><div class="panel"><div class="bar"><div><h2 style="margin:0">Add School</h2><div class="muted">School + branding + branch + first administrator.</div></div><button class="btn" onclick="closeModal()">✕</button></div>
<form onsubmit="save(event)"><div class="fields">
<div class="section">School profile</div><label>School Name<input id="name" required></label><label>School Code<input id="code" required></label><label>Display Name<input id="displayName"></label><label>Logo URL<input id="logoUrl" placeholder="https://…"></label><label>Phone<input id="phone"></label><label>Email<input id="email" type="email"></label><label>Website<input id="website"></label><label>Timezone<input id="timezone" value="Asia/Kolkata"></label><label>Currency<input id="currencyCode" value="INR"></label><label>Locale<input id="locale" value="en-IN"></label><label>Primary Color<input id="primaryColor" placeholder="#4f46e5"></label><label>Secondary Color<input id="secondaryColor" placeholder="#06b6d4"></label><label class="full">Address<input id="address"></label>
<div class="section">ERP / mobile app</div><label>App Name<input id="appName"></label><label>App Slug<input id="appSlug" required placeholder="school-name"></label><label>Android Package<input id="androidPackage" placeholder="com.example.school"></label><label>iOS Bundle ID<input id="iosBundleId"></label><label class="full">API Base URL<input id="apiBaseUrl" placeholder="https://api.example.com"></label>
<div class="section">Main branch</div><label>Main Branch<input id="mainBranchName" value="Main Branch"></label><label>Branch Code<input id="mainBranchCode" value="MAIN"></label>
<div class="section">First school administrator</div><label>Admin email<input id="adminEmail" type="email"></label><label>Admin phone<input id="adminPhone"></label><label>Admin password<input id="adminPassword" type="password" minlength="6" required></label><label>Confirm password<input id="adminPassword2" type="password" minlength="6" required></label>
</div><div class="meter"><i id="meter"></i></div><div class="bar"><span id="formStatus" class="muted"></span><button id="createBtn" class="btn primary">Create School + Admin</button></div></form></div></div>
<script>
let schools=[];const m=document.getElementById('m');const token=()=>localStorage.getItem('accessToken')||localStorage.getItem('token')||'';
const api=async(u,o={})=>{o.headers={...(o.headers||{}),Authorization:'Bearer '+token(),'Content-Type':'application/json'};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function updateNetwork(){const online=navigator.onLine;network.textContent=online?'● Online • sync available':'○ Offline • cached data and pending changes';network.style.color=online?'#027a48':'#b54708'}addEventListener('online',updateNetwork);addEventListener('offline',updateNetwork);updateNetwork();
function openModal(){m.classList.add('open')}function closeModal(){m.classList.remove('open')}
function render(){const q=document.getElementById('q').value.toLowerCase();grid.innerHTML=schools.filter(s=>(s.name+' '+s.code+' '+(s.displayName||'')).toLowerCase().includes(q)).map(s=>'<article class="card"><div class="bar" style="margin:0 0 10px"><div><h3 style="margin:0">'+esc(s.displayName||s.name)+'</h3><small class="muted">'+esc(s.code)+'</small></div><span class="badge">'+esc(s.status||'active')+'</span></div><div><b>'+esc(s.appSlug||'')+'</b></div><p class="muted">'+esc(s.address||'No address')+'</p><small>'+esc(s.email||'')+' '+esc(s.phone||'')+'</small></article>').join('')||'<div class="card">No schools found.</div>'}
async function load(){try{schools=(await api('/api/platform/schools')).schools||[];status.textContent=schools.length+' school(s) provisioned';render()}catch(e){status.textContent=e.message}}
async function save(e){e.preventDefault();const p=adminPassword.value,p2=adminPassword2.value;if(p!==p2){formStatus.textContent='Admin passwords do not match';return}if(!adminEmail.value.trim()&&!adminPhone.value.trim()){formStatus.textContent='Provide admin email or phone';return}
const ids=['name','code','displayName','appName','appSlug','logoUrl','phone','email','website','timezone','currencyCode','locale','primaryColor','secondaryColor','address','mainBranchName','mainBranchCode','adminEmail','adminPhone','adminPassword','androidPackage','iosBundleId','apiBaseUrl'];const b={};ids.forEach(id=>b[id]=document.getElementById(id).value.trim());
createBtn.disabled=true;meter.style.width='35%';formStatus.textContent='Provisioning school…';
try{const created=await api('/api/platform/schools',{method:'POST',body:JSON.stringify(b)});meter.style.width='70%';formStatus.textContent='School created • creating administrator…';await api('/api/platform/schools/'+encodeURIComponent(created.school.id)+'/admin',{method:'POST',body:JSON.stringify({email:b.adminEmail,phone:b.adminPhone,password:b.adminPassword,role:'admin'})});meter.style.width='100%';formStatus.textContent='School and administrator created successfully';setTimeout(()=>{closeModal();e.target.reset();meter.style.width='0';formStatus.textContent='';load()},600)}catch(err){meter.style.width='0';formStatus.textContent=err.message}finally{createBtn.disabled=false}}
load();
</script></body></html>
