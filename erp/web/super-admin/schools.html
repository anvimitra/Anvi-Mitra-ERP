<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Anvi Mitra ERP - Schools</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#182033}.wrap{max-width:1100px;margin:auto;padding:28px}.hero{display:flex;justify-content:space-between;align-items:center}.card{background:white;border:1px solid #e7eaf1;border-radius:18px;padding:20px;margin-top:20px}.btn{background:#5b4bff;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}input{padding:11px;border:1px solid #ddd;border-radius:10px;margin:5px;width:calc(50% - 20px)}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #eee;text-align:left}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center}.modal.show{display:flex}.box{background:white;padding:24px;border-radius:20px;width:min(700px,90%)}small{color:#68738a}</style></head><body><main class='wrap'><div class='hero'><div><h1>School Management</h1><small>Super Admin · Anvi Mitra ERP</small></div><button class='btn' onclick='openForm()'>+ Add School</button></div><div class='card'><div id='stats'>Loading...</div><table><thead><tr><th>School</th><th>Code</th><th>App</th><th>Status</th></tr></thead><tbody id='rows'></tbody></table></div></main><div id='modal' class='modal'><div class='box'><h2>Add School</h2><form onsubmit='save(event)'><input name='name' placeholder='School name' required><input name='code' placeholder='School code' required><input name='displayName' placeholder='Display name'><input name='appName' placeholder='App name'><input name='appSlug' placeholder='App slug' required><input name='logoUrl' placeholder='Logo URL'><input name='phone' placeholder='Phone'><input name='email' placeholder='Email'><input name='address' placeholder='Address'><input name='primaryColor' placeholder='Primary color'><input name='secondaryColor' placeholder='Secondary color'><input name='mainBranchName' value='Main Branch'><input name='mainBranchCode' value='MAIN'><input name='androidPackage' placeholder='Android package'><div style='margin-top:15px;text-align:right'><button type='button' onclick='closeForm()'>Cancel</button> <button class='btn'>Create School</button></div></form></div></div><script>let schools=[];const token=()=>localStorage.getItem('anviMitraAccessToken')||localStorage.getItem('accessToken')||'';async function api(u,o={}){const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json',...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(x){return String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{schools=(await api('/api/platform/schools')).schools||[];stats.textContent='Total: '+schools.length+' · Active: '+schools.filter(x=>x.status==='active').length;rows.innerHTML=schools.map(s=>'<tr><td><b>'+esc(s.displayName||s.name)+'</b></td><td>'+esc(s.code)+'</td><td>'+esc(s.appSlug||'—')+'</td><td>'+esc(s.status)+'</td></tr>').join('')}catch(e){stats.textContent=e.message}}function openForm(){modal.classList.add('show')}function closeForm(){modal.classList.remove('show')}async function save(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.displayName=b.displayName||b.name;b.appName=b.appName||b.name;try{await api('/api/platform/schools',{method:'POST',body:JSON.stringify(b)});closeForm();e.target.reset();load()}catch(err){alert(err.message)}}load()</script></body></html>
