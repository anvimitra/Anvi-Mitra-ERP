<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Schools</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:28px}.hero{padding:28px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#172554,#4f46e5)}.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:20px 0;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 24px #1118270d}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#4f46e5;color:#fff}input{padding:11px;border:1px solid #d7dce7;border-radius:10px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.panel{background:#fff;padding:22px;border-radius:20px;width:min(720px,100%);max-height:90vh;overflow:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.fields label{font-size:12px;font-weight:700}.fields input{width:100%;margin-top:5px;box-sizing:border-box}.full{grid-column:1/-1}@media(max-width:600px){.fields{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><h1>School Management</h1><div>Super Admin • Multi-school ERP</div></section><div class="bar"><input id="q" placeholder="Search school…" oninput="render()"><button class="btn primary" onclick="document.getElementById('m').classList.add('open')">＋ Add School</button></div><div id="status"></div><div id="grid" class="grid"></div></div><div id="m" class="modal"><div class="panel"><div class="bar"><h2>Add School</h2><button class="btn" onclick="m.classList.remove('open')">✕</button></div><form onsubmit="save(event)"><div class="fields"><label>School Name<input id="name" required></label><label>School Code<input id="code" required></label><label>Display Name<input id="displayName"></label><label>App Name<input id="appName"></label><label>App Slug<input id="appSlug" required placeholder="school-name"></label><label>Logo URL<input id="logoUrl"></label><label>Phone<input id="phone"></label><label>Email<input id="email" type="email"></label><label>Website<input id="website"></label><label>Timezone<input id="timezone" value="Asia/Kolkata"></label><label>Currency<input id="currencyCode" value="INR"></label><label>Locale<input id="locale" value="en-IN"></label><label>Primary Color<input id="primaryColor" placeholder="#4f46e5"></label><label>Secondary Color<input id="secondaryColor" placeholder="#06b6d4"></label><label class="full">Address<input id="address"></label><label>Main Branch<input id="mainBranchName" value="Main Branch"></label><label>Branch Code<input id="mainBranchCode" value="MAIN"></label></div><div class="bar"><span id="formStatus"></span><button class="btn primary">Create</button></div></form></div></div><script>let schools=[];const m=document.getElementById('m');const token=()=>localStorage.getItem('accessToken')||localStorage.getItem('token')||'';async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token(),'Content-Type':'application/json'};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=document.getElementById('q').value.toLowerCase();document.getElementById('grid').innerHTML=schools.filter(s=>(s.name+' '+s.code+' '+(s.displayName||'')).toLowerCase().includes(q)).map(s=>`<article class="card"><h3>${esc(s.displayName||s.name)}</h3><div>${esc(s.code)} • ${esc(s.appSlug||'')}</div><p>${esc(s.address||'')}</p><small>${esc(s.email||'')} ${esc(s.phone||'')}</small></article>`).join('')||'<div class="card">No schools found.</div>'}async function load(){try{schools=(await api('/api/platform/schools')).schools||[];render()}catch(e){document.getElementById('status').textContent=e.message}}async function save(e){e.preventDefault();const ids=['name','code','displayName','appName','appSlug','logoUrl','phone','email','website','timezone','currencyCode','locale','primaryColor','secondaryColor','address','mainBranchName','mainBranchCode'];const b={};ids.forEach(id=>b[id]=document.getElementById(id).value.trim());document.getElementById('formStatus').textContent='Creating…';try{await api('/api/platform/schools',{method:'POST',body:JSON.stringify(b)});m.classList.remove('open');e.target.reset();await load()}catch(err){document.getElementById('formStatus').textContent=err.message}}load()</script></body></html>
