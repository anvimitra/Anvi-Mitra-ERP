<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Sync Monitoring</title>
<style>:root{--p:#4f46e5;--bg:#f5f7fb;--ink:#172033;--muted:#667085;--line:#e5e7eb;--ok:#087443;--warn:#b54708}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 10% 0,#dbeafe,transparent 30%),var(--bg);color:var(--ink)}.wrap{max-width:1200px;margin:auto;padding:28px}.hero{padding:30px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#111827,#4338ca,#0891b2);box-shadow:0 18px 45px #11182722}.hero h1{margin:0 0 7px}.hero p{margin:0;color:#dbeafe}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;background:#4f46e5;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px #1118270b}.label{font-size:12px;color:var(--muted)}.value{font-size:28px;font-weight:900;margin-top:5px}.status{font-size:12px;margin-top:6px}.ok{color:var(--ok)}.warn{color:var(--warn)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:800}.muted{color:var(--muted)}.error{color:#b42318;margin-top:12px}.empty{padding:20px;text-align:center;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:16px}.table{font-size:12px}.table th,.table td{padding:8px}}</style></head>
<body><main class="wrap"><section class="hero"><h1>Sync Monitoring</h1><p>School-wide visibility for offline devices, change journal, pending conflicts and last-seen health.</p></section>
<div class="bar"><strong id="headline">Loading sync health…</strong><button class="btn" onclick="load()">↻ Refresh</button></div><section id="cards" class="grid"></section>
<section class="card" style="margin-top:16px"><div class="bar" style="margin-top:0"><h2 style="margin:0">Registered devices</h2><span class="muted">Revoke or reset a device from the admin controls.</span></div><div style="overflow:auto"><table class="table"><thead><tr><th>Device</th><th>Platform</th><th>Cursor</th><th>Last seen</th><th>Status</th></tr></thead><tbody id="devices"></tbody></table></div></section>
<section class="card" style="margin-top:16px"><div class="bar" style="margin-top:0"><h2 style="margin:0">Pending conflicts</h2><a href="/super-admin/sync-conflicts">Open conflict center →</a></div><div id="conflicts" class="empty">Loading…</div></section><div id="error" class="error"></div></main>
<script>const token=()=>sessionStorage.getItem('lsk_access_token')||localStorage.getItem('accessToken')||localStorage.getItem('token')||'';async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token(),'Content-Type':'application/json'};const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function card(label,value,note,cls=''){return '<article class="card"><div class="label">'+label+'</div><div class="value">'+esc(value)+'</div><div class="status '+cls+'">'+esc(note)+'</div></article>'}async function load(){error.textContent='';try{const [s,d,c]=await Promise.all([api('/api/sync/status'),api('/api/sync/admin/devices'),api('/api/sync/admin/conflicts')]);const dev=s.deviceCount||{};cards.innerHTML=card('Active devices',dev.active||0,(dev.total||0)+' registered device(s)',(dev.active?'ok':''))+card('Journal changes',s.changeCount||0,'Durable server change entries')+card('Pending conflicts',s.pendingConflictCount||0,s.pendingConflictCount?'Needs admin review':'No unresolved conflicts',s.pendingConflictCount?'warn':'ok')+card('Last change',s.latestChange?.changed_at?new Date(s.latestChange.changed_at).toLocaleString():'—','Cursor '+(s.latestChange?.cursor??0));headline.textContent=(dev.active||0)+' active device(s) • '+(s.pendingConflictCount||0)+' pending conflict(s)';devices.innerHTML=(d.devices||[]).map(x=>'<tr><td><b>'+esc(x.device_name||'Unnamed device')+'</b><br><span class="muted">'+esc(x.device_key)+'</span></td><td>'+esc(x.platform)+'</td><td>'+esc(x.last_cursor)+'</td><td>'+esc(x.last_seen_at?new Date(x.last_seen_at).toLocaleString():'Never')+'</td><td><span class="pill">'+esc(x.status)+'</span></td></tr>').join('')||'<tr><td colspan="5" class="empty">No sync devices registered.</td></tr>';const pending=(c.conflicts||[]).filter(x=>x.resolution==='pending');conflicts.innerHTML=pending.length?pending.slice(0,8).map(x=>'<div style="padding:11px 0;border-bottom:1px solid var(--line)"><b>'+esc(x.entity_type)+'</b> <span class="muted">'+esc(x.entity_id||'')+'</span><div class="muted">Created '+esc(new Date(x.created_at).toLocaleString())+'</div></div>').join('')+(pending.length>8?'<div style="padding-top:12px"><a href="/super-admin/sync-conflicts">View all '+pending.length+' conflicts →</a></div>':''):'✓ No pending conflicts.'}catch(e){headline.textContent='Sync monitoring unavailable';error.textContent=e.message||'Could not load sync health'}}load();setInterval(load,30000);</script></body></html>
