<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anvi Mitra ERP • School</title>
<style>
:root{--p:#4f46e5;--p2:#06b6d4;--bg:#f4f7fb;--ink:#172033;--muted:#667085;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 90% 0,#cffafe,transparent 28%),var(--bg);color:var(--ink)}
.wrap{max-width:1180px;margin:auto;padding:24px}.hero{padding:28px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#111827,#3730a3 55%,#0891b2);box-shadow:0 20px 55px #11182726}
.hero h1{margin:0 0 7px;font-size:30px}.muted{color:var(--muted)}.hero .muted{color:#dbeafe}
.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 24px #1118270b}.stat{font-size:28px;font-weight:900}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.ghost{background:#fff;border:1px solid var(--line)}
input,select{width:100%;padding:10px 12px;border:1px solid #d7dce7;border-radius:10px;margin-top:6px;background:#fff}label{font-size:12px;font-weight:800}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.tabs{display:flex;gap:8px;margin:20px 0;overflow:auto}.tab{padding:10px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer;font-weight:800}.tab.active{background:#111827;color:#fff}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.panel{background:#fff;border-radius:22px;padding:22px;width:min(720px,100%);max-height:92vh;overflow:auto}
.logo{width:70px;height:70px;border-radius:16px;object-fit:contain;border:1px solid var(--line);background:#fff}.row{display:flex;align-items:center;gap:12px}.badge{font-size:11px;font-weight:900;padding:5px 9px;border-radius:99px;background:#ecfdf3;color:#027a48}
@media(max-width:650px){.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap">
<div id="hero" class="hero"><div class="muted">Loading school…</div></div>
<div class="tabs"><button class="tab active" onclick="show('overview',this)">Overview</button><button class="tab" onclick="show('staff',this)">Staff</button><button class="tab" onclick="show('branches',this)">Branches</button></div>
<section id="overview"><div id="stats" class="grid"></div><div id="quick" class="grid" style="margin-top:15px"></div><div id="profile" class="card" style="margin-top:15px"></div></section>
<section id="staff" style="display:none"><div class="bar"><h2>School Staff</h2><button class="btn primary" onclick="openAdmin()">＋ Add Administrator</button></div><div id="staffList" class="grid"></div></section>
<section id="branches" style="display:none"><div class="bar"><h2>Branches</h2><button class="btn primary" onclick="openBranch()">＋ Add Branch</button></div><div id="branchList" class="grid"></div></section>
</div>
<div id="modal" class="modal"><div class="panel"><div class="bar"><h2 id="modalTitle" style="margin:0"></h2><button class="btn ghost" onclick="closeModal()">✕</button></div><form id="form" onsubmit="save(event)"></form></div></div>
<script>
const id=new URLSearchParams(location.search).get('id');let state={};const token=()=>sessionStorage.getItem('lsk_access_token')||localStorage.getItem('accessToken')||localStorage.getItem('token')||'';
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token(),'Content-Type':'application/json'};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{state=await api('/api/platform/schools/'+encodeURIComponent(id));const s=state.school;hero.innerHTML='<div class="row"><img class="logo" src="'+esc(s.logoUrl||'')+'" onerror="this.style.display=\'none\'"><div><h1>'+esc(s.displayName||s.name)+'</h1><div class="hero muted">'+esc(s.code)+' • '+esc(s.status)+'</div></div></div>';const c=await api('/api/platform/schools/'+encodeURIComponent(id)+'/summary');quick.innerHTML='<div class="card"><h3>Onboarding</h3><p class="muted">Create staff, teachers and enroll students.</p><a class="btn primary" href="/super-admin/school-onboarding?schoolId='+encodeURIComponent(id)+'">Open Onboarding →</a></div><div class="card"><h3>Teacher Permissions</h3><p class="muted">Assign class, section, subject and session access.</p><a class="btn primary" href="/super-admin/teacher-permissions?schoolId='+encodeURIComponent(id)+'">Manage Permissions →</a></div><div class="card"><h3>Sync Center</h3><p class="muted">Review offline synchronization and conflicts.</p><a class="btn primary" href="/super-admin/sync-conflicts?schoolId='+encodeURIComponent(id)+'">Open Sync Center →</a></div>';stats.innerHTML=Object.entries(c.counts).map(([k,v])=>'<div class="card"><div class="muted">'+esc(k)+'</div><div class="stat">'+v+'</div></div>').join('');profile.innerHTML='<div class="bar"><div><h2>School Profile</h2><p class="muted">ERP and app configuration</p></div><button class="btn primary" onclick="openEdit()">Edit</button></div><div class="grid"><div><b>Address</b><p class="muted">'+esc(s.address||'—')+'</p></div><div><b>Contact</b><p class="muted">'+esc(s.phone||'—')+' '+esc(s.email||'')+'</p></div><div><b>ERP App</b><p class="muted">'+esc(s.appName||'—')+' / '+esc(s.appSlug||'—')+'</p></div><div><b>API</b><p class="muted">'+esc(s.apiBaseUrl||'—')+'</p></div></div>';staffList.innerHTML=(state.admins||[]).map(a=>'<div class="card"><b>'+esc(a.role)+'</b><p>'+esc(a.email||a.phone||'')+'</p><span class="badge">'+esc(a.status)+'</span></div>').join('')||'<div class="card">No administrators yet.</div>';branchList.innerHTML=(state.branches||[]).map(b=>'<div class="card"><b>'+esc(b.name)+'</b><p class="muted">'+esc(b.code)+'</p><span class="badge">'+esc(b.status)+'</span></div>').join('');}catch(e){hero.innerHTML='<h1>Unable to load school</h1><p>'+esc(e.message)+'</p>'}}
function show(id,b){for(const x of ['overview','staff','branches'])document.getElementById(x).style.display=x===id?'block':'none';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function openEdit(){const s=state.school;modalTitle.textContent='Edit School';form.innerHTML='<div class="fields">'+field('School Name','name',s.name)+field('School Code','code',s.code)+field('Display Name','displayName',s.displayName)+field('Logo URL','logoUrl',s.logoUrl)+'<label>School Status<select id="status"><option value="active" '+(s.status==='active'?'selected':'')+'>Active</option><option value="inactive" '+(s.status==='inactive'?'selected':'')+'>Inactive</option></select></label>'+field('Phone','phone',s.phone)+field('Email','email',s.email)+field('Website','website',s.website)+field('Timezone','timezone',s.timezone)+field('Currency','currencyCode',s.currencyCode)+field('Locale','locale',s.locale)+field('Primary Color','primaryColor',s.primaryColor)+field('Secondary Color','secondaryColor',s.secondaryColor)+'<label class="full">Address<input id="address" value="'+esc(s.address||'')+'"></label><label class="full">Upload logo<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="previewLogo(event)"><small id="logoHint" class="muted">Select a small branding image (PNG/JPEG/WebP/SVG).</small></label><div class="full"><img id="logoPreview" class="logo" src="'+esc(s.logoUrl||'')+'" onerror="this.style.display=\'none\'"></div></div><div class="bar"><span id="editStatus" class="muted"></span><button class="btn primary">Save Changes</button></div>';modal.classList.add('open');form.dataset.mode='edit'}
function openAdmin(){modalTitle.textContent='Add School Administrator';form.innerHTML='<div class="fields">'+field('Email','email','')+field('Phone','phone','')+field('Password','password','',true)+'<label>Role<select id="role"><option value="admin">Admin</option><option value="principal">Principal</option></select></label></div><div class="bar"><span></span><button class="btn primary">Create Administrator</button></div>';modal.classList.add('open');form.dataset.mode='admin'}
function openBranch(){modalTitle.textContent='Add Branch';form.innerHTML='<div class="fields">'+field('Branch Name','name','')+field('Branch Code','code','')+field('Phone','phone','')+field('Email','email','')+field('Logo URL','logoUrl','')+'<label class="full">Address<input id="address"></label></div><div class="bar"><span></span><button class="btn primary">Create Branch</button></div>';modal.classList.add('open');form.dataset.mode='branch'}
function field(label,id,v='',pass=false){return '<label>'+label+'<input id="'+id+'" '+(pass?'type="password"':'')+' value="'+esc(v||'')+'"></label>'}
function closeModal(){modal.classList.remove('open')} async function previewLogo(e){const f=e.target.files?.[0];if(!f)return;if(f.size>500000){editStatus.textContent='Logo must be under 500 KB';e.target.value='';return}const reader=new FileReader();reader.onload=()=>{logoPreview.src=reader.result;logoPreview.style.display='block';form.dataset.logoData=reader.result;editStatus.textContent='Logo ready to upload'};reader.readAsDataURL(f)}
async function save(e){e.preventDefault();const mode=form.dataset.mode;const b={};form.querySelectorAll('input,select').forEach(x=>{if(x.type!=='file')b[x.id]=x.value});try{if(mode==='edit'){await api('/api/platform/schools/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(b)});if(form.dataset.logoData){await api('/api/platform/schools/'+encodeURIComponent(id)+'/logo',{method:'POST',body:JSON.stringify({logoUrl:form.dataset.logoData})})}}if(mode==='admin')await api('/api/platform/schools/'+encodeURIComponent(id)+'/admin',{method:'POST',body:JSON.stringify(b)});if(mode==='branch')await api('/api/platform/schools/'+encodeURIComponent(id)+'/branches',{method:'POST',body:JSON.stringify(b)});closeModal();load()}catch(err){alert(err.message)}}
load();
</script></body></html>
