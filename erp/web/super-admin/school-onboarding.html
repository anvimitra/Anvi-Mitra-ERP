<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • School Onboarding</title><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{padding:28px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#111827,#3730a3,#0891b2);box-shadow:0 20px 55px #11182733}.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:18px 0}.tabs{display:flex;gap:8px;margin:18px 0}.tab,.btn{border:1px solid #e5e7eb;background:#fff;border-radius:11px;padding:10px 15px;font-weight:800;cursor:pointer}.tab.active,.primary{background:#4f46e5;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 24px #1118270d}.muted{color:#667085}.badge{padding:5px 9px;border-radius:99px;background:#ecfdf3;color:#027a48;font-size:11px;font-weight:900}.panel{display:none}.panel.active{display:block}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.dialog{background:#fff;border-radius:20px;padding:22px;width:min(760px,100%);max-height:90vh;overflow:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:800}input,select{width:100%;padding:10px;margin-top:6px;border:1px solid #d7dce7;border-radius:10px;box-sizing:border-box}.full{grid-column:1/-1}.parent-box{grid-column:1/-1;padding:13px;border:1px solid #e5e7eb;border-radius:14px;background:#f8fafc}.parent-box select{margin-bottom:8px}@media(max-width:650px){.fields{grid-template-columns:1fr}}#toast{display:none;position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 15px;border-radius:12px}</style></head><body><div class="wrap"><section class="hero"><h1>School Onboarding</h1><p>Enroll staff, teachers, students and parent links inside the selected school's tenant.</p></section><div class="bar"><span id="net">Checking network…</span><a class="btn" href="/super-admin/schools">← Schools</a></div><div class="tabs"><button class="tab active" onclick="tab('staff',this)">Staff</button><button class="tab" onclick="tab('students',this)">Students</button></div><section id="staff" class="panel active"><div class="bar"><h2>Staff & Teachers</h2><button class="btn primary" onclick="openStaff()">＋ Add Staff</button></div><div id="staffList" class="grid"></div></section><section id="students" class="panel"><div class="bar"><h2>Students</h2><button class="btn primary" onclick="openStudent()">＋ Enroll Student</button></div><div id="studentList" class="grid"></div></section></div><div id="modal" class="modal"><div class="dialog"><div class="bar"><h2 id="mt">Add</h2><button class="btn" onclick="closeModal()">✕</button></div><form id="form" onsubmit="submitForm(event)"></form></div></div><div id="toast"></div><script>let masters={};const token=()=>localStorage.getItem('accessToken')||localStorage.getItem('token')||sessionStorage.getItem('lsk_access_token')||'';async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token(),'Content-Type':'application/json'};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function network(){net.textContent=navigator.onLine?'● Online • sync enabled':'○ Offline • pending changes will wait for sync'}addEventListener('online',network);addEventListener('offline',network);network();function tab(n,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(n).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function fld(l,id,t='text'){return '<label>'+l+'<input id="'+id+'" type="'+t+'"></label>'}async function load(){try{const[a,b,m]=await Promise.all([api('/api/staff'),api('/api/enrollment/students?limit=300'),api('/api/enrollment/masters')]);masters=m;staffList.innerHTML=(a.staff||[]).map(x=>'<article class="card"><b>'+esc(x.role)+'</b><p>'+esc(x.email||x.phone||'')+'</p><span class="badge">'+esc(x.status)+'</span></article>').join('')||'<div class="card">No staff yet.</div>';studentList.innerHTML=(b.students||[]).map(x=>'<article class="card"><b>'+esc(x.fullName)+'</b><p class="muted">Admission: '+esc(x.admissionNo)+'</p><small>'+esc(x.className||'Not enrolled')+' • '+esc(x.sectionName||'')+'</small><p class="muted">'+(x.parents||[]).map(p=>esc(p.name)+' ('+esc(p.relation)+')').join(' • ')+'</p></article>').join('')||'<div class="card">No students yet.</div>'}catch(e){toastMsg(e.message)}}function openStaff(){mt.textContent='Add Staff / Teacher';form.dataset.mode='staff';form.innerHTML='<div class="fields">'+fld('Email','email')+fld('Phone','phone')+fld('Password','password','password')+'<label>Role<select id="role"><option value="teacher">Teacher</option><option value="office_staff">Office Staff</option><option value="accountant">Accountant</option><option value="driver">Driver</option><option value="admin">Admin</option><option value="principal">Principal</option></select></label><label>Branch<select id="branchId"><option value="">School-wide</option>'+(masters.branches||[]).map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('')+'</select></label></div><div class="bar"><span class="muted">Subject/class permissions are enforced separately.</span><button class="btn primary">Create</button></div>';modal.classList.add('open')}function openStudent(){mt.textContent='Enroll Student';form.dataset.mode='student';form.innerHTML='<div class="fields">'+fld('Full Name','fullName')+fld('Admission No','admissionNo')+fld('Date of Birth','dateOfBirth')+fld('Gender','gender')+fld('Roll No','rollNo')+'<label>Academic Session<select id="sessionId" required><option value="">Select</option>'+(masters.sessions||[]).map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></label><label>Section<select id="sectionId" required><option value="">Select</option>'+(masters.sections||[]).map(s=>'<option value="'+s.id+'">'+esc(s.className)+' — '+esc(s.name)+'</option>').join('')+'</select></label><div class="parent-box"><b>Parent / Guardian</b><p class="muted">Link an existing parent, or create a new parent account first.</p><select id="parentUserId"><option value="">No parent link</option>'+(masters.parents||[]).map(p=>'<option value="'+p.userId+'">'+esc(p.fullName)+' • '+esc(p.phone||p.email||'')+'</option>').join('')+'</select><input id="parentRelation" placeholder="Relation e.g. father / mother / guardian"><label style="display:flex;align-items:center;gap:8px;font-weight:700"><input id="parentPrimary" type="checkbox" style="width:auto;margin:0" checked> Primary parent</label></div></div><div class="bar"><span class="muted">Student will be enrolled in the selected session/section.</span><button class="btn primary">Enroll</button></div>';modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function toastMsg(s){toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',2500)}async function submitForm(e){e.preventDefault();const b={};form.querySelectorAll('input,select').forEach(x=>{if(x.id==='parentPrimary')return;b[x.id]=x.value});if(form.dataset.mode==='student'){const parentUserId=document.getElementById('parentUserId')?.value;if(parentUserId)b.parents=[{userId:parentUserId,relation:document.getElementById('parentRelation')?.value||'guardian',isPrimary:document.getElementById('parentPrimary')?.checked!==false}]}try{await api(form.dataset.mode==='staff'?'/api/staff':'/api/enrollment/students',{method:'POST',body:JSON.stringify(b)});closeModal();toastMsg('Saved successfully');load()}catch(err){toastMsg(err.message)}}load();</script></body></html>
