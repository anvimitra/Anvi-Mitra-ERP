<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Teacher Enrollment</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:22px;margin-bottom:18px}h1{margin:0 0 5px}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}input,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d6dce6;border-radius:9px;font:inherit}button{background:#4f46e5;color:#fff;border:0;font-weight:750;cursor:pointer}.full{grid-column:1/-1}.ok{color:#087443;margin-top:12px}.err{color:#b42318;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="card"><h1>Teacher Enrollment</h1><div class="muted">Create the teacher login account and teacher profile together for the current school/branch.</div><form id="form" class="grid"><div><label>Full Name *</label><input id="name" required></div><div><label>Employee Code *</label><input id="code" required></div><div><label>Email</label><input id="email" type="email"></div><div><label>Phone</label><input id="phone"></div><div><label>Joining Date</label><input id="joining" type="date"></div><div><label>Initial Password *</label><input id="password" type="password" minlength="6" required></div><div class="full"><button>Create Teacher</button></div></form><div id="msg"></div></div><div class="card"><h2>Teachers</h2><table><thead><tr><th>Name</th><th>Employee Code</th><th>Login</th><th>Branch</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="/erp/web/api.js"></script><script>(async()=>{const role=(LSKERP.user().role||'').toLowerCase();if(!['super_admin','principal','admin','office_staff'].includes(role)){document.body.innerHTML='<main class="wrap"><div class="card"><h2>Access denied</h2><p class="muted">Administrator access is required.</p></div></main>';return}const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));async function load(){try{const r=await LSKERP.request('/api/teachers');$('rows').innerHTML=(r.teachers||[]).map(t=>`<tr><td>${esc(t.fullName)}</td><td>${esc(t.employeeCode||'')}</td><td>${esc(t.userId||'')}</td><td>${esc(t.branchName||'School')}</td><td>${esc(t.status)}</td></tr>`).join('')||'<tr><td colspan="5">No teachers found.</td></tr>'}catch(e){$('rows').innerHTML='<tr><td colspan="5" class="err">'+esc(e.message)+'</td></tr>'}}$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Creating…';try{const r=await LSKERP.request('/api/teachers',{method:'POST',body:JSON.stringify({fullName:$('name').value,employeeCode:$('code').value,email:$('email').value||null,phone:$('phone').value||null,joiningDate:$('joining').value||null,password:$('password').value})});$('msg').className='ok';$('msg').textContent='Teacher created successfully: '+r.teacher.fullName;e.target.reset();await load()}catch(e){$('msg').className='err';$('msg').textContent=e.message}};load()})();</script></body></html>
