<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Dashboard</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--line:#e5eaf2;--brand:#5b5bd6;--muted:#667085}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:linear-gradient(160deg,#10162d,#24275a);color:#fff;padding:22px}.brand{font-size:20px;font-weight:850}.sub{font-size:11px;color:#b8c2e5;margin:5px 0 28px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#d9e2ff;text-align:left;padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer}.nav button:hover,.nav button.active{background:#ffffff14;color:#fff}.logout{margin-top:18px;width:100%;padding:10px;border:1px solid #415078;background:transparent;color:white;border-radius:9px;cursor:pointer}.main{padding:25px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:27px}.role{font-size:13px;background:white;border:1px solid var(--line);padding:8px 12px;border-radius:999px}.hero{background:linear-gradient(120deg,#24285f,#6046c8);color:white;border-radius:20px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hero h2{margin:0 0 6px;font-size:21px}.hero p{margin:0;color:#e6e8ff;font-size:13px}.switch{min-width:230px}.switch label{display:block;font-size:11px;color:#dfe2ff;margin-bottom:5px}.switch select{width:100%;padding:10px;border:1px solid #ffffff38;border-radius:10px;background:#ffffff16;color:white}.switch select option{color:#172033;background:white}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:17px}.card,.section{background:white;border:1px solid #e4e8f0;border-radius:16px;padding:18px}.label{font-size:12px;color:#667085}.value{font-size:27px;font-weight:850;margin-top:5px}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item{padding:15px;border:1px solid #e7eaf0;border-radius:12px}.item b{display:block;margin-bottom:5px}.muted{color:#667085;font-size:13px}.error{color:#b42318;font-size:13px;margin-top:12px}.status{font-size:12px;color:#087443;margin-top:5px}.school-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.school-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.school-full{grid-column:1/-1}.school-form label{display:block;font-size:12px;font-weight:700;color:#344054;margin-bottom:5px}.school-form input,.school-form select,.school-form button{width:100%;padding:10px;border:1px solid #d6dce6;border-radius:9px;font:inherit}.school-form button{background:#4f46e5;color:#fff;border:0;font-weight:750;cursor:pointer}.school-table{width:100%;border-collapse:collapse;font-size:13px}.school-table th,.school-table td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}.school-table th{font-size:11px;text-transform:uppercase;color:#667085;background:#fafbfc}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef0ff;color:#3730a3;font-size:11px}.success{color:#087443;font-size:13px;margin-top:10px}.school-error{color:#b42318;font-size:13px;margin-top:10px}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{padding:12px;position:sticky;top:0;z-index:2}.nav{display:flex;overflow:auto}.cards{grid-template-columns:repeat(2,1fr)}.grid,.school-grid{grid-template-columns:1fr}.main{padding:16px}}@media(max-width:620px){.cards{grid-template-columns:1fr}.top,.hero{align-items:flex-start;flex-direction:column}.switch{width:100%}.school-form{grid-template-columns:1fr}.school-full{grid-column:auto}}</style></head><body><div class="app"><aside class="side"><div class="brand">Anvi Mitra ERP</div><div class="sub">Multi-School • Multi-Branch</div><nav class="nav" id="nav"></nav><button class="logout" id="logout">Logout</button></aside><main class="main"><div class="top"><h1 id="title">Dashboard</h1><div class="role" id="role">Role: —</div></div><section class="hero"><div><h2 id="schoolName">Welcome to Anvi Mitra ERP</h2><p id="branchName">Choose your working branch for a focused dashboard.</p></div><div class="switch"><label>WORKING BRANCH</label><select id="branchSelect"><option value="">All / School level</option></select></div></section><div id="dashboardView"><div class="cards" id="cards"></div><div class="section"><h2>Quick access</h2><div class="grid" id="content"></div><div class="error" id="error"></div></div></div><div id="schoolView" hidden></div></main></div><script src="/erp/web/api.js"></script><script>(async()=>{const token=LSKERP.token();if(!token){location.replace('/erp/web/login.html');return}let user=LSKERP.user();const role=(user.role||'').toLowerCase();const roles={admin:['Dashboard','Academic Setup','Students','Admissions','Attendance','Exams & Results','Fees','Timetable','Homework','Teachers','Reports','Report Cards','Report Card Designer'],principal:['Dashboard','Academic Setup','Students','Admissions','Attendance','Exams & Results','Fees','Timetable','Homework','Teachers','Reports','Report Cards','Report Card Designer'],super_admin:['Dashboard','School Management','Academic Setup','Students','Admissions','Attendance','Exams & Results','Fees','Timetable','Homework','Teachers','Reports','Report Cards','Report Card Designer'],accountant:['Dashboard','Students','Fees','Reports'],office_staff:['Dashboard','Students','Admissions','Fees','Reports'],teacher:['Dashboard','Students','Attendance','Exams & Results','Timetable','Homework'],parent:['Dashboard','My Children','Attendance','Homework','Exams & Results','Fees']};const data={admin:[['Academic Setup','Classes, sections, subjects and academic sessions'],['Students','Admissions, profiles and enrollments'],['Reports','Academic and operational reports'],['Report Cards','Generate, review, publish and print student report cards'],['Report Card Designer','Create school / branch-specific report card templates'],['Fees','Fee structure, invoices, collection and dues']],principal:[['Academic Setup','Classes, sections, subjects and academic sessions'],['Students','Admissions, profiles and enrollments'],['Reports','Academic and operational reports'],['Report Cards','Generate, review, publish and print student report cards'],['Fees','Fee structure, invoices, collection and dues']],super_admin:[['School Management','Add schools, logo, app configuration and branch details'],['Academic Setup','Classes, sections, subjects and academic sessions'],['Students','Admissions, profiles and enrollments'],['Reports','Academic and operational reports'],['Report Cards','Generate, review, publish and print student report cards'],['Fees','Fee structure, invoices, collection and dues']],accountant:[['Fees','Fee structure, invoices, collection and dues'],['Reports','Collection and outstanding reports']],office_staff:[['Students','Admissions, profiles and enrollments'],['Fees','Fee structure, invoices, collection and dues']],teacher:[['Today','Attendance and timetable at a glance'],['Homework','Create and review class homework'],['Results','FA1 / FA2 / FA3 / Half Yearly / Yearly marks']],parent:[['My Children','See linked student profiles'],['Homework','See assigned and pending homework'],['Results','View published exam results']]};if(!roles[role]){sessionStorage.clear();location.replace('/erp/web/login.html');return}document.getElementById('role').textContent='Role: '+role;const nav=document.getElementById('nav');const showDashboard=()=>{document.getElementById('dashboardView').hidden=false;document.getElementById('schoolView').hidden=true;document.getElementById('title').textContent='Dashboard'};roles[role].forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.className=i?'':'active';b.onclick=()=>{document.querySelectorAll('.nav button').forEach(n=>n.classList.remove('active'));b.classList.add('active');document.getElementById('title').textContent=x;if(x==='Dashboard'){showDashboard();return}if(x==='School Management'){if(role==='super_admin')showSchoolManagement();return}if(x==='Academic Setup')location.href='/erp/web/academic-master.html';if(x==='Exams & Results')location.href='/erp/web/exam-management.html';if(x==='Report Cards')location.href='/erp/web/report-card-management.html';if(x==='Report Card Designer')location.href='/erp/web/report-card-designer.html';if(x==='Fees')location.href='/erp/web/fee-management.html'};nav.appendChild(b)});document.getElementById('content').innerHTML=data[role].map(x=>`<div class="item"><b>${x[0]}</b><span class="muted">${x[1]}</span></div>`).join('');document.getElementById('logout').onclick=()=>{sessionStorage.clear();location.replace('/erp/web/login.html')};async function load(){try{const org=await LSKERP.request('/api/organization');document.getElementById('schoolName').textContent=org.school.displayName||org.school.name;const select=document.getElementById('branchSelect');select.innerHTML='<option value="">All / School level</option>'+(org.branches||[]).map(b=>`<option value="${b.id}">${b.name} (${b.code})</option>`).join('');if(user.branchId)select.value=user.branchId;document.getElementById('branchName').textContent=select.value?(org.branches.find(b=>b.id===select.value)?.name||'Selected branch')+' • Branch-scoped view':'School-level view • Select a branch to focus your workspace';select.onchange=async()=>{try{select.disabled=true;await LSKERP.setBranch(select.value);user=LSKERP.user();await load()}catch(e){document.getElementById('error').textContent=e.message||'Could not switch branch'}finally{select.disabled=false}};const d=role==='parent'?await LSKERP.request('/api/portal/me/students'):await LSKERP.request('/api/students');const list=d.students||[];document.getElementById('cards').innerHTML=`<div class="card"><div class="label">Students visible</div><div class="value">${list.length}</div><div class="muted">Based on your school/branch access</div></div><div class="card"><div class="label">Branches</div><div class="value">${(org.branches||[]).length}</div><div class="muted">Configured branches</div></div><div class="card"><div class="label">ERP status</div><div class="value">✓</div><div class="status">Authenticated & connected</div></div><div class="card"><div class="label">Role</div><div class="value" style="text-transform:capitalize">${role}</div><div class="muted">Permission-aware workspace</div></div>`}catch(e){document.getElementById('error').textContent=e.message||'Could not load dashboard data'}}async function showSchoolManagement(){if(role!=='super_admin')return;document.getElementById('dashboardView').hidden=true;document.getElementById('schoolView').hidden=false;const view=document.getElementById('schoolView');view.innerHTML=`<div class="school-grid"><section class="section"><h2>Add School</h2><p class="muted">Create the school, main branch, settings and mobile app configuration together.</p><form id="schoolForm" class="school-form"><div><label>School Name *</label><input id="sName" required></div><div><label>School Code *</label><input id="sCode" required></div><div><label>Display Name</label><input id="sDisplay"></div><div><label>App Name</label><input id="sAppName"></div><div><label>App Slug *</label><input id="sSlug" required placeholder="school-name"></div><div><label>Logo URL</label><input id="sLogo" type="url"></div><div><label>Android Package</label><input id="sAndroid"></div><div><label>iOS Bundle ID</label><input id="sIos"></div><div><label>Primary Color</label><input id="sPrimary" value="4F46E5"></div><div><label>Secondary Color</label><input id="sSecondary" value="0F1720"></div><div><label>Support Phone</label><input id="sPhone"></div><div><label>Support Email</label><input id="sEmail" type="email"></div><div><label>Main Branch Name</label><input id="sBranchName" value="Main Branch"></div><div><label>Main Branch Code</label><input id="sBranchCode" value="MAIN"></div><div class="school-full"><label>Address</label><input id="sAddress"></div><div><label>API Base URL</label><input id="sApi"></div><div><label>Minimum App Version</label><input id="sMin" value="1.0.0"></div><div><label>Force Update</label><select id="sForce"><option value="false">No</option><option value="true">Yes</option></select></div><div class="school-full"><button>Add School</button></div></form><div id="schoolMsg"></div></section><section class="section"><h2>All Schools</h2><p class="muted">Central school registry. Creation is restricted by the API to super_admin.</p><div style="overflow:auto"><table class="school-table"><thead><tr><th>School</th><th>Code</th><th>Main Branch</th><th>App</th><th>Status</th></tr></thead><tbody id="schoolRows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></div>`;const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));const msg=(t,b=false)=>{document.getElementById('schoolMsg').className=b?'school-error':'success';document.getElementById('schoolMsg').textContent=t};async function list(){try{const r=await LSKERP.request('/api/platform/schools');document.getElementById('schoolRows').innerHTML=(r.schools||[]).map(s=>`<tr><td><b>${esc(s.display_name||s.name)}</b><br><span class="muted">${esc(s.email||s.phone||'')}</span></td><td><span class="pill">${esc(s.code)}</span></td><td>${esc(s.branch_name||'—')}<br><span class="muted">${esc(s.branch_code||'')}</span></td><td>${esc(s.app_name||'—')}<br><span class="muted">${esc(s.app_slug||'')}</span></td><td>${esc(s.status||'—')}</td></tr>`).join('')||'<tr><td colspan="5">No schools found.</td></tr>'}catch(e){document.getElementById('schoolRows').innerHTML=`<tr><td colspan="5" class="school-error">${esc(e.message)}</td></tr>`}}document.getElementById('schoolForm').onsubmit=async e=>{e.preventDefault();msg('Creating school…');const b={name:sName.value,code:sCode.value,displayName:sDisplay.value||sName.value,appName:sAppName.value||`${sName.value} App`,appSlug:sSlug.value,logoUrl:sLogo.value,androidPackage:sAndroid.value,iosBundleId:sIos.value,primaryColor:sPrimary.value,secondaryColor:sSecondary.value,supportPhone:sPhone.value,supportEmail:sEmail.value,branchName:sBranchName.value,branchCode:sBranchCode.value,address:sAddress.value,apiBaseUrl:sApi.value,minAppVersion:sMin.value,forceUpdate:sForce.value==='true'};try{const r=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(b)});msg(`School created: ${r.school?.name||b.name}`);e.target.reset();sPrimary.value='4F46E5';sSecondary.value='0F1720';sBranchName.value='Main Branch';sBranchCode.value='MAIN';sMin.value='1.0.0';await list()}catch(err){msg(err.message||'Could not create school',true)}};await list()}load()})();</script></body></html>
