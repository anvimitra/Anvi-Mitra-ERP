<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Dashboard</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--brand:#5b5bd6;--line:#e5eaf2}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:linear-gradient(160deg,#10162d,#24275a);color:#fff;padding:22px}.brand{font-size:20px;font-weight:850}.sub{font-size:11px;color:#b8c2e5;margin:5px 0 28px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#d9e2ff;text-align:left;padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer}.nav button:hover,.nav button.active{background:#ffffff14;color:#fff}.logout{margin-top:18px;width:100%;padding:10px;border:1px solid #415078;background:transparent;color:white;border-radius:9px;cursor:pointer}.main{padding:25px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:27px}.role{font-size:13px;background:white;border:1px solid var(--line);padding:8px 12px;border-radius:999px}.hero{background:linear-gradient(120deg,#24285f,#6046c8);color:white;border-radius:20px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hero h2{margin:0 0 6px;font-size:21px}.hero p{margin:0;color:#e6e8ff;font-size:13px}.switch{min-width:230px}.switch label{display:block;font-size:11px;color:#dfe2ff;margin-bottom:5px}.switch select{width:100%;padding:10px;border:1px solid #ffffff38;border-radius:10px;background:#ffffff16;color:white}.switch select option{color:#172033;background:white}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:17px}.card,.section{background:white;border:1px solid #e4e8f0;border-radius:16px;padding:18px}.label{font-size:12px;color:#667085}.value{font-size:27px;font-weight:850;margin-top:5px}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item{padding:15px;border:1px solid #e7eaf0;border-radius:12px}.item b{display:block;margin-bottom:5px}.muted{color:#667085;font-size:13px}.error{color:#b42318;font-size:13px;margin-top:12px}.status{font-size:12px;color:#087443;margin-top:5px}.admin-link{display:none;margin-top:12px}.admin-link button{width:100%;padding:11px;border:1px solid #cfd5e1;background:#fff;color:#172033;border-radius:10px;font-weight:700;cursor:pointer}.sync-btn{margin-top:10px;border:1px solid #cfd5e1;background:#fff;padding:8px 10px;border-radius:9px;font-weight:700;cursor:pointer}.sync-btn:disabled{opacity:.6}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{padding:12px;position:sticky;top:0;z-index:2}.nav{display:flex;overflow:auto}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.main{padding:16px}}@media(max-width:620px){.cards{grid-template-columns:1fr}.top,.hero{align-items:flex-start;flex-direction:column}.switch{width:100%}}</style><script>function openModule(label){const routes={'Students':'/erp/web/student-enrollment.html','Teachers':'/erp/web/staff-management.html','Teacher Assignments':'/erp/web/teacher-assignments.html','Report Cards':'/erp/web/report-card-management.html','Report Card Designer':'/erp/web/report-card-designer.html','Fees':'/erp/web/fee-management.html','Academic Setup':'/erp/web/academic-master.html','Exams & Results':'/erp/web/exam-management.html','Local Storage':'/erp/web/local-storage.html','Teacher Permissions':'/erp/web/teacher-permissions.html','School Onboarding':'/erp/web/school-admin/onboarding.html'};if(routes[label])location.href=routes[label]}</script></head><body><div class="app"><aside class="side"><div class="brand">Anvi Mitra ERP</div><div class="sub">Multi-School • Multi-Branch</div><nav class="nav" id="nav"></nav><div class="admin-link" id="adminLink"><button id="schoolsBtn">🏫 School Management</button></div><button class="logout" id="logout">Logout</button></aside><main class="main"><div class="top"><h1 id="title">Dashboard</h1><div class="role" id="role">Role: —</div></div><section class="hero"><div><h2 id="schoolName">Welcome to Anvi Mitra ERP</h2><p id="branchName">Choose your working branch for a focused dashboard.</p></div><div class="switch"><label>WORKING BRANCH</label><select id="branchSelect"><option value="">All / School level</option></select></div></section><div class="cards" id="cards"></div><div class="section"><h2>Quick access</h2><div class="grid" id="content"></div><div class="error" id="error"></div></div></main></div><script src="/erp/web/api.js"></script><script src="/erp/web/offline-sync.js"></script><script>(async()=>{const token=LSKERP.token();if(!token){location.replace('/erp/web/login.html');return}let user=LSKERP.user();const role=(user.role||'').toLowerCase();const roles={admin:['Dashboard','Academic Setup','Students','Admissions','Attendance','Exams & Results','Fees','Timetable','Homework','Teachers','Teacher Assignments','School Onboarding','Reports','Report Cards','Report Card Designer'],principal:['Dashboard','Academic Setup','Students','Admissions','Attendance','Exams & Results','Fees','Timetable','Homework','Teachers','Teacher Assignments','Reports','Report Cards','Report Card Designer'],super_admin:['Dashboard','Academic Setup','Students','Admissions','Attendance','Exams & Results','Fees','Timetable','Homework','Teachers','Teacher Assignments','Reports','Report Cards','Report Card Designer'],accountant:['Dashboard','Students','Fees','Reports'],office_staff:['Dashboard','Students','Admissions','Fees','Reports'],teacher:['Dashboard','Students','Attendance','Exams & Results','Timetable','Homework'],parent:['Dashboard','My Children','Attendance','Homework','Exams & Results','Fees']};const data={admin:[['Academic Setup','Classes, sections, subjects and academic sessions'],['Students','Admissions, profiles and enrollments'],['Teacher Assignments','Control exactly which class/subject each teacher can edit'],['Reports','Academic and operational reports'],['Report Cards','Generate, review, publish and print student report cards'],['Report Card Designer','Create school / branch-specific report card templates'],['Fees','Fee structure, invoices, collection and dues']],principal:[['Academic Setup','Classes, sections, subjects and academic sessions'],['Students','Admissions, profiles and enrollments'],['Teacher Assignments','Control teacher class and subject permissions'],['Reports','Academic and operational reports'],['Report Cards','Generate, review, publish and print student report cards'],['Fees','Fee structure, invoices, collection and dues']],super_admin:[['Academic Setup','Classes, sections, subjects and academic sessions'],['Students','Admissions, profiles and enrollments'],['Teacher Assignments','Control teacher class and subject permissions'],['Reports','Academic and operational reports'],['Report Cards','Generate, review, publish and print student report cards'],['Fees','Fee structure, invoices, collection and dues']],accountant:[['Fees','Fee structure, invoices, collection and dues'],['Reports','Collection and outstanding reports']],office_staff:[['Students','Admissions, profiles and enrollments'],['Fees','Fee structure, invoices, collection and dues']],teacher:[['Today','Attendance and timetable at a glance'],['Homework','Create and review class homework'],['Results','FA1 / FA2 / FA3 / Half Yearly / Yearly marks']],parent:[['My Children','See linked student profiles'],['Homework','See assigned and pending homework'],['Results','View published exam results']]};if(!roles[role]){sessionStorage.clear();location.replace('/erp/web/login.html');return}document.getElementById('role').textContent='Role: '+role;if(role==='super_admin'){document.getElementById('adminLink').style.display='block';document.getElementById('schoolsBtn').onclick=()=>location.href='/erp/web/super-admin-schools.html'}const nav=document.getElementById('nav');roles[role].forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.className=i?'':'active';b.onclick=()=>{openModule(x);document.querySelectorAll('.nav button').forEach(n=>n.classList.remove('active'));b.classList.add('active');document.getElementById('title').textContent=x};nav.appendChild(b)});document.getElementById('content').innerHTML=data[role].map(x=>'<button class="item" onclick="openModule(\''+x[0]+'\')" style="text-align:left;background:#fff;cursor:pointer;font:inherit"><b>'+x[0]+'</b><span class="muted">'+x[1]+'</span></button>').join('');document.getElementById('logout').onclick=()=>{sessionStorage.clear();location.replace('/erp/web/login.html')};async function load(){try{const org=await LSKERP.request('/api/organization');document.getElementById('schoolName').textContent=org.school.displayName||org.school.name;const select=document.getElementById('branchSelect');select.innerHTML='<option value="">All / School level</option>'+(org.branches||[]).map(b=>'<option value="'+b.id+'">'+b.name+' ('+b.code+')</option>').join('');if(user.branchId)select.value=user.branchId;document.getElementById('branchName').textContent=select.value?((org.branches||[]).find(b=>b.id===select.value)?.name||'Selected branch')+' • Branch-scoped view':'School-level view • Select a branch to focus your workspace';select.onchange=async()=>{try{select.disabled=true;await LSKERP.setBranch(select.value);user=LSKERP.user();await load()}catch(e){document.getElementById('error').textContent=e.message||'Could not switch branch'}finally{select.disabled=false}};const d=role==='parent'?await LSKERP.request('/api/portal/me/students'):await LSKERP.request('/api/students');const list=d.students||[];const syncStatus=await AnviMitraOfflineSync.status();document.getElementById('cards').innerHTML='<div class="card"><div class="label">Students visible</div><div class="value">'+list.length+'</div><div class="muted">Based on your school/branch access</div></div><div class="card"><div class="label">Branches</div><div class="value">'+(org.branches||[]).length+'</div><div class="muted">Configured branches</div></div><div class="card"><div class="label">ERP status</div><div class="value">✓</div><div class="status">Authenticated & connected</div></div><div class="card"><div class="label">Offline sync</div><div class="value" style="font-size:20px">'+(syncStatus.online?'Online':'Offline')+'</div><div class="muted">Outbox: '+syncStatus.outboxCount+' • Cursor: '+syncStatus.cursor+'</div><button class="sync-btn" id="syncNow">Sync now</button></div>';document.getElementById('syncNow').onclick=async()=>{const b=document.getElementById('syncNow');b.disabled=true;b.textContent='Syncing…';try{await AnviMitraOfflineSync.sync();await load()}catch(e){document.getElementById('error').textContent=e.message||'Sync failed'}finally{b.disabled=false;b.textContent='Sync now'}}}catch(e){document.getElementById('error').textContent=e.message||'Could not load dashboard data'}}load()})();</script></body></html>
