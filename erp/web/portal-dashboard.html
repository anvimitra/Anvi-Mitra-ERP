<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Dashboard</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--line:#e5eaf2}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:linear-gradient(160deg,#10162d,#24275a);color:#fff;padding:22px}.brand{font-size:20px;font-weight:850}.sub{font-size:11px;color:#b8c2e5;margin:5px 0 28px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#d9e2ff;text-align:left;padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer}.nav button:hover,.nav button.active{background:#ffffff14;color:#fff}.logout{margin-top:18px;width:100%;padding:10px;border:1px solid #415078;background:transparent;color:white;border-radius:9px;cursor:pointer}.main{padding:25px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:27px}.role{font-size:13px;background:white;border:1px solid var(--line);padding:8px 12px;border-radius:999px}.sync{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:8px;justify-content:flex-end}.dot{width:8px;height:8px;border-radius:50%;background:#087443}.dot.off{background:#b42318}.hero{background:linear-gradient(120deg,#24285f,#6046c8);color:white;border-radius:20px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hero h2{margin:0 0 6px;font-size:21px}.hero p{margin:0;color:#e6e8ff;font-size:13px}.switch{min-width:230px}.switch label{display:block;font-size:11px;color:#dfe2ff;margin-bottom:5px}.switch select{width:100%;padding:10px;border:1px solid #ffffff38;border-radius:10px;background:#ffffff16;color:white}.switch select option{color:#172033;background:white}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:17px}.card,.section{background:white;border:1px solid #e4e8f0;border-radius:16px;padding:18px}.label{font-size:12px;color:#667085}.value{font-size:27px;font-weight:850;margin-top:5px}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item{padding:15px;border:1px solid #e7eaf0;border-radius:12px}.item b{display:block;margin-bottom:5px}.muted{color:#667085;font-size:13px}.error{color:#b42318;font-size:13px;margin-top:12px}.status{font-size:12px;color:#087443;margin-top:5px}.primary{background:#172b55!important;color:#fff!important;border:0!important;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:700}.modal{position:fixed;inset:0;background:#10162d88;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;width:min(1000px,96vw);max-height:92vh;overflow:auto;border-radius:18px;padding:22px}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.modalhead h2{margin:0}.close{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.schoolform{display:grid;gap:10px;margin-top:15px}.schoolrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.schoolform label{font-size:12px;font-weight:700}.schoolform input{width:100%;padding:10px;border:1px solid #d9dee8;border-radius:9px;font:inherit}.schoollist{display:grid;gap:9px;margin-top:15px}.schoolrowcard{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.schoolrowcard b{display:block}.mini{font-size:12px;color:#667085}.editbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.modalmsg{font-size:13px;min-height:20px}.ok{color:#087443}.err{color:#b42318}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{padding:12px;position:sticky;top:0;z-index:2}.nav{display:flex;overflow:auto}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.main{padding:16px}}@media(max-width:620px){.cards{grid-template-columns:1fr}.top,.hero{align-items:flex-start;flex-direction:column}.sync{justify-content:flex-start}.switch{width:100%}.schoolrow{grid-template-columns:1fr}.schoolrowcard{flex-direction:column}}</style></head><body><div class="app"><aside class="side"><div class="brand">Anvi Mitra ERP</div><div class="sub">Multi-School • Multi-Branch</div><nav class="nav" id="nav"></nav><button class="logout" id="logout">Logout</button></aside><main class="main"><div class="top"><h1 id="title">Dashboard</h1><div><span class="role" id="role">Role: —</span><div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Online</span></div></div></div><section class="hero"><div><h2 id="schoolName">Welcome to Anvi Mitra ERP</h2><p id="branchName">Choose your working branch for a focused dashboard.</p></div><div class="switch"><label>WORKING BRANCH</label><select id="branchSelect"><option value="">All / School level</option></select></div></section><div class="cards" id="cards"></div><div class="section"><div class="top"><h2>Quick access</h2><button class="primary" id="schoolBtn" style="display:none">Manage Schools</button></div><div class="grid" id="content"></div><div class="error" id="error"></div></div></main></div><div class="modal" id="schoolModal"><div class="modalbox"><div class="modalhead"><div><h2>School Management</h2><div class="muted">Super Admin • onboard schools and configure ERP/mobile app basics</div></div><button class="close" onclick="closeSchools()">Close</button></div><div id="schoolList" class="schoollist">Loading…</div><hr><h3 id="schoolFormTitle">Add New School</h3><form id="schoolForm" class="schoolform"><div class="schoolrow"><div><label>School name *</label><input id="s_name" required></div><div><label>School code *</label><input id="s_code" required></div></div><div class="schoolrow"><div><label>Display name</label><input id="s_displayName"></div><div><label>Logo URL</label><input id="s_logoUrl" type="url"></div></div><div><label>Address</label><input id="s_address"></div><div class="schoolrow"><div><label>School phone</label><input id="s_phone"></div><div><label>Support email</label><input id="s_supportEmail" type="email"></div></div><div class="schoolrow"><div><label>App name</label><input id="s_appName"></div><div><label>App slug *</label><input id="s_appSlug" required></div></div><div class="schoolrow"><div><label>Android package</label><input id="s_androidPackage"></div><div><label>iOS bundle ID</label><input id="s_iosBundleId"></div></div><div class="schoolrow"><div><label>Primary color</label><input id="s_primaryColor" value="4F46E5"></div><div><label>Secondary color</label><input id="s_secondaryColor" value="0F1720"></div></div><div class="schoolrow"><div><label>Min app version</label><input id="s_minAppVersion" value="1.0.0"></div><div><label>Support phone</label><input id="s_supportPhone"></div></div><h3>Initial School Admin</h3><div class="schoolrow"><div><label>Admin name *</label><input id="s_initialAdminName" required></div><div><label>Admin email</label><input id="s_initialAdminEmail" type="email"></div></div><div class="schoolrow"><div><label>Admin phone</label><input id="s_initialAdminPhone"></div><div><label>Admin password *</label><input id="s_initialAdminPassword" type="password" minlength="6" required></div></div><div id="schoolMsg" class="modalmsg"></div><div><button class="primary" id="schoolSubmit">Create School</button> <button type="button" class="close" onclick="resetSchoolForm()">Clear</button></div></form></div></div><script src="/erp/web/api.js"></script><script>(async()=>{const token=LSKERP.token();if(!token){location.replace('/erp/web/login.html');return}let user=LSKERP.user();const role=(user.role||'').toLowerCase();const roles={admin:['Dashboard','Academic Setup','Students','Admissions','Attendance','Exams & Results','Fees','Timetable','Homework','Teachers','Reports','Report Cards','Report Card Designer'],principal:['Dashboard','Academic Setup','Students','Admissions','Attendance','Exams & Results','Fees','Timetable','Homework','Teachers','Reports','Report Cards','Report Card Designer'],super_admin:['Dashboard','Schools','Academic Setup','Students','Admissions','Attendance','Exams & Results','Fees','Timetable','Homework','Teachers','Reports','Report Cards','Report Card Designer'],accountant:['Dashboard','Students','Fees','Reports'],office_staff:['Dashboard','Students','Admissions','Fees','Reports'],teacher:['Dashboard','Students','Attendance','Exams & Results','Timetable','Homework'],parent:['Dashboard','My Children','Attendance','Homework','Exams & Results','Fees']};const data={admin:[['Academic Setup','Classes, sections, subjects and academic sessions'],['Students','Admissions, profiles and enrollments'],['Reports','Academic and operational reports'],['Report Cards','Generate, review, publish and print student report cards'],['Report Card Designer','Create school / branch-specific report card templates'],['Fees','Fee structure, invoices, collection and dues']],principal:[['Academic Setup','Classes, sections, subjects and academic sessions'],['Students','Admissions, profiles and enrollments'],['Reports','Academic and operational reports'],['Report Cards','Generate, review, publish and print student report cards'],['Fees','Fee structure, invoices, collection and dues']],super_admin:[['Schools','Create schools, configure app branding, onboarding admin and branches'],['Academic Setup','Classes, sections, subjects and academic sessions'],['Students','Admissions, profiles and enrollments'],['Reports','Academic and operational reports'],['Report Cards','Generate, review, publish and print student report cards'],['Fees','Fee structure, invoices, collection and dues']],accountant:[['Fees','Fee structure, invoices, collection and dues'],['Reports','Collection and outstanding reports']],office_staff:[['Students','Admissions, profiles and enrollments'],['Fees','Fee structure, invoices, collection and dues']],teacher:[['Today','Attendance and timetable at a glance'],['Homework','Create and review class homework'],['Results','FA1 / FA2 / FA3 / Half Yearly / Yearly marks']],parent:[['My Children','See linked student profiles'],['Homework','See assigned and pending homework'],['Results','View published exam results']]};if(!roles[role]){sessionStorage.clear();location.replace('/erp/web/login.html');return}document.getElementById('role').textContent='Role: '+role;const nav=document.getElementById('nav');roles[role].forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.className=i?'':'active';b.onclick=()=>{document.querySelectorAll('.nav button').forEach(n=>n.classList.remove('active'));b.classList.add('active');document.getElementById('title').textContent=x;if(x==='Schools')openSchools();if(x==='Academic Setup')location.href='/erp/web/academic-master.html';if(x==='Exams & Results')location.href='/erp/web/exam-management.html';if(x==='Report Cards')location.href='/erp/web/report-card-management.html';if(x==='Report Card Designer')location.href='/erp/web/report-card-designer.html';if(x==='Fees')location.href='/erp/web/fee-management.html'};nav.appendChild(b)});if(role==='super_admin'){document.getElementById('schoolBtn').style.display='block';document.getElementById('schoolBtn').onclick=openSchools}document.getElementById('content').innerHTML=data[role].map(x=>`<div class="item"><b>${x[0]}</b><span class="muted">${x[1]}</span></div>`).join('');document.getElementById('logout').onclick=()=>{sessionStorage.clear();location.replace('/erp/web/login.html')};function setNet(){const on=navigator.onLine;document.getElementById('syncDot').classList.toggle('off',!on);document.getElementById('syncText').textContent=on?'Online • sync-ready':'Offline • local work can continue; sync when online'}window.addEventListener('online',setNet);window.addEventListener('offline',setNet);setNet();async function load(){try{const org=await LSKERP.request('/api/organization');document.getElementById('schoolName').textContent=org.school.displayName||org.school.name;const select=document.getElementById('branchSelect');select.innerHTML='<option value="">All / School level</option>'+(org.branches||[]).map(b=>`<option value="${b.id}">${b.name} (${b.code})</option>`).join('');if(user.branchId)select.value=user.branchId;document.getElementById('branchName').textContent=select.value?(org.branches.find(b=>b.id===select.value)?.name||'Selected branch')+' • Branch-scoped view':'School-level view • Select a branch to focus your workspace';select.onchange=async()=>{try{select.disabled=true;await LSKERP.setBranch(select.value);user=LSKERP.user();await load()}catch(e){document.getElementById('error').textContent=e.message||'Could not switch branch'}finally{select.disabled=false}};const d=role==='parent'?await LSKERP.request('/api/portal/me/students'):await LSKERP.request('/api/students');const list=d.students||[];document.getElementById('cards').innerHTML=`<div class="card"><div class="label">Students visible</div><div class="value">${list.length}</div><div class="muted">Based on your school/branch access</div></div><div class="card"><div class="label">Branches</div><div class="value">${(org.branches||[]).length}</div><div class="muted">Configured branches</div></div><div class="card"><div class="label">ERP status</div><div class="value">✓</div><div class="status">Authenticated & connected</div></div><div class="card"><div class="label">Role</div><div class="value" style="text-transform:capitalize">${role}</div><div class="muted">Permission-aware workspace</div></div>`}catch(e){document.getElementById('error').textContent=e.message||'Could not load dashboard data'}}window.openSchools=async()=>{document.getElementById('schoolModal').classList.add('show');await loadSchools()};window.closeSchools=()=>document.getElementById('schoolModal').classList.remove('show');const schoolFields=['name','code','displayName','logoUrl','address','phone','supportEmail','appName','appSlug','androidPackage','iosBundleId','primaryColor','secondaryColor','minAppVersion','supportPhone','initialAdminName','initialAdminEmail','initialAdminPhone','initialAdminPassword'];let editingSchoolId=null;window.resetSchoolForm=()=>{editingSchoolId=null;schoolFields.forEach(x=>{const el=document.getElementById('s_'+x);if(el)el.value=''});document.getElementById('s_primaryColor').value='4F46E5';document.getElementById('s_secondaryColor').value='0F1720';document.getElementById('s_minAppVersion').value='1.0.0';document.getElementById('schoolFormTitle').textContent='Add New School';document.getElementById('schoolSubmit').textContent='Create School';document.getElementById('s_initialAdminName').required=true;document.getElementById('s_initialAdminPassword').required=true;document.getElementById('schoolMsg').textContent=''};window.editSchool=s=>{editingSchoolId=s.id;const map={name:s.name,code:s.code,displayName:s.display_name||'',logoUrl:s.logo_url||'',address:s.address||'',phone:s.phone||'',supportEmail:s.email||'',appName:s.app_name||'',appSlug:s.app_slug||'',androidPackage:s.android_package||'',iosBundleId:s.ios_bundle_id||'',primaryColor:s.primary_color||'4F46E5',secondaryColor:s.secondary_color||'0F1720',minAppVersion:s.min_app_version||'1.0.0',supportPhone:s.support_phone||''};schoolFields.forEach(x=>{const el=document.getElementById('s_'+x);if(el&&map[x]!==undefined)el.value=map[x]});document.getElementById('schoolFormTitle').textContent='Edit School';document.getElementById('schoolSubmit').textContent='Save Changes';document.getElementById('s_initialAdminName').required=false;document.getElementById('s_initialAdminPassword').required=false};async function loadSchools(){try{const r=await LSKERP.request('/api/platform/schools');const list=r.schools||[];document.getElementById('schoolList').innerHTML=list.length?list.map(s=>`<div class="schoolrowcard"><div><b>${s.display_name||s.name}</b><div class="mini">${s.code} • ${s.app_name||'No mobile app config'} • ${s.status}</div><div class="mini">${s.address||'No address configured'}</div></div><button class="editbtn" onclick='editSchool(${JSON.stringify(s)})'>Edit</button></div>`).join(''):'<div class="muted">No schools onboarded yet.</div>'}catch(e){document.getElementById('schoolList').textContent=e.message}}document.getElementById('schoolForm').onsubmit=async e=>{e.preventDefault();const p={};schoolFields.forEach(x=>{const el=document.getElementById('s_'+x);if(el)p[x]=(el.value||'').trim()});if(!editingSchoolId&&!p.initialAdminEmail&&!p.initialAdminPhone){document.getElementById('schoolMsg').className='modalmsg err';document.getElementById('schoolMsg').textContent='Initial admin email or phone is required.';return}document.getElementById('schoolMsg').className='modalmsg';document.getElementById('schoolMsg').textContent=editingSchoolId?'Saving…':'Creating…';try{await LSKERP.request(editingSchoolId?'/api/platform/schools/'+editingSchoolId:'/api/platform/schools',{method:editingSchoolId?'PATCH':'POST',body:JSON.stringify(p)});document.getElementById('schoolMsg').className='modalmsg ok';document.getElementById('schoolMsg').textContent=editingSchoolId?'School updated successfully.':'School onboarded successfully.';resetSchoolForm();await loadSchools()}catch(e){document.getElementById('schoolMsg').className='modalmsg err';document.getElementById('schoolMsg').textContent=e.message||'Request failed'}}load()})();</script></body></html>
