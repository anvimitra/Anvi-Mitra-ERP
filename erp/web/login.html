<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP — Login</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--primary:#172b55;--secondary:#14b8a6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--secondary) 12%,transparent),transparent 35%),#f4f7fb;transition:background .4s ease}.box{width:min(440px,92vw);background:#fff;border:1px solid #e1e6ef;border-radius:22px;padding:28px;box-shadow:0 18px 60px #15203b14;animation:rise .45s ease both}.brandrow{display:flex;align-items:center;gap:12px}.logo{width:56px;height:56px;border-radius:14px;object-fit:contain;background:#f2f5f9}.brand{font-size:24px;font-weight:800}.sub{color:#667085;font-size:14px;margin:6px 0 24px}label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}input,select,button{width:100%;padding:12px;border:1px solid #d9dee8;border-radius:9px;font:inherit}input:focus,select:focus{outline:none;border-color:var(--secondary);box-shadow:0 0 0 3px color-mix(in srgb,var(--secondary) 18%,transparent)}button{margin-top:18px;background:linear-gradient(100deg,var(--primary),var(--secondary));color:#fff;border:0;cursor:pointer;font-weight:800;transition:transform .18s,filter .18s}button:hover{transform:translateY(-1px);filter:brightness(1.04)}.msg{margin-top:14px;font-size:13px;color:#667085}.hint{font-size:11px;color:#667085;margin-top:6px}.status{font-size:11px;margin-top:10px;color:#667085;min-height:16px}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style></head><body><form class="box" id="login"><div class="brandrow"><img id="logo" class="logo" alt="School logo" hidden><div><div class="brand" id="brand">Anvi Mitra ERP</div><div class="sub" id="sub">Secure multi-school management portal</div></div></div><label>School Code</label><input id="schoolCode" autocomplete="organization" required><div class="status" id="schoolStatus"></div><label>Email / Phone</label><input id="loginId" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><label>Login as</label><select id="role"><option value="super_admin">Super Admin</option><option value="principal">Principal</option><option value="admin" selected>Admin / Office</option><option value="teacher">Teacher</option><option value="accountant">Accountant</option><option value="office_staff">Office Staff</option><option value="parent">Parent</option><option value="student">Student</option><option value="driver">Driver</option></select><div class="hint">Your account's server-side role is authoritative; this selection is only for the login experience.</div><button>Sign in</button><div class="msg" id="msg"></div></form><script>const form=document.getElementById('login'),code=document.getElementById('schoolCode'),brand=document.getElementById('brand'),sub=document.getElementById('sub'),logo=document.getElementById('logo'),schoolStatus=document.getElementById('schoolStatus'),msg=document.getElementById('msg');const allowed=new Set(['super_admin','principal','admin','teacher','accountant','office_staff','parent','student','driver']);let configTimer;async function loadSchoolConfig(){const value=code.value.trim();if(!value){schoolStatus.textContent='';return}schoolStatus.textContent='Loading school branding…';try{const r=await fetch('/api/public/school-config?schoolCode='+encodeURIComponent(value));const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'School not found');const s=d.school||{};brand.textContent=s.displayName||s.name||'Anvi Mitra ERP';sub.textContent=s.appName?s.appName+' • Secure management portal':'Secure multi-school management portal';if(s.logoUrl){logo.src=s.logoUrl;logo.hidden=false}else{logo.hidden=true}if(s.primaryColor)document.documentElement.style.setProperty('--primary',s.primaryColor);if(s.secondaryColor)document.documentElement.style.setProperty('--secondary',s.secondaryColor);schoolStatus.textContent='✓ '+(s.name||'School')+' connected';schoolStatus.style.color='var(--secondary)';}catch(e){schoolStatus.textContent=e.message;schoolStatus.style.color='#b42318';}}code.addEventListener('change',loadSchoolConfig);code.addEventListener('blur',loadSchoolConfig);form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.getElementById('loginId').value,password:document.getElementById('password').value,schoolCode:code.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Login failed');if(!d.accessToken)throw new Error('Login response did not contain an access token');const actual=String(d.user?.role||'').toLowerCase();if(!allowed.has(actual))throw new Error('This account has an unsupported ERP role');sessionStorage.setItem('lsk_access_token',d.accessToken);sessionStorage.setItem('lsk_user',JSON.stringify(d.user||{}));if(actual==='parent')location.href='/erp/web/parent-dashboard.html';else location.href='/erp/web/portal-dashboard.html?role='+encodeURIComponent(actual)}catch(err){msg.textContent=err.message||'Login failed'}});clearTimeout(configTimer);</script></body></html>
