<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP - Teacher Permissions</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field select{width:100%;padding:10px;border:1px solid #d7dce6;border-radius:8px;background:#fff}.btn{padding:10px 14px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}.btn.danger{background:#b42318}.muted{color:#667085;font-size:13px}.ok{color:#067647}.err{color:#b42318}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:#667085}@media(max-width:800px){.grid{grid-template-columns:1fr}.table{min-width:900px}.scroll{overflow:auto}}</style></head><body><main class="wrap"><h1>Teacher Class & Subject Permissions</h1><p class="muted">Assign the exact class + section + subject + academic session a teacher may access. Marks editing is denied unless an assignment exists.</p><section class="panel"><form id="form" class="grid"><div class="field"><label>Teacher *</label><select id="teacher" required></select></div><div class="field"><label>Class *</label><select id="class" required></select></div><div class="field"><label>Section *</label><select id="section" required></select></div><div class="field"><label>Subject *</label><select id="subject" required></select></div><div class="field"><label>Academic session *</label><select id="session" required></select></div><div class="field"><label>Branch</label><select id="branch"><option value="">All branches</option></select></div><div><button class="btn">Save permission</button></div></form><div id="msg" class="muted"></div></section><section class="panel"><h2>Assignments</h2><div class="scroll"><table class="table"><thead><tr><th>Teacher</th><th>Class</th><th>Section</th><th>Subject</th><th>Session</th><th>Branch</th><th>Marks</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading…</td></tr></tbody></table></div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(!['super_admin','principal','admin'].includes(role)){document.body.innerHTML='<main class="wrap"><section class="panel"><h2>Access denied</h2></section></main>';return}const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let structure=null;async function load(){const r=await Promise.all([LSKERP.request('/api/academic-structure'),LSKERP.request('/api/people?role=teacher').catch(()=>({people:[]})),LSKERP.request('/api/teacher-permissions')]);structure=r[0];const teachers=r[1].people||r[1].users||r[1].teachers||[];const perms=r[2].permissions||[];$('teacher').innerHTML=teachers.map(t=>`<option value="${t.id}">${esc(t.name||t.displayName||t.email||t.phone||t.id)}</option>`).join('');$('class').innerHTML=(structure.classes||[]).map(c=>`<option value="${c.id}">${esc(c.name)}${c.branchName?' • '+esc(c.branchName):''}</option>`).join('');$('subject').innerHTML=(structure.subjects||[]).map(s=>`<option value="${s.id}">${esc(s.name)}${s.code?' ('+esc(s.code)+')':''}</option>`).join('');$('session').innerHTML=(structure.sessions||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');$('branch').innerHTML='<option value="">All branches</option>'+(await LSKERP.request('/api/branches')).branches.map(b=>`<option value="${b.id}">${esc(b.name)} (${esc(b.code)})</option>`).join('');function sections(){const cid=$('class').value;$('section').innerHTML=(structure.sections||[]).filter(s=>s.classId===cid).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}$('class').onchange=sections;sections();$('rows').innerHTML=perms.map(p=>`<tr><td>${esc(p.email||p.phone||p.teacherUserId)}</td><td>${esc(p.className)}</td><td>${esc(p.sectionName)}</td><td>${esc(p.subjectName)}</td><td>${esc(p.sessionName)}</td><td>${esc(p.branchName||'All')}</td><td>${p.canEditMarks?'Allowed':'View only'}</td><td><button class="btn danger" data-id="${p.id}">Remove</button></td></tr>`).join('')||'<tr><td colspan="8">No assignments yet.</td></tr>';$('rows').querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this permission?'))return;try{await LSKERP.request('/api/teacher-permissions/'+b.dataset.id,{method:'DELETE'});await load()}catch(e){msg(e.message,true)}})}function msg(t,b=false){$('msg').className=b?'err':'ok';$('msg').textContent=t}$('form').onsubmit=async e=>{e.preventDefault();try{await LSKERP.request('/api/teacher-permissions',{method:'POST',body:JSON.stringify({teacherUserId:$('teacher').value,classId:$('class').value,sectionId:$('section').value,subjectId:$('subject').value,sessionId:$('session').value,branchId:$('branch').value||null,canView:true,canEditMarks:true})});msg('Permission saved.');await load()}catch(err){msg(err.message||'Could not save permission',true)}};try{await load()}catch(e){msg(e.message||'Could not load permissions',true)}})()</script></body></html>
