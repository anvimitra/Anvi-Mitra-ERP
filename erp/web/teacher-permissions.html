<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anvi Mitra ERP — Teacher Permission Guard</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#07111f;color:#eef6ff;--a:#55d6be;--b:#6ea8ff;--muted:#9eb2c9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#12335a,#07111f 48%);min-height:100vh}.wrap{width:min(980px,94vw);margin:auto;padding:30px 0}.panel{background:linear-gradient(145deg,#112640,#0a1829);border:1px solid #294866;border-radius:24px;padding:24px;box-shadow:0 24px 80px #0008;animation:rise .5s ease both}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}h1{margin:5px 0 8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.input{width:100%;padding:12px;border-radius:11px;border:1px solid #29445f;background:#081625;color:#fff;outline:none}.input:focus{border-color:var(--a);box-shadow:0 0 0 3px #55d6be22}.btn{margin-top:16px;padding:12px 16px;border:0;border-radius:11px;font-weight:800;cursor:pointer;background:linear-gradient(100deg,var(--a),#75e8d2);color:#03201a}.result{margin-top:18px;padding:18px;border-radius:16px;border:1px solid #294866;background:#091727}.allowed{border-color:#267f69;background:#0a2b28}.denied{border-color:#824654;background:#301720}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:800;font-size:12px}.ok{background:#55d6be;color:#03201a}.no{background:#ff9da9;color:#321017}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="panel">
<div class="eyebrow">Security Control</div><h1>Teacher Marks Permission</h1>
<p class="muted">Check the server-side permission for a teacher before opening or submitting marks. The same authorization is enforced again when data is synchronized.</p>
<div class="grid"><div class="field"><label>Exam Subject ID</label><input id="examSubjectId" class="input" placeholder="UUID"></div><div class="field"><label>Current connection</label><div id="connection" class="result" style="margin:0">Checking…</div></div></div>
<button id="check" class="btn" onclick="checkPermission()">Check Permission</button>
<div id="result" class="result">Enter an Exam Subject ID and check access.</div>
</section></main>
<script>
const token=sessionStorage.getItem('lsk_access_token'),user=JSON.parse(sessionStorage.getItem('lsk_user')||'{}');
if(!token) location.href='/erp/web/login.html';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function conn(){const e=document.getElementById('connection');e.textContent=navigator.onLine?'● Online — server authorization available':'● Offline — cached UI only; writes remain subject to server re-authorization on sync';}
async function checkPermission(){const id=document.getElementById('examSubjectId').value.trim(),out=document.getElementById('result');if(!id){out.textContent='Exam Subject ID is required.';return}out.textContent='Checking…';try{const r=await fetch('/api/teacher-permissions/marks?examSubjectId='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});const d=await r.json();if(!r.ok)throw Error(d.error||'Permission check failed');out.className='result '+(d.allowed?'allowed':'denied');out.innerHTML='<span class="badge '+(d.allowed?'ok':'no')+'">'+(d.allowed?'ALLOWED':'DENIED')+'</span><div style="margin-top:10px"><strong>'+esc(d.reason||'')+'</strong></div><div class="muted" style="margin-top:6px">Role: '+esc(user.role||'')+' · School: '+esc(user.schoolId||'')+'</div>'}catch(e){out.className='result denied';out.textContent=e.message}}
window.addEventListener('online',conn);window.addEventListener('offline',conn);conn();
</script></body></html>
