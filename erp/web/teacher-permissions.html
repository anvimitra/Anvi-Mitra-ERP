<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Marks Permission Check</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--line:#e4e8f0;--muted:#667085;--brand:#5b5bd6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;margin-top:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:var(--brand);font-weight:750;text-decoration:none}.field label{display:block;font-size:12px;font-weight:750;margin:14px 0 6px}.field input{width:100%;padding:11px;border:1px solid #d8deea;border-radius:10px;font:inherit}.btn{margin-top:14px;border:0;border-radius:10px;padding:11px 16px;background:var(--brand);color:#fff;font:inherit;font-weight:750;cursor:pointer}.result{margin-top:14px;padding:14px;border-radius:12px;background:#f5f7ff}.ok{color:#087443;font-weight:750}.no{color:#b42318;font-weight:750}.muted{color:var(--muted);font-size:13px;line-height:1.5}</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="/erp/web/portal-dashboard.html">← Dashboard</a><h1>Teacher Marks Permission</h1></div><span id="role" class="muted"></span></div><section class="panel"><p class="muted">Enter an exam-subject ID to verify whether the signed-in teacher is allowed to enter marks. Administrators are school-wide.</p><div class="field"><label>Exam Subject ID</label><input id="examSubjectId" placeholder="UUID"></div><button class="btn" id="check">Check permission</button><div id="result"></div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{const token=LSKERP.token(),user=LSKERP.user(),role=(user.role||'').toLowerCase();if(!token){location.replace('/erp/web/login.html');return}document.getElementById('role').textContent='Role: '+role;const result=document.getElementById('result');document.getElementById('check').onclick=async()=>{const id=document.getElementById('examSubjectId').value.trim();if(!id){result.innerHTML='<div class="result no">Exam Subject ID is required.</div>';return}result.innerHTML='<div class="result muted">Checking…</div>';try{const d=await LSKERP.request('/api/teacher-permissions/marks?examSubjectId='+encodeURIComponent(id));result.innerHTML=`<div class="result ${d.allowed?'ok':'no'}">${d.allowed?'✓ Allowed':'✕ Not allowed'}<div class="muted">Reason: ${d.reason||'unknown'}</div></div>`}catch(e){result.innerHTML=`<div class="result no">${e.message||'Permission check failed'}</div>`}}})();</script></body></html>
