<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Card</title><style>:root{--theme:#172033}*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:Arial,sans-serif}.toolbar{position:sticky;top:0;background:#172033;padding:12px;text-align:center}.toolbar button{border:0;border-radius:8px;padding:9px 16px;margin:0 4px;font-weight:700}.page{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:16mm;box-shadow:0 4px 22px #0002}.header{text-align:center;border-bottom:2px solid var(--theme);padding-bottom:12px;margin-bottom:14px}.logo{max-height:72px;max-width:160px}.school{font-size:25px;font-weight:800;color:var(--theme)}.meta{font-size:13px;color:#596579;margin-top:4px}.title{font-size:20px;font-weight:800;margin-top:10px;text-transform:uppercase}.student{display:grid;grid-template-columns:1fr 1fr;gap:7px 22px;border:1px solid #cfd6e0;border-radius:8px;padding:12px;margin-bottom:15px;font-size:14px}.photoCell{grid-row:span 4;text-align:right}.studentPhoto{width:86px;height:104px;object-fit:cover;border:1px solid #9aa6b5;border-radius:4px}.marks{width:100%;border-collapse:collapse;font-size:12px}.marks th,.marks td{border:1px solid #9aa6b5;padding:7px;text-align:center}.marks th{background:#f1f4f8;color:var(--theme)}.marks td:first-child{text-align:left}.examCell small{display:block;color:#667085;font-size:10px}.summary{margin-top:15px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{border:1px solid #cfd6e0;border-radius:8px;padding:10px;text-align:center}.box small{display:block;color:#687487}.box strong{font-size:20px}.extra{margin-top:15px;border:1px solid #cfd6e0;border-radius:8px;padding:10px;font-size:13px}.footer{margin-top:45px;display:flex;justify-content:space-between;font-size:13px}.status{text-align:center;font-weight:700;margin-top:15px}.error{text-align:center;color:#b42318;padding:30px}@media print{body{background:#fff}.toolbar{display:none}.page{margin:0;box-shadow:none;width:auto;min-height:auto;padding:12mm}@page{size:A4;margin:0}}@media(max-width:700px){.page{width:100%;margin:0;padding:12px}.student{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.photoCell{text-align:left;grid-row:auto}.marks{font-size:10px}.marks th,.marks td{padding:5px}}
</style></head><body><div class="toolbar"><button onclick="window.print()">Print / Save PDF</button><button onclick="loadCard()">Refresh</button></div><main id="app" class="page">Loading report card…</main><script src="./api.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const url=v=>{try{const u=new URL(v,location.href);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}};async function loadCard(){const id=new URLSearchParams(location.search).get('id');if(!id){app.innerHTML='<div class="error">Report card ID is missing.</div>';return}try{const [d,x]=await Promise.all([LSKERP.request('/api/report-card/'+encodeURIComponent(id)),LSKERP.request('/api/report-card/'+encodeURIComponent(id)+'/context')]),c=d.reportCard,s=d.school||{},t=d.template||{},l=t.layout||{},a=d.subjects||[],st=x.student||{},parents=x.parents||[],att=x.attendance||{};document.documentElement.style.setProperty('--theme',l.themeColor||'#172033');const configuredCols=Array.isArray(l.marksColumns)&&l.marksColumns.length?l.marksColumns:['subject','totalMarks','percentage','grade','remarks'];const examList=[];a.forEach(q=>(q.exams||[]).forEach(e=>{const key=e.examTypeId||e.examType||e.examTypeCode;if(key&&!examList.some(z=>String(z.key)===String(key)))examList.push({key,label:e.examType||e.examTypeCode||'Exam',id:e.examTypeId})}));const showExams=l.showExamBreakdown===true&&examList.length>0;const cols=showExams?['subject',...examList.map(e=>'exam:'+e.key),...configuredCols.filter(x=>x!=='subject')]:configuredCols;const labels={subject:'Subject',totalMarks:'Total Marks',percentage:'Percentage',grade:'Grade',remarks:'Remarks'};const head=cols.map(z=>z.startsWith('exam:')?'<th>'+esc(examList.find(e=>String(e.key)===z.slice(5))?.label||'Exam')+'</th>':'<th>'+esc(labels[z]||z)+'</th>').join('');const rows=a.map((q,i)=>'<tr>'+cols.map(col=>{if(col.startsWith('exam:')){const e=(q.exams||[]).find(x=>String(x.examTypeId||x.examType||x.examTypeCode)===col.slice(5));return '<td class="examCell">'+(e?esc(e.marks)+' / '+esc(e.maxMarks):'—')+(e&&e.weightedMarks!=null?'<small>Weighted: '+esc(Number(e.weightedMarks).toFixed(2))+'</small>':'')+'</td>'}let v=col==='subject'?(i+1)+'. '+q.subjectName:col==='totalMarks'?q.totalMarks:col==='percentage'?Number(q.percentage||0).toFixed(2)+'%':col==='grade'?(q.grade||'-'):col==='remarks'?(q.remarks||''):'';return '<td>'+esc(v)+'</td>'}).join('')+'</tr>').join('');const logo=url(l.logoUrl),photo=url(st.photoUrl),parent=parents.find(p=>p.isPrimary)||parents[0],attTotal=Number(att.total||0),attText=attTotal?('Present: '+Number(att.present||0)+' • Absent: '+Number(att.absent||0)+' • Late: '+Number(att.late||0)+' • Half Day: '+Number(att.halfDay||0)+' • Leave: '+Number(att.leave||0)):'Not recorded';const classSection=st.classSection||[st.className,st.sectionName].filter(Boolean).join(' - ')||'-';app.innerHTML='<div class="header">'+(logo?'<img class="logo" src="'+esc(logo)+'" alt="Logo"><br>':'')+'<div class="school">'+esc(l.schoolName||s.name||'School')+'</div><div class="meta">'+esc(l.address||'')+'</div><div class="title">'+esc(l.title||'Student Report Card')+'</div><div class="meta">'+esc(st.sessionName||c.sessionName||'')+(c.branchName?' • '+esc(c.branchName):'')+'</div></div><div class="student">'+(l.showStudentPhoto&&photo?'<div class="photoCell"><img class="studentPhoto" src="'+esc(photo)+'" alt="Student Photo"></div>':'')+'<div><b>Student:</b> '+esc(st.fullName||c.fullName)+'</div>'+(l.showAdmissionNo===false?'':'<div><b>Admission No:</b> '+esc(st.admissionNo||c.admissionNo)+'</div>')+(l.showClassSection===false?'':'<div><b>Class/Section:</b> '+esc(classSection)+'</div>')+'<div><b>Status:</b> '+esc(c.status)+'</div>'+(parent?'<div><b>Parent/Guardian:</b> '+esc(parent.fullName||'')+(parent.relation?' ('+esc(parent.relation)+')':'')+'</div>':'')+'</div><table class="marks"><thead><tr>'+head+'</tr></thead><tbody>'+(rows||'<tr><td colspan="'+cols.length+'">No subject results generated.</td></tr>')+'</tbody></table>'+(l.showTotalMarks===false&&l.showPercentage===false&&l.showGrade===false?'':'<div class="summary">'+(l.showTotalMarks===false?'':'<div class="box"><small>Total Marks</small><strong>'+esc(c.totalMarks)+'</strong></div>')+(l.showPercentage===false?'':'<div class="box"><small>Overall Percentage</small><strong>'+Number(c.percentage||0).toFixed(2)+'%</strong></div>')+(l.showGrade===false?'':'<div class="box"><small>Overall Grade</small><strong>'+esc(c.overallGrade||'-')+'</strong></div>')+'</div>')+(l.showAttendance?'<div class="extra"><b>Attendance:</b> '+esc(attText)+'<br><b>Attendance %:</b> '+Number(att.attendancePercent||0).toFixed(2)+'%</div>':'')+(l.showRemarks?'<div class="extra"><b>Remarks:</b> '+esc(c.remarks||'—')+'</div>':'')+'<div class="status">'+(c.status==='published'?'FINAL / PUBLISHED':'DRAFT — NOT YET PUBLISHED')+'</div><div class="footer"><span>'+esc(l.leftSignature||'Class Teacher')+'</span><span>'+esc(l.rightSignature||'Principal')+'</span></div>'+(l.footer?'<div class="meta" style="text-align:center;margin-top:25px">'+esc(l.footer)+'</div>':'');}catch(e){app.innerHTML='<div class="error">Unable to load report card.</div>';console.error(e)}}loadCard();</script></body></html>
