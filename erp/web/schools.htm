<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • School Management</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--line:#e4e8f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:27px}.top p{margin:5px 0 0;color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.card h2{font-size:17px;margin:0 0 14px}.form{display:grid;gap:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:700;color:#344054;margin-bottom:5px}input{width:100%;padding:11px;border:1px solid #d8deea;border-radius:9px;font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:#172b55;color:#fff;font-weight:700;cursor:pointer}.msg{font-size:13px;margin-top:10px}.ok{color:#087443}.err{color:#b42318}.hint{font-size:11px;color:#667085}.schools{display:grid;gap:10px}.school{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.school b{display:block}.meta{font-size:12px;color:#667085;margin-top:4px}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;white-space:nowrap}.empty{color:#667085;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div><h1>School Management</h1><p>Super Admin • create schools and prepare their ERP configuration.</p></div><button id="back">Back to Dashboard</button></div><div class="grid"><section class="card"><h2>Add School</h2><form id="form" class="form"><div><label>School Name *</label><input id="name" required></div><div class="row"><div><label>School Code *</label><input id="code" required></div><div><label>App Slug *</label><input id="appSlug" required></div></div><div class="row"><div><label>Application ID</label><input id="androidPackage" placeholder="in.anvimitra.example"></div><div><label>API Base URL</label><input id="apiBaseUrl" placeholder="https://erp.example.com"></div></div><div><label>Logo URL</label><input id="logoUrl" type="url"><div class="hint">Only public logo configuration is stored here; never put secrets or credentials in this field.</div></div><div class="row"><div><label>Primary Color</label><input id="primaryColor" value="4F46E5" maxlength="7"></div><div><label>Secondary Color</label><input id="secondaryColor" value="0F1720" maxlength="7"></div></div><div class="row"><div><label>Support Email</label><input id="supportEmail" type="email"></div><div><label>Support Phone</label><input id="supportPhone"></div></div><button type="submit">Create School</button><div id="msg" class="msg"></div></form></section><section class="card"><h2>Configured Schools</h2><div id="schools" class="schools"><div class="empty">Loading…</div></div></section></div></div><script src="/erp/web/api.js"></script><script>(async()=>{const token=LSKERP.token(),u=LSKERP.user();if(!token||String(u.role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id),msg=$('msg'),list=$('schools');$('back').onclick=()=>location.href='/erp/web/portal-dashboard.html?role=super_admin';const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const d=await LSKERP.request('/api/platform/schools');const rows=d.schools||[];list.innerHTML=rows.length?rows.map(s=>`<div class="school"><div><b>${esc(s.name||s.displayName)}</b><div class="meta">Code: ${esc(s.code)} • App: ${esc(s.app_slug||'—')} • Branches: ${esc(s.branch_count??0)}</div></div><span class="pill">${esc(s.status||'active')}</span></div>`).join(''):'<div class="empty">No schools configured yet.</div>'}catch(e){list.innerHTML=`<div class="empty err">${esc(e.message||'Could not load schools')}</div>`}}$('form').onsubmit=async e=>{e.preventDefault();msg.className='msg';msg.textContent='Creating school…';const body={name:$('name').value.trim(),code:$('code').value.trim(),appSlug:$('appSlug').value.trim(),androidPackage:$('androidPackage').value.trim()||null,apiBaseUrl:$('apiBaseUrl').value.trim()||null,logoUrl:$('logoUrl').value.trim()||null,primaryColor:$('primaryColor').value.trim(),secondaryColor:$('secondaryColor').value.trim(),supportEmail:$('supportEmail').value.trim()||null,supportPhone:$('supportPhone').value.trim()||null};try{await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(body)});msg.className='msg ok';msg.textContent='School created successfully.';e.target.reset();$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';await load()}catch(e){msg.className='msg err';msg.textContent=e.message||'School creation failed'}};await load()})();</script></body></html>
