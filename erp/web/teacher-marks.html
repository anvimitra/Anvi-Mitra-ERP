<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP - Teacher Marks</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #e3e7ef;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field select,.field input{width:100%;padding:10px;border:1px solid #d7dce6;border-radius:8px;box-sizing:border-box}.btn{padding:10px 14px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.table input{width:90px;padding:7px}.muted{color:#667085;font-size:13px}.ok{color:#067647}.err{color:#b42318}.offline{color:#b54708;font-size:13px;margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.scroll{overflow:auto}.table{min-width:900px}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Teacher Marks Entry</h1><p class="muted">Only classes, sections, subjects and sessions assigned to your teacher account can be edited.</p><section class="panel"><div class="grid"><div class="field"><label>Session</label><select id="session"></select></div><div class="field"><label>Exam</label><select id="exam"></select></div><div class="field"><label>Class</label><select id="class"></select></div><div class="field"><label>Section</label><select id="section"></select></div></div><div style="margin-top:12px"><button class="btn" id="load">Load permitted subject</button></div><div id="msg" class="muted"></div><div id="offline" class="offline"></div></section><section class="panel"><h2 id="subjectTitle">Students</h2><div class="scroll"><table class="table"><thead><tr><th>Admission</th><th>Student</th><th>Marks</th><th>Remarks</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="5">Choose filters and load.</td></tr></tbody></table></div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(role!=='teacher'){document.body.innerHTML='<main class="wrap"><section class="panel"><h2>Teacher account required</h2></section></main>';return}const $=id=>document.getElementById(id);let structure=null;const msg=(t,b)=>{$('msg').textContent=t;$('msg').className=b?'err':'ok'};const queueStatus=()=>{const q=LSKERP.offlineQueue();$('offline').textContent=q.length?`${q.length} offline change(s) waiting for internet sync.`:''};window.addEventListener('lsk:offline-queued',queueStatus);window.addEventListener('lsk:sync-complete',queueStatus);queueStatus();try{structure=await LSKERP.request('/api/academic-structure');$('session').innerHTML=(structure.sessions||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('class').innerHTML=(structure.classes||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('section').innerHTML='';$('exam').innerHTML='';const exams=await LSKERP.request('/api/exams?sessionId='+encodeURIComponent($('session').value));$('exam').innerHTML=(exams.exams||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');}catch(e){msg(e.message,true);return}$('session').onchange=async()=>{try{const exams=await LSKERP.request('/api/exams?sessionId='+encodeURIComponent($('session').value));$('exam').innerHTML=(exams.exams||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}catch(e){msg(e.message,true)}};$('class').onchange=()=>{const c=String($('class').value);$('section').innerHTML=(structure.sections||[]).filter(s=>String(s.classId)===c).map(s=>`<option value="${s.id}">${s.name}</option>`).join('')};$('class').dispatchEvent(new Event('change'));$('load').onclick=async()=>{try{const q=new URLSearchParams({sessionId:$('session').value,examId:$('exam').value,classId:$('class').value,sectionId:$('section').value});const d=await LSKERP.request('/api/teacher-marks?'+q.toString());$('subjectTitle').textContent=(d.examSubject?.subjectName||'Subject')+' • max '+d.examSubject?.maxMarks;$('rows').innerHTML=(d.students||[]).map(s=>`<tr><td>${s.admissionNo||''}</td><td>${s.fullName||''}</td><td><input type="number" min="0" max="${d.examSubject.maxMarks}" step="0.01" data-id="${s.id}" value="${s.marks??''}"></td><td><input type="text" data-remarks="${s.id}" value="${String(s.remarks||'').replace(/\"/g,'&quot;')}"></td><td><button class="btn" data-save="${s.id}">Save</button></td></tr>`).join('')||'<tr><td colspan="5">No enrolled students.</td></tr>';$('rows').querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save;const input=$('rows').querySelector('[data-id="'+id+'"]');const rem=$('rows').querySelector('[data-remarks="'+id+'"]');b.disabled=true;try{const result=await LSKERP.request('/api/teacher-marks',{method:'POST',offlineQueue:true,replay:true,syncMeta:{entityType:'teacher_marks',entityId:id},body:JSON.stringify({examId:$('exam').value,sessionId:$('session').value,classId:$('class').value,sectionId:$('section').value,studentId:id,marks:input.value===''?null:Number(input.value),remarks:rem.value})});if(result.offlineQueued){b.textContent='Queued';msg('Saved locally. It will sync automatically when internet returns.');}else{b.textContent='Saved';msg('Marks saved successfully.')}setTimeout(()=>b.textContent='Save',1200);queueStatus()}catch(e){msg(e.message,true)}finally{b.disabled=false}})}catch(e){$('rows').innerHTML='<tr><td colspan="5">'+e.message+'</td></tr>';msg(e.message,true)}})();</script></body></html>
