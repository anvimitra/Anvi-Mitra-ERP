<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP - Teacher Marks</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #e3e7ef;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field select,.field input{width:100%;padding:10px;border:1px solid #d7dce6;border-radius:8px;box-sizing:border-box}.btn{padding:10px 14px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.table input{padding:7px}.marks{width:90px}.remarks{width:min(360px,100%)}.muted{color:#667085;font-size:13px}.ok{color:#067647}.err{color:#b42318}.offline{color:#b54708;font-size:13px;margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}.scroll{overflow:auto}.table{min-width:850px}}</style></head><body><main class="wrap"><h1>Teacher Marks Entry</h1><p class="muted">The assignment list below is server-filtered to your teacher account. You cannot load or save marks for another class, section or subject.</p><section class="panel"><div class="grid"><div class="field"><label>Your assignment *</label><select id="assignment"></select></div><div class="field"><label>Exam *</label><select id="exam"></select></div><div class="field"><label>Class / Section</label><input id="classInfo" readonly></div></div><div style="margin-top:12px"><button class="btn" id="load">Load permitted subject</button></div><div id="msg" class="muted"></div><div id="offline" class="offline"></div></section><section class="panel"><h2 id="subjectTitle">Students</h2><div class="scroll"><table class="table"><thead><tr><th>Admission</th><th>Student</th><th>Marks</th><th>Remarks</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="5">Choose an assignment and exam.</td></tr></tbody></table></div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(role!=='teacher'){location.replace('/erp/web/portal-dashboard.html');return}const $=id=>document.getElementById(id);let assignments=[];let exams=[];let current=null;const msg=(t,b=false)=>{$('msg').textContent=t;$('msg').className=b?'err':'ok'};const queueStatus=()=>{const q=LSKERP.offlineQueue();$('offline').textContent=q.length?`${q.length} offline change(s) waiting for internet sync.`:''};window.addEventListener('lsk:offline-queued',queueStatus);window.addEventListener('lsk:sync-complete',queueStatus);queueStatus();async function loadAssignments(){const r=await LSKERP.request('/api/teacher-assignments');assignments=r.assignments||[];$('assignment').innerHTML=assignments.map((a,i)=>`<option value="${i}">${esc(a.className)} • ${esc(a.sectionName)} • ${esc(a.subjectName)} • ${esc(a.sessionName)}</option>`).join('');if(!assignments.length){$('assignment').innerHTML='<option>No assignment configured</option>';throw new Error('No teacher assignment is configured for your account.')}await loadExams()}async function loadExams(){current=assignments[Number($('assignment').value)];if(!current)return;const r=await LSKERP.request('/api/exams?sessionId='+encodeURIComponent(current.sessionId));exams=r.exams||[];$('exam').innerHTML=exams.map(e=>`<option value="${e.id}">${esc(e.name)}${e.status==='published'?' • Published':''}</option>`).join('');$('classInfo').value=current.className+' • '+current.sectionName}async function loadStudents(){current=assignments[Number($('assignment').value)];const examId=$('exam').value;if(!current||!examId)return;const q=new URLSearchParams({sessionId:current.sessionId,examId,classId:current.classId,sectionId:current.sectionId,subjectId:current.subjectId});$('rows').innerHTML='<tr><td colspan="5">Loading…</td></tr>';try{const d=await LSKERP.request('/api/teacher-marks?'+q.toString());$('subjectTitle').textContent=esc(d.examSubject.subjectName)+' • max '+d.examSubject.maxMarks;if(d.examSubject.examStatus==='published'){$('msg').textContent='Published exam: marks are locked.';$('msg').className='err'}else{$('msg').textContent='Permission verified.';$('msg').className='ok'}$('rows').innerHTML=(d.students||[]).map(s=>`<tr><td>${esc(s.admissionNo)}</td><td>${esc(s.fullName)}</td><td><input class="marks" type="number" min="0" max="${d.examSubject.maxMarks}" step="0.01" data-id="${s.id}" value="${s.marks??''}" ${d.examSubject.examStatus==='published'?'disabled':''}></td><td><input class="remarks" data-remarks="${s.id}" value="${esc(s.remarks||'')}" maxlength="500" ${d.examSubject.examStatus==='published'?'disabled':''}></td><td><button class="btn" data-save="${s.id}" ${d.examSubject.examStatus==='published'?'disabled':''}>Save</button></td></tr>`).join('')||'<tr><td colspan="5">No enrolled students.</td></tr>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=saveOne)}catch(e){$('rows').innerHTML='<tr><td colspan="5">'+esc(e.message)+'</td></tr>';$('msg').textContent=e.message;$('msg').className='err'}}async function saveOne(e){const b=e.currentTarget,id=b.dataset.save,input=document.querySelector(`[data-id="${CSS.escape(id)}"]`),remarks=document.querySelector(`[data-remarks="${CSS.escape(id)}"]`);b.disabled=true;try{const body={examId:$('exam').value,sessionId:current.sessionId,classId:current.classId,sectionId:current.sectionId,subjectId:current.subjectId,studentId:id,marks:input.value===''?null:Number(input.value),remarks:remarks.value};const r=await LSKERP.request('/api/teacher-marks',{method:'POST',offlineQueue:true,replay:true,syncMeta:{entityType:'teacher_marks',entityId:id},body:JSON.stringify(body)});if(r.offlineQueued){b.textContent='Queued';msg('Saved locally. It will sync automatically when internet returns.')}else{b.textContent='Saved';msg('Marks saved successfully.')}queueStatus();setTimeout(()=>b.textContent='Save',1200)}catch(err){msg(err.message||'Could not save marks',true)}finally{b.disabled=false}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('assignment').onchange=loadExams;$('load').onclick=loadStudents;try{await loadAssignments()}catch(e){msg(e.message||'Could not load teacher assignments',true)}})();</script></body></html>
