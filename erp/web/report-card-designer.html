<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Report Card Designer</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--brand:#5b5bd6;--line:#e2e7ef}*{box-sizing:border-box}body{margin:0}.app{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:25px}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}.panel,.preview{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px #17203309}.panel h2{font-size:16px;margin:0 0 14px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #ccd3df;border-radius:9px;font:inherit}.field textarea{min-height:70px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0}.check input{width:auto}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:750;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#edf0f6;color:#172033}.status{font-size:12px;margin-top:10px;min-height:16px}.ok{color:#087443}.bad{color:#b42318}.paper{background:#fff;min-height:700px;border:1px solid #d6dce5;padding:38px;box-shadow:0 3px 18px #0001}.phead{text-align:center;border-bottom:2px solid #172033;padding-bottom:12px}.pname{font-size:25px;font-weight:850}.ptitle{font-size:18px;font-weight:800;margin-top:8px;text-transform:uppercase}.pmeta{font-size:12px;color:#667085;margin-top:4px}.pstudent{display:grid;grid-template-columns:1fr 1fr;border:1px solid #cfd6e0;border-radius:8px;padding:10px;margin:15px 0;gap:7px;font-size:13px}.ptable{width:100%;border-collapse:collapse;font-size:12px}.ptable th,.ptable td{border:1px solid #9aa6b5;padding:7px}.ptable th{background:#f1f4f8}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.sum{border:1px solid #ccd3df;padding:9px;text-align:center;border-radius:7px}.sign{display:flex;justify-content:space-between;margin-top:55px;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.paper{padding:20px}}@media print{.panel,.top{display:none}.app{padding:0}.preview{border:0;padding:0;box-shadow:none}.paper{border:0;box-shadow:none}}
</style></head><body><div class="app"><div class="top"><div><h1>Report Card Template Designer</h1><div class="muted">Create a separate printable design for each school / branch.</div></div><button class="btn secondary" onclick="location.href='/erp/web/portal-dashboard.html'">Dashboard</button></div><div class="grid"><section class="panel"><h2>Template settings</h2><div class="field"><label>Template name</label><input id="name" value="Standard Report Card"></div><div class="field"><label>Template key</label><input id="key" value="standard"></div><div class="field"><label>School name override</label><input id="schoolName" placeholder="Use school master name"></div><div class="field"><label>Address / contact line</label><input id="address" placeholder="School address, phone, email"></div><div class="field"><label>Report card title</label><input id="title" value="Student Report Card"></div><div class="row"><div class="field"><label>Left signature</label><input id="leftSig" value="Class Teacher"></div><div class="field"><label>Right signature</label><input id="rightSig" value="Principal"></div></div><label class="check"><input type="checkbox" id="default"> Make this the default template</label><div class="buttons"><button class="btn primary" id="save">Save template</button><button class="btn secondary" id="new">Reset</button></div><div id="status" class="status"></div><hr><h2>Existing templates</h2><select id="templates"><option value="">Select template to edit</option></select><div class="muted" style="margin-top:6px">Selecting a template loads its saved layout.</div></section><section class="preview"><div class="paper" id="paper"></div></section></div></div><script src="/erp/web/api.js"></script><script>const $=id=>document.getElementById(id);let editingId=null;let loaded=[];function layout(){return {schoolName:$('schoolName').value.trim(),address:$('address').value.trim(),title:$('title').value.trim(),leftSignature:$('leftSig').value.trim(),rightSignature:$('rightSig').value.trim()}}function render(){const l=layout();$('paper').innerHTML=`<div class="phead"><div class="pname">${esc(l.schoolName||'Your School Name')}</div><div class="pmeta">${esc(l.address||'School address / contact')}</div><div class="ptitle">${esc(l.title||'Student Report Card')}</div><div class="pmeta">Academic Session • Branch</div></div><div class="pstudent"><div><b>Student:</b> Sample Student</div><div><b>Admission No:</b> ADM-001</div><div><b>Class:</b> Class 8</div><div><b>Section:</b> A</div></div><table class="ptable"><thead><tr><th>Subject</th><th>FA1</th><th>FA2</th><th>Half Yearly</th><th>Yearly</th><th>Grade</th></tr></thead><tbody><tr><td>English</td><td>18/20</td><td>17/20</td><td>72/80</td><td>86/100</td><td>A</td></tr><tr><td>Mathematics</td><td>19/20</td><td>18/20</td><td>75/80</td><td>91/100</td><td>A+</td></tr><tr><td>Science</td><td>17/20</td><td>18/20</td><td>70/80</td><td>84/100</td><td>A</td></tr></tbody></table><div class="summary"><div class="sum"><small>Total Marks</small><br><b>—</b></div><div class="sum"><small>Percentage</small><br><b>—</b></div><div class="sum"><small>Overall Grade</small><br><b>—</b></div></div><div class="sign"><span>${esc(l.leftSignature||'Class Teacher')}</span><span>${esc(l.rightSignature||'Principal')}</span></div>`}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}['name','key','schoolName','address','title','leftSig','rightSig'].forEach(id=>$(id).addEventListener('input',render));async function load(){try{loaded=(await LSKERP.request('/api/report-card/templates')).templates||[];$('templates').innerHTML='<option value="">Select template to edit</option>'+loaded.map(t=>`<option value="${t.id}">${esc(t.name)}${t.isDefault?' • Default':''}</option>`).join('')}catch(e){$('status').textContent=e.message||'Could not load templates';$('status').className='status bad'}}$('templates').onchange=()=>{const t=loaded.find(x=>x.id===$('templates').value);if(!t)return;editingId=t.id;const l=t.layout||{};$('name').value=t.name||'';$('key').value=t.templateKey||'standard';$('schoolName').value=l.schoolName||'';$('address').value=l.address||'';$('title').value=l.title||'Student Report Card';$('leftSig').value=l.leftSignature||'Class Teacher';$('rightSig').value=l.rightSignature||'Principal';$('default').checked=!!t.isDefault;render()};$('new').onclick=()=>{editingId=null;$('name').value='Standard Report Card';$('key').value='standard';$('schoolName').value='';$('address').value='';$('title').value='Student Report Card';$('leftSig').value='Class Teacher';$('rightSig').value='Principal';$('default').checked=false;render();$('templates').value=''};$('save').onclick=async()=>{try{$('status').textContent='Saving…';const body={name:$('name').value.trim(),templateKey:$('key').value.trim()||'standard',layout:layout(),isDefault:$('default').checked};if(!body.name)throw new Error('Template name is required');let r;if(editingId)r=await LSKERP.request('/api/report-card/templates/'+editingId,{method:'PATCH',body:JSON.stringify(body)});else r=await LSKERP.request('/api/report-card/templates',{method:'POST',body:JSON.stringify(body)});editingId=r.template.id;$('status').textContent='Template saved successfully';$('status').className='status ok';await load();$('templates').value=editingId}catch(e){$('status').textContent=e.message||'Save failed';$('status').className='status bad'}};render();load();</script></body></html>
