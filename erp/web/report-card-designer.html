<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Report Card Designer</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--brand:#5b5bd6;--line:#e2e7ef}*{box-sizing:border-box}body{margin:0}.app{max-width:1280px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:25px}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:400px 1fr;gap:18px}.panel,.preview{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px #17203309}.panel h2{font-size:16px;margin:0 0 14px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #ccd3df;border-radius:9px;font:inherit}.field textarea{min-height:70px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:8px;font-size:13px;margin:9px 0}.check input{width:auto}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:750;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#edf0f6;color:#172033}.status{font-size:12px;margin-top:10px;min-height:16px}.ok{color:#087443}.bad{color:#b42318}.paper{background:#fff;min-height:700px;border:1px solid #d6dce5;padding:38px;box-shadow:0 3px 18px #0001}.phead{text-align:center;border-bottom:2px solid var(--brand);padding-bottom:12px}.logo{max-height:60px;max-width:150px}.pname{font-size:25px;font-weight:850}.ptitle{font-size:18px;font-weight:800;margin-top:8px;text-transform:uppercase}.pmeta{font-size:12px;color:#667085;margin-top:4px}.pstudent{display:grid;grid-template-columns:1fr 1fr;border:1px solid #cfd6e0;border-radius:8px;padding:10px;margin:15px 0;gap:7px;font-size:13px}.photo{grid-row:span 3;text-align:right}.photo img{width:78px;height:96px;object-fit:cover;border:1px solid #9aa6b5}.ptable{width:100%;border-collapse:collapse;font-size:11px}.ptable th,.ptable td{border:1px solid #9aa6b5;padding:6px;text-align:center}.ptable th{background:#f1f4f8}.ptable td:first-child{text-align:left}.exam{font-size:10px;color:#667085}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.sum{border:1px solid #ccd3df;padding:9px;text-align:center;border-radius:7px}.extra{margin-top:10px;border:1px solid #ccd3df;padding:9px;border-radius:7px;font-size:12px}.sign{display:flex;justify-content:space-between;margin-top:45px;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.paper{padding:20px}}@media print{.panel,.top{display:none}.app{padding:0}.preview{border:0;padding:0;box-shadow:none}.paper{border:0;box-shadow:none}}
</style></head><body><div class="app"><div class="top"><div><h1>Report Card Template Designer</h1><div class="muted">Configure a separate printable design for each school / branch.</div></div><button class="btn secondary" onclick="location.href='/erp/web/portal-dashboard.html'">Dashboard</button></div><div class="grid"><section class="panel"><h2>Template settings</h2><div class="field"><label>Template name</label><input id="name" value="Standard Report Card"></div><div class="field"><label>Template key</label><input id="key" value="standard"></div><div class="field"><label>School name override</label><input id="schoolName" placeholder="Use school master name"></div><div class="field"><label>Logo URL</label><input id="logoUrl" placeholder="https://..."></div><div class="field"><label>Address / contact line</label><input id="address" placeholder="School address, phone, email"></div><div class="field"><label>Report card title</label><input id="title" value="Student Report Card"></div><div class="row"><div class="field"><label>Theme color</label><input id="themeColor" type="color" value="#172033"></div><div class="field"><label>Exam breakdown</label><select id="examBreakdown"><option value="false">Hide</option><option value="true">Show</option></select></div></div><h2>Display options</h2><label class="check"><input type="checkbox" id="photo"> Show student photo</label><label class="check"><input type="checkbox" id="admission" checked> Show admission number</label><label class="check"><input type="checkbox" id="classSection" checked> Show class / section</label><label class="check"><input type="checkbox" id="attendance" checked> Show attendance</label><label class="check"><input type="checkbox" id="remarks" checked> Show remarks</label><label class="check"><input type="checkbox" id="total" checked> Show total marks</label><label class="check"><input type="checkbox" id="percentage" checked> Show percentage</label><label class="check"><input type="checkbox" id="grade" checked> Show overall grade</label><div class="row"><div class="field"><label>Left signature</label><input id="leftSig" value="Class Teacher"></div><div class="field"><label>Right signature</label><input id="rightSig" value="Principal"></div></div><div class="field"><label>Footer</label><textarea id="footer" placeholder="Optional footer text"></textarea></div><label class="check"><input type="checkbox" id="default"> Make this the default template</label><div class="buttons"><button class="btn primary" id="save">Save template</button><button class="btn secondary" id="new">Reset</button></div><div id="status" class="status"></div><hr><h2>Existing templates</h2><select id="templates"><option value="">Select template to edit</option></select></section><section class="preview"><div class="paper" id="paper"></div></section></div></div><script src="/erp/web/api.js"></script><script>const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),safeUrl=v=>{try{const u=new URL(v,location.href);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}};let editingId=null,loaded=[];function layout(){return {schoolName:$('schoolName').value.trim(),logoUrl:$('logoUrl').value.trim(),address:$('address').value.trim(),title:$('title').value.trim(),themeColor:$('themeColor').value,showExamBreakdown:$('examBreakdown').value==='true',showStudentPhoto:$('photo').checked,showAdmissionNo:$('admission').checked,showClassSection:$('classSection').checked,showAttendance:$('attendance').checked,showRemarks:$('remarks').checked,showTotalMarks:$('total').checked,showPercentage:$('percentage').checked,showGrade:$('grade').checked,leftSignature:$('leftSig').value.trim(),rightSignature:$('rightSig').value.trim(),footer:$('footer').value.trim()}}function render(){const l=layout();document.documentElement.style.setProperty('--brand',l.themeColor);const logo=safeUrl(l.logoUrl);let heads='<th>Subject</th>';if(l.showExamBreakdown)heads+='<th>FA1</th><th>FA2</th><th>FA3</th><th>Half Yearly</th><th>Yearly</th>';heads+='<th>Total Marks</th><th>%</th><th>Grade</th>';let row='<tr><td>1. English</td>';if(l.showExamBreakdown)row+='<td>18/20</td><td>17/20</td><td>19/20</td><td>72/80</td><td>86/100</td>';row+='<td>212</td><td>90.2%</td><td>A+</td></tr>';const photo=$('photo').checked?'<div class="photo"><img src="https://placehold.co/78x96?text=Photo" alt="Student"></div>':'';$('paper').innerHTML='<div class="phead">'+(logo?'<img class="logo" src="'+esc(logo)+'" alt="Logo"><br>':'')+'<div class="pname">'+esc(l.schoolName||'Your School Name')+'</div><div class="pmeta">'+esc(l.address||'School address / contact')+'</div><div class="ptitle">'+esc(l.title||'Student Report Card')+'</div><div class="pmeta">Academic Session • Branch</div></div><div class="pstudent">'+photo+'<div><b>Student:</b> Sample Student</div>'+($('admission').checked?'<div><b>Admission No:</b> ADM-001</div>':'')+($('classSection').checked?'<div><b>Class / Section:</b> Class 8 - A</div>':'')+'</div><table class="ptable"><thead><tr>'+heads+'</tr></thead><tbody>'+row+'</tbody></table>'+(l.showTotalMarks||l.showPercentage||l.showGrade?'<div class="summary">'+(l.showTotalMarks?'<div class="sum"><small>Total Marks</small><br><b>212</b></div>':'')+(l.showPercentage?'<div class="sum"><small>Percentage</small><br><b>90.20%</b></div>':'')+(l.showGrade?'<div class="sum"><small>Overall Grade</small><br><b>A+</b></div>':'')+'</div>':'')+(l.showAttendance?'<div class="extra"><b>Attendance:</b> Present 180 • Absent 8 • Total 188</div>':'')+(l.showRemarks?'<div class="extra"><b>Remarks:</b> Very Good</div>':'')+'<div class="sign"><span>'+esc(l.leftSignature||'Class Teacher')+'</span><span>'+esc(l.rightSignature||'Principal')+'</span></div>'+(l.footer?'<div class="pmeta" style="text-align:center;margin-top:25px">'+esc(l.footer)+'</div>':'')}['name','key','schoolName','logoUrl','address','title','themeColor','examBreakdown','photo','admission','classSection','attendance','remarks','total','percentage','grade','leftSig','rightSig','footer'].forEach(id=>$(id).addEventListener('input',render));['examBreakdown','photo','admission','classSection','attendance','remarks','total','percentage','grade'].forEach(id=>$(id).addEventListener('change',render));async function load(){try{loaded=(await LSKERP.request('/api/report-card/templates')).templates||[];$('templates').innerHTML='<option value="">Select template to edit</option>'+loaded.map(t=>`<option value="${t.id}">${esc(t.name)}${t.isDefault?' • Default':''}</option>`).join('')}catch(e){$('status').textContent=e.message||'Could not load templates';$('status').className='status bad'}}$('templates').onchange=()=>{const t=loaded.find(x=>x.id===$('templates').value);if(!t)return;editingId=t.id;const l=t.layout||{};$('name').value=t.name||'';$('key').value=t.templateKey||'standard';$('schoolName').value=l.schoolName||'';$('logoUrl').value=l.logoUrl||'';$('address').value=l.address||'';$('title').value=l.title||'Student Report Card';$('themeColor').value=l.themeColor||'#172033';$('examBreakdown').value=l.showExamBreakdown?'true':'false';$('photo').checked=!!l.showStudentPhoto;$('admission').checked=l.showAdmissionNo!==false;$('classSection').checked=l.showClassSection!==false;$('attendance').checked=l.showAttendance!==false;$('remarks').checked=l.showRemarks!==false;$('total').checked=l.showTotalMarks!==false;$('percentage').checked=l.showPercentage!==false;$('grade').checked=l.showGrade!==false;$('leftSig').value=l.leftSignature||'Class Teacher';$('rightSig').value=l.rightSignature||'Principal';$('footer').value=l.footer||'';$('default').checked=!!t.isDefault;render()};$('new').onclick=()=>{editingId=null;$('name').value='Standard Report Card';$('key').value='standard';$('schoolName').value='';$('logoUrl').value='';$('address').value='';$('title').value='Student Report Card';$('themeColor').value='#172033';$('examBreakdown').value='false';$('photo').checked=false;$('admission').checked=true;$('classSection').checked=true;$('attendance').checked=true;$('remarks').checked=true;$('total').checked=true;$('percentage').checked=true;$('grade').checked=true;$('leftSig').value='Class Teacher';$('rightSig').value='Principal';$('footer').value='';$('default').checked=false;$('templates').value='';render()};$('save').onclick=async()=>{try{$('status').textContent='Saving…';const body={name:$('name').value.trim(),templateKey:$('key').value.trim()||'standard',layout:layout(),isDefault:$('default').checked};if(!body.name)throw new Error('Template name is required');let r=editingId?await LSKERP.request('/api/report-card/templates/'+editingId,{method:'PATCH',body:JSON.stringify(body)}):await LSKERP.request('/api/report-card/templates',{method:'POST',body:JSON.stringify(body)});editingId=r.template.id;$('status').textContent='Template saved successfully';$('status').className='status ok';await load();$('templates').value=editingId}catch(e){$('status').textContent=e.message||'Save failed';$('status').className='status bad'}};render();load();</script></body></html>
