<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Fee Assignment - Anvi Mitra ERP</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:22px}.card{background:#fff;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.field{display:flex;flex-direction:column}.field label{font-size:12px;color:#667085;margin:5px}input,select,button{padding:10px;margin:5px;border:1px solid #ccd3df;border-radius:8px}button{cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.muted{color:#667085}.msg{min-height:20px;padding:8px 5px}.error{color:#b42318}.ok{color:#087443}.results{display:none;border:1px solid #e5e7eb;border-radius:10px;padding:10px}.student{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px;align-items:center}.context{display:flex;flex-wrap:wrap;gap:8px}.pill{background:#f8fafc;border:1px solid #e5e7eb;border-radius:9px;padding:8px 12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}</style></head><body><div class="wrap"><div class="top"><div><h1>Smart Fee Assignment</h1><div class="muted">Student → class/session → fee structure → assignment</div></div><a href="/erp/web/fee-center.html">← Fee Center</a></div><section class="card"><h3>1. Select Student</h3><input id="search" placeholder="Admission No. / Name"><button class="primary" onclick="findStudents()">Search</button><div id="msg" class="msg"></div><div id="results" class="results"></div><div id="selected" class="card" style="display:none"></div></section><section class="card"><h3>2. Select Fee Structure</h3><div id="context" class="context"><span class="pill">Select a student first.</span></div><div class="grid"><div class="field"><label>Academic Session</label><select id="session"><option value="">Select student</option></select></div><div class="field"><label>Fee Structure</label><select id="structure"><option value="">Select student first</option></select></div></div><div id="structureMsg" class="msg"></div></section><section class="card"><h3>3. Assignment Details</h3><div class="grid"><div class="field"><label>Fee Head</label><select id="feeHead"><option value="">Select structure</option></select></div><div class="field"><label>Amount</label><input id="amount" type="number" min="0" step="0.01"></div><div class="field"><label>Frequency</label><select id="frequency"><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="half_yearly">Half Yearly</option><option value="annual">Annual</option><option value="one_time">One Time</option></select></div><div class="field"><label>Start Date</label><input id="startDate" type="date"></div><div class="field"><label>Due Day</label><input id="dueDay" type="number" min="1" max="31"></div></div><button class="primary" onclick="assign(false)">Assign Fee</button><button onclick="assign(true)">Assign + Generate Installments</button><div id="assignMsg" class="msg"></div></section><section class="card"><h3>4. Generate Installments</h3><div class="grid"><div class="field"><label>From</label><input id="fromDate" type="date"></div><div class="field"><label>To</label><input id="toDate" type="date"></div></div><button class="primary" onclick="generate()">Generate Installments</button><div id="genMsg" class="msg"></div></section><section class="card"><h3>Existing Assignments</h3><button onclick="loadAssignments()">Refresh</button><div class="table-wrap"><table><thead><tr><th>Fee Head</th><th>Amount</th><th>Frequency</th><th>Start</th><th>Due Day</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="muted">Select a student first.</td></tr></tbody></table></div></section></div><script src="/erp/web/api.js"></script><script>const roles=['super_admin','principal','admin','accountant','office_staff'];const user=LSKERP.user();if(!roles.includes(String(user.role||'').toLowerCase()))document.body.innerHTML='<div class="wrap"><div class="card"><h2>Access denied</h2><p>Finance access is required.</p></div></div>';let studentId=null,academic=null,structures=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));const msg=(id,t,c='')=>{const e=$(id);e.textContent=t;e.className='msg '+c};function dates(s){const a=s.startsOn||new Date().toISOString().slice(0,10);$('startDate').value=a;$('fromDate').value=a;$('toDate').value=s.endsOn||a}function context(){const s=academic?.sessions?.find(x=>x.id==$('session').value),e=academic?.enrollment;let h=s?`<span class="pill"><b>Session:</b> ${esc(s.name)}</span>`:'';if(e)h+=`<span class="pill"><b>Class:</b> ${esc(e.className||'—')}</span><span class="pill"><b>Section:</b> ${esc(e.sectionName||'—')}</span><span class="pill"><b>Branch:</b> ${esc(e.branchName||'Main')}</span>`;$('context').innerHTML=h||'<span class="pill">Select a student first.</span>'}async function init(){try{const d=await LSKERP.request('/api/academic-structure');academic=d;const ss=d.sessions||[];const cur=ss.find(x=>x.isCurrent)||ss[0];$('session').innerHTML='<option value="">Select session</option>'+ss.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.isCurrent?' • Current':''}</option>`).join('');if(cur){$('session').value=cur.id;dates(cur)}context()}catch(e){msg('structureMsg',e.message||'Could not load academic sessions.','error')}}async function findStudents(){const q=$('search').value.trim();if(!q)return msg('msg','Enter admission number or name.','error');try{msg('msg','Searching…');const d=await LSKERP.request('/api/students/search?q='+encodeURIComponent(q));const list=d.students||[],box=$('results');if(!list.length){box.style.display='none';return msg('msg','No student found.','error')}box.style.display='block';box.innerHTML=list.map(s=>`<div class="student"><div><b>${esc(s.fullName)}</b><br><span class="muted">Admission: ${esc(s.admissionNo||'—')}</span></div><button onclick="selectStudent('${encodeURIComponent(s.id)}','${encodeURIComponent(s.fullName||'Student')}','${encodeURIComponent(s.admissionNo||'')}')">Select</button></div>`).join('');msg('msg',list.length+' student(s) found.','ok')}catch(e){msg('msg',e.message||'Search failed.','error')}}async function selectStudent(id,name,adm){studentId=decodeURIComponent(id);$('selected').style.display='block';$('selected').innerHTML='<b>Selected:</b> '+esc(decodeURIComponent(name))+' — '+esc(decodeURIComponent(adm));$('results').style.display='none';try{const d=await LSKERP.request('/api/students/'+encodeURIComponent(studentId)+'/enrollments');const list=d.enrollments||[];academic.enrollment=list.find(x=>x.status==='active')||list[0]||null;if(!academic.enrollment)throw Error('No enrollment found for this student.');$('session').value=academic.enrollment.sessionId||$('session').value;const s=academic.sessions.find(x=>x.id==$('session').value);if(s)dates(s);context();await loadStructures();await loadAssignments()}catch(e){msg('assignMsg',e.message||'Could not load enrollment.','error')}}async function loadStructures(){const sid=$('session').value,e=academic?.enrollment;const classId=e?(academic.sections||[]).find(x=>x.id===e.sectionId)?.classId:null;$('structure').innerHTML='<option value="">Loading structures…</option>';if(!sid||!classId){$('structure').innerHTML='<option value="">No class/session context</option>';return}try{const d=await LSKERP.request('/api/fee-structures?sessionId='+encodeURIComponent(sid)+'&classId='+encodeURIComponent(classId));structures=(d.feeStructures||[]).filter(x=>!e.branchId||!x.branchId||x.branchId===e.branchId);$('structure').innerHTML='<option value="">Select fee structure</option>'+structures.map(x=>`<option value="${esc(x.id)}">${esc(x.feeHeadName)} — ₹${Number(x.amount||0).toFixed(2)} — ${esc(x.frequency)}${x.dueDay?' — Due '+esc(x.dueDay):''}</option>`).join('')||'<option value="">No fee structure found</option>'}catch(e){$('structure').innerHTML='<option value="">Could not load structures</option>';msg('structureMsg',e.message||'Could not load fee structures.','error')}}$('structure').addEventListener('change',()=>{const x=structures.find(s=>s.id==$('structure').value);if(!x)return;$('feeHead').innerHTML=`<option value="${esc(x.feeHeadId)}">${esc(x.feeHeadName)} (${esc(x.feeHeadCode||'')})</option>`;$('feeHead').value=x.feeHeadId;$('amount').value=Number(x.amount||0);$('frequency').value=x.frequency||'annual';$('dueDay').value=x.dueDay||'';msg('structureMsg','Fee structure applied automatically.','ok')});$('session').addEventListener('change',()=>{const s=academic?.sessions?.find(x=>x.id==$('session').value);if(s)dates(s);context();loadStructures()});async function assign(andGenerate){if(!studentId)return msg('assignMsg','Select a student first.','error');const b={studentId,sessionId:$('session').value,feeHeadId:$('feeHead').value,amount:Number($('amount').value),frequency:$('frequency').value,startDate:$('startDate').value,dueDay:$('dueDay').value?Number($('dueDay').value):null};if(!b.sessionId||!b.feeHeadId||!b.startDate||!Number.isFinite(b.amount)||b.amount<=0)return msg('assignMsg','Select structure and enter valid assignment details.','error');try{msg('assignMsg','Saving…');await LSKERP.request('/api/fees/assignments',{method:'POST',body:JSON.stringify(b)});msg('assignMsg','Fee assignment created successfully.','ok');await loadAssignments();if(andGenerate)await generate()}catch(e){msg('assignMsg',e.message||'Assignment failed.','error')}}async function generate(){if(!studentId)return msg('genMsg','Select a student first.','error');const sid=$('session').value,from=$('fromDate').value,to=$('toDate').value;if(!sid||!from||!to)return msg('genMsg','Session and date range are required.','error');if(from>to)return msg('genMsg','From date cannot be after To date.','error');try{msg('genMsg','Generating installments…');const d=await LSKERP.request('/api/fees/installments/generate',{method:'POST',body:JSON.stringify({sessionId:sid,studentId,fromDate:from,toDate:to})});msg('genMsg',`Generated ${d.generated||0} installment(s) from ${d.assignments||0} assignment(s).`,'ok')}catch(e){msg('genMsg',e.message||'Generation failed.','error')}}async function loadAssignments(){if(!studentId)return;try{const d=await LSKERP.request('/api/fees/assignments/student/'+encodeURIComponent(studentId));const list=d.assignments||[];$('rows').innerHTML=list.map(x=>`<tr><td>${esc(x.feeHeadName)}</td><td>₹${Number(x.amount||0).toFixed(2)}</td><td>${esc(x.frequency)}</td><td>${esc(x.startDate)}</td><td>${esc(x.dueDay||'—')}</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No assignments found.</td></tr>'}catch(e){msg('assignMsg',e.message||'Could not load assignments.','error')}}init();$('search').addEventListener('keydown',e=>{if(e.key==='Enter')findStudents()});</script></body></html>
