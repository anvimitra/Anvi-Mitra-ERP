<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP - Schools</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #d7dce6;border-radius:8px;box-sizing:border-box}.wide{grid-column:1/-1}.btn{padding:11px 16px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-weight:700}.muted{color:#667085;font-size:13px}.ok{color:#067647}.err{color:#b42318}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}@media(max-width:750px){.grid,.form{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><h1>School Management</h1><p class="muted">Super Admin - add schools and configure their ERP app.</p><div class="grid"><div class="panel"><div class="muted">Total schools</div><h2 id="total">-</h2></div><div class="panel"><div class="muted">Active schools</div><h2 id="active">-</h2></div><div class="panel"><div class="muted">Configured apps</div><h2 id="apps">-</h2></div></div><section class="panel"><h2>Add school</h2><form id="form" class="form"><div class="field"><label>School name *</label><input id="name" required></div><div class="field"><label>School code *</label><input id="code" required></div><div class="field"><label>App slug *</label><input id="appSlug" required></div><div class="field"><label>Display name</label><input id="displayName"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Support email</label><input id="supportEmail"></div><div class="field wide"><label>Address</label><input id="address"></div><div class="field"><label>Logo URL</label><input id="logoUrl"></div><div class="field"><label>Primary color</label><input id="primaryColor" value="4F46E5"></div><div class="field"><label>Secondary color</label><input id="secondaryColor" value="0F1720"></div><div class="field"><label>Main branch</label><input id="branchName" value="Main Branch"></div><div class="field"><label>Branch code</label><input id="branchCode" value="MAIN"></div><div class="field"><label>Android package</label><input id="androidPackage"></div><div class="field"><label>Min app version</label><input id="minAppVersion" value="1.0.0"></div><div class="wide"><button class="btn">Create school</button></div></form><p id="msg" class="muted"></p></section><section class="panel"><h2>Schools</h2><table class="table"><thead><tr><th>School</th><th>Code</th><th>App</th><th>Branch</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}if((LSKERP.user().role||'').toLowerCase()!=='super_admin'){document.body.innerHTML='<main class="wrap"><section class="panel"><h2>Access denied</h2></section></main>';return}const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[c]));async function load(){const d=await LSKERP.request('/api/platform/schools');const a=d.schools||[];$('total').textContent=a.length;$('active').textContent=a.filter(x=>x.status==='active').length;$('apps').textContent=a.filter(x=>x.app_slug).length;$('rows').innerHTML=a.map(x=>`<tr><td>${esc(x.display_name||x.name)}</td><td>${esc(x.code)}</td><td>${esc(x.app_name||'-')}<br><small>${esc(x.app_slug||'')}</small></td><td>${esc(x.branch_name||'-')} (${esc(x.branch_code||'-')})</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="5">No schools yet</td></tr>'}$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Creating...';try{await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify({name:$('name').value,code:$('code').value,appSlug:$('appSlug').value,displayName:$('displayName').value,address:$('address').value,phone:$('phone').value,supportEmail:$('supportEmail').value,logoUrl:$('logoUrl').value,primaryColor:$('primaryColor').value,secondaryColor:$('secondaryColor').value,branchName:$('branchName').value,branchCode:$('branchCode').value,androidPackage:$('androidPackage').value,minAppVersion:$('minAppVersion').value})});$('msg').className='ok';$('msg').textContent='School created successfully';$('form').reset();$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';$('branchName').value='Main Branch';$('branchCode').value='MAIN';$('minAppVersion').value='1.0.0';load()}catch(e){$('msg').className='err';$('msg').textContent=e.message}};load().catch(e=>{$('msg').className='err';$('msg').textContent=e.message})})()</script></body></html>
