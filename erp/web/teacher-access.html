<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Access</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}select{width:100%;padding:10px;border:1px solid #d9dee8;border-radius:8px;background:#fff}.btn{padding:10px 14px;border:0;border-radius:9px;background:#172b55;color:#fff;font-weight:700;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}.muted{color:#667085;font-size:12px}.msg{font-size:13px;margin-top:10px}.err{color:#b42318}.ok{color:#087443}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Teacher Access Control</h1><p class="muted">Assign exactly which class, section and subject a teacher can view and edit marks for.</p><section class="panel"><form id="f"><div class="grid"><div><label>Teacher</label><select id="teacher" required></select></div><div><label>Academic Session</label><select id="session" required></select></div><div><label>Class</label><select id="class" required></select></div><div><label>Section</label><select id="section" required></select></div><div><label>Subject</label><select id="subject" required></select></div><div><label>Branch</label><select id="branch"><option value="">School / all branches</option></select></div></div><p><label><input id="edit" type="checkbox" checked> Allow marks editing</label></p><button class="btn">Save Permission</button><div id="msg" class="msg"></div></form></section><section class="panel"><h2>Current Assignments</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Teacher</th><th>Class</th><th>Section</th><th>Subject</th><th>Session</th><th>Branch</th><th>Marks</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script src="/erp/web/api.js"></script><script>(async()=>{const u=LSKERP.user(),role=(u.role||'').toLowerCase();if(!LSKERP.token()||!['super_admin','principal','admin'].includes(role)){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));let structure={};async function load(){const [t,p,a,b]=await Promise.all([LSKERP.request('/api/teachers'),LSKERP.request('/api/teacher-permissions'),LSKERP.request('/api/academic-structure'),LSKERP.request('/api/branches')]);structure=a; $('teacher').innerHTML=(t.teachers||[]).map(x=>`<option value="${x.userId||x.user_id||x.id}">${esc(x.fullName)}${x.employeeCode?' ('+esc(x.employeeCode)+')':''}</option>`).join('');$('session').innerHTML=(a.sessions||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('class').innerHTML=(a.classes||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('subject').innerHTML=(a.subjects||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('branch').innerHTML='<option value="">School / all branches</option>'+(b.branches||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');renderSections();$('class').onchange=renderSections;$('rows').innerHTML=(p.permissions||[]).map(x=>`<tr><td>${esc(x.fullName||x.email)}</td><td>${esc(x.className)}</td><td>${esc(x.sectionName)}</td><td>${esc(x.subjectName)}</td><td>${esc(x.sessionName)}</td><td>${esc(x.branchName||'All')}</td><td>${x.canEditMarks?'Yes':'No'}</td><td><button class="btn" onclick="removePermission('${x.id}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">No assignments.</td></tr>'}function renderSections(){const cid=$('class').value;$('section').innerHTML=(structure.sections||[]).filter(x=>x.classId===cid).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}window.removePermission=async id=>{if(!confirm('Remove this teacher permission?'))return;try{await LSKERP.request('/api/teacher-permissions/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}};$('f').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Saving…';try{await LSKERP.request('/api/teacher-permissions',{method:'POST',body:JSON.stringify({teacherUserId:$('teacher').value,classId:$('class').value,sectionId:$('section').value,subjectId:$('subject').value,sessionId:$('session').value,branchId:$('branch').value||null,canView:true,canEditMarks:$('edit').checked})});$('msg').textContent='Permission saved.';$('msg').className='msg ok';await load()}catch(err){$('msg').textContent=err.message||'Could not save permission';$('msg').className='msg err'}};await load()})()</script></body></html>
