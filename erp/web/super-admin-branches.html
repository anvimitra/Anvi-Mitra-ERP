<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Branches</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb;--brand:#5b5bd6;--line:#e4e8f0;--muted:#667085}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h1{margin:0}.pill{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 35px #10162d0b}.list{display:grid;gap:10px}.branch{display:flex;align-items:center;gap:14px;border:1px solid #e7eaf0;border-radius:13px;padding:14px;transition:.2s}.branch:hover{transform:translateY(-2px);box-shadow:0 8px 22px #10162d0d}.icon{width:46px;height:46px;border-radius:12px;background:#eef0ff;color:var(--brand);display:grid;place-items:center;font-weight:900}.meta{color:var(--muted);font-size:12px;margin-top:4px}.badge{margin-left:auto;padding:5px 9px;border-radius:999px;background:#eefbf4;color:#087443;font-size:11px;font-weight:750}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #d9dee8;border-radius:9px;font:inherit}.full{grid-column:1/-1}button{padding:11px 14px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#fff;color:#172033;border:1px solid #d9dee8}.msg{font-size:12px;margin-top:10px}.ok{color:#087443}.err{color:#b42318}@media(max-width:650px){.wrap{padding:14px}.form{grid-template-columns:1fr}.full{grid-column:auto}.badge{display:none}}</style></head><body><main class="wrap"><div class="head"><div><h1 id="title">Branch Management</h1><div id="school" class="meta">Loading school…</div></div><div><span class="pill">Super Admin</span> <button class="secondary" onclick="location.href='/erp/web/super-admin-schools.html'">← Schools</button></div></div><section class="panel"><h2 style="margin-top:0">Branches</h2><div id="list" class="list">Loading…</div><form id="form" class="form"><div class="field"><label>Branch name *</label><input id="name" required></div><div class="field"><label>Branch code *</label><input id="code" required></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field full"><label>Address</label><input id="address"></div><div class="full"><button id="save">Add branch</button><div id="msg" class="msg"></div></div></form></section></main><script src="/erp/web/api.js"></script><script>(async()=>{const u=LSKERP.user();if(!LSKERP.token()||u.role!=='super_admin'){location.replace('/erp/web/login.html');return}const p=new URLSearchParams(location.search),schoolId=p.get('schoolId');if(!schoolId){location.replace('/erp/web/super-admin-schools.html');return}const $=id=>document.getElementById(id);let branches=[];async function load(){try{const d=await LSKERP.request('/api/platform/schools/'+encodeURIComponent(schoolId));$('school').textContent=(d.school.displayName||d.school.name)+' • '+d.school.code;branches=d.branches||[];$('list').innerHTML=branches.length?branches.map(b=>'<article class="branch"><div class="icon">'+String(b.code||'BR').slice(0,2)+'</div><div><b>'+esc(b.name)+'</b><div class="meta">'+esc(b.code)+' • '+esc(b.address||'No address')+' • '+esc(b.phone||b.email||'No contact')+'</div></div><span class="badge">'+esc(b.status||'active')+'</span></article>').join(''):'<div class="meta">No branches yet.</div>'}catch(e){$('list').textContent=e.message||'Could not load branches'}}async function add(e){e.preventDefault();$('save').disabled=true;$('msg').textContent='Saving…';$('msg').className='msg';try{await LSKERP.request('/api/platform/schools/'+encodeURIComponent(schoolId)+'/branches',{method:'POST',body:JSON.stringify({schoolId,name:$('name').value.trim(),code:$('code').value.trim(),phone:$('phone').value.trim()||null,email:$('email').value.trim()||null,address:$('address').value.trim()||null})});e.target.reset();$('msg').textContent='Branch added';$('msg').className='msg ok';await load()}catch(err){$('msg').textContent=err.message||'Could not add branch';$('msg').className='msg err'}finally{$('save').disabled=false}}function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}$('form').onsubmit=add;load()})();</script></body></html>
