<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Attendance</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--brand:#5b5bd6;--line:#e4e8f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.top h1{margin:0;font-size:25px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;cursor:pointer}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{font-size:11px;color:#667085;display:block;margin-bottom:5px}input,select{width:100%;padding:10px;border:1px solid #d9deea;border-radius:9px;background:#fff}.actions{display:flex;gap:8px;align-items:end}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.pill{background:#f7f8fc;border:1px solid var(--line);padding:9px 12px;border-radius:10px;font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.table th{font-size:11px;color:#667085}.status{padding:6px;border-radius:8px;border:1px solid #d9deea;background:white}.save{margin-top:12px}.report{margin-top:8px}.msg{font-size:13px;margin-top:10px}.ok{color:#087443}.err{color:#b42318}.empty{text-align:center;color:#667085;padding:25px}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.table{display:block;overflow:auto;white-space:nowrap}}@media(max-width:520px){.filters{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>Attendance</h1><div style="color:#667085;font-size:13px">Daily attendance • session, section & branch scoped</div></div><div><button class="btn report" onclick="location.href='/erp/web/attendance-report.html'">Attendance Report</button> <button class="btn" onclick="location.href='/erp/web/portal-dashboard.html'">← Dashboard</button></div></div><section class="panel"><div class="filters"><div><label>DATE</label><input id="date" type="date"></div><div><label>ACADEMIC SESSION</label><select id="session"><option value="">Current session</option></select></div><div><label>SECTION</label><select id="section"><option value="">All sections</option></select></div><div class="actions"><button class="btn primary" onclick="loadStudents()">Load Students</button></div></div><div class="summary"><div class="pill">Students: <b id="count">0</b></div><div class="pill">Present: <b id="present">0</b></div><div class="pill">Absent: <b id="absent">0</b></div><div class="pill">Late: <b id="late">0</b></div><div class="pill">Marked: <b id="marked">0</b></div></div></section><section class="panel"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><b>Daily Attendance</b><div><button class="btn" onclick="setAll('present')">Mark All Present</button> <button class="btn" onclick="setAll('absent')">Mark All Absent</button></div></div><div id="msg" class="msg"></div><table class="table"><thead><tr><th>STUDENT</th><th>ADMISSION NO</th><th>CLASS / SECTION</th><th>STATUS</th><th>NOTE</th></tr></thead><tbody id="body"><tr><td colspan="5" class="empty">Select a date and load students.</td></tr></tbody></table><button class="btn primary save" onclick="save()">Save Attendance</button></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id);const today=new Date();$('date').value=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);let students=[];async function init(){try{const a=await LSKERP.request('/api/academic-sessions');$('session').innerHTML='<option value="">Current session</option>'+((a.sessions||a.academicSessions||[]).map(s=>`<option value="${s.id}">${esc(s.name||s.sessionName||s.id)}</option>`).join(''));await loadSections()}catch(e){setMsg(e.message||'Could not load setup data',true)}}async function loadSections(){try{const q=$('session').value?'?sessionId='+encodeURIComponent($('session').value):'';const d=await LSKERP.request('/api/attendance/sections'+q);$('section').innerHTML='<option value="">All sections</option>'+(d.sections||[]).map(s=>`<option value="${s.sectionId}">${esc(s.className)} • ${esc(s.sectionName)} (${s.studentCount})</option>`).join('')}catch(e){setMsg(e.message||'Could not load sections',true)}}$('session').onchange=loadSections;async function loadStudents(){try{if(!$('date').value)throw new Error('Please select attendance date');setMsg('Loading…');const q=new URLSearchParams({date:$('date').value});if($('session').value)q.set('sessionId',$('session').value);if($('section').value)q.set('sectionId',$('section').value);const d=await LSKERP.request('/api/attendance/roster?'+q.toString());students=(d.roster||[]).map(s=>({...s,status:s.status||'present',note:s.note||''}));render();setMsg(students.length?'Roster loaded.':'No active students found for this section/session.',!students.length)}catch(e){students=[];render();setMsg(e.message||'Could not load students',true)}}function render(){const body=$('body');if(!students.length){body.innerHTML='<tr><td colspan="5" class="empty">No students found.</td></tr>';updateCounts();return}body.innerHTML=students.map((s,i)=>`<tr><td><b>${esc(s.fullName||'—')}</b></td><td>${esc(s.admissionNo||'—')}</td><td>${esc(s.className||'')} / ${esc(s.sectionName||'')}</td><td><select class="status" onchange="students[${i}].status=this.value"><option value="present" ${s.status==='present'?'selected':''}>Present</option><option value="absent" ${s.status==='absent'?'selected':''}>Absent</option><option value="late" ${s.status==='late'?'selected':''}>Late</option><option value="half_day" ${s.status==='half_day'?'selected':''}>Half Day</option><option value="leave" ${s.status==='leave'?'selected':''}>Leave</option></select></td><td><input value="${esc(s.note||'')}" onchange="students[${i}].note=this.value" placeholder="Optional note"></td></tr>`).join('');updateCounts()}function setAll(status){students.forEach(s=>s.status=status);render()}function updateCounts(){$('count').textContent=students.length;$('present').textContent=students.filter(s=>s.status==='present').length;$('absent').textContent=students.filter(s=>s.status==='absent').length;$('late').textContent=students.filter(s=>s.status==='late').length;$('marked').textContent=students.filter(s=>s.status).length}function setMsg(text,error){$('msg').className='msg '+(error?'err':'ok');$('msg').textContent=text}async function save(){try{if(!students.length)throw new Error('No students to save');const records=students.map(s=>({studentId:s.id,status:s.status,note:s.note||null}));await LSKERP.request('/api/attendance/bulk',{method:'POST',body:JSON.stringify({date:$('date').value,sessionId:$('session').value||null,records})});setMsg('Attendance saved successfully.');await loadStudents()}catch(e){setMsg(e.message||'Could not save attendance',true)}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.loadStudents=loadStudents;window.setAll=setAll;window.save=save;init()})();</script></body></html>
