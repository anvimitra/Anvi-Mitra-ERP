<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Attendance</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--brand:#5b5bd6;--line:#e4e8f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.top h1{margin:0;font-size:25px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;cursor:pointer}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{font-size:11px;color:#667085;display:block;margin-bottom:5px}input,select{width:100%;padding:10px;border:1px solid #d9deea;border-radius:9px;background:#fff}.actions{display:flex;gap:8px;align-items:end}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.pill{background:#f7f8fc;border:1px solid var(--line);padding:9px 12px;border-radius:10px;font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.table th{font-size:11px;color:#667085}.status{padding:6px;border-radius:8px;border:1px solid #d9deea;background:white}.save{margin-top:12px}.msg{font-size:13px;margin-top:10px}.ok{color:#087443}.err{color:#b42318}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.table{display:block;overflow:auto;white-space:nowrap}}@media(max-width:520px){.filters{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>Attendance</h1><div style="color:#667085;font-size:13px">Teacher-friendly daily attendance • branch & session scoped</div></div><button class="btn" onclick="location.href='/erp/web/portal-dashboard.html'">← Dashboard</button></div><section class="panel"><div class="filters"><div><label>DATE</label><input id="date" type="date"></div><div><label>ACADEMIC SESSION</label><select id="session"><option value="">Current session</option></select></div><div><label>SECTION</label><select id="section"><option value="">All sections</option></select></div><div class="actions"><button class="btn primary" onclick="loadStudents()">Load Students</button></div></div><div class="summary"><div class="pill">Students: <b id="count">0</b></div><div class="pill">Present: <b id="present">0</b></div><div class="pill">Absent: <b id="absent">0</b></div><div class="pill">Marked: <b id="marked">0</b></div></div></section><section class="panel"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><b>Daily Attendance</b><div><button class="btn" onclick="setAll('present')">Mark All Present</button> <button class="btn" onclick="setAll('absent')">Mark All Absent</button></div></div><div id="msg" class="msg"></div><table class="table"><thead><tr><th>STUDENT</th><th>ADMISSION NO</th><th>CLASS / SECTION</th><th>STATUS</th><th>NOTE</th></tr></thead><tbody id="body"><tr><td colspan="5" style="color:#667085">Select a date and load students.</td></tr></tbody></table><button class="btn primary save" onclick="save()">Save Attendance</button></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id);const today=new Date();$('date').value=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);let students=[];let existing={};async function init(){try{const a=await LSKERP.request('/api/academic-sessions');$('session').innerHTML='<option value="">Current session</option>'+((a.sessions||a.academicSessions||[]).map(s=>`<option value="${s.id}">${s.name||s.sessionName||s.id}</option>`).join(''));const d=await LSKERP.request('/api/attendance/sections');$('section').innerHTML='<option value="">All sections</option>'+(d.sections||[]).map(s=>`<option value="${s.sectionId}">${s.className} • ${s.sectionName} (${s.studentCount})</option>`).join('')}catch(e){$('msg').className='msg err';$('msg').textContent=e.message||'Could not load setup data'}}async function loadStudents(){try{$('msg').className='msg';$('msg').textContent='Loading…';const q=new URLSearchParams({date:$('date').value});if($('session').value)q.set('sessionId',$('session').value);if($('section').value)q.set('sectionId',$('section').value);const d=await LSKERP.request('/api/attendance?'+q.toString());const rows=d.attendance||[];existing={};rows.forEach(r=>existing[r.studentId]=r);const sec=$('section').value;const sectionRows=sec?await LSKERP.request('/api/attendance/sections?sessionId='+encodeURIComponent($('session').value||'')):null;let all=[];if(sec){const ed=await LSKERP.request('/api/students');all=(ed.students||[]).filter(s=>String(s.sectionId||'')===String(sec))}else{const ed=await LSKERP.request('/api/students');all=ed.students||[]}students=all.map(s=>({...s,status:existing[s.id]?.status||'present',note:existing[s.id]?.note||''}));render();$('msg').className='msg ok';$('msg').textContent=rows.length?'Existing attendance loaded; edit and save as needed.':'No attendance marked yet for this date.'}catch(e){$('msg').className='msg err';$('msg').textContent=e.message||'Could not load students'}}function render(){const body=$('body');body.innerHTML=students.map((s,i)=>`<tr><td><b>${esc(s.fullName||s.full_name||'—')}</b></td><td>${esc(s.admissionNo||s.admission_no||'—')}</td><td>${esc(s.className||'')} ${s.sectionName?' / '+esc(s.sectionName):''}</td><td><select class="status" onchange="students[${i}].status=this.value"><option value="present" ${s.status==='present'?'selected':''}>Present</option><option value="absent" ${s.status==='absent'?'selected':''}>Absent</option><option value="late" ${s.status==='late'?'selected':''}>Late</option><option value="half_day" ${s.status==='half_day'?'selected':''}>Half Day</option><option value="leave" ${s.status==='leave'?'selected':''}>Leave</option></select></td><td><input value="${esc(s.note||'')}" onchange="students[${i}].note=this.value" placeholder="Optional note"></td></tr>`).join('');updateCounts()}function setAll(status){students.forEach(s=>s.status=status);render()}function updateCounts(){$('count').textContent=students.length;$('present').textContent=students.filter(s=>s.status==='present').length;$('absent').textContent=students.filter(s=>s.status==='absent').length;$('marked').textContent=students.filter(s=>s.status).length}async function save(){try{if(!students.length)return;const records=students.map(s=>({studentId:s.id,status:s.status,note:s.note||null}));await LSKERP.request('/api/attendance/bulk',{method:'POST',body:JSON.stringify({date:$('date').value,sessionId:$('session').value||null,records})});$('msg').className='msg ok';$('msg').textContent='Attendance saved successfully.';await loadStudents()}catch(e){$('msg').className='msg err';$('msg').textContent=e.message||'Could not save attendance'}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.loadStudents=loadStudents;window.setAll=setAll;window.save=save;init()})();</script></body></html>
