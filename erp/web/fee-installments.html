<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fee Installments - Anvi Mitra ERP</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #0001}input,select,button{padding:10px;margin:5px;border:1px solid #ccd3df;border-radius:8px}button{cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}.msg{padding:10px}</style></head><body><div class="wrap"><h1>Fee Assignment & Installments</h1><p>Student fee assignment → installment → invoice automation.</p><div class="card"><h3>Generate Installments</h3><input id="session" placeholder="Session UUID"><input id="student" placeholder="Student UUID (optional)"><input id="from" type="date"><input id="to" type="date"><button onclick="generate()">Generate</button></div><div class="card"><h3>Convert Due Installments to Invoice</h3><input id="invoiceSession" placeholder="Session UUID"><input id="invoiceStudent" placeholder="Student UUID (optional)"><input id="invoiceFrom" type="date"><input id="invoiceTo" type="date"><input id="invoiceDue" type="date"><button onclick="invoice()">Generate Invoice</button><div id="result" class="msg"></div></div><div class="card"><h3>Installment List</h3><button onclick="load()">Refresh</button><table><thead><tr><th>Student</th><th>Fee</th><th>Period</th><th>Due</th><th>Amount</th><th>Paid</th><th>Status</th><th>Invoice</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const token=localStorage.getItem('lskerp_token')||localStorage.getItem('token');async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function generate(){try{const d=await api('/api/fees/installments/generate',{method:'POST',body:JSON.stringify({sessionId:session.value,studentId:student.value||null,fromDate:from.value,toDate:to.value})});alert(`Generated ${d.generated} installments`);load()}catch(e){alert(e.message)}}async function invoice(){try{const d=await api('/api/fees/installments/invoice',{method:'POST',body:JSON.stringify({sessionId:invoiceSession.value,studentId:invoiceStudent.value||null,fromDate:invoiceFrom.value||null,toDate:invoiceTo.value||null,dueDate:invoiceDue.value||null})});result.textContent=`Created ${d.count} invoice(s), total ₹${Number(d.totalAmount).toFixed(2)}. `+(d.invoices||[]).map(x=>x.invoiceNo).join(', ')}catch(e){result.textContent=e.message}}async function load(){try{const s=invoiceSession.value||session.value;const d=await api('/api/fees/installments'+(s?'?sessionId='+encodeURIComponent(s):''));rows.innerHTML=(d.installments||[]).map(x=>`<tr><td>${x.studentName||''}<br><small>${x.admissionNo||''}</small></td><td>${x.feeHeadName||''}</td><td>${x.periodStart} → ${x.periodEnd}</td><td>${x.dueDate}</td><td>₹${Number(x.amount).toFixed(2)}</td><td>₹${Number(x.paidAmount||0).toFixed(2)}</td><td>${x.status}</td><td>${x.invoiceId||'-'}</td></tr>`).join('')}catch(e){alert(e.message)}}load()</script></body></html>
