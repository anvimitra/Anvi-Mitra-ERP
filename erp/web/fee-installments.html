<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fee Installments - Anvi Mitra ERP</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1150px;margin:auto;padding:24px}.card{background:#fff;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #0001}input,select,button{padding:10px;margin:5px;border:1px solid #ccd3df;border-radius:8px}button{cursor:pointer}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.table-wrap{overflow:auto}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.pill{background:#f1f4f9;padding:10px 14px;border-radius:10px}.paid{color:#087443;font-weight:600}.due{color:#a15c00;font-weight:600}.muted{color:#667085}.msg{padding:10px}.error{color:#b42318}</style></head><body><div class="wrap"><h1>Fee Assignment & Installments</h1><p class="muted">Student fee assignment → installment → invoice → payment allocation.</p><div class="card"><h3>Generate Installments</h3><input id="session" placeholder="Session UUID"><input id="student" placeholder="Student UUID (optional)"><input id="from" type="date"><input id="to" type="date"><button onclick="generate()">Generate</button></div><div class="card"><h3>Convert Due Installments to Invoice</h3><input id="invoiceSession" placeholder="Session UUID"><input id="invoiceStudent" placeholder="Student UUID (optional)"><input id="invoiceFrom" type="date"><input id="invoiceTo" type="date"><input id="invoiceDue" type="date"><button onclick="invoice()">Generate Invoice</button><div id="result" class="msg"></div></div><div class="card"><h3>Installment List</h3><button onclick="load()">Refresh</button><div id="summary" class="summary"></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Fee</th><th>Period</th><th>Due</th><th>Amount</th><th>Paid</th><th>Remaining</th><th>Status</th><th>Invoice</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>const token=localStorage.getItem('lskerp_token')||localStorage.getItem('token');async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function money(v){return '₹'+Number(v||0).toFixed(2)}async function generate(){try{const d=await api('/api/fees/installments/generate',{method:'POST',body:JSON.stringify({sessionId:session.value,studentId:student.value||null,fromDate:from.value,toDate:to.value})});alert(`Generated ${d.generated} installments`);load()}catch(e){alert(e.message)}}async function invoice(){try{const d=await api('/api/fees/installments/invoice',{method:'POST',body:JSON.stringify({sessionId:invoiceSession.value,studentId:invoiceStudent.value||null,fromDate:invoiceFrom.value||null,toDate:invoiceTo.value||null,dueDate:invoiceDue.value||null})});result.textContent=`Created ${d.count} invoice(s), total ${money(d.totalAmount)}. `+(d.invoices||[]).map(x=>x.invoiceNo).join(', ');load()}catch(e){result.textContent=e.message;result.className='msg error'}}async function load(){try{const s=invoiceSession.value||session.value;const d=await api('/api/fees/installments'+(s?'?sessionId='+encodeURIComponent(s):''));const list=d.installments||[];const totalAmount=list.reduce((a,x)=>a+Number(x.amount||0),0);const totalPaid=list.reduce((a,x)=>a+Number(x.paidAmount||0),0);const totalRemaining=list.reduce((a,x)=>a+Number(x.remainingAmount||0),0);summary.innerHTML=`<div class="pill">Installments <b>${list.length}</b></div><div class="pill">Amount <b>${money(totalAmount)}</b></div><div class="pill paid">Paid <b>${money(totalPaid)}</b></div><div class="pill due">Remaining <b>${money(totalRemaining)}</b></div>`;rows.innerHTML=list.map(x=>{const paid=Number(x.paidAmount||0),remaining=Number(x.remainingAmount||0);return `<tr><td>${esc(x.studentName)}<br><small>${esc(x.admissionNo)}</small></td><td>${esc(x.feeHeadName)}</td><td>${esc(x.periodStart)} → ${esc(x.periodEnd)}</td><td>${esc(x.dueDate)}</td><td>${money(x.amount)}</td><td class="paid">${money(paid)}</td><td class="${remaining?'due':'paid'}">${money(remaining)}</td><td>${esc(x.status)}</td><td>${x.invoiceId?esc(x.invoiceId):'-'}</td></tr>`}).join('')||'<tr><td colspan="9" class="muted">No installments found.</td></tr>'}catch(e){alert(e.message)}}load()</script></body></html>
