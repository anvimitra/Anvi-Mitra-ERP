<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LSK ERP — Students</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h1{margin:0;font-size:24px}.back{padding:9px 12px;border:1px solid #d9dee8;border-radius:9px;background:#fff;text-decoration:none;color:#172033}.tools{display:flex;gap:10px;margin-bottom:14px}.tools input,.tools select{flex:1;padding:11px;border:1px solid #d9dee8;border-radius:9px;background:white}.table{background:#fff;border:1px solid #e2e7ef;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid #edf0f4;font-size:14px}th{font-size:12px;color:#667085;text-transform:uppercase}tr:last-child td{border-bottom:0}.muted{color:#667085;font-size:13px}.msg{padding:22px;color:#667085}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f8;font-size:12px}</style></head><body><main class="wrap"><div class="head"><h1>Students</h1><a class="back" href="/erp/web/portal-dashboard.html">← Dashboard</a></div><div class="tools"><input id="search" placeholder="Search name or admission number"><select id="class"><option value="">All classes</option></select></div><div class="table"><table><thead><tr><th>Admission No.</th><th>Student</th><th>Class</th><th>Section</th><th>Roll No.</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="msg">Loading…</td></tr></tbody></table></div></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const rows=document.getElementById('rows');let students=[];try{const d=await LSKERP.request('/api/students');students=d.students||d.data||[];render()}catch(e){rows.innerHTML=`<tr><td colspan="6" class="msg">${e.message}</td></tr>`}function render(){const q=document.getElementById('search').value.trim().toLowerCase();const filtered=students.filter(s=>!q||String(s.fullName||s.full_name||'').toLowerCase().includes(q)||String(s.admissionNo||s.admission_no||'').toLowerCase().includes(q));if(!filtered.length){rows.innerHTML='<tr><td colspan="6" class="msg">No students found</td></tr>';return}rows.innerHTML=filtered.map(s=>`<tr><td>${s.admissionNo||s.admission_no||'—'}</td><td><b>${s.fullName||s.full_name||'—'}</b></td><td>${s.className||s.class_name||'—'}</td><td>${s.sectionName||s.section_name||'—'}</td><td>${s.rollNo||s.roll_no||'—'}</td><td><span class="badge">${s.status||'active'}</span></td></tr>`).join('')}document.getElementById('search').addEventListener('input',render)})();</script></body></html>
