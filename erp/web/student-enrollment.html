<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP — Student Enrollment</title><style>:root{font-family:system-ui,sans-serif;color:#eef6ff;background:#07111f;--a:#55d6be;--line:#25435f;--muted:#9eb2c9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#16385b,#07111f 50%)}main{width:min(1200px,94vw);margin:auto;padding:28px 0 50px}.top{display:flex;justify-content:space-between;align-items:center}.ey{font-size:11px;color:var(--a);font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:5px 0}.muted{color:var(--muted)}.panel{margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#10233a,#0b1727);box-shadow:0 24px 70px #0008}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.input{width:100%;padding:12px;border-radius:10px;border:1px solid #29445f;background:#081625;color:#fff}.btn{padding:12px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:var(--a);color:#03201a}.list{display:grid;gap:9px;margin-top:16px}.item{padding:14px;border:1px solid #1d3854;border-radius:14px;background:#0a192a;display:flex;justify-content:space-between}.msg{min-height:20px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}</style></head><body><main><header class="top"><div><div class="ey">School Administration</div><h1>Student Enrollment</h1><div class="muted">Enroll students into the correct session, class and section.</div></div><button class="btn primary" onclick="location.href='/erp/web/portal-dashboard.html'">Back to ERP</button></header><section class="panel"><h2>Enroll Student</h2><form id="form"><div class="grid"><div><label>Admission No. *</label><input class="input" name="admissionNo" required></div><div><label>Full Name *</label><input class="input" name="fullName" required></div><div><label>Date of Birth</label><input class="input" name="dateOfBirth" type="date"></div><div><label>Gender</label><input class="input" name="gender"></div><div><label>Session *</label><select class="input" name="sessionId" id="session" required></select></div><div><label>Section *</label><select class="input" name="sectionId" id="section" required></select></div><div><label>Roll No.</label><input class="input" name="rollNo"></div><div><label>Photo URL</label><input class="input" name="photoUrl"></div></div><div class="msg" id="msg"></div><button class="btn primary">Save Enrollment</button></form></section><section class="panel"><div style="display:flex;justify-content:space-between;gap:10px"><h2>Enrolled Students</h2><button class="btn primary" onclick="loadStudents()">Refresh</button></div><div class="list" id="list"></div></section></main><script>const token=sessionStorage.getItem('lsk_access_token');if(!token)location.href='/erp/web/login.html';const H={Authorization:'Bearer '+token,'Content-Type':'application/json'};let sections=[];async function masters(){const r=await fetch('/api/enrollment/masters',{headers:H}),d=await r.json();if(!r.ok){document.getElementById('msg').textContent=d.error||'Unable to load masters';return}document.getElementById('session').innerHTML=(d.sessions||[]).map(s=>'<option value="'+s.id+'">'+s.name+(s.isCurrent?' · Current':'')+'</option>').join('');sections=d.sections||[];renderSections()}function renderSections(){const sid=document.getElementById('session').value;document.getElementById('section').innerHTML=sections.filter(s=>!sid||true).map(s=>'<option value="'+s.id+'">'+s.className+' — '+s.name+'</option>').join('')}document.getElementById('session').onchange=renderSections;async function loadStudents(){const r=await fetch('/api/enrollment/students?limit=200',{headers:H}),d=await r.json();if(!r.ok){document.getElementById('list').textContent=d.error||'Unable to load students';return}document.getElementById('list').innerHTML=(d.students||[]).map(s=>'<div class="item"><div><b>'+s.fullName+'</b><div class="muted">'+s.admissionNo+' · '+(s.className||'Unassigned')+' / '+(s.sectionName||'')+'</div></div><span>'+ (s.rollNo||'—') +'</span></div>').join('')||'<div class="muted">No students found.</div>'}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Saving…';const body=Object.fromEntries(new FormData(e.target).entries());const r=await fetch('/api/enrollment/students',{method:'POST',headers:H,body:JSON.stringify(body)}),d=await r.json();msg.textContent=r.ok?'Student enrolled successfully.':(d.error||'Enrollment failed');if(r.ok){e.target.reset();renderSections();loadStudents()}};masters().then(loadStudents);</script></body></html>
