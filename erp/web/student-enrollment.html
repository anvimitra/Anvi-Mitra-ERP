<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Enrollment</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb;--brand:#4f46e5;--line:#e3e7ef;--muted:#667085}*{box-sizing:border-box}body{margin:0}.app{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0}.sub{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1.25fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 12px 35px #10162d0b}.panel h2{margin:0 0 14px;font-size:18px}.form{display:grid;gap:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d8dee8;border-radius:9px;font:inherit;background:#fff}.button{border:0;border-radius:10px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:12px;font-weight:800;cursor:pointer}.button:disabled{opacity:.6}.msg{font-size:12px;min-height:18px}.ok{color:#087443}.err{color:#b42318}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.badge{padding:4px 8px;border-radius:999px;background:#eefbf4;color:#087443;font-size:11px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:40px}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.row{grid-template-columns:1fr}.app{padding:14px}}</style></head><body><main class="app"><div class="top"><div><h1>Student Enrollment</h1><div class="sub">School staff workspace • branch-aware enrollment</div></div><a href="/erp/web/portal-dashboard.html">← Dashboard</a></div><div class="grid"><section class="panel"><h2>Enroll student</h2><form id="form" class="form"><div class="row"><div class="field"><label>Full name *</label><input id="name" required></div><div class="field"><label>Admission no. *</label><input id="admission" required></div></div><div class="row"><div class="field"><label>Academic session *</label><select id="session" required><option value="">Loading…</option></select></div><div class="field"><label>Class & section *</label><select id="section" required><option value="">Loading…</option></select></div></div><div class="row"><div class="field"><label>Roll no.</label><input id="roll"></div><div class="field"><label>Date of birth</label><input id="dob" type="date"></div></div><div class="row"><div class="field"><label>Gender</label><select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Photo URL</label><input id="photo"></div></div><div class="field"><label>Parent account (optional)</label><select id="parent"><option value="">No parent link</option></select></div><button class="button" id="save">Enroll student</button><div id="msg" class="msg"></div></form></section><section class="panel"><h2>Current students</h2><div id="list" class="tableWrap">Loading…</div></section></div></main><script src="/erp/web/api.js"></script><script>(async()=>{const u=LSKERP.user();if(!LSKERP.token()||!['super_admin','principal','admin','office_staff'].includes((u.role||'').toLowerCase())){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id);let masters={};function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function load(){try{masters=await LSKERP.request('/api/enrollment/masters');$('session').innerHTML='<option value="">Select session</option>'+(masters.sessions||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+(x.isCurrent?' (Current)':'')+'</option>').join('');$('section').innerHTML='<option value="">Select class / section</option>'+(masters.sections||[]).map(x=>'<option value="'+x.id+'">'+esc(x.className+' — '+x.name)+'</option>').join('');$('parent').innerHTML='<option value="">No parent link</option>'+(masters.parents||[]).map(x=>'<option value="'+x.userId+'">'+esc(x.fullName)+' '+esc(x.phone||x.email||'')+'</option>').join('');const d=await LSKERP.request('/api/enrollment/students?limit=200');const rows=d.students||[];$('list').innerHTML=rows.length?'<table class="table"><thead><tr><th>Student</th><th>Admission</th><th>Class</th><th>Session</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.fullName)+'</td><td>'+esc(x.admissionNo)+'</td><td>'+esc((x.className||'')+' '+(x.sectionName||''))+'</td><td>'+esc(x.sessionName||'—')+'</td><td><span class="badge">'+esc(x.status||'active')+'</span></td></tr>').join('')+'</tbody></table>':'<div class="empty">No students enrolled yet.</div>'}catch(e){$('list').textContent=e.message||'Unable to load enrollment data'}}$('form').onsubmit=async e=>{e.preventDefault();const b=$('save'),m=$('msg');b.disabled=true;m.textContent='Saving…';m.className='msg';try{const parent=$('parent').value;await LSKERP.request('/api/enrollment/students',{method:'POST',body:JSON.stringify({fullName:$('name').value.trim(),admissionNo:$('admission').value.trim(),sessionId:$('session').value,sectionId:$('section').value,rollNo:$('roll').value.trim()||null,dateOfBirth:$('dob').value||null,gender:$('gender').value||null,photoUrl:$('photo').value.trim()||null,parents:parent?[{userId:parent,relation:'guardian',isPrimary:true}]:[]})});m.textContent='Student enrolled successfully';m.className='msg ok';e.target.reset();await load()}catch(err){m.textContent=err.message||'Enrollment failed';m.className='msg err'}finally{b.disabled=false}};await load()})()</script></body></html>
