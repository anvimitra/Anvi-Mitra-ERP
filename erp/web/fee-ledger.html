<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Fee Ledger</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.top,.actions{display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{justify-content:flex-end;flex-wrap:wrap}.card{background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:16px;margin:14px 0}.search{display:flex;gap:8px}.search input{flex:1}input{padding:11px;border:1px solid #d7dce6;border-radius:9px}.suggestions{display:grid;gap:6px;margin-top:8px}.suggestion{padding:10px;border:1px solid #e3e8f0;border-radius:9px;cursor:pointer;background:#fafbff}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{border:1px solid #e3e8f0;border-radius:11px;padding:13px}.kpi small{display:block;color:#667085}.kpi strong{font-size:21px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px}th{background:#f8f9fc}.btn{padding:10px 13px;border:1px solid #d7dce6;border-radius:9px;background:#5b5bd6;color:white;font-weight:700;cursor:pointer}.ghost{background:white;color:#172033}.msg{color:#667085}.error{color:#b42318}.ok{color:#087443}@media(max-width:750px){.kpis{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}@media print{body{background:#fff}.no-print{display:none!important}.wrap{padding:0}.card{border:0}}
</style></head><body><main class="wrap"><div class="top"><div><h1>Student Fee Ledger</h1><div class="msg">Complete invoice, payment and outstanding balance statement.</div></div><div class="actions no-print"><button class="btn ghost" onclick="location.href='/erp/web/fee-management.html'">← Fees</button><button class="btn ghost" onclick="window.print()">Print / PDF</button></div></div><section class="card no-print"><div class="search"><input id="q" placeholder="Search admission no. or student name" oninput="search()"><button class="btn" onclick="search()">Search</button></div><div id="suggestions" class="suggestions"></div></section><section id="ledger" class="card"><div class="msg">Select a student to view ledger.</div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id);let timer;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.search=()=>{clearTimeout(timer);const q=$('q').value.trim();if(q.length<2){$('suggestions').innerHTML='';return}timer=setTimeout(async()=>{try{const d=await LSKERP.request('/api/students/search?q='+encodeURIComponent(q)+'&limit=8');$('suggestions').innerHTML=(d.students||[]).map(s=>`<div class="suggestion" onclick="loadLedger('${s.id}')"><b>${esc(s.fullName)}</b><br><span>${esc(s.admissionNo||'-')} • ${esc(s.branchName||'')}</span></div>`).join('')||'<div class="msg">No student found.</div>'}catch(e){$('suggestions').innerHTML='<div class="error">'+esc(e.message)+'</div>'}},250)};window.loadLedger=async id=>{try{$('suggestions').innerHTML='';const s=await LSKERP.request('/api/students/'+encodeURIComponent(id));const f=await LSKERP.request('/api/fees/student/'+encodeURIComponent(id));const invoices=f.invoices||[];let paid=0,net=0;invoices.forEach(x=>{paid+=Number(x.paidAmount||0);net+=Number(x.netAmount||0)});const balance=Number(f.totalBalance||0);$('ledger').innerHTML=`<h2>${esc(s.student.fullName)}</h2><div class="msg">Admission: ${esc(s.student.admissionNo||'-')} • Status: ${esc(s.student.status||'')}</div><div class="kpis"><div class="kpi"><small>Total Invoiced</small><strong>₹${net.toFixed(2)}</strong></div><div class="kpi"><small>Total Paid</small><strong>₹${paid.toFixed(2)}</strong></div><div class="kpi"><small>Outstanding</small><strong>₹${balance.toFixed(2)}</strong></div><div class="kpi"><small>Invoices</small><strong>${invoices.length}</strong></div></div><div class="table"><table><thead><tr><th>Invoice</th><th>Date</th><th>Due</th><th>Status</th><th>Net</th><th>Paid</th><th>Balance</th></tr></thead><tbody>${invoices.map(x=>`<tr><td>${esc(x.invoiceNo)}</td><td>${x.invoiceDate?new Date(x.invoiceDate).toLocaleDateString():'-'}</td><td>${esc(x.dueDate||'-')}</td><td>${esc(x.status)}</td><td>₹${Number(x.netAmount||0).toFixed(2)}</td><td>₹${Number(x.paidAmount||0).toFixed(2)}</td><td>₹${Number(x.balanceAmount||0).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan="7">No invoices found.</td></tr>'}</tbody></table></div>`}catch(e){$('ledger').innerHTML='<div class="error">'+esc(e.message||'Could not load fee ledger')+'</div>'}}})();</script></body></html>
