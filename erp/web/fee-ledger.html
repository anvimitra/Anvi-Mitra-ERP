<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Fee Ledger</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.top,.actions,.search{display:flex;gap:10px;align-items:center}.top{justify-content:space-between}.actions{flex-wrap:wrap}.card{background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:16px;margin:14px 0}input{padding:11px;border:1px solid #d7dce6;border-radius:9px}.search input{flex:1}.suggestions{display:grid;gap:6px;margin-top:8px}.suggestion{padding:10px;border:1px solid #e3e8f0;border-radius:9px;cursor:pointer;background:#fafbff}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{border:1px solid #e3e8f0;border-radius:11px;padding:13px}.kpi small{display:block;color:#667085}.kpi strong{font-size:21px}.table{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:750px}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px;white-space:nowrap}th{background:#f8f9fc}.btn{padding:10px 13px;border:1px solid #d7dce6;border-radius:9px;background:#5b5bd6;color:white;font-weight:700;cursor:pointer}.ghost{background:white;color:#172033}.msg{color:#667085}.error{color:#b42318}.link{color:#4b4bc5;font-weight:700;cursor:pointer}@media(max-width:750px){.kpis{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}@media print{body{background:#fff}.no-print{display:none!important}.wrap{padding:0}.card{border:0}}</style></head><body><main class="wrap"><div class="top"><div><h1>Student Fee Ledger</h1><div class="msg">Invoices • payments • outstanding balance • receipt history</div></div><div class="actions no-print"><button class="btn ghost" onclick="location.href='/erp/web/fee-management.html'">← Fees</button><button class="btn ghost" onclick="window.print()">Print / PDF</button></div></div><section class="card no-print"><div class="search"><input id="q" placeholder="Search admission no. or student name" oninput="search()"><button class="btn" onclick="search()">Search</button></div><div id="suggestions" class="suggestions"></div></section><section id="ledger" class="card"><div class="msg">Select a student to view ledger.</div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(!['super_admin','principal','admin','accountant','office_staff'].includes(role)){document.body.innerHTML='<main class="wrap"><h2>Access denied</h2><p>Fee ledger is available to finance staff only.</p></main>';return}const $=id=>document.getElementById(id);let timer;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));window.search=()=>{clearTimeout(timer);const q=$('q').value.trim();if(q.length<2){$('suggestions').innerHTML='';return}timer=setTimeout(async()=>{try{const d=await LSKERP.request('/api/students/search?q='+encodeURIComponent(q)+'&limit=8');$('suggestions').innerHTML=(d.students||[]).map(s=>`<div class="suggestion" onclick="loadLedger('${s.id}')"><b>${esc(s.fullName)}</b><br><span>${esc(s.admissionNo||'-')} • ${esc(s.branchName||'')}</span></div>`).join('')||'<div class="msg">No student found.</div>'}catch(e){$('suggestions').innerHTML='<div class="error">'+esc(e.message)+'</div>'}},250)};window.loadLedger=async id=>{try{$('suggestions').innerHTML='';const d=await LSKERP.request('/api/fees/student/'+encodeURIComponent(id)+'/ledger');const s=d.student,invoices=d.invoices||[],payments=d.payments||[],sum=d.summary||{};$('ledger').innerHTML=`<h2>${esc(s.fullName)}</h2><div class="msg">Admission: ${esc(s.admissionNo||'-')} • Status: ${esc(s.status||'-')} • Branch: ${esc(s.branchName||'-')}</div><div class="kpis"><div class="kpi"><small>Total Invoiced</small><strong>₹${Number(sum.totalInvoiced||0).toFixed(2)}</strong></div><div class="kpi"><small>Total Paid</small><strong>₹${Number(sum.totalPaid||0).toFixed(2)}</strong></div><div class="kpi"><small>Outstanding</small><strong>₹${Number(sum.balance||0).toFixed(2)}</strong></div><div class="kpi"><small>Payments</small><strong>${payments.length}</strong></div></div><h3>Invoice Ledger</h3><div class="table"><table><thead><tr><th>Invoice</th><th>Date</th><th>Due</th><th>Status</th><th>Net</th><th>Paid</th><th>Balance</th></tr></thead><tbody>${invoices.map(x=>`<tr><td>${esc(x.invoiceNo)}</td><td>${x.invoiceDate?new Date(x.invoiceDate).toLocaleDateString():'-'}</td><td>${esc(x.dueDate||'-')}</td><td>${esc(x.status)}</td><td>₹${Number(x.netAmount||0).toFixed(2)}</td><td>₹${Number(x.paidAmount||0).toFixed(2)}</td><td>₹${Number(x.balanceAmount||0).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan="7">No invoices found.</td></tr>'}</tbody></table></div><h3>Payment History</h3><div class="table"><table><thead><tr><th>Receipt</th><th>Date</th><th>Invoice</th><th>Amount</th><th>Method</th><th>Transaction Ref</th><th>Action</th></tr></thead><tbody>${payments.map(p=>`<tr><td><b>${esc(p.receiptNo)}</b></td><td>${p.paidOn?new Date(p.paidOn).toLocaleString():'-'}</td><td>${esc(p.invoiceNo||'-')}</td><td>₹${Number(p.amount||0).toFixed(2)}</td><td>${esc(p.method||'-')}</td><td>${esc(p.transactionRef||'-')}</td><td><span class="link" onclick="window.open('/erp/web/fee-receipt.html?receiptNo='+encodeURIComponent('${esc(p.receiptNo)}'),'_blank')">Print Receipt</span></td></tr>`).join('')||'<tr><td colspan="7">No payments found.</td></tr>'}</tbody></table></div>`}catch(e){$('ledger').innerHTML='<div class="error">'+esc(e.message||'Could not load fee ledger')+'</div>'}}})();</script></body></html>
