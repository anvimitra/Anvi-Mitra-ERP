<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LSK ERP — Student Profile</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:0}.btn{padding:9px 12px;border:1px solid #d9dee8;border-radius:9px;background:#fff;text-decoration:none;color:#172033}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.card{background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:18px}.card h2{font-size:17px;margin:0 0 14px}.row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #edf0f4}.row:last-child{border:0}.label{color:#667085;font-size:13px}.docs{margin-top:14px}.doc{padding:10px 0;border-bottom:1px solid #edf0f4}.muted{color:#667085;font-size:13px}.err{color:#b42318}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><main class="wrap"><div class="top"><h1>Student Profile</h1><a class="btn" href="/erp/web/students.html">← Students</a></div><div id="app" class="muted">Loading…</div></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('app').innerHTML='<p class="err">Student ID is missing.</p>';return}try{const d=await LSKERP.request('/api/students/'+encodeURIComponent(id));const s=d.student||d;document.getElementById('app').innerHTML=`<div class="grid"><section class="card"><h2>Basic Information</h2>${row('Admission No.',s.admissionNo||s.admission_no)}${row('Roll No.',s.rollNo||s.roll_no)}${row('Name',s.fullName||s.full_name)}${row('Date of Birth',s.dateOfBirth||s.date_of_birth)}${row('Gender',s.gender)}${row('Status',s.status)}</section><section class="card"><h2>Academic Information</h2>${row('Class',s.className||s.class_name)}${row('Section',s.sectionName||s.section_name)}${row('Session',s.sessionName||s.session_name)}<div class="docs"><b>Documents</b><div id="docs" class="muted">Loading documents…</div></div></section></div>`;try{const x=await LSKERP.request('/api/students/'+encodeURIComponent(id)+'/documents');const docs=x.documents||[];document.getElementById('docs').innerHTML=docs.length?docs.map(v=>`<div class="doc"><b>${v.documentType||'Document'}</b> — ${v.documentNo||'No number'}</div>`).join(''):'No documents added';}catch(e){document.getElementById('docs').textContent='Documents unavailable';}}catch(e){document.getElementById('app').innerHTML='<p class="err">'+e.message+'</p>'}function row(a,b){return `<div class="row"><span class="label">${a}</span><span>${b||'—'}</span></div>`}})();</script></body></html>
