<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP - Schools</title></head><body><h1>School Management</h1><p>Super Admin only.</p><script src="/erp/web/api.js"></script><script>(async()=>{const u=LSKERP.user();if((u.role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/portal-dashboard.html');return}document.body.insertAdjacentHTML('beforeend','<p>Loading schools...</p>');try{const d=await LSKERP.request('/api/platform/schools');const box=document.createElement('div');box.innerHTML=(d.schools||[]).map(s=>`<div><b>${s.display_name||s.name}</b> — ${s.code} — ${s.app_name||''}</div>`).join('')||'<p>No schools yet.</p>';document.body.appendChild(box)}catch(e){document.body.insertAdjacentHTML('beforeend',`<p>${e.message}</p>`)}})();</script></body></html>
