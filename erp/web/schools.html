<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Schools</title></head><body><h1>🏫 School Management</h1><p>Super Admin school management.</p><form id="f"><input id="name" required placeholder="School name"><input id="code" required placeholder="School code"><input id="appSlug" required placeholder="App slug"><input id="appName" placeholder="App name"><input id="logoUrl" placeholder="Logo URL"><button>Create School</button></form><p id="msg"></p><div id="list"></div><script src="/erp/web/api.js"></script><script>(async()=>{const u=LSKERP.user();if(!LSKERP.token()||(u.role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id);async function load(){const d=await LSKERP.request('/api/platform/schools');$('list').innerHTML=(d.schools||[]).map(s=>`<p><b>${s.name}</b> — ${s.code} — ${s.app_slug||''}</p>`).join('')||'No schools yet.'}f.onsubmit=async e=>{e.preventDefault();try{await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify({name:name.value.trim(),code:code.value.trim(),appSlug:appSlug.value.trim(),appName:appName.value.trim(),logoUrl:logoUrl.value.trim()})});msg.textContent='School created successfully';f.reset();await load()}catch(e){msg.textContent=e.message}};load()})()</script></body></html>
