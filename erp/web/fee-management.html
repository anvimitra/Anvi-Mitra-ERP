<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Fees</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--line:#e5eaf2;--brand:#5b5bd6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 14px;background:var(--brand);color:white;cursor:pointer}.ghost{background:white;color:#172033;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:16px}.card h2{font-size:16px;margin:0 0 12px}input,select{width:100%;padding:10px;border:1px solid #d9deea;border-radius:9px;margin:5px 0 10px;background:white}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.table{margin-top:18px;background:white;border:1px solid var(--line);border-radius:15px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px;white-space:nowrap}th{background:#f8f9fc}.msg{margin-top:12px;color:#667085}.error{color:#b42318}.ok{color:#087443}.summary{font-size:26px;font-weight:800}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="top"><div><h1>Fees Management</h1><div class="msg">Fee heads • Fee structure • Invoices • Collection</div></div><div class="actions"><button class="ghost" onclick="location.href='/erp/web/portal-dashboard.html'">Dashboard</button><button class="ghost" onclick="location.href='/erp/web/students.html'">Students</button></div></div><div class="grid"><section class="card"><h2>Create Fee Head</h2><input id="fhName" placeholder="Fee name e.g. Tuition Fee"><input id="fhCode" placeholder="Code e.g. TUITION"><input id="fhDesc" placeholder="Description"><button onclick="createHead()">Save Fee Head</button></section><section class="card"><h2>Fee Structure</h2><div class="formgrid"><div><label>Session</label><select id="session"></select></div><div><label>Class</label><select id="class"></select></div><div><label>Fee Head</label><select id="head"></select></div><div><label>Frequency</label><select id="frequency"><option value="annual">Annual</option><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="half_yearly">Half Yearly</option><option value="one_time">One Time</option></select></div><div><label>Amount</label><input id="amount" type="number" min="0" step="0.01"></div><div><label>Due day</label><input id="dueDay" type="number" min="1" max="31"></div></div><button onclick="createStructure()">Add Structure</button></section><section class="card"><h2>Generate Student Invoice</h2><input id="studentId" placeholder="Student ID"><select id="invoiceSession"></select><input id="discount" type="number" min="0" step="0.01" placeholder="Discount"><button onclick="createInvoice()">Generate Invoice</button><div class="msg">Leave item list automatic: class fee structure will be used.</div></section></div><section class="card" style="margin-top:18px"><h2>Student Fee Search</h2><div class="formgrid"><input id="searchStudent" placeholder="Student ID"><button onclick="loadStudentFees()">Load Fees</button></div><div id="studentResult" class="msg"></div></section><section class="table"><table><thead><tr><th>Invoice</th><th>Date</th><th>Due</th><th>Status</th><th>Net</th><th>Paid</th><th>Balance</th><th>Action</th></tr></thead><tbody id="invoices"></tbody></table></section><section class="card" style="margin-top:18px"><h2>Collect Payment</h2><div class="formgrid"><input id="payInvoice" placeholder="Invoice ID"><input id="payAmount" type="number" min="0.01" step="0.01" placeholder="Amount"><select id="payMethod"><option value="cash">Cash</option><option value="upi">UPI</option><option value="card">Card</option><option value="bank_transfer">Bank Transfer</option><option value="online">Online</option><option value="other">Other</option></select><input id="txRef" placeholder="Transaction reference (optional)"></div><button onclick="collectPayment()">Collect & Generate Receipt</button><div id="receipt" class="msg"></div></section><section class="card" style="margin-top:18px"><h2>Collection Report</h2><div class="formgrid"><input id="from" type="date"><input id="to" type="date"></div><button onclick="collectionReport()">Load Collection</button><div id="collection" class="msg"></div></section><div id="msg" class="msg"></div></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(!['super_admin','principal','admin','accountant','office_staff'].includes(role)){document.body.innerHTML='<main class="wrap"><h2>Access denied</h2><p>Fees management is available to finance staff only.</p></main>';return}window.loadBasics=async()=>{try{const org=await LSKERP.request('/api/organization');const a=await LSKERP.request('/api/academic-structure');const hs=await LSKERP.request('/api/fee-heads');const sessions=(a.sessions||a.academicSessions||[]);const classes=a.classes||[];document.getElementById('session').innerHTML=sessions.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');document.getElementById('invoiceSession').innerHTML=document.getElementById('session').innerHTML;document.getElementById('class').innerHTML=classes.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');document.getElementById('head').innerHTML=(hs.feeHeads||[]).map(x=>`<option value="${x.id}">${x.name} (${x.code})</option>`).join('');loadStructures()}catch(e){msg(e.message||'Could not load fee setup','error')}};window.createHead=async()=>{try{await LSKERP.request('/api/fee-heads',{method:'POST',body:JSON.stringify({name:fhName.value,code:fhCode.value,description:fhDesc.value||null})});msg('Fee head created','ok');await loadBasics()}catch(e){msg(e.message,'error')}};window.createStructure=async()=>{try{await LSKERP.request('/api/fee-structures',{method:'POST',body:JSON.stringify({sessionId:session.value,classId:class.value,feeHeadId:head.value,amount:Number(amount.value),frequency:frequency.value,dueDay:dueDay.value?Number(dueDay.value):null})});msg('Fee structure saved','ok');loadStructures()}catch(e){msg(e.message,'error')}};window.loadStructures=async()=>{try{const d=await LSKERP.request('/api/fee-structures?sessionId='+encodeURIComponent(session.value));document.getElementById('studentResult').textContent=(d.feeStructures||[]).length+' fee structures available for selected session.'}catch(e){}};window.createInvoice=async()=>{try{const d=await LSKERP.request('/api/fees/invoices',{method:'POST',body:JSON.stringify({studentId:studentId.value,sessionId:invoiceSession.value,discountAmount:Number(discount.value||0)})});msg('Invoice '+d.invoice.invoiceNo+' created. Balance ₹'+d.invoice.balanceAmount,'ok');searchStudent.value=studentId.value;loadStudentFees()}catch(e){msg(e.message,'error')}};window.loadStudentFees=async()=>{try{const id=searchStudent.value.trim();if(!id)throw new Error('Enter student ID');const d=await LSKERP.request('/api/fees/student/'+encodeURIComponent(id));document.getElementById('invoices').innerHTML=(d.invoices||[]).map(x=>`<tr><td>${x.invoiceNo}</td><td>${new Date(x.invoiceDate).toLocaleDateString()}</td><td>${x.dueDate||'-'}</td><td>${x.status}</td><td>₹${Number(x.netAmount).toFixed(2)}</td><td>₹${Number(x.paidAmount).toFixed(2)}</td><td>₹${Number(x.balanceAmount).toFixed(2)}</td><td><button onclick="payInvoice.value='${x.id}';payAmount.value='${x.balanceAmount}'">Pay</button></td></tr>`).join('');document.getElementById('studentResult').innerHTML=`<span class="summary">₹${Number(d.totalBalance||0).toFixed(2)}</span> total balance` }catch(e){msg(e.message,'error')}};window.collectPayment=async()=>{try{const d=await LSKERP.request('/api/fees/payments',{method:'POST',body:JSON.stringify({invoiceId:payInvoice.value,amount:Number(payAmount.value),method:payMethod.value,transactionRef:txRef.value||null})});receipt.textContent=`Receipt ${d.receipt.receiptNo} generated • ₹${d.receipt.amount} • ${d.receipt.method}`;receipt.className='msg ok';loadStudentFees()}catch(e){msg(e.message,'error')}};window.collectionReport=async()=>{try{const q=new URLSearchParams();if(from.value)q.set('from',from.value);if(to.value)q.set('to',to.value);const d=await LSKERP.request('/api/fees/reports/collection?'+q);collection.innerHTML=`<span class="summary">₹${Number(d.totalCollected||0).toFixed(2)}</span> collected • ${(d.payments||[]).length} receipts`}catch(e){msg(e.message,'error')}};window.msg=(t,c='')=>{const el=document.getElementById('msg');el.textContent=t;el.className='msg '+c};loadBasics()})();</script></body></html>
