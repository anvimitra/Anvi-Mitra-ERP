<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Onboarding</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:24px}.panel{background:#fff;padding:25px;border-radius:20px;border:1px solid #e5e9f2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{padding:14px;background:#f7f8fc;border-radius:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><p><a href="/super-admin/schools">← Schools</a></p><section class="panel"><h1 id="name">School Onboarding</h1><p id="state">Loading…</p><div id="details" class="grid"></div><h2>Setup checklist</h2><div class="item">Staff & administrators</div><div class="item">Academic sessions, classes, sections & subjects</div><div class="item">Student enrollment & parent linking</div><div class="item">Teacher class/subject assignments</div><div class="item">Offline devices & local storage connector</div></section></main><script>async function load(){try{const id=new URLSearchParams(location.search).get('school'),r=await fetch('/api/platform/schools',{headers:{Authorization:'Bearer '+(localStorage.getItem('accessToken')||'')}}),d=await r.json(),s=d.schools.find(x=>String(x.id)===String(id));if(!s)throw Error('School not found');name.textContent=s.displayName||s.name;state.textContent='Provisioned and ready for school onboarding';details.innerHTML=[['Code',s.code],['App',s.appName||'—'],['Slug',s.appSlug||'—'],['Logo',s.logoUrl||'Not configured'],['Phone',s.phone||'—'],['Email',s.email||'—'],['Timezone',s.timezone||'Asia/Kolkata'],['Currency',s.currencyCode||'INR']].map(x=>'<div class="item"><b>'+x[0]+'</b><br>'+x[1]+'</div>').join('')}catch(e){state.textContent=e.message}}load();</script></body></html>
