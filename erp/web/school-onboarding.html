<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP - School Onboarding</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #d7dce6;border-radius:8px;box-sizing:border-box}.btn{padding:11px 16px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-weight:750;cursor:pointer}.muted{color:#667085;font-size:13px}.ok{color:#067647}.err{color:#b42318}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><h1>School Onboarding</h1><p class="muted">Create the school, main branch, app configuration and the first school admin in one secure transaction.</p><section class="panel"><form id="form" class="grid"><div class="field"><label>School Name *</label><input id="name" required></div><div class="field"><label>School Code *</label><input id="code" required placeholder="LSK001"></div><div class="field"><label>Display Name</label><input id="displayName"></div><div class="field"><label>Logo URL</label><input id="logoUrl" type="url"></div><div class="field"><label>School Phone</label><input id="phone"></div><div class="field"><label>Support Email</label><input id="supportEmail" type="email"></div><div class="field full"><label>Address</label><input id="address"></div><div class="field"><label>Main Branch Name</label><input id="branchName" value="Main Branch"></div><div class="field"><label>Main Branch Code</label><input id="branchCode" value="MAIN"></div><div class="field"><label>App Name</label><input id="appName"></div><div class="field"><label>App Slug *</label><input id="appSlug" required placeholder="school-name"></div><div class="field"><label>Android Package</label><input id="androidPackage" placeholder="in.anvimitra.school"></div><div class="field"><label>iOS Bundle ID</label><input id="iosBundleId"></div><div class="field"><label>Primary Color</label><input id="primaryColor" value="4F46E5"></div><div class="field"><label>Secondary Color</label><input id="secondaryColor" value="0F1720"></div><div class="field"><label>API Base URL</label><input id="apiBaseUrl"></div><div class="field"><label>Minimum App Version</label><input id="minAppVersion" value="1.0.0"></div></form></section><section class="panel"><h2>First School Admin</h2><p class="muted">This account can log in immediately and continue staff/student enrollment setup.</p><form id="adminForm" class="grid"><div class="field"><label>Admin Name *</label><input id="adminName" required></div><div class="field"><label>Admin Email</label><input id="adminEmail" type="email"></div><div class="field"><label>Admin Phone</label><input id="adminPhone"></div><div class="field"><label>Admin Password * (min 6)</label><input id="adminPassword" type="password" minlength="6" required></div><div class="full"><button class="btn">Create School & Admin</button></div></form><p id="msg" class="muted"></p></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}if((LSKERP.user().role||'').toLowerCase()!=='super_admin'){document.body.innerHTML='<main class="wrap"><section class="panel"><h2>Access denied</h2><p class="muted">Only super_admin can onboard schools.</p></section></main>';return}const $=id=>document.getElementById(id);const msg=(text,err=false)=>{$('msg').className=err?'err':'ok';$('msg').textContent=text};$('adminForm').onsubmit=async e=>{e.preventDefault();const email=$('adminEmail').value.trim();const phone=$('adminPhone').value.trim();if(!email&&!phone)return msg('Admin email or phone is required.',true);const body={name:$('name').value,code:$('code').value,displayName:$('displayName').value,logoUrl:$('logoUrl').value,phone:$('phone').value,supportEmail:$('supportEmail').value,address:$('address').value,branchName:$('branchName').value,branchCode:$('branchCode').value,appName:$('appName').value||`${$('name').value} App`,appSlug:$('appSlug').value,androidPackage:$('androidPackage').value,iosBundleId:$('iosBundleId').value,primaryColor:$('primaryColor').value,secondaryColor:$('secondaryColor').value,apiBaseUrl:$('apiBaseUrl').value,minAppVersion:$('minAppVersion').value,initialAdminName:$('adminName').value,initialAdminEmail:email,initialAdminPhone:phone,initialAdminPassword:$('adminPassword').value};msg('Creating school and first admin…');try{const result=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(body)});msg(`School created successfully. Admin: ${result.initialAdmin?.email||result.initialAdmin?.phone||'created'}.`);e.target.reset();$('branchName').value='Main Branch';$('branchCode').value='MAIN';$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';$('minAppVersion').value='1.0.0'}catch(err){msg(err.message||'School onboarding failed.',true)}}})()</script></body></html>
