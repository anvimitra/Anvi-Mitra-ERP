<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP — Parent Dashboard</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb;--line:#e5e7eb;--brand:#5b5bd6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{font-size:23px;font-weight:850}.muted{color:#667085;font-size:13px}.btn{border:1px solid var(--line);background:#fff;color:#172033;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:750;cursor:pointer}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.hero{background:linear-gradient(120deg,#24285f,#6046c8);color:#fff;border-radius:18px;padding:22px}.hero h1{margin:0 0 5px;font-size:24px}.hero p{margin:0;color:#e6e8ff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.card h2{margin:0 0 7px;font-size:17px}.value{font-size:28px;font-weight:850}.badge{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 6px;margin-left:7px;border-radius:999px;background:#dc2626;color:#fff;font-size:11px;font-weight:800;vertical-align:middle}.children{display:grid;gap:10px;margin-top:12px}.child{padding:12px;border:1px solid var(--line);border-radius:12px}.status{margin-top:14px;color:#b42318;min-height:20px}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.top .btn{width:100%}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">Anvi Mitra ERP</div><div class="muted">Parent Dashboard</div></div><button class="btn" id="logout">Logout</button></div><section class="hero"><h1 id="welcome">Welcome</h1><p>Monitor your child's school updates from one place.</p></section><div class="grid"><article class="card"><h2>🔔 Notifications <span class="badge" id="badge" style="display:none"></span></h2><div class="value" id="unread">—</div><div class="muted">Unread updates</div><p><a class="btn primary" href="/erp/web/parent-notifications.html">Open Notifications</a></p></article><article class="card"><h2>👨‍👩‍👧 My Children</h2><div class="value" id="childCount">—</div><div class="muted">Linked students</div></article><article class="card"><h2>💳 Fee Updates</h2><div class="muted">Payment receipts and fee invoices appear in Notifications.</div></article></div><section class="card" style="margin-top:16px"><h2>Linked Children</h2><div id="children" class="children"></div><div id="status" class="status"></div></section></div><script src="/erp/web/api.js"></script><script>(async()=>{const token=LSKERP.token();if(!token){location.replace('/erp/web/login.html');return}const user=LSKERP.user();if((user.role||'').toLowerCase()!=='parent'){location.replace('/erp/web/portal-dashboard.html');return}document.getElementById('welcome').textContent='Welcome, '+(user.fullName||user.name||'Parent');document.getElementById('logout').onclick=()=>{sessionStorage.clear();location.replace('/erp/web/login.html')};const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));try{const [students,notes]=await Promise.all([LSKERP.request('/api/portal/me/students'),LSKERP.request('/api/notifications/me?limit=100')]);const children=students.students||[],notifications=notes.notifications||[],unread=notifications.filter(n=>!n.readAt).length;document.getElementById('childCount').textContent=children.length;document.getElementById('unread').textContent=unread;const badge=document.getElementById('badge');if(unread){badge.textContent=unread>99?'99+':unread;badge.style.display='inline-grid'}document.getElementById('children').innerHTML=children.length?children.map(s=>`<div class="child"><b>${esc(s.fullName)}</b><div class="muted">${esc(s.admissionNo||'')} ${s.className?'• '+esc(s.className):''} ${s.sectionName?'• '+esc(s.sectionName):''}</div></div>`).join(''):'<div class="muted">No linked children found.</div>'}catch(e){document.getElementById('status').textContent=e.message||'Unable to load parent dashboard.'}})();</script></body></html>
