<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Staff</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--line:#e4e8f0;--muted:#667085;--brand:#4f46e5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.back{color:var(--brand);font-weight:750;text-decoration:none}.layout{display:grid;grid-template-columns:1fr 390px;gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px #10162d0b}.panel h2{margin:0 0 14px}.list{display:grid;gap:10px}.person{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:13px}.avatar{width:42px;height:42px;border-radius:12px;background:#eef0ff;display:grid;place-items:center;font-weight:800;color:#4f46e5}.meta{font-size:12px;color:var(--muted);margin-top:3px}.badge{margin-left:auto;padding:5px 9px;border-radius:999px;background:#eefbf4;color:#087443;font-size:11px;font-weight:800}.form{display:grid;gap:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select{width:100%;padding:10px 11px;border:1px solid #d9dee8;border-radius:9px;font:inherit;background:#fff}.btn{padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.msg{min-height:18px;font-size:12px}.ok{color:#087443}.err{color:#b42318}@media(max-width:850px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><main class="wrap"><div class="top"><div><a class="back" href="/erp/web/portal-dashboard.html">← Dashboard</a><h1>Staff Management</h1></div><span id="role" class="meta"></span></div><div class="layout"><section class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>School staff</h2><input id="search" placeholder="Search…" style="padding:9px;border:1px solid #d9dee8;border-radius:9px"></div><div id="list" class="list">Loading…</div><div id="listMsg" class="msg"></div></section><section class="panel"><h2>Add staff account</h2><form id="form" class="form"><div class="row"><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Phone</label><input id="phone" inputmode="tel"></div></div><div class="field"><label>Temporary password *</label><input id="password" type="password" minlength="6" required></div><div class="field"><label>Role *</label><select id="roleSelect" required><option value="teacher">Teacher</option><option value="office_staff">Office Staff</option><option value="accountant">Accountant</option><option value="driver">Driver</option><option value="admin">Admin</option><option value="principal">Principal</option></select></div><div class="field"><label>Branch</label><select id="branch"><option value="">School level</option></select></div><button class="btn" id="save">Create staff account</button><div id="msg" class="msg"></div></form></section></div></main><script src="/erp/web/api.js"></script><script>(async()=>{const user=LSKERP.user(),role=(user.role||'').toLowerCase();if(!LSKERP.token()){location.replace('/erp/web/login.html');return}if(!['super_admin','principal','admin'].includes(role)){document.getElementById('role').textContent='Insufficient permission';document.getElementById('save').disabled=true;return}document.getElementById('role').textContent='Role: '+role;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let staff=[];async function load(){try{const [s,b]=await Promise.all([LSKERP.request('/api/staff'),LSKERP.request('/api/branches')]);staff=s.staff||[];$('branch').innerHTML='<option value="">School level</option>'+(b.branches||[]).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+' ('+esc(x.code)+')</option>').join('');render();}catch(e){$('listMsg').className='msg err';$('listMsg').textContent=e.message||'Could not load staff'}}function render(){const q=$('search').value.trim().toLowerCase();const rows=staff.filter(x=>(x.email||'').toLowerCase().includes(q)||(x.phone||'').includes(q)||(x.role||'').toLowerCase().includes(q));$('list').innerHTML=rows.length?rows.map(x=>'<article class="person"><div class="avatar">'+esc((x.email||x.phone||'U').slice(0,1).toUpperCase())+'</div><div><b>'+esc(x.email||x.phone||'Staff')+'</b><div class="meta">'+esc(x.role)+' • '+esc(x.branchName||'School level')+'</div></div><span class="badge">'+esc(x.status)+'</span></article>').join(''):'<div class="meta">No staff accounts found.</div>'}$('search').oninput=render;$('form').onsubmit=async e=>{e.preventDefault();const b=$('save');b.disabled=true;$('msg').textContent='Creating…';$('msg').className='msg';try{const d=await LSKERP.request('/api/staff',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),phone:$('phone').value.trim(),password:$('password').value,role:$('roleSelect').value,branchId:$('branch').value||null})});$('msg').className='msg ok';$('msg').textContent='Staff account created successfully.';e.target.reset();await load();}catch(err){$('msg').className='msg err';$('msg').textContent=err.message||'Could not create staff'}finally{b.disabled=false}};load()})()</script></body></html>
