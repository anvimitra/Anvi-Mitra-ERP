<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP — Staff</title><style>:root{font-family:system-ui,sans-serif;color:#eef6ff;background:#07111f;--a:#55d6be;--line:#25435f;--muted:#9eb2c9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#12335a,#07111f 48%)}main{width:min(1200px,94vw);margin:auto;padding:28px 0 50px}.top{display:flex;justify-content:space-between;align-items:center}.ey{font-size:11px;color:var(--a);font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:5px 0}.muted{color:var(--muted)}.panel{margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#10233a,#0b1727);box-shadow:0 24px 70px #0008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #29445f;background:#081625;color:#fff}.btn{padding:12px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:var(--a);color:#03201a}.row{display:flex;gap:10px;align-items:end}.list{display:grid;gap:9px;margin-top:16px}.item{padding:14px;border:1px solid #1d3854;border-radius:14px;background:#0a192a;display:flex;justify-content:space-between}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#12324b}.msg{margin-top:10px;min-height:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}</style></head><body><main><header class="top"><div><div class="ey">School Administration</div><h1>Staff Management</h1><div class="muted">Create staff accounts and assign the correct branch.</div></div><button class="btn primary" onclick="location.href='/erp/web/portal-dashboard.html'">Back to ERP</button></header><section class="panel"><h2>Add Staff / Teacher</h2><form id="form"><div class="grid"><div><label>Email</label><input class="input" name="email" type="email"></div><div><label>Phone</label><input class="input" name="phone"></div><div><label>Password</label><input class="input" name="password" type="password" minlength="6" required></div><div><label>Role</label><select class="input" name="role"><option value="teacher">Teacher</option><option value="office_staff">Office Staff</option><option value="accountant">Accountant</option><option value="driver">Driver</option><option value="admin">Admin</option><option value="principal">Principal</option></select></div><div><label>Branch</label><select class="input" name="branchId" id="branch"></select></div></div><div class="msg" id="msg"></div><button class="btn primary">Create Account</button></form></section><section class="panel"><div class="row"><div style="flex:1"><input class="input" id="q" placeholder="Search staff…"></div><button class="btn primary" onclick="load()">Refresh</button></div><div class="list" id="list"></div></section></main><script>const token=sessionStorage.getItem('lsk_access_token'),user=JSON.parse(sessionStorage.getItem('lsk_user')||'{}');if(!token)location.href='/erp/web/login.html';const H={Authorization:'Bearer '+token,'Content-Type':'application/json'};let data=[];async function masters(){const r=await fetch('/api/branches',{headers:H}),d=await r.json();if(r.ok)document.getElementById('branch').innerHTML='<option value="">School-wide</option>'+(d.branches||[]).map(b=>'<option value="'+b.id+'">'+b.name+' ('+b.code+')</option>').join('')}async function load(){const r=await fetch('/api/staff',{headers:H}),d=await r.json();if(!r.ok){document.getElementById('list').textContent=d.error||'Unable to load staff';return}data=d.staff||[];render()}function render(){const q=document.getElementById('q').value.toLowerCase();document.getElementById('list').innerHTML=data.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>'<div class="item"><div><b>'+ (x.email||x.phone||'Staff') +'</b><div class="muted">'+x.role+' · '+(x.branchName||'School-wide')+'</div></div><span class="badge">'+x.status+'</span></div>').join('')||'<div class="muted">No staff accounts found.</div>'}document.getElementById('q').oninput=render;document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');const body=Object.fromEntries(new FormData(e.target).entries());if(!body.email&&!body.phone){msg.textContent='Email or phone is required';return}if(!body.branchId)delete body.branchId;msg.textContent='Creating…';const r=await fetch('/api/staff',{method:'POST',headers:H,body:JSON.stringify(body)}),d=await r.json();msg.textContent=r.ok?'Staff account created.':(d.error||'Creation failed');if(r.ok){e.target.reset();await load();}};masters().then(load);</script></body></html>
