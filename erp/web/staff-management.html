<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Staff</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #d7dce6;border-radius:8px;box-sizing:border-box;font:inherit}.btn{padding:10px 14px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.table th{font-size:11px;color:#667085;text-transform:uppercase}.muted{color:#667085;font-size:13px}.ok{color:#067647}.err{color:#b42318}@media(max-width:800px){.grid{grid-template-columns:1fr}.scroll{overflow:auto}.table{min-width:800px}}</style></head><body><main class="wrap"><h1>School Staff</h1><p class="muted">Create and manage staff accounts for the currently logged-in school. Access remains school-scoped and branch assignment can be applied at creation.</p><section class="panel"><form id="form" class="grid"><div class="field"><label>Name *</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Password *</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>Role *</label><select id="role"><option value="teacher">Teacher</option><option value="admin">Admin</option><option value="principal">Principal</option><option value="accountant">Accountant</option><option value="office_staff">Office Staff</option><option value="driver">Driver</option></select></div><div class="field"><label>Branch</label><select id="branch"><option value="">School level / none</option></select></div><div><button class="btn" id="save">Create staff account</button></div></form><div id="msg" class="muted"></div></section><section class="panel"><h2>Existing staff</h2><div class="scroll"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Branch</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(!['super_admin','principal','admin'].includes(role)){document.body.innerHTML='<main class="wrap"><section class="panel"><h2>Access denied</h2></section></main>';return}const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const [staff,branches]=await Promise.all([LSKERP.request('/api/staff'),LSKERP.request('/api/branches')]);$('branch').innerHTML='<option value="">School level / none</option>'+(branches.branches||[]).map(b=>`<option value="${b.id}">${esc(b.name)} (${esc(b.code)})</option>`).join('');$('rows').innerHTML=(staff.staff||[]).map(s=>`<tr><td><b>${esc(s.displayName||'—')}</b></td><td>${esc(s.email||'—')}</td><td>${esc(s.phone||'—')}</td><td>${esc(s.role)}</td><td>${esc((branches.branches||[]).find(b=>b.id===s.branchId)?.name||'School')}</td><td>${esc(s.status)}</td></tr>`).join('')||'<tr><td colspan="6">No staff accounts yet.</td></tr>'}$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;$('msg').className='muted';$('msg').textContent='Creating staff account…';try{await LSKERP.request('/api/staff',{method:'POST',body:JSON.stringify({name:$('name').value.trim(),email:$('email').value.trim()||null,phone:$('phone').value.trim()||null,password:$('password').value,role:$('role').value,branchId:$('branch').value||null})});$('msg').className='ok';$('msg').textContent='Staff account created successfully.';e.target.reset();await load()}catch(err){$('msg').className='err';$('msg').textContent=err.message||'Could not create staff account'}finally{$('save').disabled=false}};try{await load()}catch(e){$('msg').className='err';$('msg').textContent=e.message||'Could not load staff'}})()</script></body></html>
