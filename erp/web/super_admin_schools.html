<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Super Admin</title><style>:root{--p:#6d5dfc;--q:#21d4fd;--bg:#07111f;--c:#101d32;--line:#ffffff18;--t:#f5f7ff;--m:#a9b6cc}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--t);background:radial-gradient(circle at 15% 10%,#253475,transparent 32%),radial-gradient(circle at 85% 15%,#124c66,transparent 30%),var(--bg);min-height:100vh}body:before{content:"";position:fixed;inset:-30%;background:conic-gradient(from 180deg,transparent,var(--p),transparent,var(--q),transparent);filter:blur(100px);opacity:.12;animation:s 18s linear infinite;pointer-events:none}@keyframes s{to{transform:rotate(360deg)}}.w{position:relative;max-width:1250px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;gap:13px;align-items:center}.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--p),var(--q));box-shadow:0 12px 40px #6d5dfc44}.brand h1{margin:0;font-size:22px}.brand p{margin:3px 0;color:var(--m);font-size:13px}.pill{padding:8px 12px;border-radius:99px;border:1px solid var(--line);color:#7ff1b9;background:#10b98112}.g{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}@media(max-width:900px){.g{grid-template-columns:1fr}}.card{background:#101d32cc;border:1px solid var(--line);backdrop-filter:blur(18px);border-radius:24px;padding:22px;box-shadow:0 20px 70px #0006;animation:u .55s ease both}@keyframes u{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}h2{margin:0 0 5px}.sub{color:var(--m);font-size:13px;margin-bottom:20px}.f{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}@media(max-width:600px){.f{grid-template-columns:1fr}.full{grid-column:auto}}label{display:block;color:#cbd6e8;font-size:12px;margin-bottom:6px}input,select{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:#081425;color:var(--t);outline:0}input:focus,select:focus{border-color:#8176ff;box-shadow:0 0 0 4px #6d5dfc18}button{border:0;border-radius:13px;padding:13px 17px;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--p),#8c65ff)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stat{padding:15px;border:1px solid var(--line);border-radius:16px;background:#ffffff07}.stat b{font-size:23px}.stat span{display:block;color:var(--m);font-size:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:10px;color:var(--m);text-transform:uppercase}.st{color:#7ff1b9}.msg{display:none;padding:11px;border-radius:12px}.ok{background:#10b98118;color:#7ff1b9}.err{background:#ef444418;color:#ff9a9a}</style></head><body><div class="w"><header class="top"><div class="brand"><div class="logo">AM</div><div><h1>Anvi Mitra ERP</h1><p>Super Admin • Multi-school management</p></div></div><div class="pill">● Platform secure</div></header><main class="g"><section class="card"><h2>Add New School</h2><div class="sub">Provision tenant, branding, main branch and app configuration together.</div><form id="f" class="f"><div><label>School name *</label><input name="name" required placeholder="LSK Academy"></div><div><label>School code *</label><input name="code" required placeholder="LSK"></div><div><label>Display name</label><input name="displayName" placeholder="LSK Academy ERP"></div><div><label>App slug *</label><input name="appSlug" required placeholder="lsk-academy"></div><div><label>Logo URL</label><input name="logoUrl" placeholder="https://..."></div><div><label>Website</label><input name="website" placeholder="https://..."></div><div><label>Phone</label><input name="phone" placeholder="+91..."></div><div><label>Email</label><input name="email" type="email"></div><div><label>Primary color</label><input name="primaryColor" placeholder="#6D5DFC"></div><div><label>Secondary color</label><input name="secondaryColor" placeholder="#21D4FD"></div><div><label>Main branch</label><input name="mainBranchName" value="Main Branch"></div><div><label>Branch code</label><input name="mainBranchCode" value="MAIN"></div><div class="full"><label>Address</label><input name="address"></div><div><label>Timezone</label><select name="timezone"><option>Asia/Kolkata</option><option>Asia/Dubai</option><option>Asia/Kathmandu</option></select></div><div><label>Currency</label><select name="currencyCode"><option>INR</option><option>AED</option><option>USD</option></select></div><div class="full"><label>Android package</label><input name="androidPackage" placeholder="com.anvimitra.lskacademy"></div><div class="full"><button>Create School</button></div><div id="m" class="msg full"></div></form></section><section class="card"><h2>School Directory</h2><div class="sub">Platform-wide school tenants.</div><div class="stats"><div class="stat"><b id="t">0</b><span>Total</span></div><div class="stat"><b id="a">0</b><span>Active</span></div><div class="stat"><b id="p">0</b><span>App configs</span></div></div><div id="list">Loading…</div></section></main></div><script>const token=localStorage.getItem('anviAccessToken');const m=document.getElementById('m');const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const d=await api('/api/platform/schools');const x=d.schools||[];t.textContent=x.length;a.textContent=x.filter(s=>s.status==='active').length;p.textContent=x.filter(s=>s.appSlug).length;list.innerHTML=x.length?'<table><tr><th>School</th><th>Code</th><th>App</th><th>Status</th></tr>'+x.map(s=>'<tr><td>'+esc(s.displayName||s.name)+'</td><td>'+esc(s.code)+'</td><td>'+esc(s.appSlug||'—')+'</td><td class="st">'+esc(s.status)+'</td></tr>').join('')+'</table>':'No schools yet.'}catch(e){list.textContent='Sign in as Super Admin to load schools.'}}f.onsubmit=async e=>{e.preventDefault();try{await api('/api/platform/schools',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f).entries()))});m.textContent='School created successfully.';m.className='msg full ok';m.style.display='block';f.reset();await load()}catch(e){m.textContent=e.message;m.className='msg full err';m.style.display='block'}};load();</script></body></html>
