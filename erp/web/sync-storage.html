<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Sync & Storage</title><style>body{margin:0;background:#f5f7fb;color:#111827;font:15px system-ui}.wrap{max-width:1050px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px;box-shadow:0 12px 35px #1118270b}.stat{font-size:30px;font-weight:850}.muted{color:#667085;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f4}.row:last-child{border-bottom:0}input,select{width:100%;padding:11px;border:1px solid #d9dee8;border-radius:10px;margin:5px 0 10px}button{padding:11px 15px;border:0;border-radius:11px;background:#4f46e5;color:white;font-weight:800;cursor:pointer}.ghost{background:#eef2ff;color:#3730a3}.ok{color:#087443}.err{color:#b42318}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Sync & Local Storage</h1><p class="muted">Online PostgreSQL remains the primary source of truth. Local browser/mobile data is a cache/outbox; school-PC storage is an explicitly permitted secondary connector.</p><div class="grid"><section class="card"><h2>Sync status</h2><div id="stats">Loading…</div><button onclick="load()">Refresh</button><span id="msg" class="muted"></span></section><section class="card"><h2>Add local connector</h2><label>Name</label><input id="name" placeholder="School Office PC"><label>Type</label><select id="type"><option value="desktop_folder">Desktop folder</option><option value="nas_folder">NAS folder</option><option value="external_drive">External drive</option></select><label>Permission</label><select id="perm"><option value="read_write">Read + Write</option><option value="read_only">Read only</option></select><label>Selected folder</label><input id="path" placeholder="Folder selected by the connector app"><button onclick="addConnector()">Save connector</button></section></div><section class="card" style="margin-top:16px"><h2>Configured connectors</h2><div id="connectors">Loading…</div></section></div><script src="/erp/web/api.js"></script><script>(async()=>{const u=LSKERP.user();if(!LSKERP.token()){location.replace('/erp/web/login.html');return}async function load(){try{const[s,c]=await Promise.all([LSKERP.request('/api/sync/status'),LSKERP.request('/api/local-storage/connectors')]);$('stats').innerHTML='<div class="row"><span>Online source</span><b class="ok">'+s.onlineSourceOfTruth+'</b></div><div class="row"><span>Registered devices</span><b>'+s.deviceCount.active+' / '+s.deviceCount.total+'</b></div><div class="row"><span>Sync changes</span><b>'+s.changeCount+'</b></div><div class="row"><span>Pending conflicts</span><b class="'+(s.pendingConflictCount?'err':'ok')+'">'+s.pendingConflictCount+'</b></div><div class="row"><span>Last change</span><b>'+((s.latestChange||{}).changed_at||'—')+'</b></div>';$('connectors').innerHTML=(c.connectors||[]).length?c.connectors.map(x=>'<div class="row"><div><b>'+x.display_name+'</b><div class="muted">'+x.connector_type+' • '+x.permission_mode+' • '+(x.selected_path||'path not reported')+'</div></div><b class="'+(x.enabled?'ok':'err')+'">'+(x.enabled?'Enabled':'Disabled')+'</b></div>').join(''):'<span class="muted">No local connectors configured.</span>';$('msg').textContent=' • Updated';}catch(e){$('msg').textContent=' • '+e.message;$('msg').className='err'}}async function addConnector(){try{await LSKERP.request('/api/local-storage/connectors',{method:'POST',body:JSON.stringify({displayName:$('name').value,connectorType:$('type').value,permissionMode:$('perm').value,selectedPath:$('path').value||null})});$('name').value='';$('path').value='';await load()}catch(e){alert(e.message)}}const $=id=>document.getElementById(id);load()})();</script></body></html>
