<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Timetable</title><style>body{margin:0;font-family:Inter,system-ui;background:#f5f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.hero{padding:28px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#111827,#3730a3,#0891b2);box-shadow:0 20px 50px #11182720}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 24px #1118270b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}select,button{padding:11px;border:1px solid #d8dce5;border-radius:10px}button{background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;font-weight:800}.muted{color:#667085}</style></head><body><div class="wrap"><section class="hero"><h1>Academic Timetable</h1><p>Section schedules with teacher and section slot protection.</p></section><div class="row"><select id="session"></select><select id="section"></select><button onclick="loadEntries()">Refresh</button><a href="/super-admin/schools">Schools</a></div><div id="status" class="muted">Loading…</div><div id="grid" class="grid"></div></div><script>const token=()=>localStorage.getItem('accessToken')||localStorage.getItem('token')||sessionStorage.getItem('lsk_access_token')||'';async function api(u){const r=await fetch(u,{headers:{Authorization:'Bearer '+token()}}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function boot(){try{const m=await api('/api/academic/master');session.innerHTML='<option value="">All sessions</option>'+(m.sessions||[]).map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');section.innerHTML='<option value="">All sections</option>'+(m.sections||[]).map(x=>'<option value="'+x.id+'">'+x.className+' — '+x.name+'</option>').join('');await loadEntries()}catch(e){status.textContent=e.message}}async function loadEntries(){try{const d=await api('/api/timetable?sessionId='+encodeURIComponent(session.value)+'&sectionId='+encodeURIComponent(section.value));grid.innerHTML=(d.entries||[]).map(x=>'<article class="card"><b>Day '+x.dayOfWeek+' • '+x.startsAt+'–'+x.endsAt+'</b><h3>'+x.subjectName+'</h3><p>'+x.className+' — '+x.sectionName+'</p><p class="muted">'+(x.teacherEmail||'')+(x.room?' • Room '+x.room:'')+'</p></article>').join('')||'<article class="card">No timetable entries.</article>';status.textContent=(d.entries||[]).length+' timetable entr'+((d.entries||[]).length===1?'y':'ies')}catch(e){status.textContent=e.message}}boot();</script></body></html>
