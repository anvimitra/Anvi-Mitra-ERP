<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Local Storage</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--brand:#4f46e5;--line:#e4e8f0;--muted:#667085}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:linear-gradient(160deg,#10162d,#24275a);color:#fff;padding:22px}.brand{font-size:20px;font-weight:850}.sub{font-size:11px;color:#b8c2e5;margin:5px 0 28px}.nav{display:grid;gap:7px}.nav a{color:#d9e2ff;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}.nav a:hover,.nav a.active{background:#ffffff14;color:#fff}.logout{margin-top:18px;width:100%;padding:10px;border:1px solid #415078;background:transparent;color:#fff;border-radius:9px}.main{padding:25px;max-width:1050px;width:100%;margin:auto}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.hero{background:linear-gradient(120deg,#24285f,#6046c8);color:#fff;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#e6e8ff;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.panel h2{font-size:17px;margin:0 0 10px}.panel p{font-size:13px;color:var(--muted);line-height:1.5}.button{padding:11px 14px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:750;cursor:pointer;margin:5px 5px 0 0}.button.secondary{background:#eef2ff;color:#3730a3}.status{margin-top:12px;font-size:12px;color:#667085}.ok{color:#087443}.error{color:#b42318}.pill{display:inline-block;background:#eef2ff;color:#3730a3;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;margin:2px}@media(max-width:800px){.app{grid-template-columns:1fr}.side{padding:12px;position:sticky;top:0;z-index:2}.nav{display:flex;overflow:auto}.main{padding:16px}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">Anvi Mitra ERP</div><div class="sub">Offline • Local Storage</div><nav class="nav"><a href="/erp/web/portal-dashboard.html">ERP Dashboard</a><a class="active" href="/erp/web/local-storage.html">Local Storage</a></nav><button class="logout" id="logout">Logout</button></aside><main class="main"><section class="hero"><h1>Offline & Local Storage</h1><p>Browser cache and offline outbox stay on this device. When internet returns, queued changes are retried against the central ERP sync API.</p></section><div class="grid"><section class="panel"><h2>Local folder</h2><p id="support">Checking browser support…</p><button class="button" id="choose">Choose folder</button><button class="button secondary" id="backup">Write backup</button><button class="button secondary" id="restore">Read backup</button><div class="status" id="folderStatus"></div></section><section class="panel"><h2>Sync status</h2><div id="syncStatus"></div><button class="button" id="sync">Sync now</button><div class="status" id="syncMsg"></div></section></div></main></div><script src="/erp/web/api.js"></script><script src="/erp/web/offline-sync.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}document.getElementById('logout').onclick=()=>{sessionStorage.clear();location.replace('/erp/web/login.html')};const support=document.getElementById('support'),folderStatus=document.getElementById('folderStatus'),syncMsg=document.getElementById('syncMsg');let dir=null;const hasFs='showDirectoryPicker' in window;const deviceKey=localStorage.getItem('anvi_erp_device_key')||('web-'+crypto.randomUUID());localStorage.setItem('anvi_erp_device_key',deviceKey);if(!hasFs)support.textContent='Folder read/write is not available in this browser. JSON backup download/upload remains available.';else support.textContent='Folder access is available. Permission is requested only after you choose a folder.';const payload=async()=>({version:2,schoolId:LSKERP.user().schoolId||null,createdAt:new Date().toISOString(),outbox:await AnviOfflineSync.outbox()});function download(data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='anvi-mitra-offline-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function writeBackup(){const data=await payload();if(dir){const handle=await dir.getFileHandle('anvi-mitra-offline-backup.json',{create:true});const writable=await handle.createWritable();await writable.write(JSON.stringify(data,null,2));await writable.close();folderStatus.className='status ok';folderStatus.textContent='Backup written to selected folder.'}else download(data)}async function readBackup(){const input=document.createElement('input');input.type='file';input.accept='application/json';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());const schoolId=LSKERP.user().schoolId;if(data.schoolId&&schoolId&&data.schoolId!==schoolId)throw new Error('Backup belongs to another school');for(const change of (data.outbox||[])){if(change&&change.entityType)await AnviOfflineSync.queue(change)}folderStatus.className='status ok';folderStatus.textContent=`Backup restored locally. ${(data.outbox||[]).length} pending change(s) added to the outbox.`;render()}catch(e){folderStatus.className='status error';folderStatus.textContent=e.message||'Backup could not be read'}};input.click()}document.getElementById('choose').onclick=async()=>{if(!hasFs)return readBackup();try{dir=await window.showDirectoryPicker({mode:'readwrite'});folderStatus.className='status ok';folderStatus.textContent='Read/write permission granted for the selected folder.'}catch(e){folderStatus.className='status error';folderStatus.textContent=e.message||'Folder permission cancelled'}};document.getElementById('backup').onclick=()=>writeBackup().catch(e=>{folderStatus.className='status error';folderStatus.textContent=e.message||'Backup failed'});document.getElementById('restore').onclick=readBackup;document.getElementById('sync').onclick=async()=>{syncMsg.className='status';syncMsg.textContent='Synchronizing…';const r=await AnviOfflineSync.syncNow();if(r.error){syncMsg.className='status error';syncMsg.textContent=r.error.message||'Sync failed'}else{syncMsg.className='status ok';syncMsg.textContent=`Uploaded ${r.sent||0}; pulled ${r.pulled||0}; remaining ${r.remaining||0}${r.conflicts?' • conflicts: '+r.conflicts:''}.`}render()};AnviOfflineSync.bind(LSKERP.request,deviceKey);window.addEventListener('anvi:online',render);window.addEventListener('anvi:offline',render);window.addEventListener('anvi:sync-conflicts',e=>{syncMsg.className='status error';syncMsg.textContent=`${e.detail?.length||0} sync conflict(s) need admin review.`});function render(){const online=navigator.onLine;AnviOfflineSync.outbox().then(q=>{document.getElementById('syncStatus').innerHTML=`<div class="pill">${online?'Online':'Offline'}</div><div class="pill">Pending: ${q.length}</div><div class="status">Device: ${deviceKey}</div>`})}render()})()</script></body></html>
