<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP — Local Storage</title><style>:root{font-family:system-ui,sans-serif;color:#eef6ff;background:#07111f;--a:#55d6be;--muted:#9eb2c9;--line:#25435f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#16385b,#07111f 48%)}main{width:min(1000px,94vw);margin:auto;padding:28px 0 50px}.panel{background:linear-gradient(145deg,#112640,#091827);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 24px 70px #0008}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.ey{font-size:11px;color:var(--a);font-weight:900;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #29445f;background:#071522;color:#fff}.btn{padding:11px 15px;border:0;border-radius:10px;font-weight:800;cursor:pointer;background:var(--a);color:#03201a}.secondary{background:#17304b;color:#d9ecff;border:1px solid #2b4965}.status{margin:14px 0;padding:11px;border:1px solid #245071;border-radius:12px}.offline{border-color:#7b5b22;background:#3b2b0d;color:#ffe5aa}.list{display:grid;gap:10px;margin-top:16px}.item{padding:14px;border:1px solid #1d3854;border-radius:14px;background:#0a192a}.itemhead{display:flex;justify-content:space-between;gap:12px}.chip{display:inline-block;margin:6px 6px 0 0;padding:5px 9px;border-radius:999px;background:#123a39;color:#70ead7;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main><section class="panel"><div class="top"><div><div class="ey">Secondary Storage</div><h1>Local Storage</h1><p class="muted">Permissioned school PC/NAS/external-drive connectors. Online PostgreSQL remains the primary source of truth.</p></div><button class="btn" id="add">Add Connector</button></div><div id="status" class="status">Checking connection…</div><form id="form" class="grid"><input class="input" name="displayName" placeholder="Connector name" required><select class="input" name="connectorType"><option value="desktop_folder">Desktop Folder</option><option value="nas_folder">NAS Folder</option><option value="external_drive">External Drive</option></select><select class="input" name="permissionMode"><option value="read_write">Read + Write</option><option value="read_only">Read Only</option></select><input class="input" name="selectedPath" placeholder="Selected folder name"><button class="btn" type="submit">Save Connector</button><button class="btn secondary" type="button" id="pick">Choose Folder Permission</button></form><div id="msg" class="status"></div><h2>Connectors</h2><div id="list" class="list"></div></section></main><script>const token=sessionStorage.getItem('lsk_access_token')||localStorage.getItem('accessToken')||localStorage.getItem('token');if(!token)location.href='/erp/web/login.html';const H={Authorization:'Bearer '+token,'Content-Type':'application/json'},statusEl=document.getElementById('status'),msg=document.getElementById('msg'),list=document.getElementById('list'),form=document.getElementById('form');function connection(){const online=navigator.onLine;statusEl.textContent=online?'● Online — connector sync enabled':'● Offline — cached connector state remains available';statusEl.classList.toggle('offline',!online)}addEventListener('online',connection);addEventListener('offline',connection);connection();const HANDLE_DB='anvi-mitra-local-folders';function openHandleDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(HANDLE_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('handles');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function saveHandle(key,h){const db=await openHandleDb();return new Promise((resolve,reject)=>{const t=db.transaction('handles','readwrite');t.objectStore('handles').put(h,key);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}async function getHandle(key){const db=await openHandleDb();return new Promise((resolve,reject)=>{const r=db.transaction('handles').objectStore('handles').get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}async function ensurePermission(h){if(!h)return false;let p=await h.queryPermission({mode:'readwrite'});if(p==='prompt')p=await h.requestPermission({mode:'readwrite'});return p==='granted'}async function load(){try{const r=await fetch('/api/local-storage/connectors',{headers:H}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load connectors');list.innerHTML=(d.connectors||[]).map(c=>'<div class="item"><div class="itemhead"><strong>'+esc(c.display_name)+'</strong><span>'+(c.enabled?'Enabled':'Disabled')+'</span></div><span class="chip">'+esc(c.permission_mode)+'</span><span class="chip">'+esc(c.connector_type)+'</span><div class="muted">'+esc(c.selected_path||'Folder not selected')+'</div><button class="btn secondary" onclick="heartbeat(\\''+c.id+'\\')">Test Sync</button></div>').join('')||'<div class="muted">No connectors configured.</div>'}catch(e){msg.textContent=e.message;msg.classList.add('offline')}}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}document.getElementById('pick').onclick=async()=>{if(!window.showDirectoryPicker){msg.textContent='Folder permission requires a supported desktop browser.';return}try{const h=await showDirectoryPicker({mode:'readwrite'});form.selectedPath.value=h.name;await saveHandle('pending',h);msg.textContent='Folder permission granted for: '+h.name+'. Save Connector to bind it.'}catch(e){msg.textContent=e.name==='AbortError'?'Selection cancelled':e.message}};form.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving…';const body=Object.fromEntries(new FormData(form).entries());try{const folder=await getHandle('pending').catch(()=>null);if(folder&&!await ensurePermission(folder))throw Error('Folder permission is not granted');const r=await fetch('/api/local-storage/connectors',{method:'POST',headers:H,body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');msg.textContent='Connector saved with local permission.';form.reset();await load()}catch(e){msg.textContent=e.message}};async function heartbeat(id){msg.textContent='Testing sync…';try{const r=await fetch('/api/local-storage/connectors/'+encodeURIComponent(id)+'/heartbeat',{method:'POST',headers:H,body:JSON.stringify({})}),d=await r.json();if(!r.ok)throw Error(d.error||'Sync test failed');msg.textContent='Test Sync successful — '+(d.connector.last_sync_at||'updated');await load()}catch(e){msg.textContent=e.message}}document.getElementById('add').onclick=()=>form.scrollIntoView({behavior:'smooth'});load();</script></body></html>
