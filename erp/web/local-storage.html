<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Storage Connector</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb}.wrap{max-width:900px;margin:auto;padding:24px}.panel{background:white;padding:24px;border-radius:20px}button{padding:10px 14px;border:0;border-radius:10px;background:#4f46e5;color:white;font-weight:700}</style><main class="wrap"><section class="panel"><h1>Local Storage Connector</h1><p>Select a folder only through an explicit browser/desktop permission. The ERP never receives unrestricted computer filesystem access.</p><button id="pick">Choose Folder</button><p id="status"></p></section></main><script>pick.onclick=async()=>{if(!window.showDirectoryPicker){status.textContent='Folder access requires a supported desktop browser.';return}try{const h=await showDirectoryPicker({mode:'readwrite'});status.textContent='Folder permission granted for: '+h.name}catch(e){status.textContent=e.name==='AbortError'?'Selection cancelled':e.message}}</script>
