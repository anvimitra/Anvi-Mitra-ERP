<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Local Storage</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:22px;margin-bottom:16px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#eef2ff;color:#312e81}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#667085;font-size:13px}.msg{margin-top:12px;font-size:13px}.ok{color:#087443}.err{color:#b42318}input{padding:10px;border:1px solid #d7dce5;border-radius:9px;font:inherit;width:min(100%,520px)}</style></head><body><main class="wrap"><div class="card"><h1>Local Storage Connector</h1><p class="muted">Connect a school computer/NAS/external drive folder. Browser permission is granted by the user; the ERP never gets unrestricted disk access.</p><div class="row"><button class="btn" id="choose">Choose Folder</button><button class="btn secondary" id="test" disabled>Test Read / Write</button><button class="btn secondary" id="back">ERP Dashboard</button></div><div id="msg" class="msg"></div></div><div class="card"><h2>Connected storage</h2><div id="list" class="muted">Loading…</div></div></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(!['super_admin','principal','admin'].includes(role)){document.querySelector('.wrap').innerHTML='<div class="card"><h2>Access denied</h2><p>Only school administrators can configure local storage.</p></div>';return}let dir=null;const msg=document.getElementById('msg'),test=document.getElementById('test');document.getElementById('back').onclick=()=>location.href='/erp/web/portal-dashboard.html';document.getElementById('choose').onclick=async()=>{try{if(!window.showDirectoryPicker)throw new Error('Folder access requires a Chromium-based browser with File System Access API.');dir=await window.showDirectoryPicker({mode:'readwrite'});const path=dir.name;await LSKERP.request('/api/local-storage/connectors',{method:'POST',body:JSON.stringify({displayName:path,connectorType:'desktop_folder',permissionMode:'read_write',selectedPath:path})});test.disabled=false;msg.className='msg ok';msg.textContent='Folder connected with read/write permission: '+path;await load()}catch(e){msg.className='msg err';msg.textContent=e.message||'Folder permission was not granted'}};document.getElementById('test').onclick=async()=>{try{if(!dir)throw new Error('Choose a folder first');const file=await dir.getFileHandle('anvi-mitra-erp-sync-test.txt',{create:true});const writable=await file.createWritable();await writable.write('Anvi Mitra ERP local storage test • '+new Date().toISOString());await writable.close();const read=await file.getFile();const text=await read.text();msg.className='msg ok';msg.textContent='Read/write test successful. File contains: '+text}catch(e){msg.className='msg err';msg.textContent=e.message||'Local storage test failed'}};async function load(){try{const d=await LSKERP.request('/api/local-storage/connectors');const rows=d.connectors||[];document.getElementById('list').innerHTML=rows.length?rows.map(c=>`<div style="padding:12px 0;border-bottom:1px solid #edf0f5"><b>${c.displayName}</b><div class="muted">${c.connectorType} • ${c.permissionMode} • ${c.enabled?'Enabled':'Disabled'}</div></div>`).join(''):'No connector configured yet.'}catch(e){document.getElementById('list').textContent=e.message||'Could not load connectors'}}load()})();</script></body></html>
