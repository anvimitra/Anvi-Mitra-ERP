<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anvi Mitra ERP — Local Storage</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eef6ff;background:#07111f;--a:#55d6be;--b:#6ea8ff;--line:#294866;--muted:#9eb2c9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#12335a,#07111f 48%)}.wrap{width:min(1050px,94vw);margin:auto;padding:28px 0 50px;animation:rise .45s ease both}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}h1{margin:4px 0}.muted{color:var(--muted)}.panel{margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#10233a,#0b1727);box-shadow:0 25px 70px #0008}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:800}.primary{background:linear-gradient(100deg,var(--a),#75e8d2);color:#03201a}.secondary{background:#17304b;color:#d9ecff;border:1px solid #2b4965}.input,.select{width:100%;background:#081625;color:#fff;border:1px solid #29445f;border-radius:11px;padding:12px;outline:none}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{font-size:11px;color:#a9bdd2;font-weight:750;margin-bottom:4px}.card{padding:15px;border:1px solid #1d3854;border-radius:15px;background:#091827;margin-top:12px;animation:card .3s ease both}.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:6px 9px;border-radius:999px;background:#11324c;border:1px solid #2a5675;font-size:12px}.ok{color:#7ff0d9}.warn{color:#ffd38a}.msg{min-height:20px}.err{color:#ffadb6}.hidden{display:none}.modal{position:fixed;inset:0;background:#020814cc;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}.box{width:min(620px,96vw);background:#0d1e31;border:1px solid #294866;border-radius:22px;padding:22px;box-shadow:0 30px 100px #000b;animation:modal .22s ease both}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 12px var(--a);margin-right:7px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes modal{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}@keyframes card{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:650px){.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="wrap">
<header class="top"><div><div class="eyebrow">School Infrastructure</div><h1>Local Storage</h1><div class="muted">Permissioned PC / NAS / external-drive connectors for this school.</div></div><div class="badge"><span class="dot"></span><span id="net">Checking…</span></div></header>
<div class="panel"><div class="toolbar"><button class="btn primary" onclick="openModal()">+ Add Connector</button><button class="btn secondary" onclick="load()">↻ Refresh</button></div><div id="msg" class="msg muted" style="margin-top:12px"></div><div id="list"></div></div>
</div>
<div id="modal" class="modal hidden"><div class="box"><div class="cardhead"><div><div class="eyebrow">Permission boundary</div><h2 id="title">Add Connector</h2></div><button class="btn secondary" onclick="closeModal()">Close</button></div>
<form id="form" class="form" style="margin-top:18px"><div><div class="label">Display name *</div><input class="input" name="displayName" placeholder="School Backup PC" required></div><div class="row"><div><div class="label">Connector type</div><select class="select" name="connectorType"><option value="desktop_folder">Desktop folder</option><option value="nas_folder">NAS folder</option><option value="external_drive">External drive</option></select></div><div><div class="label">Permission</div><select class="select" name="permissionMode"><option value="read_write">Read + Write</option><option value="read_only">Read only</option></select></div></div><div><div class="label">Selected folder</div><input class="input" name="selectedPath" placeholder="Chosen by the local connector"></div><div id="formMsg" class="msg"></div><button class="btn primary">Save Connector</button></form></div></div>
<script>
const token=sessionStorage.getItem('lsk_access_token'),user=JSON.parse(sessionStorage.getItem('lsk_user')||'{}');
if(!token||!['super_admin','principal','admin'].includes(String(user.role||'').toLowerCase())) location.href='/';
const H=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'});let editing=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function network(){const n=document.getElementById('net');n.textContent=navigator.onLine?'Online — sync enabled':'Offline — connector state remains cached';n.className=navigator.onLine?'ok':'warn'}addEventListener('online',network);addEventListener('offline',network);network();
async function load(){const m=document.getElementById('msg');m.textContent='Loading connectors…';try{const r=await fetch('/api/local-storage/connectors',{headers:H()}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load connectors');render(d.connectors||[]);m.textContent='Connector directory synced.'}catch(e){m.textContent=e.message;m.className='msg err'}}
function render(items){document.getElementById('list').innerHTML=items.length?items.map((c,i)=>`<div class="card" style="animation-delay:${Math.min(i,8)*35}ms"><div class="cardhead"><div><strong>${esc(c.display_name)}</strong><div class="muted">${esc(c.connector_type)} · ${esc(c.selected_path||'Path selected by desktop connector')}</div></div><span class="badge ${c.enabled?'ok':'warn'}">${c.enabled?'Enabled':'Disabled'} · ${esc(c.permission_mode)}</span></div><div class="muted" style="margin-top:9px">Last sync: ${esc(c.last_sync_at||'Never')}${c.last_error?' · Error: '+esc(c.last_error):''}</div><div style="margin-top:10px"><button class="btn secondary" onclick="editConnector('${esc(c.id)}')">Edit</button> <button class="btn secondary" onclick="heartbeat('${esc(c.id)}')">Test Sync</button></div></div>`).join(''):'<div class="muted" style="padding:25px;text-align:center">No local connectors configured.</div>'}
async function loadOne(id){const r=await fetch('/api/local-storage/connectors',{headers:H()});const d=await r.json();return(d.connectors||[]).find(x=>x.id===id)}
function openModal(c=null){editing=c?.id||null;document.getElementById('title').textContent=editing?'Edit Connector':'Add Connector';document.getElementById('form').reset();if(c)for(const[k,v]of Object.entries({displayName:c.display_name,connectorType:c.connector_type,permissionMode:c.permission_mode,selectedPath:c.selected_path}))document.querySelector('[name='+k+']').value=v??'';document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
async function editConnector(id){const c=await loadOne(id);if(c)openModal(c)}
async function heartbeat(id){try{const r=await fetch('/api/local-storage/connectors/'+encodeURIComponent(id)+'/heartbeat',{method:'POST',headers:H(),body:JSON.stringify({})});const d=await r.json();if(!r.ok)throw Error(d.error||'Sync test failed');document.getElementById('msg').textContent='Connector heartbeat recorded successfully.';load()}catch(e){document.getElementById('msg').textContent=e.message;document.getElementById('msg').className='msg err'}}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('formMsg');msg.textContent='Saving…';const body=Object.fromEntries(new FormData(e.target).entries());body.enabled=true;try{const url=editing?'/api/local-storage/connectors/'+encodeURIComponent(editing):'/api/local-storage/connectors';const r=await fetch(url,{method:editing?'PATCH':'POST',headers:H(),body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');msg.textContent='Saved successfully.';await load();setTimeout(closeModal,350)}catch(err){msg.textContent=err.message;msg.className='msg err'}});load();
</script></body></html>
