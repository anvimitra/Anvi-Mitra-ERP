<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • School Management</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #d6dce7;border-radius:9px;box-sizing:border-box}button{padding:11px 15px;border:0;border-radius:9px;background:#25285f;color:#fff;font-weight:700;cursor:pointer;margin-top:14px}.msg{margin-top:12px;font-size:13px}.error{color:#b42318}.ok{color:#087443}.school{background:#fff;border:1px solid #e4e8f0;border-radius:12px;padding:14px;margin-top:10px}.meta{font-size:12px;color:#667085;margin-top:4px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="panel"><h1>School Management</h1><p>Super Admin • Add and provision schools for Anvi Mitra ERP</p></section><section class="panel"><h2>Add New School</h2><form id="form"><div class="grid"><div class="field"><label>School name *</label><input id="name" required></div><div class="field"><label>School code *</label><input id="code" required></div><div class="field"><label>App name</label><input id="appName"></div><div class="field"><label>App slug *</label><input id="appSlug" required></div><div class="field"><label>Application ID</label><input id="androidPackage"></div><div class="field"><label>Logo URL</label><input id="logoUrl" type="url"></div><div class="field"><label>Primary color</label><input id="primaryColor" value="4F46E5"></div><div class="field"><label>Secondary color</label><input id="secondaryColor" value="0F1720"></div><div class="field"><label>Support email</label><input id="supportEmail" type="email"></div><div class="field"><label>Support phone</label><input id="supportPhone"></div><div class="field"><label>API base URL</label><input id="apiBaseUrl" type="url"></div></div><button id="submit">Create School & Provision ERP</button><div id="msg" class="msg"></div></form></section><section class="panel"><h2>Provisioned Schools</h2><div id="schools">Loading…</div><div id="listError" class="msg error"></div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{const token=LSKERP.token(),user=LSKERP.user();if(!token||String(user.role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id),msg=$('msg');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const d=await LSKERP.request('/api/platform/schools');$('schools').innerHTML=(d.schools||[]).map(s=>`<div class="school"><b>${esc(s.name)}</b><div class="meta">Code: ${esc(s.code)} • App slug: ${esc(s.app_slug||'—')} • Status: ${esc(s.status||'active')}</div></div>`).join('')||'No schools provisioned yet.'}catch(e){$('listError').textContent=e.message||'Could not load schools.'}}$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;msg.className='msg';msg.textContent='Creating school…';try{const body={name:$('name').value.trim(),code:$('code').value.trim(),appName:$('appName').value.trim()||$('name').value.trim(),appSlug:$('appSlug').value.trim(),androidPackage:$('androidPackage').value.trim()||null,logoUrl:$('logoUrl').value.trim()||null,primaryColor:$('primaryColor').value.trim(),secondaryColor:$('secondaryColor').value.trim(),supportEmail:$('supportEmail').value.trim()||null,supportPhone:$('supportPhone').value.trim()||null,apiBaseUrl:$('apiBaseUrl').value.trim()||null};const d=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(body)});msg.className='msg ok';msg.textContent=`School created: ${d.school?.name||body.name}`;$('form').reset();$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';await load()}catch(e){msg.className='msg error';msg.textContent=e.message||'School creation failed.'}finally{$('submit').disabled=false}};await load()})()</script></body></html>
