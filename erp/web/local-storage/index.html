<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP — Local Storage</title><style>:root{font-family:system-ui;color:#eef6ff;background:#07111f;--a:#55d6be;--muted:#9eb2c9;--line:#25435f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#12335a,#07111f 48%)}main{width:min(1000px,94vw);margin:auto;padding:28px 0 50px;animation:up .5s ease}.panel{background:linear-gradient(145deg,#10233a,#091625);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 24px 70px #0008;margin-bottom:18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}h1{margin:4px 0 8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input{width:100%;padding:12px;border-radius:11px;border:1px solid #29445f;background:#081625;color:#fff}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer;background:linear-gradient(100deg,var(--a),#75e8d2);color:#03201a}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px;border:1px solid #1d3854;border-radius:14px;margin-top:10px;background:#0a192a}.tag{padding:6px 9px;border-radius:999px;background:#112d47;border:1px solid #294c69;font-size:12px}.err{color:#ffadb6}.ok{color:#9ff3df}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="panel"><div class="eyebrow">Offline resilience</div><h1>Local Storage Connector</h1><p class="muted">Connect a school-owned folder, NAS or external drive as secondary storage. The browser can only access a folder after the user explicitly grants permission.</p><div class="grid"><div><label class="muted">Connector name</label><input id="name" class="input" value="School PC Backup"></div><div><label class="muted">Permission</label><select id="perm" class="input"><option value="read_write">Read + Write</option><option value="read_only">Read Only</option></select></div></div><p id="msg" class="muted"></p><button class="btn" onclick="connect()">Choose Folder & Connect</button></section><section class="panel"><div class="eyebrow">Connected devices</div><h2>Secondary storage</h2><div id="list" class="muted">Loading…</div></section></main><script>const token=sessionStorage.getItem('lsk_access_token');if(!token)location.href='/';const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};async function load(){try{const r=await fetch('/api/local-storage/connectors',{headers:H}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load connectors');document.getElementById('list').innerHTML=d.connectors.length?d.connectors.map(c=>'<div class="row"><div><b>'+esc(c.display_name)+'</b><div class="muted">'+esc(c.connector_type)+' · '+esc(c.permission_mode)+' · '+esc(c.selected_path||'Folder permission pending')+'</div></div><span class="tag">'+(c.enabled?'Enabled':'Disabled')+'</span></div>').join(''):'<p class="muted">No connector configured yet.</p>'}catch(e){document.getElementById('list').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function connect(){const msg=document.getElementById('msg');msg.textContent='Requesting folder permission…';try{if(!('showDirectoryPicker'in window))throw Error('This browser does not support folder access. Use a supported desktop browser.');const handle=await window.showDirectoryPicker({mode:document.getElementById('perm').value==='read_write'?'readwrite':'read'});const path=handle.name;const body={displayName:document.getElementById('name').value.trim()||handle.name,connectorType:'desktop_folder',permissionMode:document.getElementById('perm').value,selectedPath:path,enabled:true};const r=await fetch('/api/local-storage/connectors',{method:'POST',headers:H,body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Connector setup failed');msg.className='ok';msg.textContent='Folder permission granted and connector registered. Sync engine can now use this connector.';await load()}catch(e){msg.className='err';msg.textContent=e.name==='AbortError'?'Folder selection cancelled.':e.message}}load();</script></body></html>
