<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anvi Mitra ERP • School Management</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--brand:#5146c8;--line:#e4e8f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{font-size:27px;font-weight:850}.sub{color:#667085;font-size:13px;margin-top:4px}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--brand);color:white;font-weight:750;cursor:pointer}.btn.alt{background:white;color:#172033;border:1px solid var(--line)}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}.panel h2{margin:0 0 14px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}input,textarea{width:100%;padding:11px;border:1px solid #d7dce6;border-radius:9px;font:inherit}textarea{min-height:72px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.msg{margin-top:10px;font-size:13px}.ok{color:#087443}.err{color:#b42318}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef0ff;font-size:11px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:15px;border:1px solid var(--line);border-radius:12px}.num{font-size:25px;font-weight:850}.muted{color:#667085;font-size:12px}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.wrap{padding:15px}}
</style></head>
<body><main class="wrap">
<div class="top"><div><div class="title">School Management</div><div class="sub">Super Admin • create and manage schools and their primary ERP configuration</div></div><button class="btn alt" id="back">Dashboard</button></div>
<section class="cards"><div class="card"><div class="muted">Schools</div><div class="num" id="schoolCount">—</div></div><div class="card"><div class="muted">Status</div><div class="num" id="status">—</div></div><div class="card"><div class="muted">Access</div><div class="num">Super Admin</div></div></section>
<section class="panel"><h2>Add New School</h2><form id="schoolForm"><div class="grid">
<div><label>School name *</label><input id="name" required maxlength="200" placeholder="Example Public School"></div>
<div><label>School code *</label><input id="code" required maxlength="50" placeholder="ABC001"></div>
<div><label>App slug *</label><input id="appSlug" required maxlength="80" placeholder="abc-school"></div>
<div><label>Display name</label><input id="displayName" maxlength="200" placeholder="ABC Public School"></div>
<div><label>Logo URL</label><input id="logoUrl" maxlength="1000" placeholder="https://.../logo.png"></div>
<div><label>Primary color</label><input id="primaryColor" value="4F46E5" maxlength="7"></div>
<div><label>Secondary color</label><input id="secondaryColor" value="0F1720" maxlength="7"></div>
<div><label>Support email</label><input id="supportEmail" type="email" maxlength="200"></div>
<div><label>Support phone</label><input id="supportPhone" maxlength="40"></div>
<div><label>Branch name</label><input id="branchName" value="Main Branch" maxlength="200"></div>
<div><label>Branch code</label><input id="branchCode" value="MAIN" maxlength="50"></div>
<div><label>API base URL</label><input id="apiBaseUrl" placeholder="https://erp.example.com"></div>
<div class="full"><label>Address</label><textarea id="address" maxlength="1000"></textarea></div>
</div><div class="actions"><button class="btn">Create School</button><button type="reset" class="btn alt">Clear</button></div><div class="msg" id="formMsg"></div></form></section>
<section class="panel"><h2>Existing Schools</h2><div id="list">Loading…</div><div class="msg" id="listMsg"></div></section>
</main>
<script src="/erp/web/api.js"></script><script>
(async()=>{
 const token=LSKERP.token(), user=LSKERP.user();
 if(!token){location.replace('/erp/web/login.html');return}
 if((user.role||'').toLowerCase()!=='super_admin'){document.body.innerHTML='<main class="wrap"><section class="panel"><h2>Access denied</h2><p>Only Super Admin can manage schools.</p></section></main>';return}
 const $=id=>document.getElementById(id);
 $('back').onclick=()=>location.href='/erp/web/portal-dashboard.html';
 async function load(){
  try{const d=await LSKERP.request('/api/platform/schools');const schools=d.schools||[];$('schoolCount').textContent=schools.length;$('status').textContent='Connected';
   if(!schools.length){$('list').innerHTML='<p class="muted">No schools found.</p>';return}
   $('list').innerHTML='<table class="table"><thead><tr><th>Name</th><th>Code</th><th>Slug</th><th>Status</th><th>Created</th></tr></thead><tbody>'+schools.map(s=>'<tr><td><b>'+esc(s.name||'')+'</b><div class="muted">'+esc(s.display_name||'')+'</div></td><td>'+esc(s.code||'')+'</td><td>'+esc(s.app_slug||'')+'</td><td><span class="badge">'+esc(s.status||'active')+'</span></td><td>'+esc(s.created_at?new Date(s.created_at).toLocaleDateString():'')+'</td></tr>').join('')+'</tbody></table>';
  }catch(e){$('status').textContent='Error';$('list').innerHTML='';$('listMsg').className='msg err';$('listMsg').textContent=e.message||'Could not load schools'}
 }
 function esc(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
 $('schoolForm').onsubmit=async e=>{e.preventDefault();$('formMsg').className='msg';$('formMsg').textContent='Creating school…';try{
  const body={name:$('name').value.trim(),code:$('code').value.trim(),appSlug:$('appSlug').value.trim(),displayName:$('displayName').value.trim()||$('name').value.trim(),logoUrl:$('logoUrl').value.trim()||null,primaryColor:$('primaryColor').value.trim(),secondaryColor:$('secondaryColor').value.trim(),supportEmail:$('supportEmail').value.trim()||null,supportPhone:$('supportPhone').value.trim()||null,branchName:$('branchName').value.trim()||'Main Branch',branchCode:$('branchCode').value.trim()||'MAIN',apiBaseUrl:$('apiBaseUrl').value.trim()||null,address:$('address').value.trim()||null};
  const d=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(body)});$('formMsg').className='msg ok';$('formMsg').textContent='School created successfully: '+(d.school?.name||body.name);e.target.reset();$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';$('branchName').value='Main Branch';$('branchCode').value='MAIN';await load();
 }catch(err){$('formMsg').className='msg err';$('formMsg').textContent=err.message||'Could not create school'}};
 await load();
})();</script></body></html>
