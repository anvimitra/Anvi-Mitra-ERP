<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • School Management</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--brand:#24285f;--line:#e4e8f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--brand);color:white;font-weight:700;cursor:pointer}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}input{width:100%;padding:11px;border:1px solid #d5dbe6;border-radius:9px;font:inherit}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;margin-top:16px}.msg{margin-top:12px;font-size:13px}.ok{color:#087443}.err{color:#b42318}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}.muted{color:#667085;font-size:13px}.badge{padding:4px 8px;border-radius:999px;background:#eef1ff;font-size:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:14px}.table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><main class="wrap"><div class="top"><div><h1>School Management</h1><div class="muted">Super Admin • Add and manage schools</div></div><button class="btn" onclick="location.href='/erp/web/portal-dashboard.html'">Back to Dashboard</button></div><section class="panel"><h2>Add School</h2><p class="muted">Create the school profile first. A main branch, school settings and mobile-app configuration are created automatically by the backend.</p><form id="form"><div class="grid"><div><label>School Name *</label><input id="name" required placeholder="Example Public School"></div><div><label>School Code *</label><input id="code" required placeholder="SCHOOL001"></div><div><label>App Slug *</label><input id="appSlug" required placeholder="example-school"></div><div><label>Application ID</label><input id="androidPackage" placeholder="in.anvimitra.exampleschool"></div><div><label>Logo URL</label><input id="logoUrl" type="url" placeholder="https://..."></div><div><label>Support Email</label><input id="supportEmail" type="email" placeholder="admin@school.in"></div><div><label>Support Phone</label><input id="supportPhone" placeholder="9876543210"></div><div><label>Primary Color</label><input id="primaryColor" value="4F46E5" placeholder="4F46E5"></div><div><label>Secondary Color</label><input id="secondaryColor" value="0F1720" placeholder="0F1720"></div><div><label>Main Branch Name</label><input id="branchName" placeholder="Main Branch"></div></div><div class="actions"><button class="btn">Create School</button></div><div id="msg" class="msg"></div></form></section><section class="panel"><h2>Schools</h2><div class="muted" id="loading">Loading…</div><table class="table" id="table" style="display:none"><thead><tr><th>Name</th><th>Code</th><th>App Slug</th><th>Status</th><th>Created</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="/erp/web/api.js"></script><script>(async()=>{const token=LSKERP.token(),user=LSKERP.user();if(!token||user.role!=='super_admin'){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id);async function load(){try{const d=await LSKERP.request('/api/platform/schools');const schools=d.schools||[];$('loading').style.display='none';$('table').style.display='table';$('rows').innerHTML=schools.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.code)}</td><td>${esc(s.app_slug||'')}</td><td><span class="badge">${esc(s.status||'active')}</span></td><td>${s.created_at?new Date(s.created_at).toLocaleDateString():''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No schools created yet.</td></tr>'}catch(e){$('loading').textContent=e.message||'Could not load schools'}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('form').addEventListener('submit',async e=>{e.preventDefault();$('msg').className='msg';$('msg').textContent='Creating school…';try{const body={name:$('name').value.trim(),code:$('code').value.trim(),appSlug:$('appSlug').value.trim(),androidPackage:$('androidPackage').value.trim()||undefined,logoUrl:$('logoUrl').value.trim()||undefined,supportEmail:$('supportEmail').value.trim()||undefined,supportPhone:$('supportPhone').value.trim()||undefined,primaryColor:$('primaryColor').value.trim(),secondaryColor:$('secondaryColor').value.trim(),branchName:$('branchName').value.trim()||undefined};const d=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(body)});$('msg').className='msg ok';$('msg').textContent=`School created successfully: ${d.school?.name||body.name}`;e.target.reset();$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';await load()}catch(err){$('msg').className='msg err';$('msg').textContent=err.message||'Could not create school'}});load()})();</script></body></html>
