<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP - School Management</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--line:#e5eaf2;--brand:#172b55}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.top h1{margin:0;font-size:27px}.sub{color:#667085;font-size:13px;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 8px 28px #15203b08}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.field label{display:block;font-size:12px;font-weight:750;margin:0 0 6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d9dee8;border-radius:9px;font:inherit;background:#fff}.section-title{margin:20px 0 11px;font-size:14px;font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{padding:10px 14px;border:0;border-radius:9px;background:var(--brand);color:#fff;font:inherit;font-weight:750;cursor:pointer}.btn.secondary{background:#fff;color:#172033;border:1px solid #d9dee8}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{font-size:13px;margin-top:10px}.err{color:#b42318}.ok{color:#087443}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf0f4;font-size:13px;vertical-align:top}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:750}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:15px}.card{border:1px solid var(--line);border-radius:13px;padding:14px}.card .n{font-size:23px;font-weight:850}.muted{color:#667085;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.wrap{padding:14px}.grid,.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>School Management</h1><div class="sub">Super Admin • onboard schools, configure app identity and create the first school admin</div></div><button class="btn secondary" onclick="location.href='/erp/web/portal-dashboard.html?role=super_admin'">Back to Dashboard</button></div><section class="panel"><h2>Add School</h2><form id="f"><div class="section-title">School profile</div><div class="grid"><div class="field"><label>School Name *</label><input id="name" required></div><div class="field"><label>School Code *</label><input id="code" required></div><div class="field"><label>Display Name</label><input id="displayName"></div><div class="field"><label>Address</label><input id="address"></div><div class="field"><label>School Phone</label><input id="phone"></div><div class="field"><label>School Email</label><input id="email" type="email"></div><div class="field"><label>Logo URL</label><input id="logoUrl" placeholder="https://..."></div></div><div class="section-title">School app configuration</div><div class="grid"><div class="field"><label>App Name</label><input id="appName"></div><div class="field"><label>App Slug *</label><input id="appSlug" required placeholder="school-name"></div><div class="field"><label>Android Package</label><input id="androidPackage" placeholder="in.anvimitra.school"></div><div class="field"><label>iOS Bundle ID</label><input id="iosBundleId"></div><div class="field"><label>API Base URL</label><input id="apiBaseUrl" placeholder="https://erp.example.com"></div><div class="field"><label>Primary Color</label><input id="primaryColor" value="4F46E5"></div><div class="field"><label>Secondary Color</label><input id="secondaryColor" value="0F1720"></div><div class="field"><label>Minimum App Version</label><input id="minAppVersion" value="1.0.0"></div><div class="field"><label>Force Update</label><select id="forceUpdate"><option value="false">No</option><option value="true">Yes</option></select></div></div><div class="section-title">Main branch</div><div class="grid"><div class="field"><label>Branch Name</label><input id="branchName" value="Main Branch"></div><div class="field"><label>Branch Code</label><input id="branchCode" value="MAIN"></div></div><div class="section-title">Initial school admin</div><div class="grid"><div class="field"><label>Admin Name *</label><input id="initialAdminName" required></div><div class="field"><label>Admin Email</label><input id="initialAdminEmail" type="email"></div><div class="field"><label>Admin Phone</label><input id="initialAdminPhone"></div><div class="field"><label>Admin Password *</label><input id="initialAdminPassword" type="password" minlength="6" required></div></div><div class="actions"><button class="btn" id="create">Create School & Admin</button><button type="button" class="btn secondary" id="reset">Reset</button></div><div id="m" class="msg"></div></form></section><section class="panel"><div class="top"><div><h2 style="margin:0">Schools</h2><div class="sub">Existing schools registered in the central ERP</div></div><button class="btn secondary" id="refresh">Refresh</button></div><div class="cards" id="cards"></div><div class="table-wrap"><table class="table"><thead><tr><th>School</th><th>Code</th><th>App</th><th>Main branch</th><th>Contact</th><th>Created</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script src="/erp/web/api.js"></script><script>(async()=>{const u=LSKERP.user();if(!LSKERP.token()||(u.role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id);const v=id=>$(id).value.trim();function payload(){return{name:v('name'),code:v('code'),displayName:v('displayName')||v('name'),address:v('address')||null,phone:v('phone')||null,supportEmail:v('email')||null,logoUrl:v('logoUrl')||null,appName:v('appName')||`${v('name')} App`,appSlug:v('appSlug'),androidPackage:v('androidPackage')||null,iosBundleId:v('iosBundleId')||null,apiBaseUrl:v('apiBaseUrl')||null,primaryColor:v('primaryColor')||'4F46E5',secondaryColor:v('secondaryColor')||'0F1720',minAppVersion:v('minAppVersion')||'1.0.0',forceUpdate:v('forceUpdate')==='true',branchName:v('branchName')||'Main Branch',branchCode:v('branchCode')||'MAIN',initialAdminName:v('initialAdminName'),initialAdminEmail:v('initialAdminEmail')||null,initialAdminPhone:v('initialAdminPhone')||null,initialAdminPassword:v('initialAdminPassword')}}async function load(){try{const d=await LSKERP.request('/api/platform/schools');const list=d.schools||[];$('cards').innerHTML=`<div class="card"><div class="muted">Total schools</div><div class="n">${list.length}</div></div><div class="card"><div class="muted">Active schools</div><div class="n">${list.filter(s=>s.status==='active').length}</div></div><div class="card"><div class="muted">Configured apps</div><div class="n">${list.filter(s=>s.app_slug).length}</div></div><div class="card"><div class="muted">Role</div><div class="n" style="font-size:18px">Super Admin</div></div>`;$('rows').innerHTML=list.map(s=>`<tr><td><b>${s.display_name||s.name}</b><br><span class="muted">${s.address||'No address'}</span></td><td>${s.code}</td><td><b>${s.app_name||'-'}</b><br><span class="badge">${s.app_slug||'No slug'}</span></td><td>${s.branch_name||'-'}<br><span class="muted">${s.branch_code||'-'}</span></td><td>${s.email||s.phone||'-'}</td><td>${s.created_at?new Date(s.created_at).toLocaleDateString():'-'}</td><td><span class="badge">${s.status}</span></td></tr>`).join('')||'<tr><td colspan="7">No schools yet.</td></tr>'}catch(e){$('rows').innerHTML=`<tr><td colspan="7" class="err">${e.message}</td></tr>`}}$('f').onsubmit=async e=>{e.preventDefault();$('m').className='msg';$('m').textContent='Creating school and initial admin…';$('create').disabled=true;try{const r=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(payload())});$('m').className='msg ok';$('m').textContent=`School created: ${r.school?.display_name||r.school?.name||'success'}. Initial admin account is ready.`;$('f').reset();$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';$('branchName').value='Main Branch';$('branchCode').value='MAIN';$('minAppVersion').value='1.0.0';await load()}catch(e){$('m').className='msg err';$('m').textContent=e.message||'School creation failed'}finally{$('create').disabled=false}};$('reset').onclick=()=>{$('f').reset();$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';$('branchName').value='Main Branch';$('branchCode').value='MAIN';$('minAppVersion').value='1.0.0';$('m').textContent=''};$('refresh').onclick=load;load()})()</script></body></html>
