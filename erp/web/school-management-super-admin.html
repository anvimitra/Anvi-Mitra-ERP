<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP - Schools</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #d9dee8;border-radius:8px;box-sizing:border-box}.btn{padding:10px 14px;border:0;border-radius:9px;background:#172b55;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#172033;border:1px solid #d9dee8}.actions{display:flex;gap:10px;margin-top:14px}.top{display:flex;justify-content:space-between;align-items:center}.msg{font-size:13px;margin-top:10px}.err{color:#b42318}.ok{color:#087443}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #edf0f4;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>School Management</h1><div>Super Admin - create and monitor schools</div></div><button class="btn secondary" onclick="location.href='/erp/web/portal-dashboard.html?role=super_admin'">Back</button></div><section class="panel"><h2>Add School</h2><form id="f"><div class="grid"><div class="field"><label>School Name *</label><input id="name" required></div><div class="field"><label>School Code *</label><input id="code" required></div><div class="field"><label>Display Name</label><input id="displayName"></div><div class="field"><label>App Name</label><input id="appName"></div><div class="field"><label>App Slug *</label><input id="appSlug" required></div><div class="field"><label>Android Package</label><input id="androidPackage"></div><div class="field"><label>Logo URL</label><input id="logoUrl"></div><div class="field"><label>API Base URL</label><input id="apiBaseUrl"></div><div class="field"><label>Primary Color</label><input id="primaryColor" value="4F46E5"></div><div class="field"><label>Secondary Color</label><input id="secondaryColor" value="0F1720"></div><div class="field"><label>Support Phone</label><input id="supportPhone"></div><div class="field"><label>Support Email</label><input id="supportEmail"></div><div class="field"><label>Main Branch Name</label><input id="branchName" value="Main Branch"></div><div class="field"><label>Main Branch Code</label><input id="branchCode" value="MAIN"></div><div class="field"><label>Address</label><input id="address"></div><div class="field"><label>Minimum App Version</label><input id="minAppVersion" value="1.0.0"></div></div><div class="actions"><button class="btn">Create School</button><button type="button" class="btn secondary" onclick="location.reload()">Reset</button></div><div id="m" class="msg"></div></form></section><section class="panel"><div class="top"><h2>Schools</h2><button class="btn secondary" id="r">Refresh</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>School</th><th>Code</th><th>App</th><th>Branch</th><th>Support</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script src="/erp/web/api.js"></script><script>(async()=>{const u=LSKERP.user();if(!LSKERP.token()||(u.role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/login.html');return}const $=x=>document.getElementById(x),v=x=>$(x).value.trim();async function load(){try{const d=await LSKERP.request('/api/platform/schools');$('rows').innerHTML=(d.schools||[]).map(s=>`<tr><td>${s.display_name||s.name}</td><td>${s.code}</td><td>${s.app_name||'-'}<br><small>${s.app_slug||''}</small></td><td>${s.branch_name||'-'} (${s.branch_code||'-'})</td><td>${s.email||s.phone||'-'}</td><td>${s.status}</td></tr>`).join('')||'<tr><td colspan="6">No schools</td></tr>'}catch(e){$('rows').innerHTML=`<tr><td colspan="6">${e.message}</td></tr>`}}$('f').onsubmit=async e=>{e.preventDefault();$('m').textContent='Creating…';try{await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify({name:v('name'),code:v('code'),displayName:v('displayName')||v('name'),appName:v('appName')||v('name')+' App',appSlug:v('appSlug'),androidPackage:v('androidPackage')||null,logoUrl:v('logoUrl')||null,apiBaseUrl:v('apiBaseUrl')||null,primaryColor:v('primaryColor')||'4F46E5',secondaryColor:v('secondaryColor')||'0F1720',supportPhone:v('supportPhone')||null,supportEmail:v('supportEmail')||null,branchName:v('branchName')||'Main Branch',branchCode:v('branchCode')||'MAIN',address:v('address')||null,minAppVersion:v('minAppVersion')||'1.0.0'})});$('m').textContent='School created successfully.';$('m').className='msg ok';$('f').reset();load()}catch(e){$('m').textContent=e.message||'Create failed';$('m').className='msg err'}};$('r').onclick=load;load()})()</script></body></html>
