<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Fee Assignment - Anvi Mitra ERP</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:#fff;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #0001}input,select,button{padding:10px;margin:5px;border:1px solid #ccd3df;border-radius:8px}input,select{min-width:190px}button{cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.muted{color:#667085}.msg{padding:8px 5px;min-height:20px}.error{color:#b42318}.ok{color:#087443}.results{display:none;border:1px solid #e5e7eb;border-radius:10px;padding:10px}.student{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.field{display:flex;flex-direction:column}.field label{font-size:12px;color:#667085;margin:5px}.selected{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Student Fee Assignment</h1><div class="muted">Assign fee → generate installments → invoice → payment</div></div><a href="/erp/web/fee-center.html">← Fee Center</a></div><section class="card"><h3>1. Select Student</h3><input id="search" placeholder="Admission No. / Name"><button class="primary" onclick="findStudents()">Search</button><div id="msg" class="msg"></div><div id="results" class="results"></div><div id="selected" class="selected" style="display:none"></div></section><section class="card"><h3>2. Assign Fee</h3><div class="grid"><div class="field"><label>Session ID</label><input id="sessionId" placeholder="Session UUID"></div><div class="field"><label>Fee Head</label><select id="feeHead"><option value="">Select fee head</option></select></div><div class="field"><label>Amount</label><input id="amount" type="number" min="0" step="0.01"></div><div class="field"><label>Frequency</label><select id="frequency"><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="half_yearly">Half Yearly</option><option value="annual">Annual</option><option value="one_time">One Time</option></select></div><div class="field"><label>Start Date</label><input id="startDate" type="date"></div><div class="field"><label>Due Day</label><input id="dueDay" type="number" min="1" max="31" value="10"></div></div><button class="primary" onclick="assign(false)">Assign Fee</button><button onclick="assign(true)">Assign + Generate Installments</button><div id="assignMsg" class="msg"></div></section><section class="card"><h3>3. Generate Installments</h3><div class="grid"><div class="field"><label>From Date</label><input id="fromDate" type="date"></div><div class="field"><label>To Date</label><input id="toDate" type="date"></div></div><button class="primary" onclick="generateInstallments()">Generate Installments</button><div id="genMsg" class="msg"></div></section><section class="card"><h3>Existing Assignments</h3><button onclick="loadAssignments()">Refresh</button><div class="table-wrap"><table><thead><tr><th>Fee Head</th><th>Amount</th><th>Frequency</th><th>Start</th><th>Due Day</th><th>Status</th></tr></thead><tbody id="assignmentRows"><tr><td colspan="6" class="muted">Select a student first.</td></tr></tbody></table></div></section></div><script src="/erp/web/api.js"></script><script>const allowed=['super_admin','principal','admin','accountant','office_staff'];const u=typeof LSKERP!=='undefined'?LSKERP.user():{};if(!allowed.includes(String(u.role||'').toLowerCase()))document.body.innerHTML='<div class="wrap"><div class="card"><h2>Access denied</h2><p>Finance access is required.</p></div></div>';let studentId=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function setMsg(id,text,cls=''){const x=$(id);x.textContent=text;x.className='msg '+cls}async function findStudents(){const q=$('search').value.trim();if(!q)return setMsg('msg','Enter admission number or student name.','error');try{setMsg('msg','Searching…');const d=await LSKERP.request('/api/students/search?q='+encodeURIComponent(q));const list=d.students||[];const box=$('results');if(!list.length){box.style.display='none';return setMsg('msg','No student found.','error')}box.style.display='block';box.innerHTML=list.map(s=>`<div class="student"><div><b>${esc(s.fullName)}</b><br><span class="muted">Admission: ${esc(s.admissionNo||'—')}</span></div><button onclick="selectStudent('${encodeURIComponent(s.id)}','${encodeURIComponent(s.fullName||'Student')}','${encodeURIComponent(s.admissionNo||'')}')">Select</button></div>`).join('');setMsg('msg',list.length+' student(s) found.','ok')}catch(e){setMsg('msg',e.message||'Search failed.','error')}}function selectStudent(id,name,adm){studentId=decodeURIComponent(id);$('selected').style.display='block';$('selected').innerHTML='<b>Selected Student</b><br>'+esc(decodeURIComponent(name))+' — Admission: '+esc(decodeURIComponent(adm));$('results').style.display='none';loadAssignments()}async function loadHeads(){try{const d=await LSKERP.request('/api/fee-heads');$('feeHead').innerHTML='<option value="">Select fee head</option>'+(d.feeHeads||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${esc(x.code)})</option>`).join('')}catch(e){setMsg('assignMsg',e.message||'Could not load fee heads.','error')}}async function assign(andGenerate){if(!studentId)return setMsg('assignMsg','Select a student first.','error');const body={studentId,sessionId:$('sessionId').value.trim(),feeHeadId:$('feeHead').value,amount:Number($('amount').value),frequency:$('frequency').value,startDate:$('startDate').value,dueDay:$('dueDay').value?Number($('dueDay').value):null};if(!body.sessionId||!body.feeHeadId||!body.startDate||Number.isNaN(body.amount))return setMsg('assignMsg','Session, fee head, amount and start date are required.','error');try{setMsg('assignMsg','Saving…');await LSKERP.request('/api/fees/assignments',{method:'POST',body:JSON.stringify(body)});setMsg('assignMsg','Fee assignment created successfully.','ok');loadAssignments();if(andGenerate)await generateInstallments()}catch(e){setMsg('assignMsg',e.message||'Assignment failed.','error')}}async function generateInstallments(){if(!studentId)return setMsg('genMsg','Select a student first.','error');const sid=$('sessionId').value.trim(),from=$('fromDate').value,to=$('toDate').value;if(!sid||!from||!to)return setMsg('genMsg','Session, From Date and To Date are required.','error');try{setMsg('genMsg','Generating installments…');const d=await LSKERP.request('/api/fees/installments/generate',{method:'POST',body:JSON.stringify({sessionId:sid,studentId,fromDate:from,toDate:to})});setMsg('genMsg',`Generated ${d.generated||0} installment(s) from ${d.assignments||0} assignment(s).`,'ok')}catch(e){setMsg('genMsg',e.message||'Generation failed.','error')}}async function loadAssignments(){if(!studentId)return;try{const d=await LSKERP.request('/api/fees/assignments/student/'+encodeURIComponent(studentId));const list=d.assignments||[];$('assignmentRows').innerHTML=list.map(x=>`<tr><td>${esc(x.feeHeadName)}</td><td>₹${Number(x.amount||0).toFixed(2)}</td><td>${esc(x.frequency)}</td><td>${esc(x.startDate)}</td><td>${esc(x.dueDay||'—')}</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No assignments found.</td></tr>'}catch(e){setMsg('assignMsg',e.message||'Could not load assignments.','error')}}loadHeads();$('search').addEventListener('keydown',e=>{if(e.key==='Enter')findStudents()});</script></body></html>
