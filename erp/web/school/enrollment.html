<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enrollment · Anvi Mitra ERP</title><style>:root{--p:#4f46e5;--c:#06b6d4;--bg:#f5f7fb;--ink:#172033;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 90% 0,#cffafe,transparent 28%),var(--bg);color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{padding:28px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#111827,#3730a3 55%,#0891b2);box-shadow:0 20px 55px #11182726}.hero h1{margin:0 0 7px}.hero p{margin:0;color:#dbeafe}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 24px #1118270b}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.fields label{font-size:12px;font-weight:800}.fields input,.fields select{width:100%;margin-top:6px;padding:11px;border:1px solid #d7dce7;border-radius:10px;background:#fff}.full{grid-column:1/-1}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--p),var(--c));color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.muted{color:var(--muted)}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:#ecfdf3;color:#027a48;font-size:11px;font-weight:900}.hidden{display:none}.toast{position:fixed;right:18px;bottom:18px;padding:13px 16px;background:#111827;color:#fff;border-radius:13px;box-shadow:0 15px 45px #0005}.check{display:flex;gap:8px;align-items:center;font-size:12px}.check input{width:auto}.section{grid-column:1/-1;border-top:1px solid var(--line);padding-top:15px;font-weight:900}@media(max-width:800px){.fields{grid-template-columns:1fr 1fr}}@media(max-width:540px){.fields{grid-template-columns:1fr}.full,.section{grid-column:auto}}</style></head><body><div class="wrap"><section class="hero"><h1>Student Enrollment</h1><p>Enroll students into the correct school, branch, session, class and section with parent linking.</p></section><div class="bar"><span id="status" class="muted">Loading…</span><a class="btn ghost" href="/super-admin/schools">← School Management</a><button class="btn primary" onclick="formCard.classList.toggle('hidden')">＋ Enroll Student</button></div><section id="formCard" class="card hidden"><form onsubmit="save(event)"><div class="fields"><div class="section">Student</div><label>Full name<input id="fullName" required></label><label>Admission No<input id="admissionNo" required></label><label>Roll No<input id="rollNo"></label><label>Date of birth<input id="dateOfBirth" type="date"></label><label>Gender<select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label><label>Photo URL<input id="photoUrl"></label><div class="section">Academic placement</div><label>Branch<select id="branch"></select></label><label>Academic session<select id="session" required></select></label><label>Class / Section<select id="section" required></select></label><div class="section">Parent links</div><label class="check"><input id="parentLink" type="checkbox"> Link parent after enrollment</label><label>Parent user ID<input id="parentUserId" placeholder="Optional parent user UUID"></label><label>Relation<input id="relation" value="guardian"></label></div><div class="bar"><span id="formStatus" class="muted"></span><button class="btn primary">Save Enrollment</button></div></form></section><div class="bar"><h2>Enrolled Students</h2><input id="q" placeholder="Search name or admission no…" style="width:min(320px,100%);padding:11px;border:1px solid #d7dce7;border-radius:10px"></div><div id="grid" class="grid"></div></div><script>
let masters={},students=[];const token=()=>localStorage.getItem('accessToken')||localStorage.getItem('token')||sessionStorage.getItem('lsk_access_token')||'';async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token(),'Content-Type':'application/json'};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=document.getElementById('q').value.toLowerCase();grid.innerHTML=students.filter(s=>(s.fullName+' '+s.admissionNo).toLowerCase().includes(q)).map(s=>'<article class="card"><h3>'+esc(s.fullName)+'</h3><p class="muted">Admission: '+esc(s.admissionNo)+' • Roll: '+esc(s.rollNo||'—')+'</p><p>'+esc(s.className||'Unassigned')+' / '+esc(s.sectionName||'—')+'</p><p class="muted">'+esc(s.sessionName||'')+(s.branchName?' • '+esc(s.branchName):'')+'</p><span class="pill">'+esc(s.status)+'</span></article>').join('')||'<div class="card">No students found.</div>'}async function load(){try{masters=await api('/api/enrollment/masters');students=(await api('/api/enrollment/students')).students||[];branch.innerHTML=(masters.branches||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');session.innerHTML=(masters.sessions||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+(x.isCurrent?' • Current':'')+'</option>').join('');section.innerHTML=(masters.sections||[]).map(x=>'<option value="'+x.id+'">'+esc(x.className)+' — '+esc(x.name)+'</option>').join('');status.textContent=students.length+' student(s) loaded';render()}catch(e){status.textContent=e.message}}async function save(e){e.preventDefault();const b={fullName:fullName.value,admissionNo:admissionNo.value,rollNo:rollNo.value,dateOfBirth:dateOfBirth.value||null,gender:gender.value||null,photoUrl:photoUrl.value||null,branchId:branch.value||null,sessionId:session.value,sectionId:section.value};if(parentLink.checked&&parentUserId.value.trim())b.parents=[{userId:parentUserId.value.trim(),relation:relation.value||'guardian',isPrimary:true}];formStatus.textContent='Saving…';try{await api('/api/enrollment/students',{method:'POST',body:JSON.stringify(b)});formStatus.textContent='Enrollment saved';e.target.reset();parentLink.checked=false;await load()}catch(err){formStatus.textContent=err.message}}q.oninput=render;load();
</script></body></html>
