<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Management · Anvi Mitra ERP</title>
<style>
:root{--p:#4f46e5;--c:#06b6d4;--bg:#f4f7fb;--ink:#172033;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 90% 0,#cffafe,transparent 28%),var(--bg);color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{padding:30px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#111827,#3730a3 55%,#0891b2);box-shadow:0 20px 55px #11182726}.hero h1{margin:0 0 7px}.hero p{margin:0;color:#dbeafe}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 24px #1118270b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.fields label{font-size:12px;font-weight:800}.fields input,.fields select{width:100%;margin-top:6px;padding:11px;border:1px solid #d7dce7;border-radius:10px;background:#fff}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--p),var(--c));color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.badge{display:inline-flex;padding:5px 9px;border-radius:99px;background:#ecfdf3;color:#027a48;font-size:11px;font-weight:900}.muted{color:var(--muted)}.full,.section{grid-column:1/-1}.section{border-top:1px solid var(--line);padding-top:14px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.open{display:flex}.panel{background:#fff;padding:24px;border-radius:24px;width:min(680px,100%);max-height:92vh;overflow:auto}@media(max-width:620px){.fields{grid-template-columns:1fr}.full,.section{grid-column:auto}}
</style></head><body><div class="wrap"><section class="hero"><h1>Staff Management</h1><p>School-wide staff accounts with branch-aware roles and teacher identity provisioning.</p></section>
<div class="bar"><div class="tools"><input id="q" placeholder="Search staff…" oninput="render()" style="padding:11px;border:1px solid #d7dce7;border-radius:10px;width:min(330px,100%)"><span id="net" class="muted"></span></div><button class="btn primary" onclick="openModal()">＋ Add Staff</button></div>
<div id="status" class="card muted">Loading…</div><div id="grid" class="grid"></div></div>
<div id="modal" class="modal"><div class="panel"><div class="bar"><div><h2 style="margin:0">Add Staff</h2><span class="muted">Teacher accounts automatically receive a teacher profile.</span></div><button class="btn ghost" onclick="closeModal()">✕</button></div>
<form onsubmit="save(event)"><div class="fields"><div class="section">Account</div><label>Email<input id="email" type="email"></label><label>Phone<input id="phone"></label><label>Role<select id="role"><option value="teacher">Teacher</option><option value="office_staff">Office Staff</option><option value="accountant">Accountant</option><option value="driver">Driver</option><option value="admin">Admin</option></select></label><label>Branch<select id="branch"></select></label><label>Password<input id="password" type="password" minlength="6" required></label></div><div class="bar"><span id="formStatus" class="muted"></span><button id="saveBtn" class="btn primary">Create Staff</button></div></form></div></div>
<script>
let staff=[],branches=[];const token=()=>localStorage.getItem('accessToken')||localStorage.getItem('token')||sessionStorage.getItem('lsk_access_token')||'';
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token(),'Content-Type':'application/json'};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=document.getElementById('q').value.toLowerCase();grid.innerHTML=staff.filter(s=>(s.email+' '+s.phone+' '+s.role+' '+s.branchName).toLowerCase().includes(q)).map(s=>`<article class="card"><div class="bar" style="margin:0 0 10px"><div><h3 style="margin:0">${esc(s.email||s.phone||'Staff')}</h3><span class="muted">${esc(s.branchName||'School-wide')}</span></div><span class="badge">${esc(s.status)}</span></div><p><b>${esc(s.role)}</b></p><small class="muted">Last login: ${esc(s.lastLoginAt||'Never')}</small></article>`).join('')||'<div class="card">No staff found.</div>'}
function openModal(){modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}
async function load(){try{const [s,b]=await Promise.all([api('/api/staff'),api('/api/branches')]);staff=s.staff||[];branches=b.branches||[];branch.innerHTML='<option value="">School-wide</option>'+branches.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');status.textContent=`${staff.length} staff account(s) • teacher accounts get assignment-ready profiles`;render();net.textContent=navigator.onLine?'● Online':'○ Offline'}catch(e){status.textContent=e.message}}
async function save(e){e.preventDefault();if(!email.value.trim()&&!phone.value.trim()){formStatus.textContent='Provide email or phone';return}saveBtn.disabled=true;formStatus.textContent='Creating…';try{await api('/api/staff',{method:'POST',body:JSON.stringify({email:email.value.trim(),phone:phone.value.trim(),role:role.value,branchId:branch.value||null,password:password.value})});formStatus.textContent='Staff created';e.target.reset();setTimeout(()=>{closeModal();formStatus.textContent='';load()},350)}catch(err){formStatus.textContent=err.message}finally{saveBtn.disabled=false}}
addEventListener('online',()=>net.textContent='● Online');addEventListener('offline',()=>net.textContent='○ Offline');load();
</script></body></html>
