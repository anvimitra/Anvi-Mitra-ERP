<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Schools</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e3e7ef;border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}input{width:100%;padding:10px;margin:5px 0 10px;box-sizing:border-box;border:1px solid #d5dbe6;border-radius:8px}label{font-size:12px;font-weight:700}button{padding:11px 16px;border:0;border-radius:8px;background:#24285f;color:#fff;font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px}.err{color:#b42318}.ok{color:#087443}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>🏫 School Management</h1><p>Super Admin • Add and manage schools for Anvi Mitra ERP</p><div class="grid"><section class="card"><h2>Add School</h2><label>School name *</label><input id="name" placeholder="Example Public School"><label>School code *</label><input id="code" placeholder="EXAMPLE"><label>Display name</label><input id="displayName"><label>Address</label><input id="address"><label>Phone</label><input id="phone"><label>Support email</label><input id="supportEmail"><label>Logo URL</label><input id="logoUrl" type="url"><label>App name</label><input id="appName"><label>App slug *</label><input id="appSlug" placeholder="example-school"><label>Android package</label><input id="androidPackage" placeholder="in.anvimitra.exampleschool"><label>Primary color</label><input id="primaryColor" value="4F46E5"><label>Secondary color</label><input id="secondaryColor" value="0F1720"><button id="create">Create School</button><p id="msg"></p></section><section class="card"><h2>Registered Schools</h2><table><thead><tr><th>School</th><th>Code</th><th>Branch</th><th>App</th><th>Status</th></tr></thead><tbody id="schools"><tr><td colspan="5">Loading…</td></tr></tbody></table><p id="listError" class="err"></p></section></div></div><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(role!=='super_admin'){location.replace('/erp/web/portal-dashboard.html');return}const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){try{const d=await LSKERP.request('/api/platform/schools');$('schools').innerHTML=(d.schools||[]).map(s=>`<tr><td><b>${esc(s.display_name||s.name)}</b></td><td>${esc(s.code)}</td><td>${esc(s.branch_name||'')}</td><td>${esc(s.app_name||'')}<br><small>${esc(s.app_slug||'')}</small></td><td>${esc(s.status||'active')}</td></tr>`).join('')||'<tr><td colspan="5">No schools yet.</td></tr>'}catch(e){$('listError').textContent=e.message}}$('create').onclick=async()=>{const p={name:$('name').value.trim(),code:$('code').value.trim(),displayName:$('displayName').value.trim(),address:$('address').value.trim(),phone:$('phone').value.trim(),supportEmail:$('supportEmail').value.trim(),logoUrl:$('logoUrl').value.trim(),appName:$('appName').value.trim(),appSlug:$('appSlug').value.trim(),androidPackage:$('androidPackage').value.trim(),primaryColor:$('primaryColor').value.trim(),secondaryColor:$('secondaryColor').value.trim()};if(!p.name||!p.code||!p.appSlug){$('msg').textContent='Name, code and app slug are required';$('msg').className='err';return}try{await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(p)});$('msg').textContent='School created successfully';$('msg').className='ok';await load()}catch(e){$('msg').textContent=e.message;$('msg').className='err'}};await load()})();</script></body></html>
