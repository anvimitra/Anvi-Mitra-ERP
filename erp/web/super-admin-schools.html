<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Schools</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--brand:#4f46e5;--line:#e4e8f0;--muted:#667085}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:linear-gradient(160deg,#10162d,#24275a);color:#fff;padding:22px}.brand{font-size:20px;font-weight:850}.sub{font-size:11px;color:#b8c2e5;margin:5px 0 28px}.nav{display:grid;gap:7px}.nav a{color:#d9e2ff;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px}.nav a:hover,.nav a.active{background:#ffffff14;color:#fff}.main{padding:25px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0;font-size:27px}.role{font-size:13px;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px}.hero{background:linear-gradient(120deg,#24285f,#6046c8);color:#fff;border-radius:20px;padding:22px;margin-bottom:18px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#e6e8ff;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,.8fr);gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.panel h2{font-size:17px;margin:0 0 14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:700}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:700}.form input,.form textarea{width:100%;padding:10px;border:1px solid #d9dee8;border-radius:9px;font:inherit}.form textarea{min-height:60px;resize:vertical}.button{padding:11px 14px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:750;cursor:pointer}.button:disabled{opacity:.6}.msg{font-size:12px;margin-top:9px}.error{color:#b42318}.ok{color:#087443}.empty{padding:25px;text-align:center;color:var(--muted);font-size:13px}.logout{margin-top:18px;width:100%;padding:10px;border:1px solid #415078;background:transparent;color:#fff;border-radius:9px;cursor:pointer}@media(max-width:950px){.app{grid-template-columns:1fr}.side{padding:12px;position:sticky;top:0;z-index:2}.nav{display:flex;overflow:auto}.layout{grid-template-columns:1fr}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="brand">Anvi Mitra ERP</div><div class="sub">Super Admin • School Management</div><nav class="nav"><a class="active" href="/erp/web/super-admin-schools.html">Schools</a><a href="/erp/web/portal-dashboard.html">ERP Dashboard</a></nav><button class="logout" id="logout">Logout</button></aside><main class="main"><div class="top"><h1>Schools</h1><div class="role" id="role">Role: —</div></div><section class="hero"><h2>School onboarding</h2><p>Create a school and its main branch/app configuration. Staff and students can be onboarded inside that isolated school workspace.</p></section><div class="layout"><section class="panel"><h2>All schools</h2><div class="table-wrap"><table class="table"><thead><tr><th>School</th><th>Code</th><th>Main branch</th><th>App</th><th>Status</th></tr></thead><tbody id="schoolRows"></tbody></table></div><div class="msg" id="listMsg"></div></section><section class="panel"><h2>Add school</h2><form class="form" id="schoolForm"><label>School name<input id="name" required maxlength="200" placeholder="Example Public School"></label><label>School code<input id="code" required maxlength="50" placeholder="SCHOOL001"></label><label>Display name<textarea id="displayName" maxlength="200" placeholder="Optional display name"></textarea></label><label>ERP app name<input id="appName" maxlength="120" placeholder="Example School App"></label><label>App slug<input id="appSlug" required maxlength="100" placeholder="example-school"></label><label>Android application ID<input id="androidPackage" maxlength="200" placeholder="in.anvimitra.example"></label><label>Logo URL<input id="logoUrl" type="url" maxlength="1000" placeholder="https://..."></label><label>Primary color<input id="primaryColor" maxlength="20" value="4F46E5"></label><label>Secondary color<input id="secondaryColor" maxlength="20" value="0F1720"></label><label>Main branch name<input id="branchName" maxlength="200" value="Main Branch"></label><label>Main branch code<input id="branchCode" maxlength="50" value="MAIN"></label><button class="button" id="saveBtn">Create school</button><div class="msg" id="formMsg"></div></form></section></div></main></div><script src="/erp/web/api.js"></script><script>(async()=>{const token=LSKERP.token();if(!token){location.replace('/erp/web/login.html');return}const user=LSKERP.user();const role=(user.role||'').toLowerCase();document.getElementById('role').textContent='Role: '+(role||'—');const msg=document.getElementById('formMsg');const btn=document.getElementById('saveBtn');if(role!=='super_admin'){msg.className='msg error';msg.textContent='Super Admin permission required.';btn.disabled=true}document.getElementById('logout').onclick=()=>{sessionStorage.clear();location.replace('/erp/web/login.html')};function esc(v){return String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}async function load(){const lm=document.getElementById('listMsg');lm.textContent='Loading schools…';try{const d=await LSKERP.request('/api/platform/schools');const rows=d.schools||[];document.getElementById('schoolRows').innerHTML=rows.length?rows.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="msg">${esc(s.display_name)}</div></td><td>${esc(s.code)}</td><td>${esc(s.branch_name||'—')}</td><td><span class="badge">${esc(s.app_slug||'—')}</span></td><td>${esc(s.status||'—')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No schools found.</td></tr>';lm.className='msg ok';lm.textContent=`${rows.length} school(s)`}catch(e){lm.className='msg error';lm.textContent=e.message||'Could not load schools'}}document.getElementById('schoolForm').addEventListener('submit',async e=>{e.preventDefault();if(role!=='super_admin')return;btn.disabled=true;msg.className='msg';msg.textContent='Creating school…';try{const p={name:name.value.trim(),code:code.value.trim(),displayName:displayName.value.trim()||undefined,appName:appName.value.trim()||undefined,appSlug:appSlug.value.trim(),androidPackage:androidPackage.value.trim()||undefined,logoUrl:logoUrl.value.trim()||undefined,primaryColor:primaryColor.value.trim()||'4F46E5',secondaryColor:secondaryColor.value.trim()||'0F1720',branchName:branchName.value.trim()||'Main Branch',branchCode:branchCode.value.trim()||'MAIN'};const d=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(p)});msg.className='msg ok';msg.textContent=`School created: ${d.school?.name||p.name}`;e.target.reset();primaryColor.value='4F46E5';secondaryColor.value='0F1720';branchName.value='Main Branch';branchCode.value='MAIN';await load()}catch(err){msg.className='msg error';msg.textContent=err.message||'School creation failed'}finally{btn.disabled=false}});load()})();</script></body></html>
