<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP · Schools</title><style>:root{--p:#315efb;--bg:#f4f7ff;--card:#fff;--line:#e5e9f2;--muted:#687287}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8faff,#edf2ff);font-family:system-ui;color:#172033}.wrap{max-width:1150px;margin:auto;padding:28px}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 35px #1f305c12}.toolbar{display:flex;gap:10px}.toolbar input{flex:1}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;font:inherit}label{font-size:12px;font-weight:700;color:#526078}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}form{display:grid;gap:10px}.school{display:flex;justify-content:space-between;padding:14px;border:1px solid var(--line);border-radius:14px;margin-top:9px;transition:.2s}.school:hover{transform:translateY(-2px);box-shadow:0 8px 22px #1f305c12}.school small{display:block;color:var(--muted);margin-top:3px}.badge{background:#e8fbf2;color:#128457;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:700}.off{background:#fff0f0;color:#c23c3c}button{border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.msg{padding:9px;border-radius:10px;background:#edf3ff;color:#315efb}.err{background:#fff0f0;color:#c23c3c}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.hero{align-items:flex-start;gap:12px;flex-direction:column}}</style></head><body><main class="wrap"><div class="hero"><div><h1>School Management</h1><div style="color:#687287">Super Admin · multi-school provisioning</div></div><button class="ghost" onclick="load()">↻ Refresh</button></div><div class="grid"><section class="card"><div class="toolbar"><input id="q" placeholder="Search school…" oninput="render()"></div><div id="list">Loading…</div></section><section class="card"><h2>Add School</h2><div id="msg"></div><form id="form"><div class="row"><div><label>School Name *</label><input name="name" required></div><div><label>School Code *</label><input name="code" required></div></div><div><label>Display Name</label><input name="displayName"></div><div class="row"><div><label>Logo URL</label><input name="logoUrl"></div><div><label>App Slug *</label><input name="appSlug" required placeholder="lsk-academy"></div></div><div class="row"><div><label>Phone</label><input name="phone"></div><div><label>Email</label><input name="email" type="email"></div></div><div><label>Address</label><input name="address"></div><div class="row"><div><label>Main Branch</label><input name="mainBranchName" value="Main Branch"></div><div><label>Branch Code</label><input name="mainBranchCode" value="MAIN"></div></div><div class="row"><div><label>Timezone</label><input name="timezone" value="Asia/Kolkata"></div><div><label>Currency</label><input name="currencyCode" value="INR"></div></div><div class="row"><div><label>App Name</label><input name="appName"></div><div><label>API Base URL</label><input name="apiBaseUrl"></div></div><button class="primary">Create School</button></form></section></div></main><script>let schools=[];const token=()=>localStorage.getItem('accessToken')||sessionStorage.getItem('accessToken')||'';const h=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token()});const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=(document.querySelector('#q').value||'').toLowerCase();const a=schools.filter(s=>(s.name+' '+s.code+' '+(s.displayName||'')).toLowerCase().includes(q));document.querySelector('#list').innerHTML=a.length?a.map(s=>'<div class="school"><div><b>'+esc(s.displayName||s.name)+'</b><small>'+esc(s.code)+' · '+esc(s.appSlug||'no app slug')+'</small></div><span class="badge '+(s.status==='active'?'':'off')+'">'+esc(s.status)+'</span></div>').join(''):'<p style="color:#687287">No schools found.</p>'}async function load(){try{const r=await fetch('/api/platform/schools',{headers:h()});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load schools');schools=d.schools||[];render()}catch(e){document.querySelector('#list').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));if(!b.displayName)b.displayName=b.name;if(!b.appName)b.appName=b.displayName;try{document.querySelector('#msg').className='msg';document.querySelector('#msg').textContent='Creating…';const r=await fetch('/api/platform/schools',{method:'POST',headers:h(),body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw Error(d.error||'Creation failed');document.querySelector('#msg').textContent='School created successfully.';e.target.reset();schools.unshift(d.school);render()}catch(x){document.querySelector('#msg').className='msg err';document.querySelector('#msg').textContent=x.message}};load();</script></body></html>
