<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Super Admin • Schools</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--line:#e5eaf2;--brand:#4f46e5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:28px}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#eef2ff;color:#312e81}.layout{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 28px #17203b08}.card h2{margin:0 0 15px;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;font-weight:700;margin:11px 0 5px}input,select{width:100%;padding:10px;border:1px solid #d9dee8;border-radius:9px;font:inherit}.full{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:16px}.msg{font-size:13px;margin-top:12px}.ok{color:#087443}.err{color:#b42318}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf0f5;font-size:13px}.table th{font-size:11px;color:#667085;text-transform:uppercase}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#ecfdf3;color:#067647;font-size:11px;font-weight:700}.muted{color:#667085;font-size:12px}.empty{padding:35px;text-align:center;color:#667085}@media(max-width:900px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="top"><div><h1>School Management</h1><div class="muted">Super Admin • Create and manage schools</div></div><button class="btn secondary" id="back">ERP Dashboard</button></div><div class="layout"><section class="card"><h2>Add School</h2><form id="schoolForm"><div class="grid"><div><label>School Name *</label><input id="name" required></div><div><label>School Code *</label><input id="code" required></div><div><label>Display Name</label><input id="displayName"></div><div><label>App Name</label><input id="appName"></div><div><label>App Slug *</label><input id="appSlug" placeholder="school-name" required></div><div><label>Android Package</label><input id="androidPackage" placeholder="in.anvimitra.school"></div><div><label>iOS Bundle ID</label><input id="iosBundleId"></div><div><label>API Base URL</label><input id="apiBaseUrl" placeholder="https://api.example.com"></div><div class="full"><label>Logo URL</label><input id="logoUrl" placeholder="https://..."></div><div><label>Primary Color</label><input id="primaryColor" placeholder="4F46E5"></div><div><label>Secondary Color</label><input id="secondaryColor" placeholder="0F1720"></div><div><label>Phone</label><input id="phone"></div><div><label>Email</label><input id="email" type="email"></div><div class="full"><label>Address</label><input id="address"></div><div><label>Website</label><input id="website"></div><div><label>Timezone</label><input id="timezone" value="Asia/Kolkata"></div><div><label>Main Branch Name</label><input id="mainBranchName" value="Main Branch"></div><div><label>Main Branch Code</label><input id="mainBranchCode" value="MAIN"></div></div><div class="actions"><button class="btn" type="submit">Create School</button><button class="btn secondary" type="button" id="clear">Clear</button></div><div id="msg" class="msg"></div></form></section><section class="card"><h2>Schools</h2><div id="list" class="table-wrap"><div class="empty">Loading schools…</div></div></section></div></div><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const user=LSKERP.user();if((user.role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/portal-dashboard.html');return}const $=id=>document.getElementById(id);$('back').onclick=()=>location.href='/erp/web/portal-dashboard.html';$('clear').onclick=()=>$('schoolForm').reset();function val(id){return $(id).value.trim()}function render(schools){if(!schools.length){$('list').innerHTML='<div class="empty">No schools created yet.</div>';return}$('list').innerHTML='<table class="table"><thead><tr><th>School</th><th>Code</th><th>App</th><th>Android</th><th>Branch</th><th>Status</th></tr></thead><tbody>'+schools.map(s=>`<tr><td><b>${s.displayName||s.name}</b><div class="muted">${s.address||''}</div></td><td>${s.code}</td><td>${s.appName||'-'}<div class="muted">${s.appSlug||''}</div></td><td>${s.androidPackage||'-'}</td><td>Configured</td><td><span class="pill">${s.status}</span></td></tr>`).join('')+'</tbody></table>'}async function load(){try{const d=await LSKERP.request('/api/platform/schools');render(d.schools||[])}catch(e){$('list').innerHTML='<div class="empty err">'+(e.message||'Could not load schools')+'</div>'}}$('schoolForm').addEventListener('submit',async e=>{e.preventDefault();$('msg').className='msg';$('msg').textContent='Creating school…';const body={name:val('name'),code:val('code'),displayName:val('displayName'),appName:val('appName'),appSlug:val('appSlug'),androidPackage:val('androidPackage')||null,iosBundleId:val('iosBundleId')||null,apiBaseUrl:val('apiBaseUrl')||null,logoUrl:val('logoUrl')||null,primaryColor:val('primaryColor')||null,secondaryColor:val('secondaryColor')||null,phone:val('phone')||null,email:val('email')||null,address:val('address')||null,website:val('website')||null,timezone:val('timezone')||'Asia/Kolkata',mainBranchName:val('mainBranchName')||'Main Branch',mainBranchCode:val('mainBranchCode')||'MAIN'};try{const d=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(body)});$('msg').className='msg ok';$('msg').textContent=d.message||'School created successfully';$('schoolForm').reset();$('timezone').value='Asia/Kolkata';$('mainBranchName').value='Main Branch';$('mainBranchCode').value='MAIN';await load()}catch(e){$('msg').className='msg err';$('msg').textContent=e.message||'School creation failed'}});load()})();</script></body></html>
