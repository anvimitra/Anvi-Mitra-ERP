<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • School Management</title>
<style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--brand:#5146c7;--line:#e4e8f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.title h1{margin:0;font-size:26px}.title p{margin:5px 0 0;color:#667085;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.panel h2{margin:0 0 14px;font-size:18px}.search{width:100%;padding:11px 12px;border:1px solid #d8deea;border-radius:10px;font:inherit;margin-bottom:12px}.school{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}.school:hover,.school.active{border-color:#9a91ed;background:#faf9ff}.school strong{display:block}.meta{font-size:12px;color:#667085;margin-top:5px}.badge{display:inline-block;font-size:11px;border-radius:999px;padding:4px 8px;background:#eef0ff;margin-top:8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field input{width:100%;padding:10px;border:1px solid #d8deea;border-radius:9px;font:inherit}.check{display:flex!important;gap:8px;align-items:center;font-size:13px}.msg{font-size:13px;margin-top:12px}.ok{color:#087443}.err{color:#b42318}.details{margin-top:18px}.kv{display:grid;grid-template-columns:145px 1fr;gap:7px;font-size:13px;border-bottom:1px solid #eef0f4;padding:8px 0}.kv b{color:#667085}.empty{color:#667085;font-size:13px;padding:25px;text-align:center}@media(max-width:900px){.layout{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.kv{grid-template-columns:120px 1fr}}
</style></head><body><main class="wrap">
<div class="top"><div class="title"><h1>🏫 Super Admin • School Management</h1><p>Add school → configure ERP/app identity → create the main branch → then enroll staff and students.</p></div><div class="actions"><button class="btn" onclick="location.href='/erp/web/portal-dashboard.html?role=super_admin'">Dashboard</button><button class="btn primary" id="newBtn">+ Add School</button></div></div>
<div class="layout"><section class="panel"><h2>Schools</h2><input class="search" id="search" placeholder="Search school name, display name or code…"><div id="list" class="empty">Loading schools…</div></section>
<section class="panel"><h2 id="formTitle">Add School</h2><form id="schoolForm"><div class="form">
<div class="field"><label>School Name *</label><input id="name" required maxlength="200"></div><div class="field"><label>School Code *</label><input id="code" required maxlength="50" placeholder="LSK001"></div>
<div class="field"><label>Display Name</label><input id="displayName" maxlength="200"></div><div class="field"><label>ERP App Name</label><input id="appName" maxlength="200" placeholder="School Name App"></div>
<div class="field"><label>App Slug *</label><input id="appSlug" required maxlength="100" placeholder="school-slug"></div><div class="field"><label>Android Package</label><input id="androidPackage" maxlength="200" placeholder="in.anvimitra.school"></div>
<div class="field"><label>iOS Bundle ID</label><input id="iosBundleId" maxlength="200"></div><div class="field"><label>API Base URL</label><input id="apiBaseUrl" maxlength="500" placeholder="https://erp.example.com"></div>
<div class="field full"><label>Address</label><input id="address" maxlength="500"></div><div class="field"><label>Phone</label><input id="phone" maxlength="50"></div><div class="field"><label>Support Email</label><input id="supportEmail" type="email" maxlength="200"></div>
<div class="field"><label>Support Phone</label><input id="supportPhone" maxlength="50"></div><div class="field"><label>Logo URL</label><input id="logoUrl" type="url" maxlength="1000" placeholder="https://…/logo.png"></div>
<div class="field"><label>Primary Color</label><input id="primaryColor" maxlength="6" value="4F46E5"></div><div class="field"><label>Secondary Color</label><input id="secondaryColor" maxlength="6" value="0F1720"></div>
<div class="field"><label>Main Branch Name</label><input id="branchName" value="Main Branch" maxlength="200"></div><div class="field"><label>Main Branch Code</label><input id="branchCode" value="MAIN" maxlength="50"></div>
<div class="field"><label>Minimum App Version</label><input id="minAppVersion" value="1.0.0" maxlength="30"></div><div class="field"><label class="check"><input id="forceUpdate" type="checkbox"> Force app update when required</label></div>
</div><div class="actions" style="margin-top:14px"><button type="submit" class="btn primary">Save School</button><button type="button" class="btn" id="clearBtn">Clear</button></div><div id="msg" class="msg"></div></form><div class="details" id="details"></div></section></div></main>
<script src="/erp/web/api.js"></script><script>(()=>{const $=id=>document.getElementById(id),token=LSKERP.token();if(!token){location.replace('/erp/web/login.html');return}if((LSKERP.user().role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/portal-dashboard.html');return}let schools=[],selected=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fields(){return{name:$('name').value.trim(),code:$('code').value.trim().toUpperCase(),displayName:$('displayName').value.trim(),appName:$('appName').value.trim(),appSlug:$('appSlug').value.trim().toLowerCase(),androidPackage:$('androidPackage').value.trim(),iosBundleId:$('iosBundleId').value.trim(),apiBaseUrl:$('apiBaseUrl').value.trim(),address:$('address').value.trim(),phone:$('phone').value.trim(),supportEmail:$('supportEmail').value.trim(),supportPhone:$('supportPhone').value.trim(),logoUrl:$('logoUrl').value.trim(),primaryColor:$('primaryColor').value.trim().replace('#',''),secondaryColor:$('secondaryColor').value.trim().replace('#',''),branchName:$('branchName').value.trim()||'Main Branch',branchCode:$('branchCode').value.trim().toUpperCase()||'MAIN',minAppVersion:$('minAppVersion').value.trim()||'1.0.0',forceUpdate:$('forceUpdate').checked}}
function clear(){selected=null;$('schoolForm').reset();$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';$('branchName').value='Main Branch';$('branchCode').value='MAIN';$('minAppVersion').value='1.0.0';$('formTitle').textContent='Add School';$('msg').textContent='';$('details').innerHTML='';render()}
function render(){const q=$('search').value.toLowerCase(),rows=schools.filter(s=>`${s.name||''} ${s.code||''} ${s.display_name||''}`.toLowerCase().includes(q));$('list').innerHTML=rows.length?rows.map(s=>`<div class="school ${selected===s.id?'active':''}" data-id="${esc(s.id)}"><strong>${esc(s.display_name||s.name)}</strong><div class="meta">${esc(s.code)} • ${esc(s.branch_name||'Main Branch')} • ${esc(s.app_slug||'')}</div><span class="badge">${esc(s.status||'active')}</span></div>`).join(''):'<div class="empty">No schools found.</div>';document.querySelectorAll('.school').forEach(el=>el.onclick=()=>fill(schools.find(s=>String(s.id)===String(el.dataset.id))));}
function fill(s){if(!s)return;selected=s.id;$('formTitle').textContent='Edit School Profile';const m={name:'name',code:'code',displayName:'display_name',appName:'app_name',appSlug:'app_slug',androidPackage:'android_package',iosBundleId:'ios_bundle_id',apiBaseUrl:'api_base_url',address:'address',phone:'phone',supportEmail:'email',supportPhone:'support_phone',logoUrl:'logo_url',primaryColor:'primary_color',secondaryColor:'secondary_color',branchName:'branch_name',branchCode:'branch_code',minAppVersion:'min_app_version'};for(const[i,k]of Object.entries(m))if($(i))$(i).value=s[k]??'';$('forceUpdate').checked=!!s.force_update;$('details').innerHTML=`<div class="kv"><b>School ID</b><span>${esc(s.id)}</span></div><div class="kv"><b>Created</b><span>${esc(s.created_at)}</span></div><div class="kv"><b>Branch</b><span>${esc(s.branch_name||'Main Branch')} (${esc(s.branch_code||'MAIN')})</span></div>`;render()}
async function load(){try{const r=await LSKERP.request('/api/platform/schools');schools=r.schools||[];render()}catch(e){$('list').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
$('schoolForm').onsubmit=async e=>{e.preventDefault();$('msg').className='msg';$('msg').textContent='Saving…';try{const body=fields();let r;if(selected){r=await LSKERP.request('/api/platform/schools/'+encodeURIComponent(selected),{method:'PATCH',body:JSON.stringify(body)});$('msg').textContent='School profile updated.'}else{r=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(body)});selected=r.school?.id||null;$('msg').textContent='School created successfully. Staff enrollment can be added next.'}$('msg').className='msg ok';await load();if(selected)fill(schools.find(s=>String(s.id)===String(selected)))}catch(e){$('msg').textContent=e.message||'Could not save school';$('msg').className='msg err'}};$('newBtn').onclick=clear;$('clearBtn').onclick=clear;$('search').oninput=render;load()})();</script></body></html>
