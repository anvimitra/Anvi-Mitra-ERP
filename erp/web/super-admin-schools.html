<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • School Management</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--brand:#4f46e5;--line:#e4e8f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0 0;color:#667085;font-size:13px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--brand);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 22px #17203308}.panel h2{margin:0 0 14px;font-size:18px}.search{width:100%;padding:11px;border:1px solid #d7dce7;border-radius:9px;font:inherit;margin-bottom:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4;font-size:13px;vertical-align:top}.table th{color:#667085;font-size:11px;text-transform:uppercase}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;background:#ecfdf3;color:#087443}.status.inactive{background:#fef3f2;color:#b42318}.rowbtn{padding:7px 10px;border:1px solid #d9dee8;background:#fff;border-radius:8px;cursor:pointer;font-size:12px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:700;color:#344054}.form input,.form textarea{width:100%;padding:10px;border:1px solid #d7dce7;border-radius:9px;font:inherit}.form textarea{min-height:72px;resize:vertical}.section{border-top:1px solid #edf0f4;padding-top:14px;margin-top:14px}.section h3{font-size:13px;margin:0 0 9px}.checks{display:flex;align-items:center;gap:8px;font-size:12px}.checks input{width:auto}.msg{min-height:20px;font-size:12px}.ok{color:#087443}.err{color:#b42318}.empty{padding:24px;text-align:center;color:#667085;font-size:13px}.back{margin-bottom:12px}@media(max-width:950px){.layout{grid-template-columns:1fr}.panel.formpanel{order:-1}}</style></head><body><div class="wrap"><div class="back"><button class="btn ghost" id="back">← Dashboard</button></div><div class="top"><div><h1>School Management</h1><p>Super Admin • onboard and manage schools, branches and app configuration.</p></div><button class="btn primary" id="newBtn">+ Add School</button></div><div class="layout"><section class="panel"><h2>Schools</h2><input class="search" id="search" placeholder="Search by school name, code or app slug…"><div id="list"><div class="empty">Loading schools…</div></div></section><section class="panel formpanel"><h2 id="formTitle">Add School</h2><form class="form" id="schoolForm"><label>School Name *</label><input id="name" required maxlength="200"><label>School Code *</label><input id="code" required maxlength="50" placeholder="LSK001"><label>Display Name</label><input id="displayName" maxlength="200"><label>Address</label><textarea id="address"></textarea><label>School Phone</label><input id="phone" maxlength="30"><label>Support Email</label><input id="supportEmail" type="email" maxlength="254"><label>School / App Logo URL</label><input id="logoUrl" type="url" placeholder="https://…"><div class="section"><h3>Primary Branch</h3><label>Branch Name</label><input id="branchName" value="Main Branch"><label>Branch Code</label><input id="branchCode" value="MAIN" maxlength="50"></div><div class="section"><h3>ERP Mobile App</h3><label>App Name</label><input id="appName" placeholder="School App"><label>App Slug *</label><input id="appSlug" required maxlength="100" placeholder="my-school"><label>Android Package</label><input id="androidPackage" placeholder="in.anvimitra.myschool"><label>iOS Bundle ID</label><input id="iosBundleId"><label>API Base URL</label><input id="apiBaseUrl" type="url"><label>Primary Color</label><input id="primaryColor" value="4F46E5" maxlength="6"><label>Secondary Color</label><input id="secondaryColor" value="0F1720" maxlength="6"><label>Minimum App Version</label><input id="minAppVersion" value="1.0.0"><label class="checks"><input id="forceUpdate" type="checkbox"> Force update</label></div><div class="section"><h3>Initial School Admin</h3><label>Admin Name *</label><input id="initialAdminName" required maxlength="200"><label>Admin Email</label><input id="initialAdminEmail" type="email" maxlength="254"><label>Admin Phone</label><input id="initialAdminPhone" maxlength="30"><label>Initial Password *</label><input id="initialAdminPassword" type="password" minlength="6" required><div class="msg" id="msg"></div></div><div style="display:flex;gap:9px"><button class="btn primary" type="submit" id="save">Create School</button><button class="btn ghost" type="button" id="cancel">Clear</button></div></form></section></div></div><script src="/erp/web/api.js"></script><script>(async()=>{const token=LSKERP.token(),user=LSKERP.user();if(!token||(user.role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id);let schools=[],editingId=null;$('back').onclick=()=>location.href='/erp/web/portal-dashboard.html';$('newBtn').onclick=()=>resetForm();$('cancel').onclick=()=>resetForm();$('search').oninput=render;function resetForm(){editingId=null;$('formTitle').textContent='Add School';$('save').textContent='Create School';$('schoolForm').reset();$('branchName').value='Main Branch';$('branchCode').value='MAIN';$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';$('minAppVersion').value='1.0.0';$('initialAdminPassword').required=true;$('initialAdminName').required=true;$('msg').textContent=''}function val(id){return $(id).value.trim()}function fill(s){editingId=s.id;$('formTitle').textContent='Edit School';$('save').textContent='Save Changes';$('name').value=s.name||'';$('code').value=s.code||'';$('displayName').value=s.display_name||'';$('address').value=s.address||'';$('phone').value=s.phone||'';$('supportEmail').value=s.email||'';$('logoUrl').value=s.logo_url||'';$('branchName').value=s.branch_name||'Main Branch';$('branchCode').value=s.branch_code||'MAIN';$('appName').value=s.app_name||'';$('appSlug').value=s.app_slug||'';$('initialAdminName').required=false;$('initialAdminPassword').required=false;$('initialAdminName').value='';$('initialAdminPassword').value='';$('msg').textContent='Editing existing school. Admin credentials are unchanged.';window.scrollTo({top:0,behavior:'smooth'})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('search').value.toLowerCase();const rows=schools.filter(s=>[s.name,s.code,s.app_slug].some(v=>String(v||'').toLowerCase().includes(q)));if(!rows.length){$('list').innerHTML='<div class="empty">No schools found.</div>';return}$('list').innerHTML='<table class="table"><thead><tr><th>School</th><th>App</th><th>Branch</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(s=>`<tr><td><b>${esc(s.display_name||s.name)}</b><div style="color:#667085">${esc(s.code)}</div></td><td>${esc(s.app_name||'—')}<div style="color:#667085">${esc(s.app_slug||'—')}</div></td><td>${esc(s.branch_name||'—')}<div style="color:#667085">${esc(s.branch_code||'')}</div></td><td><span class="status ${s.status==='inactive'?'inactive':''}">${esc(s.status||'active')}</span></td><td><button class="rowbtn" data-id="${s.id}">Edit</button></td></tr>`).join('')+'</tbody></table>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>fill(schools.find(s=>String(s.id)===b.dataset.id)))}async function load(){try{const r=await LSKERP.request('/api/platform/schools');schools=r.schools||[];render()}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message||'Could not load schools')+'</div>'}}$('schoolForm').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Saving…';$('msg').className='msg';const body={name:val('name'),code:val('code'),displayName:val('displayName'),address:val('address'),phone:val('phone'),supportEmail:val('supportEmail'),logoUrl:val('logoUrl'),branchName:val('branchName')||'Main Branch',branchCode:val('branchCode')||'MAIN',appName:val('appName')||val('name')+' App',appSlug:val('appSlug').toLowerCase(),androidPackage:val('androidPackage'),iosBundleId:val('iosBundleId'),apiBaseUrl:val('apiBaseUrl'),primaryColor:val('primaryColor')||'4F46E5',secondaryColor:val('secondaryColor')||'0F1720',minAppVersion:val('minAppVersion')||'1.0.0',forceUpdate:$('forceUpdate').checked};try{if(editingId){await LSKERP.request('/api/platform/schools/'+editingId,{method:'PATCH',body:JSON.stringify(body)});$('msg').textContent='School updated successfully.'}else{body.initialAdminName=val('initialAdminName');body.initialAdminEmail=val('initialAdminEmail');body.initialAdminPhone=val('initialAdminPhone');body.initialAdminPassword=$('initialAdminPassword').value;const r=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(body)});$('msg').textContent='School created. Initial admin: '+(r.initialAdmin.email||r.initialAdmin.phone)}$('msg').className='msg ok';await load();if(!editingId)resetForm()}catch(err){$('msg').textContent=err.message||'Save failed';$('msg').className='msg err'}};resetForm();await load()})();</script></body></html>
