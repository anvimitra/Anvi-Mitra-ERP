<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anvi Mitra ERP • School Management</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--line:#e4e8f0;--muted:#667085;--brand:#4f46e5}
*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}
.side{background:linear-gradient(160deg,#10162d,#24275a);color:#fff;padding:22px}.brand{font-size:20px;font-weight:850}.sub{font-size:11px;color:#b8c2e5;margin:5px 0 28px}.back{color:#d9e2ff;text-decoration:none}
.main{padding:25px;max-width:1450px;width:100%;margin:auto;position:relative;overflow:hidden}.main:before{content:'';position:fixed;inset:-30%;background:radial-gradient(circle at 15% 20%,#7c3aed18,transparent 28%),radial-gradient(circle at 85% 15%,#06b6d418,transparent 25%),radial-gradient(circle at 70% 85%,#4f46e518,transparent 30%);animation:floatGlow 14s ease-in-out infinite alternate;pointer-events:none;z-index:-1}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;animation:slideDown .55s ease both}.top h1{margin:0;font-size:28px}.pill{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px #10162d0b}.panel h2{margin:0 0 14px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:#f7f8ff;border:1px solid #e9e9ff;border-radius:13px;padding:13px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
.list{display:grid;gap:10px}.school{display:flex;gap:13px;align-items:center;border:1px solid #e7eaf0;border-radius:13px;padding:13px;transition:.2s}.school:hover{transform:translateY(-1px);box-shadow:0 8px 22px #10162d10}
.logo{width:50px;height:50px;border-radius:12px;object-fit:contain;background:#f2f4f8;border:1px solid #e5e7eb}.school b{display:block}.meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}.badge{margin-left:auto;padding:5px 9px;border-radius:999px;background:#eefbf4;color:#087443;font-size:11px;font-weight:750}.schoolActions{display:flex;gap:7px;margin-left:auto}.mini{border:1px solid #d9dee8;background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer;font-weight:700}
.form{display:grid;gap:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:10px 11px;border:1px solid #d9dee8;border-radius:9px;font:inherit}
.button{padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:800;cursor:pointer}.button:disabled,.mini:disabled{opacity:.6}.msg{min-height:18px;font-size:12px}.ok{color:#087443}.err{color:#b42318}.preview{display:none;width:58px;height:58px;object-fit:contain;border:1px solid var(--line);border-radius:12px;padding:5px;margin-top:7px}
.modal{position:fixed;inset:0;background:#10162d66;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modalBox{background:#fff;border-radius:18px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 30px 80px #10162d33}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eef0f5;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px}.actions{display:flex;gap:9px}
@media(max-width:980px){.layout{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{padding:13px}.row,.stats{grid-template-columns:1fr 1fr}}@media(max-width:600px){.row,.stats{grid-template-columns:1fr}.main{padding:15px}.badge{display:none}.schoolActions{flex-direction:column}}
@keyframes floatGlow{from{transform:translate3d(-1%,0,0) scale(1)}to{transform:translate3d(1%,2%,0) scale(1.06)}}@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="brand">Anvi Mitra ERP</div><div class="sub">Super Admin • Multi-School Control</div><a class="back" href="/erp/web/portal-dashboard.html">← Dashboard</a></aside>
<main class="main"><div class="top"><h1>School Management</h1><div class="pill">Super Admin</div></div>
<div class="layout"><section class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Registered schools</h2><input id="schoolSearch" placeholder="Search school…" style="width:min(240px,100%);padding:9px 11px;border:1px solid #d9dee8;border-radius:9px;font:inherit"></div><div id="stats" class="stats"></div><div id="list" class="list">Loading…</div><div id="listMsg" class="msg"></div></section>
<section class="panel"><h2>Add a new school</h2><form id="form" class="form">
<div class="row"><div class="field"><label>School name *</label><input id="name" required maxlength="200"></div><div class="field"><label>School code *</label><input id="code" required maxlength="50" placeholder="LSK01"></div></div>
<div class="row"><div class="field"><label>Display name</label><input id="displayName" maxlength="200"></div><div class="field"><label>App name</label><input id="appName" maxlength="200"></div></div>
<div class="row"><div class="field"><label>App slug *</label><input id="appSlug" required pattern="[a-z0-9][a-z0-9-]{2,98}" maxlength="99" placeholder="lsk-academy"></div><div class="field"><label>Android package</label><input id="androidPackage" maxlength="200" placeholder="in.anvimitra.lskacademy"></div></div>
<div class="row"><div class="field"><label>Phone</label><input id="phone" maxlength="30"></div><div class="field"><label>Email</label><input id="email" type="email" maxlength="254"></div></div>
<div class="field"><label>Website</label><input id="website" type="url" maxlength="500"></div>
<div class="field"><label>Logo URL</label><input id="logoUrl" type="url" maxlength="1000" placeholder="https://…/logo.png"><img id="preview" class="preview" alt="Logo preview"></div>
<div class="row"><div class="field"><label>Primary color</label><input id="primaryColor" value="4F46E5" maxlength="6"></div><div class="field"><label>Secondary color</label><input id="secondaryColor" value="0F1720" maxlength="6"></div></div>
<div class="row"><div class="field"><label>Main branch</label><input id="branchName" value="Main Branch" maxlength="200"></div><div class="field"><label>Branch code</label><input id="branchCode" value="MAIN" maxlength="50"></div></div>
<div class="field"><label>Address</label><input id="address" maxlength="500"></div>
<button id="submit" class="button">Create school</button><div id="formMsg" class="msg"></div></form></section></div></main></div>
<div class="modal" id="modal"><section class="modalBox"><div class="modalHead"><h2>Edit school</h2><button class="close" id="close">×</button></div>
<form id="editForm" class="form"><input type="hidden" id="editId"><div class="row"><div class="field"><label>School name</label><input id="editName" required></div><div class="field"><label>School code</label><input id="editCode" required></div></div>
<div class="row"><div class="field"><label>Display name</label><input id="editDisplayName"></div><div class="field"><label>App name</label><input id="editAppName"></div></div>
<div class="row"><div class="field"><label>App slug</label><input id="editAppSlug" pattern="[a-z0-9][a-z0-9-]{2,98}"></div><div class="field"><label>Status</label><select id="editStatus" style="width:100%;padding:10px;border:1px solid #d9dee8;border-radius:9px;font:inherit"><option value="active">Active</option><option value="inactive">Inactive</option></select></div></div>
<div class="row"><div class="field"><label>Logo URL</label><input id="editLogoUrl"></div><div class="field"><label>Website</label><input id="editWebsite"></div></div>
<div class="row"><div class="field"><label>Phone</label><input id="editPhone"></div><div class="field"><label>Email</label><input id="editEmail" type="email"></div></div>
<div class="row"><div class="field"><label>Primary color</label><input id="editPrimaryColor"></div><div class="field"><label>Secondary color</label><input id="editSecondaryColor"></div></div>
<div class="field"><label>Address</label><input id="editAddress"></div><div class="actions"><button class="button" id="saveEdit">Save changes</button><button type="button" class="mini" id="cancelEdit">Cancel</button></div><div id="editMsg" class="msg"></div></form></section></div>
<script src="/erp/web/api.js"></script><script>
(async()=>{const user=LSKERP.user();if(!LSKERP.token()||(user.role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/login.html');return}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('logoUrl').addEventListener('input',()=>{const u=$('logoUrl').value.trim();$('preview').style.display=u?'block':'none';if(u)$('preview').src=u});
let schools=[];
function render(){const q=$('schoolSearch').value.trim().toLowerCase(),ss=schools.filter(s=>((s.displayName||s.name)+' '+s.code+' '+(s.appName||'')).toLowerCase().includes(q)),active=schools.filter(s=>s.status==='active').length;
$('stats').innerHTML='<div class="stat"><b>'+schools.length+'</b><span>Total schools</span></div><div class="stat"><b>'+active+'</b><span>Active</span></div><div class="stat"><b>'+(schools.length-active)+'</b><span>Inactive</span></div>';
$('list').innerHTML=ss.length?ss.map((s,i)=>'<article class="school" style="animation:rise .35s ease '+Math.min(i*.04,.5)+'s both">'+(s.logoUrl?'<img class="logo" src="'+esc(s.logoUrl)+'" alt="">':'<div class="logo"></div>')+'<div><b>'+esc(s.displayName||s.name)+'</b><div class="meta">Code: '+esc(s.code)+' • App: '+esc(s.appName||'—')+' • Slug: '+esc(s.appSlug||'—')+'</div><div class="meta">'+esc(s.address||'No address')+' • '+esc(s.phone||s.email||'No contact')+'</div></div><div class="schoolActions"><span class="badge">'+esc(s.status||'unknown')+'</span><button class="mini" onclick="location.href='/erp/web/super-admin-branches.html?schoolId='+encodeURIComponent(''+esc(s.id)+'')">Branches</button><button class="mini" data-edit="'+esc(s.id)+'">Edit</button></div></article>').join(''):'<div class="meta">No schools found.</div>';
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));}
async function load(){try{const d=await LSKERP.request('/api/platform/schools');schools=d.schools||[];render();}catch(e){$('list').innerHTML='';$('listMsg').textContent=e.message||'Could not load schools';$('listMsg').className='msg err'}}
async function openEdit(id){const s=schools.find(x=>String(x.id)===String(id));if(!s)return;try{const d=await LSKERP.request('/api/platform/schools/'+encodeURIComponent(id)),x=d.school||s;$('editId').value=x.id;$('editName').value=x.name||'';$('editCode').value=x.code||'';$('editDisplayName').value=x.displayName||'';$('editAppName').value=x.appName||'';$('editAppSlug').value=x.appSlug||'';$('editStatus').value=x.status||'active';$('editLogoUrl').value=x.logoUrl||'';$('editWebsite').value=x.website||'';$('editPhone').value=x.phone||'';$('editEmail').value=x.email||'';$('editPrimaryColor').value=x.primaryColor||'';$('editSecondaryColor').value=x.secondaryColor||'';$('editAddress').value=x.address||'';$('editMsg').textContent='';$('modal').classList.add('open')}catch(e){$('listMsg').textContent=e.message||'Could not load school';$('listMsg').className='msg err'}}
function closeEdit(){$('modal').classList.remove('open')}$('close').onclick=closeEdit;$('cancelEdit').onclick=closeEdit;$('modal').onclick=e=>{if(e.target===$('modal'))closeEdit()};
$('editForm').onsubmit=async e=>{e.preventDefault();$('saveEdit').disabled=true;$('editMsg').className='msg';$('editMsg').textContent='Saving…';const v=id=>$(id).value.trim();try{await LSKERP.request('/api/platform/schools/'+encodeURIComponent(v('editId')),{method:'PATCH',body:JSON.stringify({name:v('editName'),code:v('editCode'),displayName:v('editDisplayName'),appName:v('editAppName'),appSlug:v('editAppSlug'),status:v('editStatus'),logoUrl:v('editLogoUrl')||null,website:v('editWebsite')||null,phone:v('editPhone')||null,email:v('editEmail')||null,primaryColor:v('editPrimaryColor')||null,secondaryColor:v('editSecondaryColor')||null,address:v('editAddress')||null})});$('editMsg').className='msg ok';$('editMsg').textContent='Saved successfully';await load();setTimeout(closeEdit,450)}catch(err){$('editMsg').className='msg err';$('editMsg').textContent=err.message||'Could not save'}finally{$('saveEdit').disabled=false}};
$('form').onsubmit=async e=>{e.preventDefault();const b=$('submit'),m=$('formMsg');b.disabled=true;m.textContent='Creating school…';m.className='msg';const v=id=>$(id).value.trim();try{const d=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify({name:v('name'),code:v('code'),displayName:v('displayName'),appName:v('appName'),appSlug:v('appSlug'),androidPackage:v('androidPackage'),address:v('address'),phone:v('phone'),email:v('email'),website:v('website'),logoUrl:v('logoUrl'),primaryColor:v('primaryColor').replace('#',''),secondaryColor:v('secondaryColor').replace('#',''),mainBranchName:v('branchName'),mainBranchCode:v('branchCode')})});m.textContent='School created successfully: '+(d.school?.name||'');m.className='msg ok';e.target.reset();$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';$('branchName').value='Main Branch';$('branchCode').value='MAIN';$('preview').style.display='none';await load()}catch(err){m.textContent=err.message||'Could not create school';m.className='msg err'}finally{b.disabled=false}};
$('schoolSearch').addEventListener('input',render);load()})();
</script></body></html>
