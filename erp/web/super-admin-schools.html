<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP - Schools</title>
<style>body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#eef2ff,#ecfeff);color:#111827}header{padding:16px 22px;background:#ffffffcc;backdrop-filter:blur(15px);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.brand{font-weight:800;font-size:19px}.brand small{display:block;color:#64748b;font-size:12px}main{max-width:1100px;margin:auto;padding:28px 18px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.hero h1{font-size:34px;margin:0}.hero p{color:#64748b}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{color:white;background:linear-gradient(135deg,#4f46e5,#06b6d4)}.panel{background:#ffffffdd;border-radius:20px;padding:20px;box-shadow:0 20px 50px #0f172a12}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}.stat{background:#fff;border-radius:17px;padding:16px;box-shadow:0 10px 30px #0f172a0a}.stat small{color:#64748b}.stat b{display:block;font-size:27px;margin-top:4px}.bar{display:flex;justify-content:space-between;gap:12px;margin-bottom:15px}.search{padding:11px;border:1px solid #e2e8f0;border-radius:11px;width:280px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #e2e8f0}.school{display:flex;gap:10px;align-items:center}.school img{width:42px;height:42px;object-fit:contain;border-radius:10px;background:#f1f5f9}.pill{background:#dcfce7;color:#166534;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#0f172a66;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.dialog{background:white;border-radius:23px;padding:22px;width:min(720px,100%);max-height:90vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#475569}.field input{padding:11px;border:1px solid #e2e8f0;border-radius:10px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}.hero{align-items:start;gap:15px;flex-direction:column}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.search{width:100%}}</style></head>
<body><header><div class="brand">Anvi Mitra ERP<small>Super Admin • School Management</small></div><button class="btn" onclick="logout()">Logout</button></header>
<main><div class="hero"><div><h1>Schools</h1><p>Manage school tenants, branding and administrators.</p></div><button class="btn primary" onclick="openModal()">＋ Add School</button></div>
<div class="stats"><div class="stat"><small>Total</small><b id="total">—</b></div><div class="stat"><small>Active</small><b id="active">—</b></div><div class="stat"><small>Inactive</small><b id="inactive">—</b></div><div class="stat"><small>Apps</small><b id="apps">—</b></div></div>
<section class="panel"><div class="bar"><h3>School Directory</h3><input id="search" class="search" placeholder="Search…" oninput="render()"></div><div id="notice" style="display:none;padding:11px;background:#fff7ed;border-radius:10px;color:#9a3412"></div><table class="table"><thead><tr><th>School</th><th>Code</th><th>Status</th><th>App</th><th>Contact</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<div id="modal" class="modal"><div class="dialog"><h2>Add New School</h2><p style="color:#64748b">Provision school + main branch + administrator + app configuration.</p><div class="form">
<div class="field"><label>School Name *</label><input id="name"></div><div class="field"><label>School Code *</label><input id="code"></div><div class="field"><label>Display Name</label><input id="displayName"></div><div class="field"><label>App Slug *</label><input id="appSlug"></div><div class="field full"><label>Logo URL</label><input id="logoUrl"></div><div class="field full"><label>Address</label><input id="address"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Main Branch</label><input id="mainBranchName" value="Main Branch"></div><div class="field"><label>Branch Code</label><input id="mainBranchCode" value="MAIN"></div><div class="field"><label>Admin Email *</label><input id="adminEmail" type="email"></div><div class="field"><label>Admin Phone</label><input id="adminPhone"></div><div class="field"><label>Admin Password *</label><input id="adminPassword" type="password"></div><div class="field"><label>Android Package</label><input id="androidPackage"></div><div class="field"><label>Primary Color</label><input id="primaryColor" value="#4f46e5"></div><div class="field"><label>Secondary Color</label><input id="secondaryColor" value="#06b6d4"></div></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button id="save" class="btn primary" onclick="createSchool()">Create School</button></div></div></div>
<script>
var token=localStorage.getItem('accessToken'), user=JSON.parse(localStorage.getItem('user')||'null'), schools=[];
function auth(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
function v(id){return document.getElementById(id).value.trim()}
function msg(x){var n=document.getElementById('notice');n.textContent=x;n.style.display='block';setTimeout(function(){n.style.display='none'},5000)}
function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
async function load(){try{var r=await fetch('/api/platform/schools',{headers:auth()}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load schools');schools=d.schools||[];render()}catch(e){msg(e.message)}}
function render(){var q=v('search').toLowerCase(),a=schools.filter(function(s){return (s.name+' '+s.code+' '+(s.displayName||'')).toLowerCase().indexOf(q)>=0});document.getElementById('total').textContent=schools.length;document.getElementById('active').textContent=schools.filter(s=>s.status==='active').length;document.getElementById('inactive').textContent=schools.filter(s=>s.status!=='active').length;document.getElementById('apps').textContent=schools.filter(s=>s.appSlug).length;document.getElementById('rows').innerHTML=a.map(function(s){return '<tr><td><div class="school">'+(s.logoUrl?'<img src="'+esc(s.logoUrl)+'">':'')+'<div><b>'+esc(s.displayName||s.name)+'</b><div style="color:#64748b;font-size:12px">'+esc(s.address||'')+'</div></div></div></td><td>'+esc(s.code)+'</td><td><span class="pill">'+esc(s.status)+'</span></td><td>'+esc(s.appName||'—')+'</td><td>'+esc(s.email||s.phone||'—')+'</td></tr>'}).join('')||'<tr><td colspan="5">No schools found.</td></tr>'}
async function createSchool(){var b={name:v('name'),code:v('code'),displayName:v('displayName'),appSlug:v('appSlug'),logoUrl:v('logoUrl'),address:v('address'),phone:v('phone'),email:v('email'),mainBranchName:v('mainBranchName'),mainBranchCode:v('mainBranchCode'),adminEmail:v('adminEmail'),adminPhone:v('adminPhone'),adminPassword:v('adminPassword'),androidPackage:v('androidPackage'),primaryColor:v('primaryColor'),secondaryColor:v('secondaryColor')};var btn=document.getElementById('save');btn.disabled=true;try{var r=await fetch('/api/platform/schools',{method:'POST',headers:auth(),body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.error||'Creation failed');closeModal();msg('School created and administrator provisioned.');load()}catch(e){msg(e.message)}finally{btn.disabled=false}}
function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function logout(){localStorage.clear();location.reload()}
if(token&&user&&user.role==='super_admin')load();else document.querySelector('main').innerHTML='<section class="panel"><h2>Super Admin login required</h2><p>Please sign in through the ERP login first.</p></section>';
</script></body></html>
