<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Schools</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#dce9ff,transparent 35%),radial-gradient(circle at 100% 20%,#eadfff,transparent 30%),#f5f7fb}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:14px;align-items:center}.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;font-size:25px}.title{font-size:25px;font-weight:850}.sub{color:#68738a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card,.panel{background:#fff;border:1px solid #e6eaf2;border-radius:20px;box-shadow:0 12px 35px #19233a0d}.stat{padding:18px}.stat b{font-size:28px}.panel{padding:22px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:750;cursor:pointer;background:#4f46e5;color:#fff}.btn.secondary{background:#eef1f7;color:#34405a}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf0f5}.pill{padding:5px 9px;border-radius:99px;background:#e9f8ef;color:#18794e;font-size:12px;font-weight:700}.modal{position:fixed;inset:0;background:#10182799;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{background:#fff;border-radius:22px;max-width:720px;width:100%;padding:25px;max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}input{padding:12px;border:1px solid #dbe0ea;border-radius:11px;font:inherit}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:15px}.grid,.form{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="logo">🎓</div><div><div class="title">Anvi Mitra ERP</div><div class="sub">Multi-school control center</div></div></div><button class="btn" onclick="openModal()">+ Add School</button></header><section class="grid"><div class="card stat"><div class="sub">Schools</div><b id="count">—</b></div><div class="card stat"><div class="sub">Active</div><b id="active">—</b></div><div class="card stat"><div class="sub">Configured Apps</div><b id="apps">—</b></div><div class="card stat"><div class="sub">ERP</div><b>Online</b></div></section><section class="panel"><h2>Schools</h2><div style="overflow:auto"><table><thead><tr><th>School</th><th>Code</th><th>App</th><th>Status</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></main><div class="modal" id="modal"><div class="dialog"><h2>Add School</h2><form id="form" class="form"><label class="field"><span>School name *</span><input name="name" required></label><label class="field"><span>School code *</span><input name="code" required></label><label class="field"><span>Display name</span><input name="displayName"></label><label class="field"><span>App name</span><input name="appName"></label><label class="field"><span>App slug *</span><input name="appSlug" required placeholder="lsk-academy"></label><label class="field"><span>Logo URL</span><input name="logoUrl"></label><label class="field"><span>Phone</span><input name="phone"></label><label class="field"><span>Email</span><input name="email" type="email"></label><label class="field"><span>Website</span><input name="website"></label><label class="field"><span>Timezone</span><input name="timezone" value="Asia/Kolkata"></label><label class="field full"><span>Address</span><input name="address"></label><div class="actions full"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn">Create School</button></div></form><p id="msg" class="sub"></p></div></div><script>const token=localStorage.getItem('accessToken')||'',auth=token?{Authorization:'Bearer '+token}:{};const modal=document.querySelector('#modal'),form=document.querySelector('#form'),msg=document.querySelector('#msg');function openModal(){modal.classList.add('open')}function closeModal(){modal.classList.remove('open');form.reset();msg.textContent=''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const r=await fetch('/api/platform/schools',{headers:auth});if(!r.ok)throw Error('Super Admin permission required');const d=await r.json();count.textContent=d.schools.length;active.textContent=d.schools.filter(x=>x.status==='active').length;apps.textContent=d.schools.filter(x=>x.appSlug).length;rows.innerHTML=d.schools.map(s=>'<tr><td><b>'+esc(s.displayName||s.name)+'</b><div class="sub">'+esc(s.address||'')+'</div></td><td>'+esc(s.code)+'</td><td>'+esc(s.appName||'—')+'</td><td><span class="pill">'+esc(s.status)+'</span></td><td><button class="btn secondary" onclick="location.href=\'/super-admin/school-onboarding?school=\'+encodeURIComponent(s.id)">Manage</button></td></tr>').join('')||'<tr><td colspan="5">No schools yet.</td></tr>'}catch(e){rows.innerHTML='<tr><td colspan="5">'+esc(e.message)+'</td></tr>'}}form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Creating…';try{const r=await fetch('/api/platform/schools',{method:'POST',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))}),d=await r.json();if(!r.ok)throw Error(d.error||'Creation failed');closeModal();load()}catch(e){msg.textContent=e.message}});load();</script></body></html>
