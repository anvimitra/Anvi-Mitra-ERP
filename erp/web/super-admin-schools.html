<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Schools</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb;--line:#e4e8f0;--muted:#667085}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:linear-gradient(160deg,#10162d,#24275a);color:#fff;padding:22px}.brand{font-size:20px;font-weight:850}.sub{font-size:11px;color:#b8c2e5;margin:5px 0 28px}.back{display:block;color:#d9e2ff;text-decoration:none;padding:11px 12px;border-radius:10px}.main{padding:25px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.top h1{margin:0;font-size:27px}.pill{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.7fr);gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.panel h2{margin:0 0 14px;font-size:17px}.table{display:grid;gap:9px}.school{border:1px solid #e7eaf0;border-radius:12px;padding:14px}.school b{display:block;font-size:15px}.meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}.badge{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;background:#eef0ff;color:#3036a8;font-size:11px;font-weight:700}.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}.field input{width:100%;padding:10px 11px;border:1px solid #d9dee8;border-radius:9px;font:inherit;background:#fff}.check{display:flex;gap:8px;align-items:center;font-size:13px}.check input{width:auto}.button{padding:11px 14px;border:0;border-radius:9px;background:#172b55;color:#fff;font:inherit;font-weight:750;cursor:pointer}.button:disabled{opacity:.6;cursor:wait}.msg{font-size:12px;min-height:18px}.ok{color:#087443}.err{color:#b42318}.hint{font-size:11px;color:var(--muted);line-height:1.45}@media(max-width:950px){.layout{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{padding:12px}.row{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">Anvi Mitra ERP</div><div class="sub">Super Admin • School Management</div><a class="back" href="/erp/web/portal-dashboard.html">← Dashboard</a></aside><main class="main"><div class="top"><h1>Schools</h1><div class="pill" id="who">Super Admin</div></div><div class="layout"><section class="panel"><h2>Registered schools</h2><div id="list" class="table">Loading…</div><div id="listMsg" class="msg"></div></section><section class="panel"><h2>Add school</h2><form id="schoolForm" class="form"><div class="row"><div class="field"><label>School name *</label><input id="name" required maxlength="200"></div><div class="field"><label>School code *</label><input id="code" required maxlength="50" placeholder="LSK01"></div></div><div class="row"><div class="field"><label>Display name</label><input id="displayName" maxlength="200"></div><div class="field"><label>App name</label><input id="appName" maxlength="200" placeholder="School App"></div></div><div class="row"><div class="field"><label>App slug *</label><input id="appSlug" required maxlength="100" placeholder="school-name"></div><div class="field"><label>Android package</label><input id="androidPackage" maxlength="200" placeholder="in.anvimitra.school"></div></div><div class="row"><div class="field"><label>Address</label><input id="address" maxlength="500"></div><div class="field"><label>School phone</label><input id="phone" maxlength="30"></div></div><div class="row"><div class="field"><label>Support email</label><input id="supportEmail" type="email" maxlength="254"></div><div class="field"><label>Support phone</label><input id="supportPhone" maxlength="30"></div></div><div class="field"><label>Logo URL</label><input id="logoUrl" type="url" maxlength="1000" placeholder="https://…/logo.png"></div><div class="row"><div class="field"><label>Primary color</label><input id="primaryColor" value="4F46E5" maxlength="6"></div><div class="field"><label>Secondary color</label><input id="secondaryColor" value="0F1720" maxlength="6"></div></div><hr style="border:0;border-top:1px solid var(--line);width:100%"><div class="row"><div class="field"><label>Main branch name</label><input id="branchName" value="Main Branch" maxlength="200"></div><div class="field"><label>Main branch code</label><input id="branchCode" value="MAIN" maxlength="50"></div></div><div class="row"><div class="field"><label>Initial admin name *</label><input id="initialAdminName" required maxlength="200"></div><div class="field"><label>Initial admin email</label><input id="initialAdminEmail" type="email" maxlength="254"></div></div><div class="row"><div class="field"><label>Initial admin phone</label><input id="initialAdminPhone" maxlength="30"></div><div class="field"><label>Initial admin password *</label><input id="initialAdminPassword" type="password" required minlength="6" autocomplete="new-password"></div></div><div class="check"><input id="forceUpdate" type="checkbox"><label for="forceUpdate">Force app update</label></div><div class="hint">Creates the school, school settings, main branch, mobile app configuration and first admin account. Password is sent only to the server.</div><button class="button" id="submit">Create school</button><div id="formMsg" class="msg"></div></form></section></div></main></div><script src="/erp/web/api.js"></script><script>(async()=>{const token=LSKERP.token(),user=LSKERP.user();if(!token||(user.role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/login.html');return}document.getElementById('who').textContent='Super Admin • '+(user.schoolName||'Platform');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const d=await LSKERP.request('/api/platform/schools');const schools=d.schools||[];document.getElementById('list').innerHTML=schools.length?schools.map(s=>`<article class="school"><b>${esc(s.display_name||s.name)}</b><div class="meta">Code: ${esc(s.code)} • App: ${esc(s.app_name||'—')} • Slug: ${esc(s.app_slug||'—')}</div><div class="meta">${esc(s.address||'No address')} • ${esc(s.phone||s.email||'No contact')}</div><div class="meta">Main branch: ${esc(s.branch_name||'—')} (${esc(s.branch_code||'—')})</div><span class="badge">${esc(s.status||'unknown')}</span></article>`).join(''):'<div class="meta">No schools registered yet.</div>'}catch(e){document.getElementById('list').innerHTML='';document.getElementById('listMsg').textContent=e.message||'Could not load schools';document.getElementById('listMsg').className='msg err'}}document.getElementById('schoolForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit'),msg=document.getElementById('formMsg');btn.disabled=true;msg.textContent='Creating school…';msg.className='msg';const v=id=>document.getElementById(id).value;const payload={name:v('name'),code:v('code'),displayName:v('displayName'),appName:v('appName'),appSlug:v('appSlug'),androidPackage:v('androidPackage'),address:v('address'),phone:v('phone'),supportEmail:v('supportEmail'),supportPhone:v('supportPhone'),logoUrl:v('logoUrl'),primaryColor:v('primaryColor').replace('#',''),secondaryColor:v('secondaryColor').replace('#',''),branchName:v('branchName'),branchCode:v('branchCode'),initialAdminName:v('initialAdminName'),initialAdminEmail:v('initialAdminEmail'),initialAdminPhone:v('initialAdminPhone'),initialAdminPassword:v('initialAdminPassword'),forceUpdate:document.getElementById('forceUpdate').checked};try{const d=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(payload)});msg.textContent=`School created: ${d.school?.name||'success'}. Initial admin: ${d.initialAdmin?.email||d.initialAdmin?.phone||'created'}.`;msg.className='msg ok';e.target.reset();document.getElementById('primaryColor').value='4F46E5';document.getElementById('secondaryColor').value='0F1720';document.getElementById('branchName').value='Main Branch';document.getElementById('branchCode').value='MAIN';await load()}catch(err){msg.textContent=err.message||'Could not create school';msg.className='msg err'}finally{btn.disabled=false}});load()})();</script></body></html>
