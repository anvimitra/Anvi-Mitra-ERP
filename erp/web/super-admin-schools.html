<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • School Management</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--brand:#4f46e5;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{font-size:25px;font-weight:850}.sub{color:#667085;font-size:13px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:750;cursor:pointer}.btn.secondary{background:#172033}.btn.small{padding:7px 10px;font-size:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}.panel h2{margin:0 0 14px;font-size:18px}.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d7dce5;border-radius:9px;font:inherit}.wide{grid-column:1/-1}.actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}.msg{font-size:13px;color:#667085}.error{color:#b42318}.success{color:#087443}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #eef0f4;font-size:13px}.table th{font-size:11px;color:#667085;text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:700}.modal{position:fixed;inset:0;background:#10162d66;display:none;place-items:center;padding:16px;z-index:10}.modal.open{display:grid}.modal-card{background:#fff;border-radius:18px;padding:20px;width:min(850px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h2{margin:0}@media(max-width:800px){.form{grid-template-columns:1fr}.wide{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><div class="title">School Management</div><div class="sub">Super Admin • onboard schools and manage ERP/app identity</div></div><button class="btn secondary" id="back">← Dashboard</button></div><section class="panel"><h2>Add New School</h2><form id="schoolForm"><div class="form"><div class="field"><label>School name *</label><input name="name" required></div><div class="field"><label>School code *</label><input name="code" required placeholder="LSK01"></div><div class="field"><label>Display name</label><input name="displayName"></div><div class="field"><label>Address</label><input name="address"></div><div class="field"><label>School phone</label><input name="phone"></div><div class="field"><label>Support email</label><input name="supportEmail" type="email"></div><div class="field"><label>App name</label><input name="appName" placeholder="School App"></div><div class="field"><label>App slug *</label><input name="appSlug" required placeholder="school-name"></div><div class="field"><label>Android package</label><input name="androidPackage" placeholder="in.anvimitra.school"></div><div class="field"><label>iOS bundle ID</label><input name="iosBundleId" placeholder="in.anvimitra.school"></div><div class="field wide"><label>Logo URL</label><input name="logoUrl" type="url" placeholder="https://..."></div><div class="field"><label>Primary color</label><input name="primaryColor" value="4F46E5"></div><div class="field"><label>Secondary color</label><input name="secondaryColor" value="0F1720"></div><div class="field"><label>Main branch name</label><input name="branchName" value="Main Branch"></div><div class="field"><label>Main branch code</label><input name="branchCode" value="MAIN"></div><div class="field"><label>Initial admin name *</label><input name="initialAdminName" required></div><div class="field"><label>Initial admin email</label><input name="initialAdminEmail" type="email"></div><div class="field"><label>Initial admin phone</label><input name="initialAdminPhone"></div><div class="field"><label>Initial admin password *</label><input name="initialAdminPassword" type="password" minlength="6" required></div></div><div class="actions"><button class="btn">Create School</button><span class="msg" id="msg"></span></div></form></section><section class="panel"><h2>Registered Schools</h2><div class="table-wrap"><div id="list" class="msg">Loading…</div></div></section></main><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2>Edit School</h2><button class="btn secondary small" id="closeModal">Close</button></div><form id="editForm"><input type="hidden" name="id"><div class="form" style="margin-top:14px"><div class="field"><label>School name</label><input name="name"></div><div class="field"><label>School code</label><input name="code"></div><div class="field"><label>Display name</label><input name="displayName"></div><div class="field"><label>Address</label><input name="address"></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Support email</label><input name="supportEmail" type="email"></div><div class="field"><label>App name</label><input name="appName"></div><div class="field"><label>App slug</label><input name="appSlug"></div><div class="field"><label>Android package</label><input name="androidPackage"></div><div class="field"><label>iOS bundle ID</label><input name="iosBundleId"></div><div class="field wide"><label>Logo URL</label><input name="logoUrl" type="url"></div><div class="field"><label>Primary color</label><input name="primaryColor"></div><div class="field"><label>Secondary color</label><input name="secondaryColor"></div><div class="field"><label>Min app version</label><input name="minAppVersion"></div><div class="field"><label>Status</label><select name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div><div class="field"><label>Force update</label><select name="forceUpdate"><option value="false">No</option><option value="true">Yes</option></select></div></div><div class="actions"><button class="btn">Save Changes</button><span class="msg" id="editMsg"></span></div></form></div></div><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}if((LSKERP.user().role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/portal-dashboard.html');return}const $=id=>document.getElementById(id),form=$('schoolForm'),msg=$('msg'),list=$('list'),modal=$('modal'),editForm=$('editForm'),editMsg=$('editMsg');$('back').onclick=()=>location.href='/erp/web/portal-dashboard.html';$('closeModal').onclick=()=>modal.classList.remove('open');function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}let schools=[];async function load(){try{const r=await LSKERP.request('/api/platform/schools');schools=r.schools||[];if(!schools.length){list.textContent='No schools registered yet.';return}list.innerHTML='<table class="table"><thead><tr><th>School</th><th>Code</th><th>App</th><th>Main branch</th><th>Status</th><th>Action</th></tr></thead><tbody>'+schools.map((s,i)=>`<tr><td><b>${esc(s.display_name||s.name)}</b><br><span class="msg">${esc(s.email||s.phone||'')}</span></td><td>${esc(s.code)}</td><td>${esc(s.app_name||'—')}<br><span class="badge">${esc(s.app_slug||'—')}</span></td><td>${esc(s.branch_name||'—')} (${esc(s.branch_code||'—')})</td><td>${esc(s.status)}</td><td><button class="btn small" data-edit="${i}">Edit</button></td></tr>`).join('')+'</tbody></table>';list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(schools[Number(b.dataset.edit)]))}catch(e){list.innerHTML='<span class="error">'+esc(e.message)+'</span>'}}function setField(f,k,v){const el=editForm.elements[k];if(el)el.value=v??''}function openEdit(s){setField(editForm,'id',s.id);setField(editForm,'name',s.name);setField(editForm,'code',s.code);setField(editForm,'displayName',s.display_name);setField(editForm,'address',s.address);setField(editForm,'phone',s.phone);setField(editForm,'supportEmail',s.email);setField(editForm,'appName',s.app_name);setField(editForm,'appSlug',s.app_slug);setField(editForm,'androidPackage',s.android_package);setField(editForm,'iosBundleId',s.ios_bundle_id);setField(editForm,'logoUrl',s.logo_url);setField(editForm,'primaryColor',s.primary_color);setField(editForm,'secondaryColor',s.secondary_color);setField(editForm,'minAppVersion',s.min_app_version||'1.0.0');setField(editForm,'status',s.status||'active');setField(editForm,'forceUpdate',String(Boolean(s.force_update)));editMsg.textContent='';modal.classList.add('open')}form.onsubmit=async e=>{e.preventDefault();msg.className='msg';msg.textContent='Creating…';const data=Object.fromEntries(new FormData(form).entries());try{const r=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(data)});msg.className='msg success';msg.textContent='School created successfully. Initial admin ID: '+r.initialAdmin.id;form.reset();form.querySelector('[name="branchName"]').value='Main Branch';form.querySelector('[name="branchCode"]').value='MAIN';form.querySelector('[name="primaryColor"]').value='4F46E5';form.querySelector('[name="secondaryColor"]').value='0F1720';await load()}catch(e){msg.className='msg error';msg.textContent=e.message||'School creation failed'}};editForm.onsubmit=async e=>{e.preventDefault();editMsg.className='msg';editMsg.textContent='Saving…';const data=Object.fromEntries(new FormData(editForm).entries());const id=data.id;delete data.id;data.forceUpdate=data.forceUpdate==='true';try{await LSKERP.request('/api/platform/schools/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(data)});editMsg.className='msg success';editMsg.textContent='Saved successfully.';await load();setTimeout(()=>modal.classList.remove('open'),400)}catch(e){editMsg.className='msg error';editMsg.textContent=e.message||'Save failed'}};load()})();</script></body></html>
