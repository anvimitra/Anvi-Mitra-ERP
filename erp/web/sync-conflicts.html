<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Sync Conflicts</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--line:#e5e7eb;--brand:#4f46e5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{font-size:25px;font-weight:850}.sub,.meta{color:#667085;font-size:13px}.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--brand);color:#fff;font-weight:750;cursor:pointer}.secondary{background:#fff;color:#172033;border:1px solid var(--line)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select{padding:9px;border:1px solid var(--line);border-radius:9px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.conflict{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:10px}.head{display:flex;justify-content:space-between;gap:12px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#fff4e5;color:#9a3412;font-size:11px;font-weight:800}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.box{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px}.box h4{margin:0 0 7px;font-size:12px}.json{white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,monospace;max-height:180px;overflow:auto}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.note{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px}.merge{width:100%;min-height:120px;padding:10px;border:1px solid var(--line);border-radius:9px;font:12px ui-monospace,monospace}.msg{font-size:13px;margin-top:8px}.ok{color:#087443}.err{color:#b42318}@media(max-width:750px){.top{align-items:flex-start;flex-direction:column}.cols{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><div class="title">Sync Conflict Center</div><div class="sub">Server-authoritative review • resolve offline changes safely</div></div><div class="toolbar"><select id="filter"><option value="pending">Pending</option><option value="server_wins">Server wins</option><option value="local_wins">Local wins</option><option value="merged">Merged</option></select><button class="btn secondary" onclick="location.href='/erp/web/portal-dashboard.html'">Dashboard</button></div></div><section class="panel"><div id="list">Loading…</div></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const role=(LSKERP.user().role||'').toLowerCase();if(!['super_admin','principal','admin'].includes(role)){location.replace('/erp/web/portal-dashboard.html');return}const list=document.getElementById('list'),filter=document.getElementById('filter');async function load(){try{const r=await LSKERP.request('/api/sync/conflicts?resolution='+encodeURIComponent(filter.value));const conflicts=r.conflicts||[];if(!conflicts.length){list.innerHTML='<div class="meta">No conflicts in this state.</div>';return}list.innerHTML=conflicts.map(c=>card(c)).join('')}catch(e){list.innerHTML='<div class="err">'+esc(e.message)+'</div>'}}function card(c){const local=JSON.stringify(c.localPayload||{},null,2),server=JSON.stringify(c.serverPayload||{},null,2);return `<article class="conflict"><div class="head"><div><b>${esc(c.entityType)}</b><div class="meta">Conflict ${esc(c.id)} • Device: ${esc(c.deviceName||'Unknown')} • ${esc(c.createdAt||'')}</div></div><span class="badge">${esc(c.resolution)}</span></div><div class="cols"><div class="box"><h4>LOCAL PAYLOAD</h4><div class="json">${esc(local)}</div></div><div class="box"><h4>SERVER PAYLOAD</h4><div class="json">${esc(server)}</div></div></div>${c.resolution==='pending'?`<div class="actions"><button class="btn" onclick="resolveConflict('${c.id}','server_wins')">Server wins</button><button class="btn secondary" onclick="resolveConflict('${c.id}','local_wins')">Local wins</button><button class="btn secondary" onclick="showMerge('${c.id}')">Review / Merge</button></div><div id="merge-${c.id}" style="display:none;margin-top:10px"><textarea class="merge" id="payload-${c.id}">${esc(JSON.stringify(c.serverPayload||{},null,2))}</textarea><input class="note" id="note-${c.id}" placeholder="Resolution note (audit trail)"><div class="actions"><button class="btn" onclick="submitMerge('${c.id}')">Apply merged payload</button></div></div>`:''}<div id="msg-${c.id}" class="msg"></div></article>`}function showMerge(id){document.getElementById('merge-'+id).style.display='block'}window.resolveConflict=async(id,resolution=>{const note=prompt('Resolution note (optional):')||'';await submit(id,resolution,note,null)};window.submitMerge=async id=>{let payload;try{payload=JSON.parse(document.getElementById('payload-'+id).value)}catch(e){document.getElementById('msg-'+id).className='msg err';document.getElementById('msg-'+id).textContent='Merged payload must be valid JSON.';return}await submit(id,'merged',document.getElementById('note-'+id).value,payload)};async function submit(id,resolution,note,mergedPayload){const m=document.getElementById('msg-'+id);m.className='msg';m.textContent='Resolving…';try{await LSKERP.request('/api/sync/conflicts/'+encodeURIComponent(id)+'/resolve',{method:'POST',body:JSON.stringify({resolution,note,mergedPayload})});m.className='msg ok';m.textContent='Resolved successfully and queued as a server sync change.';setTimeout(load,350)}catch(e){m.className='msg err';m.textContent=e.message||'Resolution failed'}}filter.onchange=load;function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}load()})();</script></body></html>
