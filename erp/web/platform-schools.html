<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • Schools</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:20px;margin-bottom:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.field{display:grid;gap:6px}label{font-size:12px;font-weight:700}input,button,select{padding:11px;border:1px solid #d9dee8;border-radius:10px;font:inherit}button{background:#4f46e5;color:#fff;border:0;font-weight:800;cursor:pointer}.secondary{background:#eef0ff;color:#3730a3}.actions{display:flex;gap:10px}.school{border:1px solid #e4e8f0;border-radius:12px;padding:14px;margin:10px 0}.school b{display:block}.meta{font-size:12px;color:#667085;margin-top:4px}.msg{font-size:13px;margin-top:12px}.error{color:#b42318}.success{color:#087443}@media(max-width:800px){.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="panel"><h1>Super Admin • School Onboarding</h1><p>Create a school with its main branch, app configuration and initial admin in one step.</p><form id="f" class="form"><div class="field"><label>School Name *</label><input id="name" required></div><div class="field"><label>School Code *</label><input id="code" required></div><div class="field"><label>Display Name</label><input id="displayName"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field full"><label>Address</label><input id="address"></div><div class="field"><label>Support Email</label><input id="supportEmail" type="email"></div><div class="field"><label>Logo URL</label><input id="logoUrl" type="url"></div><div class="field"><label>App Name</label><input id="appName"></div><div class="field"><label>App Slug *</label><input id="appSlug" required placeholder="school-name"></div><div class="field"><label>Android Package</label><input id="androidPackage" placeholder="in.anvimitra.school"></div><div class="field"><label>iOS Bundle ID</label><input id="iosBundleId"></div><div class="field"><label>API Base URL</label><input id="apiBaseUrl" type="url"></div><div class="field"><label>Primary Color</label><input id="primaryColor" value="4F46E5"></div><div class="field"><label>Secondary Color</label><input id="secondaryColor" value="0F1720"></div><div class="field"><label>Main Branch Name</label><input id="branchName" value="Main Branch"></div><div class="field"><label>Main Branch Code</label><input id="branchCode" value="MAIN"></div><div class="field"><label>Initial Admin Name *</label><input id="initialAdminName" required></div><div class="field"><label>Initial Admin Email</label><input id="initialAdminEmail" type="email"></div><div class="field"><label>Initial Admin Phone</label><input id="initialAdminPhone"></div><div class="field"><label>Initial Admin Password *</label><input id="initialAdminPassword" type="password" minlength="6" required></div><div class="field"><label>Minimum App Version</label><input id="minAppVersion" value="1.0.0"></div><div class="field"><label>Force Update</label><select id="forceUpdate"><option value="false">No</option><option value="true">Yes</option></select></div><div class="full actions"><button>Create School</button><button type="button" id="clear" class="secondary">Clear</button></div></form><div id="msg" class="msg"></div></div><div class="panel"><h2>Schools</h2><div id="list">Loading…</div></div></div><script src="/erp/web/api.js"></script><script>const $=id=>document.getElementById(id);const me=LSKERP.user();if(!LSKERP.token()){location.replace('/erp/web/login.html')}if((me.role||'').toLowerCase()!=='super_admin'){location.replace('/erp/web/portal-dashboard.html')}const v=id=>$(id).value.trim();const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await LSKERP.request('/api/platform/schools');const a=r.schools||[];$('list').innerHTML=a.length?a.map(s=>`<div class="school"><b>${esc(s.display_name||s.name)} (${esc(s.code)})</b><div class="meta">${esc(s.address||'No address')} • ${esc(s.phone||s.email||'No contact')}</div><div class="meta">App: ${esc(s.app_name||'—')} • Slug: ${esc(s.app_slug||'—')} • Branch: ${esc(s.branch_name||'—')}</div></div>`).join(''):'No schools onboarded yet.'}catch(e){$('list').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}$('f').onsubmit=async e=>{e.preventDefault();$('msg').className='msg';$('msg').textContent='Creating school…';const body={name:v('name'),code:v('code'),displayName:v('displayName'),address:v('address'),phone:v('phone'),supportEmail:v('supportEmail'),logoUrl:v('logoUrl'),appName:v('appName'),appSlug:v('appSlug'),androidPackage:v('androidPackage'),iosBundleId:v('iosBundleId'),apiBaseUrl:v('apiBaseUrl'),primaryColor:v('primaryColor'),secondaryColor:v('secondaryColor'),branchName:v('branchName'),branchCode:v('branchCode'),initialAdminName:v('initialAdminName'),initialAdminEmail:v('initialAdminEmail'),initialAdminPhone:v('initialAdminPhone'),initialAdminPassword:v('initialAdminPassword'),minAppVersion:v('minAppVersion'),forceUpdate:v('forceUpdate')==='true'};try{const r=await LSKERP.request('/api/platform/schools',{method:'POST',body:JSON.stringify(body)});$('msg').className='msg success';$('msg').textContent='School created successfully: '+(r.school?.name||body.name);$('f').reset();$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';$('branchName').value='Main Branch';$('branchCode').value='MAIN';$('minAppVersion').value='1.0.0';load()}catch(e){$('msg').className='msg error';$('msg').textContent=e.message||'School creation failed'}};$('clear').onclick=()=>{$('f').reset();$('primaryColor').value='4F46E5';$('secondaryColor').value='0F1720';$('branchName').value='Main Branch';$('branchCode').value='MAIN';$('minAppVersion').value='1.0.0';$('msg').textContent=''};load();</script></body></html>
