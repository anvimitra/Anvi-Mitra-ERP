<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anvi Mitra ERP • School Setup</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb;--brand:#4f46e5;--line:#e4e8f0;--muted:#667085}*{box-sizing:border-box}body{margin:0}.main{max-width:1050px;margin:auto;padding:25px}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.hero{background:linear-gradient(120deg,#24285f,#6046c8);color:#fff}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#e6e8ff;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid #d9dee8;border-radius:9px;font:inherit}.btn{margin-top:12px;padding:11px 15px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:750;cursor:pointer}.msg{font-size:13px;margin-top:10px}.ok{color:#087443}.error{color:#b42318}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}@media(max-width:700px){.main{padding:16px}.grid{grid-template-columns:1fr}}</style></head><body><main class="main"><section class="hero"><h1>School Setup</h1><p>Manage branches for the currently logged-in school. School-wide administrators can add branches; branch users remain scoped to their assigned branch.</p></section><section class="panel"><h2>Current school</h2><div id="school">Loading…</div></section><section class="panel"><h2>Add branch</h2><form id="form" class="grid"><div class="field"><label>Branch name<input id="name" required maxlength="200" placeholder="Main Campus"></label></div><div class="field"><label>Branch code<input id="code" required maxlength="50" placeholder="MAIN"></label></div><div class="field"><label>Address<input id="address" maxlength="500" placeholder="Optional address"></label></div><div class="field"><label>Phone<input id="phone" maxlength="30" placeholder="Optional phone"></label></div><div><button class="btn" id="save">Add branch</button></div></form><div class="msg" id="msg"></div></section><section class="panel"><h2>Branches</h2><table class="table"><thead><tr><th>Name</th><th>Code</th><th>Address</th><th>Phone</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="/erp/web/api.js"></script><script>(async()=>{if(!LSKERP.token()){location.replace('/erp/web/login.html');return}const $=id=>document.getElementById(id);const role=(LSKERP.user()?.role||'').toLowerCase();if(!['super_admin','principal','admin'].includes(role)){document.body.innerHTML='<main class="main"><section class="panel"><h2>Access denied</h2><p>School-wide administrator permission is required.</p></section></main>';return}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const d=await LSKERP.request('/api/organization');$('school').innerHTML=`<b>${esc(d.school.displayName||d.school.name)}</b><div class="msg">Code: ${esc(d.school.code||'—')}</div>`;$('rows').innerHTML=(d.branches||[]).map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.code)}</td><td>${esc(b.address||'—')}</td><td>${esc(b.phone||'—')}</td><td>${esc(b.status)}</td></tr>`).join('')||'<tr><td colspan="5">No branches found.</td></tr>'}catch(e){$('msg').className='msg error';$('msg').textContent=e.message||'Could not load school setup'}}$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;$('msg').textContent='Adding branch…';try{await LSKERP.request('/api/branches',{method:'POST',body:JSON.stringify({name:$('name').value.trim(),code:$('code').value.trim(),address:$('address').value.trim()||null,phone:$('phone').value.trim()||null})});$('msg').className='msg ok';$('msg').textContent='Branch added successfully.';e.target.reset();await load()}catch(err){$('msg').className='msg error';$('msg').textContent=err.message||'Branch creation failed'}finally{$('save').disabled=false}};await load()})();</script></body></html>
